<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>演說名言查詢｜依題目找佳句</title>
<style>
  :root{
    --ink:#15233b;        /* deep slate-indigo */
    --ink-soft:#33445f;
    --paper:#f6f3ec;      /* warm paper */
    --card:#ffffff;
    --gold:#c8992e;       /* rostrum brass */
    --gold-deep:#a67c1e;
    --line:#e3ddd0;
    --muted:#6b7688;
    --shadow:0 2px 4px rgba(21,35,59,.06),0 12px 28px rgba(21,35,59,.10);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    line-height:1.75;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 18px calc(64px + env(safe-area-inset-bottom));}

  /* ---- Header ---- */
  header{
    padding:26px 18px 20px;max-width:940px;margin:0 auto;
  }
  .eyebrow{
    font-size:13px;letter-spacing:.28em;color:var(--gold-deep);
    font-weight:700;margin:0 0 6px;
  }
  h1{
    font-size:clamp(24px,5.6vw,34px);margin:0;font-weight:800;
    letter-spacing:.01em;line-height:1.25;
  }
  h1 .bar{color:var(--gold);}
  .sub{color:var(--muted);margin:8px 0 0;font-size:15px;}

  /* ---- Search ---- */
  .search{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding:10px 18px 12px;max-width:940px;margin:0 auto;
  }
  .search-inner{position:relative;}
  #q{
    width:100%;font-size:17px;padding:15px 46px 15px 46px;border-radius:14px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    box-shadow:var(--shadow);outline:none;font-family:inherit;
  }
  #q:focus{border-color:var(--gold);}
  .ic{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);}
  .ic.left{left:15px;}
  .clear{right:10px;border:0;background:transparent;font-size:22px;color:var(--muted);
    cursor:pointer;padding:6px;line-height:1;display:none;}
  .count{font-size:13px;color:var(--muted);margin:8px 2px 0;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;max-width:940px;margin:0 auto;padding:0 18px 4px;}
  .tab{
    flex:1;text-align:center;padding:11px 8px;border-radius:12px 12px 0 0;
    border:1.5px solid var(--line);border-bottom:none;background:#efeadf;
    color:var(--ink-soft);font-weight:700;font-size:15px;cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 -3px 0 var(--gold) inset;}

  /* ---- Topic groups ---- */
  .group{margin:18px 0 0;}
  .group-h{
    display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;
    padding-bottom:8px;border-bottom:2px solid var(--ink);
  }
  .group-h .t{font-size:19px;font-weight:800;}
  .group-h .n{font-size:13px;color:var(--muted);font-weight:600;}

  /* ---- Quote card ---- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 18px 14px;margin:0 0 12px;position:relative;
  }
  .card::before{
    content:"\201C";position:absolute;top:2px;left:14px;font-size:52px;
    color:var(--gold);opacity:.28;font-family:Georgia,serif;line-height:1;
  }
  .quote{font-size:18px;font-weight:600;padding-left:30px;margin:2px 0 12px;letter-spacing:.01em;}
  .meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-left:30px;}
  .author-btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);
    background:#fbf6e9;color:var(--gold-deep);font-weight:700;font-size:14px;
    padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;
  }
  .author-btn:active{background:#f3e9cf;}
  .author-btn.plain{border-style:dashed;color:var(--muted);cursor:default;background:#f7f5ef;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:12.5px;color:var(--ink-soft);background:#eef1f6;border-radius:8px;
    padding:4px 9px;cursor:pointer;border:1px solid #e0e5ee;
  }
  .chip:active{background:#e2e7f0;}
  .src{font-size:12.5px;color:var(--muted);padding-left:30px;margin-top:8px;display:flex;
    flex-wrap:wrap;gap:6px;align-items:center;}
  .lv{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap;}
  .lv.A{background:#dff0d8;color:#2e6b2e;}
  .lv.B{background:#fdf0cd;color:#8a6300;}
  .lv.C{background:#fbe0d3;color:#9c4a1c;}
  .legend{font-size:12.5px;color:var(--muted);margin:6px 2px 0;display:flex;flex-wrap:wrap;gap:10px;}
  mark{background:#faedbf;color:inherit;padding:0 1px;border-radius:3px;}

  /* ---- Empty ---- */
  .empty{text-align:center;color:var(--muted);padding:52px 20px;}
  .empty b{color:var(--ink);}

  /* ---- Author modal ---- */
  .backdrop{
    position:fixed;inset:0;background:rgba(21,35,59,.5);backdrop-filter:blur(2px);
    display:none;align-items:flex-end;justify-content:center;z-index:60;
  }
  .backdrop.open{display:flex;}
  .sheet{
    background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
    max-height:88vh;overflow:auto;animation:rise .22s ease;
  }
  @keyframes rise{from{transform:translateY(24px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet .grab{width:44px;height:5px;border-radius:3px;background:#cfc9ba;margin:0 auto 16px;}
  .a-name{font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .a-job{font-size:13px;font-weight:700;color:#fff;background:var(--gold-deep);
    padding:3px 11px;border-radius:999px;}
  .a-lab{font-size:12px;letter-spacing:.16em;color:var(--gold-deep);font-weight:700;margin:18px 0 4px;}
  .a-works{font-size:15px;color:var(--ink-soft);font-weight:600;}
  .a-bio{font-size:15px;margin:2px 0 0;}
  .a-story.hard{border-left-color:#1F4E79;}
  .a-story{
    font-size:15.5px;line-height:1.9;margin:4px 0 0;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:0 12px 12px 0;
  }
  .close{
    margin-top:22px;width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--ink);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  }

  @media(min-width:640px){
    .wrap{padding-left:24px;padding-right:24px;}
    .quote{font-size:19px;}
    .backdrop{align-items:center;}
    .sheet{border-radius:20px;}
    .sheet .grab{display:none;}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<header>
  <p class="eyebrow">國語演說　備稿工具</p>
  <h1><span class="bar">依題目</span>找名言佳句</h1>
  <p class="sub">輸入講題或關鍵字，立刻找到可用的佳句。每句都標了出處與查證等級，點作者可看生命故事。</p>
</header>

<div class="tabs" role="tablist">
  <div class="tab" role="tab" aria-selected="true" data-view="topic">依演說題目</div>
  <div class="tab" role="tab" aria-selected="false" data-view="cat">依分類瀏覽</div>
  <div class="tab" role="tab" aria-selected="false" data-view="author">作者總覽</div>
</div>

<div class="search">
  <div class="search-inner">
    <svg class="ic left" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" inputmode="search" placeholder="搜尋講題、關鍵字或作者…" autocomplete="off">
    <button class="clear ic" id="clear" aria-label="清除">×</button>
  </div>
  <div class="count" id="count"></div>
  <div class="legend"><span><b class="lv A">A</b> 原典可查</span><span><b class="lv B">B</b> 出版品可查</span><span><b class="lv C">C</b> 流傳語，勿強調出處</span></div>
</div>

<main class="wrap" id="list"></main>

<div class="backdrop" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="aName">
    <div class="grab"></div>
    <div id="aBody"></div>
    <button class="close" id="closeBtn">關閉</button>
  </div>
</div>

 "順境不無隱憂，逆境不絕希望。（Prosperity is not without many fears and distastes; and adversity not without comforts and hopes.）", "author": "培根", "src": "《名人這麼說：雋永英語名言》轉錄", "lvl": "B 出版品可查"}, {"cat": "九、其他", "topics": ["失去與擁有", "堅持與放下"], "quote": "禍莫大於不知足，咎莫大於欲得。", "author": "老子", "src": "《道德經》第46章", "lvl": "A 原典可查"}, {"cat": "九、其他", "topics": ["微觀與宏觀", "個別與整體"], "quote": "有之以為利，無之以為用。", "author": "老子", "src": "《道德經》第11章", "lvl": "A 原典可查"}, {"cat": "九、其他", "topics": ["微觀與宏觀", "站在世界的高點"], "quote": "井蛙不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也。", "author": "莊子", "src": "《莊子·秋水》", "lvl": "A 原典可查"}, {"cat": "九、其他", "topics": ["站在世界的高點", "改變世界的力量"], "quote": "面對未來你可以無感，也可以勇敢。", "author": "艾爾文", "src": "《你，很好》", "lvl": "B 出版品可查"}, {"cat": "九、其他", "topics": ["改變我的一句話", "激勵我的一件事"], "quote": "一件事情的畢業，永遠是另一件事情的開啟。", "author": "龍應台", "src": "康軒國語六下第十一課補充", "lvl": "C 流傳語"}, {"cat": "九、其他", "topics": ["望向光明，遠離黑暗", "關於未來"], "quote": "不管你去往何方，不管將來迎接你的是什麼，請你帶著陽光般的心情啟程。", "author": "佚名", "src": "康軒國語六下第十一課補充", "lvl": "C 流傳語"}, {"cat": "九、其他", "topics": ["改變世界的一項重要發明", "改變未來的好點子"], "quote": "知識就是力量。", "author": "培根", "src": "《沉思錄》（Meditationes Sacrae）", "lvl": "A 原典可查"}, {"cat": "九、其他", "topics": ["難忘的比賽", "忘不了的那一幕"], "quote": "眠是成了，但河還在那裡，也不再呼喊我渡去了。", "author": "李蘋芬", "src": "《初醒如飛行：李蘋芬詩集》", "lvl": "B 出版品可查"}, {"cat": "九、其他", "topics": ["原諒別人，釋放自己", "青春期的我們"], "quote": "我並不堅強，我沒辦法哭著記得你，所以只能選擇遺忘。", "author": "Misa", "src": "《在沒有你的世界沉睡》", "lvl": "B 出版品可查"}, {"cat": "九、其他", "topics": ["改變我的一句話", "激勵我的一件事"], "quote": "生命的百孔千瘡，是殘忍的慈悲。", "author": "慕顏歌", "src": "《人生有多殘酷，你就該有多堅強》", "lvl": "B 出版品可查"}], "authors": [{"name": "Misa", "job": "作家", "works": "《在沒有你的世界沉睡》", "bio": "臺灣人氣網路小說家，筆觸細膩感傷，專注書寫青春歲月中的愛與遺憾。", "story": "從網路平臺連載起家，以真摯感傷的筆觸書寫青春愛戀與成長陣痛。她筆下的故事不總有完美結局，卻誠實記錄遺憾與釋懷，觸動許多同樣在成長中學著告別的年輕讀者。", "hard": "無（作者未公開相關經歷，缺乏可查證的困境事蹟）"}, {"name": "孔子", "job": "教育家", "works": "《論語》（弟子輯錄）", "bio": "春秋時期思想家與教育家，儒家學派創始人，後世尊為萬世師表。", "story": "生於亂世，周遊列國宣揚仁政卻不受重用。他打破貴族壟斷教育，開私人講學之風，廣收弟子三千，主張有教無類、因材施教，言行由弟子輯為《論語》，深刻形塑中華文化。", "hard": "他一生最大的困境是理想無人採用。五十多歲起帶著弟子周遊列國十四年，處處碰壁：在宋國遭人砍樹恐嚇，在匡地被誤認為仇人圍困，最狼狽的是在陳、蔡之間斷糧七日，弟子餓到爬不起來，子路氣憤地問：君子也會有這麼落魄的時候嗎？孔子回答，君子在困境中仍能守住自己，小人一遇困境就亂了分寸。他始終沒有等到願意採納他的君主，晚年返回魯國，把心力全放在教學與整理典籍上，讓思想透過弟子流傳下來。"}, {"name": "孟子", "job": "思想家", "works": "《孟子》", "bio": "戰國時期儒家代表，主張性善與仁政，被尊為「亞聖」。", "story": "自幼受母親悉心教導，「孟母三遷」傳為佳話。他繼承孔子思想，周遊列國力勸君王行仁政，主張民貴君輕。雖不見用於當世，其雄辯文章與性善之說，影響中華思想兩千餘年。", "hard": "幼年喪父，家境清寒，全靠母親織布撫養，為了給他良好的成長環境而三度遷居。長大後他懷抱仁政理想遊說各國君王，然而戰國時代各國競相追求富國強兵，他主張的「民為貴，君為輕」被視為迂闊而不切實際，齊、梁等國君主雖以禮相待，卻始終不肯真正採用。晚年他退回故鄉，與弟子一起著書立說，把畢生主張寫成《孟子》。他相信人在困厄中反而能磨練心志，寫下「天將降大任於是人也，必先苦其心志」，成為後世最常用來自勉的話。"}, {"name": "荀子", "job": "思想家", "works": "《荀子》", "bio": "戰國思想家，主張性惡與化性起偽，強調後天學習與禮法教化。", "story": "曾三度擔任齊國稷下學宮祭酒，為當時學術重鎮領袖。他主張人性須靠後天學習與禮法矯正，寫下〈勸學〉倡導鍥而不舍的求學精神，門下弟子韓非、李斯皆影響中國歷史深遠。", "hard": "他在齊國稷下學宮三度被推為祭酒，是當時學界的領袖，卻因遭人進讒言而被迫離開。後來到楚國擔任蘭陵令，又因春申君遇害而失去官職，從此不再出仕。晚年他留在蘭陵，把全部心力放在著書與教學上。面對亂世，他不寄望於天命，反而強調人的努力：認為人的天性需要靠後天學習與禮法一點一滴矯正，因此寫下〈勸學〉，以「鍥而不舍，金石可鏤」勉勵世人。他門下的韓非與李斯，後來都深刻影響了中國歷史的走向。"}, {"name": "老子", "job": "思想家", "works": "《道德經》", "bio": "春秋時期哲學家，道家學派創始人，主張道法自然、清靜無為。", "story": "相傳曾任周朝守藏史，見周室衰微後辭官西行。過函谷關時應關令之請，留下五千言《道德經》，闡述道法自然與無為而治的處世哲學，成為道家思想之源，影響中華文化數千年。", "hard": "據《史記》記載，他長期擔任周朝管理典籍的守藏史，眼看王室日漸衰微、天下逐漸失序，最終選擇辭官離去。西行經過函谷關時，關令尹喜請他留下著作，他因而寫下五千餘言的《道德經》，隨後不知所終。他面對亂世的方式不是抗爭，而是主張退讓與守柔：認為強行爭勝的人反而站不穩，懂得知足與不爭的人才能長久。這種在困局中不硬碰硬、以柔克剛的智慧，成為中國人面對逆境時最重要的思想資源之一。"}, {"name": "莊子", "job": "思想家", "works": "《莊子》", "bio": "戰國道家代表，善以寓言說理，追求逍遙自在的精神境界。", "story": "一生安於清貧，曾拒絕楚王重金聘相，寧願自在曳尾於塗中。他以鯤鵬、蝴蝶等奇特寓言闡述逍遙與齊物，文字瑰麗想像奔放，為中國文學與哲學留下獨樹一格的精神世界。", "hard": "他一生極為貧困，曾靠編草鞋維生，也曾因家中無糧而向監河侯借米，對方推說要等收到稅金再借，他便以「涸轍之鮒」的寓言諷刺這種緩不濟急的空話。楚威王曾派使者以千金重禮聘他為相，他卻笑著回絕，說自己寧願像在爛泥裡自在擺尾的烏龜，也不願被供在廟堂上失去自由。妻子過世時，他鼓盆而歌，認為生死如同四季更迭。他用超脫的眼光看待貧窮與死亡，把現實的困窘轉化為精神上的逍遙。"}, {"name": "曹雪芹", "job": "小說家", "works": "《紅樓夢》", "bio": "清代小說家，以《紅樓夢》寫盡家族興衰，為中國古典小說高峰。", "story": "出身江南顯赫望族，少年享盡榮華，後家道中落陷入貧困。他以親身經歷為底，「披閱十載，增刪五次」寫成《紅樓夢》，寫盡人情冷暖，未及完稿便辭世，留下不朽經典。", "hard": "他出身江南織造世家，祖上四代深受皇帝寵信，少年時過著錦衣玉食的生活。雍正年間家族因故被抄家治罪，全家由盛轉衰，遷居北京西郊，晚年窮困到「舉家食粥酒常賒」的地步。更沉重的打擊是幼子夭折，他悲痛成疾。在這樣的境況中，他仍以十年時間「披閱十載，增刪五次」寫作《紅樓夢》，把親身經歷的繁華與崩塌化為文字。書未完成他便辭世，留下的殘稿卻成為中國古典小說的巔峰。"}, {"name": "蘇軾", "job": "文學家", "works": "《東坡全集》", "bio": "北宋文學巨匠，詩詞文書畫皆臻絕頂，詞風豪放曠達。", "story": "少年高中進士，仕途卻因政見屢遭貶謫，遠至黃州、惠州、儋州。他始終曠達超脫，把苦難化為絕妙詩詞，一句「也無風雨也無晴」道盡豁達，成為最受喜愛的文學大家。", "hard": "四十三歲時因被指控寫詩諷刺朝政，遭逮捕入獄一百多天，史稱烏臺詩案，一度以為必死。出獄後被貶黃州，生活困窘到必須親自開荒種田，自號東坡居士。此後又一路被貶惠州、儋州，儋州在當時是極為偏遠的海南，環境惡劣。他卻在每個貶所都認真生活：在黃州寫下〈赤壁賦〉，在惠州吃荔枝自得其樂，在儋州辦學教書。一句「也無風雨也無晴」，道盡他不被境遇擊倒的曠達。"}, {"name": "陸游", "job": "詩人", "works": "《劍南詩稿》", "bio": "南宋愛國詩人，作品逾九千首，畢生心繫國土收復。", "story": "身處南宋偏安之世，一生力主抗金卻屢遭排擠。他把滿腔壯志化為詩篇，留下逾九千首作品，也在鄉間行旅中寫下「柳暗花明又一村」，成為後人面對困境時最常引用的希望之語。", "hard": "他生於北宋滅亡前夕，自幼隨家人逃難，畢生最大的心願是收復失土。然而南宋朝廷偏安求和，他屢次力主抗金，因此不斷遭到主和派排擠，多次被罷官，一生仕途起伏不定。中年時曾短暫從軍前線，那是他最接近理想的時刻，卻很快又被調離。晚年退居故鄉山陰，仍寫下大量憂國詩篇，留下逾九千首作品。臨終前寫〈示兒〉，交代子孫在王師收復中原之日別忘了告訴他，遺憾至死未消。"}, {"name": "李白", "job": "詩人", "works": "《李太白集》", "bio": "唐代浪漫主義詩人，想像奔放、氣勢豪邁，世稱「詩仙」。", "story": "一生渴望施展抱負，卻在朝廷難以立足，索性寄情山水詩酒。他以奔放想像寫下無數名篇，失意時仍高唱「長風破浪會有時」，那份不被現實壓垮的自信鼓舞千年讀者。", "hard": "他懷抱極大的政治抱負，四十二歲時終於奉召入京，卻只被安排寫應酬詩文，不到兩年便被「賜金放還」，理想落空。晚年遇上安史之亂，他投入永王李璘幕下，永王起兵失敗後，他被判罪下獄，隨後流放夜郎，途中才遇赦得以折返。仕途上的一再挫敗並未讓他消沉，他把失意化為詩篇，在最不得志時仍寫下「長風破浪會有時，直掛雲帆濟滄海」，那份不肯低頭的自信鼓舞了千年來的讀者。"}, {"name": "王之渙", "job": "詩人", "works": "〈登鸛雀樓〉、〈涼州詞〉", "bio": "盛唐詩人，傳世作品僅六首，卻篇篇成為千古名作。", "story": "生平記載不多，一生仕途不順，曾憤而辭官漫遊各地。他留下的詩作僅六首，卻以〈登鸛雀樓〉短短二十字寫盡登高望遠的胸襟，「更上一層樓」成為華人世界最常引用的勉勵之語。", "hard": "依據後人所立的墓誌銘記載，他曾任冀州衡水縣主簿，卻遭同僚誣謗中傷。他不願屈意辯白，索性辭去官職，此後十五年間不再出仕，過著遊歷四方、與友人詩酒往來的生活。晚年才再度出任文安縣尉，不久便病逝於任上。他一生留下的詩作僅六首，卻篇篇是精品；短短二十字的〈登鸛雀樓〉，把登高望遠、要看得更遠就得再往上走一層的道理寫得極為透徹，成為華人世界最常引用的勉勵之語。"}, {"name": "葛洪", "job": "思想家", "works": "《抱朴子》、《肘後備急方》", "bio": "東晉道家學者與醫學家，博學多聞，兼論修身、為學與醫藥。", "story": "出身江南名門，性格沉靜好學，家貧仍砍柴換紙筆抄書苦讀。他隱居深山鑽研道家哲學與醫術，著《抱朴子》論修身為學之道，並記錄大量民間醫方，對後世思想與醫學貢獻卓著。", "hard": "十三歲喪父，家道中落，田產在戰亂中散盡。他家貧到買不起紙筆，只能上山砍柴換取書寫材料，常常走幾十里路向人借書抄寫，冬天手凍裂仍不停筆。青年時期又逢戰亂，他曾被徵召領兵作戰，戰後卻拒絕封賞，選擇隱居山林潛心著述。他晚年在羅浮山煉丹修道，同時記錄大量民間急救藥方，寫成《肘後備急方》。這部書中對青蒿治瘧的記載，一千六百多年後啟發了現代科學家的研究。"}, {"name": "陸紹珩", "job": "文人", "works": "《醉古堂劍掃》", "bio": "明代清雅文人，輯錄歷代格言小品成書，文風雋永。", "story": "明代崇尚清雅的文人，博覽群書，將歷代格言與自身體悟輯錄成《醉古堂劍掃》。書中細談讀書、處世與修身，文字雋永，流露淡泊高潔的情趣，為後世傳誦的小品經典。", "hard": "無（生平記載極少，僅知其為明代文人，缺乏可查證的困境事蹟）"}, {"name": "洪應明", "job": "文人", "works": "《菜根譚》", "bio": "明代文人，融合儒釋道思想，寫成處世修身的格言小品。", "story": "生平記載極少，僅知其歷經世事後歸於恬淡。他把儒家入世、道家自然與佛家超脫融為一爐，寫成《菜根譚》，以「嚼得菜根，百事可做」的精神，成為華人最受歡迎的處世書。", "hard": "無（生平記載極少，僅知其為明代文人，曾歷經世事後歸於恬淡，缺乏可查證的困境事蹟）"}, {"name": "陳亮", "job": "思想家", "works": "《陳亮集》（龍川文集）", "bio": "南宋思想家與文學家，倡經世致用之學，文章氣勢豪邁。", "story": "才氣縱橫，一生力主抗金、恢復中原，屢次上書卻遭冷落，甚至數度入獄。他反對空談心性，主張學問須能經世致用，文章豪邁激昂，年過半百終於高中狀元，卻旋即病逝。", "hard": "他一生為抗金奔走，五次上書皇帝力陳恢復中原之策，卻始終不被採納，反而因言論激烈而屢遭陷害，前後三次入獄，其中一次幾乎喪命，全靠友人營救才得以脫身。科舉之路同樣坎坷，多次應試不第。直到五十一歲那年，他終於高中狀元，皇帝親自賞識，眼看抱負可以施展，卻在赴任途中病逝，得年五十二。他一生主張學問必須能經世致用，反對空談，「工貴其久，業貴其專」正是他治學態度的寫照。"}, {"name": "朱熹", "job": "學者", "works": "《四書章句集注》", "bio": "南宋理學集大成者，畢生講學著述，影響東亞教育數百年。", "story": "自幼好學深思，一生大半時間用於讀書、講學與著述。他重建白鹿洞書院，為《四書》作注成為後世科舉圭臬，也寫下「萬紫千紅總是春」等清新詩句，展現學者難得的生活情趣。", "hard": "他晚年遭遇了人生最大的打擊。當時朝中權臣忌憚他的聲望，發動「慶元黨禁」，將他的學說斥為「偽學」加以禁止，門人被列入黨籍受牽連，有人因此下獄流放。他本人被彈劾罷官，聲名一落千丈，晚境淒涼。即使如此，他在病中仍持續講學與修訂著作，直到去世前幾天還在修改《大學》的注解。他過世時朝廷禁止士人前往弔唁，仍有近千人冒險送葬。數十年後，他的學說終獲平反，成為東亞教育的核心。"}, {"name": "朱自清", "job": "作家", "works": "《背影》、《荷塘月色》", "bio": "中國現代散文名家，文字樸實真摯，善寫親情與自然。", "story": "任教清華大學期間筆耕不輟，以樸素真摯的白話散文著稱。他寫父親替他買橘子時攀爬月臺的背影，把難言的父子親情寫得極動人，〈背影〉成為世代傳誦的散文經典。", "hard": "他成長於家道中落的過程中，父親失業、家中負債，父子之間又因觀念不合而長年失和，兩人一度多年不通音信。〈背影〉正是他讀到父親來信、想起車站月臺上那個攀爬買橘的身影後含淚寫成的和解之作。抗戰期間他隨學校南遷，在昆明過著清苦生活，物價飛漲、薪水不足以養家，只能典當衣物度日。晚年他長期胃病纏身，因無力醫治而日漸嚴重，五十歲便病逝，留下大量樸實動人的散文。"}, {"name": "唐太宗", "job": "君主", "works": "《貞觀政要》（記其言行）", "bio": "唐朝第二位皇帝，開創貞觀之治，以善於納諫著稱。", "story": "登基後勵精圖治，最為人稱道的是能容忍直言。名臣魏徵屢次當面頂撞，他仍虛心接受；魏徵去世時，他感嘆自己失去了一面能照見得失的鏡子，成為君主納諫的千古典範。", "hard": "他在隋末亂世中隨父起兵，親歷無數場生死之戰。奪取帝位的過程伴隨兄弟相殘的血腥，也讓他終生背負沉重的爭議與心理壓力。即位後他選擇以納諫來約束自己：明知魏徵曾是敵對陣營的謀士，仍重用他，並容忍他兩百多次的當面直諫，有幾次氣得回宮發怒，最終仍照做。魏徵去世時，他感嘆自己失去了一面能照見得失的鏡子。晚年他也曾因太子之爭而痛苦不堪，甚至一度失態，可見帝王同樣有難以承受的時刻。"}, {"name": "皋魚", "job": "隱士", "works": "事見《韓詩外傳》卷九", "bio": "春秋時期人物，因未及奉養雙親而痛悔，留下風樹之嘆。", "story": "年少時外出遊學、周遊諸侯，等到想要奉養雙親，父母卻已離世。孔子路過見他在道旁悲泣，聽他說出「樹欲靜而風不止」的悔恨。孔子門下因此有十三人辭別返家奉養父母。", "hard": "他年輕時熱衷於外出遊學、周遊諸侯，追求自己的志向與見識，把奉養雙親的事一再往後推。等到他終於想安定下來盡孝，父母都已經不在了。孔子帶著弟子經過時，聽見他在道旁悲泣，上前詢問，他說自己一生有三個過失，其中最深的痛悔就是「樹欲靜而風不止，子欲養而親不待」——樹想安靜下來，風卻不停；子女想奉養父母，父母卻已等不到了。孔子聽後轉告弟子，當天就有十三人辭別返家奉養雙親。"}, {"name": "艾爾文", "job": "作家", "works": "《你，很好》、《你的夢想就是最棒的存錢筒》", "bio": "臺灣理財勵志作家，曾任工程師，以溫暖文字談自我成長與金錢。", "story": "十六歲開始讀理財書，畢業後任電子工程師，白天上班、夜裡經營部落格。二十九歲財務自由離開職場，卻在低谷時把感觸寫成文字，意外撫慰數百萬讀者，轉型為勵志作家。", "hard": "他大學讀的是理工科，畢業後成為電子工程師，工作繁重，只能利用下班後的深夜與週末寫部落格、鑽研理財，這樣的雙軌生活持續了好幾年。二十九歲他達成階段性的財務目標而離開職場，原以為從此自由，卻反而陷入失去目標的低潮，也曾因身體狀況與生活轉變而消沉。那段迷惘的日子，他把心裡的感受一篇篇寫下來，意外撫慰了同樣困惑的讀者。從理財作家轉為勵志作家，正是他走出低潮後的轉向。"}, {"name": "安藤忠雄", "job": "建築師", "works": "《選擇突破！安藤忠雄名言集》", "bio": "日本自學成才的建築大師，普立茲克獎得主，以清水混凝土聞名。", "story": "年輕時當過職業拳擊手與貨車司機，沒念過大學建築系，靠自學與旅行看遍世界名建築。他把逆境化為養分，以樸素的清水混凝土打動人心，最終奪下建築界最高榮譽普立茲克獎。", "hard": "他出身貧困，由外婆撫養長大，讀的是工業高中，年輕時當過職業拳擊手與貨車司機，沒有機會念大學建築系。無法受正規教育的他，靠著自學把建築系四年的教科書一年讀完，並用打工積蓄獨自環遊世界看建築。創業初期他四處投標卻屢屢落選，不被業界接納。更嚴峻的考驗在晚年：他兩度罹癌，前後切除了五個器官，醫生一度認為他難以繼續工作，他卻照常進事務所，繼續設計到八十多歲。"}, {"name": "慕顏歌", "job": "諮商師", "works": "《你的善良必須有點鋒芒》、《人生有多殘酷，你就該有多堅強》", "bio": "華文暢銷心理諮商師與作家，文字犀利而溫柔。", "story": "身為心理諮商師，她傾聽過無數因過度善良而受傷的心。她發現一味退讓不是善良而是懦弱，於是提筆寫下「善良必須有點鋒芒」，鼓勵人溫柔而有原則，作品暢銷兩百萬冊。", "hard": "無（作者未公開個人生平，缺乏可查證的困境事蹟）"}, {"name": "許皓宜", "job": "心理師", "works": "《情緒寄生》、《與父母和解》", "bio": "臺灣諮商心理學博士、大學副教授，擅長家庭關係與情緒議題。", "story": "從諮商工作中，她看見許多人被童年與家庭的情緒「寄生」而不自覺。她把專業心理學化為溫柔的文字，帶讀者認識並接住自己的情緒，學會與父母、與過去和解。", "hard": "無（涉及個人與家庭私事，此處不作轉述）"}, {"name": "趙星（特立獨行的貓）", "job": "作家", "works": "《人生好貴，請別浪費》", "bio": "中國知名勵志作家，以奮鬥自勵的文字鼓勵年輕人善用光陰。", "story": "普通上班族出身，靠著下班後不斷自我進修與寫作，一步步活成理想的樣子。她以「特立獨行的貓」為名分享奮鬥心得，提醒年輕人餘生很貴，別讓未來的自己討厭現在。", "hard": "她畢業自普通學校，進入職場後只是一名再平凡不過的上班族，沒有顯赫的學歷與人脈，一度對自己的處境感到焦慮。她選擇的方法是把下班後的時間全部用來投資自己：進修、閱讀、學外語、寫作，長年維持早起與自律的習慣。這條路沒有捷徑，過程中也曾懷疑努力是否真的有用。多年累積之後，她以「特立獨行的貓」為筆名分享奮鬥心得，出版多本暢銷書，用親身經歷告訴年輕人：餘生很貴，別讓未來的自己討厭現在。"}, {"name": "郭強生", "job": "學者", "works": "《來不及美好》、《何不認真來悲傷》", "bio": "臺灣小說家與戲劇學者，深刻書寫親情與生命省思。", "story": "留美取得戲劇博士，回臺任教並持續創作。中年時獨自照顧年邁父親，深刻體會親情的「來不及」，把孤獨與失落化為誠實動人的文字，讓讀者在他的坦白中看見自己的課題。", "hard": "他留美取得戲劇博士後回臺任教，正值中年時，人生接連遭遇重擊：母親過世，兄長遠在國外，他成為唯一能照顧年邁父親的人。父親身體與記憶逐漸退化，他一邊教書寫作，一邊獨自承擔漫長的照護，也在那段日子裡重新面對與父親多年來的疏離與心結。孤獨、疲憊與遺憾累積成他中年的功課。他把這些難以啟齒的感受誠實寫進散文，讓許多同樣面臨照顧父母、卻不知向誰訴說的讀者，在他的坦白中看見自己。"}, {"name": "李蘋芬", "job": "詩人", "works": "《初醒如飛行：李蘋芬詩集》", "bio": "臺灣新世代詩人，詩風細膩靈動，敏銳捕捉日常微光。", "story": "在古典文學的滋養下成長，卻寫出充滿現代靈光的詩。她以敏銳的感官捕捉日常裡的細微悸動，讓草長、雲黑、汗熱都成為詩句，年紀輕輕便屢獲文學獎肯定。", "hard": "無（作者未公開相關經歷，缺乏可查證的困境事蹟）"}, {"name": "林奕華", "job": "導演", "works": "《因為尋找，所以看見》", "bio": "香港舞台劇導演與文化評論人，作品融合文學與當代思辨。", "story": "橫跨劇場、電影與文字創作，總在作品中追問人與自我的關係。他曾獨自踏上朝聖之路，在孤獨的行走中重新學習「如何做一個人」，並把體悟化為文字啟發讀者。", "hard": "無（作者未公開相關經歷，缺乏可查證的困境事蹟）"}, {"name": "高希均", "job": "學者", "works": "《改變，才有希望》、《相信閱讀》", "bio": "經濟學者、天下文化創辦人，畢生推廣閱讀與進步觀念。", "story": "出身戰亂年代，赴美攻讀經濟學並任教多年。他深信觀念能改變社會，返臺創辦天下文化與《遠見》雜誌，畢生推廣閱讀與終身學習，被譽為影響華人世界的觀念傳播者。", "hard": "他生於南京，童年在對日抗戰的烽火中度過，隨家人不斷逃難遷徙。十三歲那年，隨家人渡海來臺，一切從零開始，家境清寒。他半工半讀完成學業，之後赴美攻讀經濟學博士，在異鄉苦讀多年才站穩腳步，並在美國大學任教三十餘年。事業穩定後，他選擇回頭投入自己認為更重要的事：返臺創辦出版社與雜誌，長年推廣閱讀與進步觀念，因為他親身經歷過知識如何把一個逃難的孩子帶往完全不同的人生。"}, {"name": "洪蘭", "job": "學者", "works": "《靜下來，才知道人生要什麼》", "bio": "臺灣認知神經科學家與大學教授，長年推廣閱讀與品格教育。", "story": "留美取得認知神經科學博士，回臺投身教育與科普。她走遍偏鄉演講、翻譯上百本科學好書，用腦科學說明閱讀與品格如何形塑人的一生，是最積極推動閱讀教育的學者之一。", "hard": "無（未取得可靠且適合轉述的困境記載）"}, {"name": "龍應台", "job": "作家", "works": "《目送》、《野火集》", "bio": "臺灣作家與文化評論人，散文兼具理性與深情。", "story": "以《野火集》的犀利筆鋒批判時弊、震撼社會，也在《目送》中寫盡親子與生死的深情。理性與柔情兼具，是華人世界最具影響力的作家與公共知識分子之一。", "hard": "她以《野火集》尖銳批判社會亂象，在戒嚴末期的臺灣引發巨大迴響，也讓她承受來自各方的壓力與攻擊。此後長年旅居海外，作品持續引發爭議，被讚譽也被激烈反對。人生最深的功課則來自家庭：母親罹患失智症，逐漸不再認得她，她定期南下陪伴，親身經歷至親一點一滴的消逝；父親過世則讓她第一次真正面對死亡。她把這些送別寫成《目送》，那句關於父女母子只能一路目送背影漸行漸遠的體悟，觸動無數讀者。"}, {"name": "魯迅", "job": "文學家", "works": "《吶喊》、《狂人日記》", "bio": "中國現代文學奠基者，以犀利筆鋒批判社會。", "story": "早年赴日學醫，卻在一則影片中看見同胞的麻木，領悟醫身不如醫心，毅然棄醫從文。他以深刻犀利的文字批判舊社會、喚醒國民，成為中國現代文學的奠基者。", "hard": "少年時期，祖父因科場案入獄，父親長年重病，家道急速中落。他常常抱著典當來的錢往返當鋪與藥鋪，在櫃檯前受盡白眼，父親最終仍在他十五歲那年病逝。這段經歷讓他決心赴日學醫，卻在課堂上看到一則影片：同胞被處決，圍觀的人神情麻木。他領悟到醫身不如醫心，毅然棄醫從文。此後他以文字批判社會，長期遭到打壓與通緝，數度避居他處，仍持續寫作，成為中國現代文學的奠基者。"}, {"name": "高爾基", "job": "文學家", "works": "《童年》、《母親》", "bio": "俄國文學家，出身貧苦自學成才，作品描寫底層人民。", "story": "幼年喪父、飽嘗貧困，做過學徒與雜工，四處流浪謀生。書籍成為他黑暗生活中的光，靠自學走上文學之路，以真摯筆觸描寫底層人民的苦難與希望。", "hard": "他四歲喪父，隨母親寄居外祖父家，十歲時母親也過世，從此被迫自謀生計。他當過鞋店學徒、輪船洗碗工、麵包房雜工、碼頭搬運工，四處流浪，飽嘗貧困與冷眼，幾乎沒有機會上學。書籍成為他黑暗生活中唯一的光，他利用工作空檔一本本苦讀，靠自學走上寫作之路。他把親身經歷寫成《童年》《在人間》《我的大學》三部曲，真實描寫底層人民的苦難與韌性，讓無數同樣出身困頓的人看見希望。"}, {"name": "托爾斯泰", "job": "小說家", "works": "《戰爭與和平》、《安娜·卡列尼娜》", "bio": "俄國文學巨匠，晚年關注道德與信仰。", "story": "出身俄國貴族，卻對財富與特權深感不安。他以恢宏筆力寫下傳世巨著，晚年更放棄貴族生活、關懷農民與信仰，追求簡樸與良善，其思想與作品同樣影響後世。", "hard": "他早年喪父喪母，由親戚撫養長大。中年時，儘管擁有名望、財富與美滿家庭，他卻陷入嚴重的精神危機，反覆追問人生的意義，痛苦到幾乎無法生活。他最終從勞動與信仰中找到答案，開始質疑自己所屬的貴族階級，主張放棄財產與土地，因而與妻子產生長年衝突，也因批評教會而遭到革除教籍。八十二歲那年，他為了實踐理想深夜離家出走，途中病倒，最後在一座偏僻的小火車站辭世。"}, {"name": "莎士比亞", "job": "劇作家", "works": "《哈姆雷特》、《羅密歐與茱麗葉》", "bio": "英國文藝復興時期劇作家與詩人，作品深刻描寫人性。", "story": "出身英國小鎮，未受完整高等教育，卻憑天賦與勤奮成為劇壇巨匠。他一生寫下近四十部劇作與大量詩篇，深刻描摹愛恨、野心與命運，作品跨越四百年仍在世界各地上演。", "hard": "他出身小鎮商人家庭，父親後來經商失敗、家道中落，他因此未能接受完整的高等教育，只能靠自學與劇場歷練成長。前往倫敦發展初期，他被學院派的劇作家譏諷為沒有學問的「暴發戶烏鴉」。人生最沉重的打擊是獨子哈姆奈特在十一歲時夭折，他當時人在倫敦演出。此後他的作品明顯轉向深沉，寫出一系列探討死亡與命運的悲劇。倫敦瘟疫流行時劇院被迫關閉，他便轉而寫詩，始終沒有停止創作。"}, {"name": "王爾德", "job": "作家", "works": "《快樂王子》、《格雷的畫像》", "bio": "愛爾蘭作家與劇作家，言語機鋒，唯美主義代表。", "story": "才華洋溢、妙語如珠，是倫敦社交界的風雲人物。他以華麗諷刺的文字追求唯美，童話《快樂王子》更充滿悲憫。雖晚年遭遇牢獄與潦倒，其智慧與作品魅力至今為人傳誦。", "hard": "他曾是倫敦最耀眼的名流，才華與機智風靡社交界。四十歲後，他因私人生活遭到控告，在一場轟動全國的審判後被判入獄兩年苦役，在獄中做著搓麻繩、踩踏車的粗重勞動，健康嚴重受損。入獄期間他破產，妻兒改姓並與他斷絕往來，母親在他服刑時過世而他無法奔喪。出獄後他化名流亡法國，生活潦倒，三年後病逝於巴黎一間簡陋旅館。獄中所寫的長信，成為他最沉痛真摯的作品。"}, {"name": "培根", "job": "哲學家", "works": "《培根隨筆》、《新工具》", "bio": "英國哲學家與政治家，倡導歸納法與實驗科學。", "story": "身兼哲學家與官員，官至大法官，仕途大起大落。他主張知識來自觀察與實驗，喊出「知識就是力量」，為近代科學方法奠基，也以精練的隨筆成為英國散文之父。", "hard": "他自幼聰慧，卻在十八歲時因父親驟逝而失去繼承，被迫自力謀生，長年為債務所苦，甚至一度被拘捕。他在政壇苦熬二十多年才逐步升遷，六十歲時官至大法官，達到人生頂點。隔年卻被國會控告收受訴訟當事人的餽贈，他認罪去職，被罰鉅款並短暫囚禁於倫敦塔，政治生涯就此結束。失勢之後，他反而全心投入寫作與科學方法的研究，完成《新工具》等重要著作，晚年的著述成就遠超過他的仕途。"}, {"name": "柏拉圖", "job": "哲學家", "works": "《理想國》", "bio": "古希臘哲學家，蘇格拉底弟子，創辦雅典學園。", "story": "出身雅典貴族，因恩師蘇格拉底受冤處死而對政治失望，轉而追求真理。他創辦西方最早的學園，以生動的對話錄探討正義與理想國度，深刻影響兩千多年的西方哲學。", "hard": "他出身雅典望族，原本立志從政，然而二十八歲那年，他最敬愛的老師蘇格拉底被雅典法庭以敗壞青年之名判處死刑。這件事讓他對當時的政治徹底失望，離開雅典遊歷各地十餘年。相傳他曾應邀前往西西里的敘拉古，試圖說服僭主推行理想政治，不但失敗，還一度被賣為奴隸，靠友人贖回。返回雅典後，他創辦學園，把改造現實的希望轉向教育與哲學，寫下《理想國》探討什麼才是真正的正義。"}, {"name": "亞里士多德", "job": "哲學家", "works": "《尼各馬可倫理學》、《政治學》", "bio": "古希臘哲學家與科學先驅，涉獵廣博，奠定西方學術根基。", "story": "自幼好學，入柏拉圖學園鑽研二十年。他不盲從老師，主張凡事觀察求證，研究橫跨邏輯、倫理、生物與政治，曾任亞歷山大大帝之師，被譽為西方學術體系的奠基者。", "hard": "他十七歲入柏拉圖學園，鑽研二十年，老師去世後卻未能接掌學園，於是離開雅典。他一生始終背負著「外邦人」的身分，在雅典沒有公民權，連置產都受限。晚年因學生亞歷山大大帝驟逝，雅典掀起強烈的反馬其頓情緒，他被指控不敬神明——正是當年蘇格拉底被處死的罪名。他選擇離開雅典，說不願讓雅典再一次對哲學犯罪。隔年他在流亡地病逝，留下的學術體系卻奠定了西方兩千年的知識根基。"}, {"name": "叔本華", "job": "哲學家", "works": "《作為意志和表象的世界》", "bio": "德國哲學家，唯意志論代表，思想深刻。", "story": "個性孤高，著作起初乏人問津，他卻堅信自己思想的價值。他主張世界由盲目的意志驅動，唯有藝術與智慧能得解脫。晚年終獲肯定，深深影響後世哲學、文學與心理學。", "hard": "他與母親關係長期緊張，父親早逝後兩人衝突加劇，最終決裂，終生未再相見。他年輕時在柏林大學任教，刻意把課排在當時最受歡迎的黑格爾同一時段，結果聽眾寥寥，只好黯然結束教職。他的代表作出版後幾乎無人問津，出版商大量銷毀庫存，這樣的冷落持續了將近三十年。他始終堅信自己的價值，繼續獨自寫作，直到六十多歲才終獲肯定，聲名鵲起，晚年終於見到自己的思想被廣泛閱讀。"}, {"name": "歌德", "job": "文學家", "works": "《浮士德》、《少年維特的煩惱》", "bio": "德國文學巨擘與思想家，為德國古典文學最高峰。", "story": "少年即以《少年維特的煩惱》轟動歐洲。他一生興趣廣博，橫跨文學、科學與政治，並花費近六十年寫就巨著《浮士德》，探問人生的意義與不斷進取的精神。", "hard": "青年時期他愛上友人的未婚妻而無法得償，內心的痛苦促使他寫下《少年維特的煩惱》，作品轟動全歐，卻也因書中情節引發爭議而備受抨擊。他在威瑪擔任官職十餘年，行政庶務幾乎吞噬了創作時間，讓他一度陷入枯竭，最後不告而別、獨自出走義大利，才重新找回創作生命。晚年他接連經歷妻子與唯一存活的兒子先他而去的打擊，仍在八十二歲高齡完成耗時近六十年的《浮士德》，隨後不久辭世。"}, {"name": "卡萊爾", "job": "史學家", "works": "《英雄與英雄崇拜》", "bio": "英國維多利亞時代思想家與史學家，文風雄辯。", "story": "出身蘇格蘭農家，靠苦讀成為維多利亞時代的思想巨擘。他文風雄辯有力，主張歷史由英雄與偉大人格推動，重視道德與信念，對當時社會思潮影響深遠。", "hard": "他出身蘇格蘭石匠家庭，靠苦讀進入大學，早年長期貧困，飽受胃病折磨。最著名的打擊發生在他寫作《法國大革命》期間：他把第一卷唯一的手稿借給友人彌爾閱讀，卻被彌爾家中的女僕誤當廢紙投入爐火燒毀。當時他沒有留下任何副本，數月心血一夕成灰。他在震驚與絕望之後，選擇從頭重寫，最終完成這部使他聲名大噪的著作。他相信歷史由堅毅的人格所推動，自己正是最好的例證。"}, {"name": "愛迪生", "job": "發明家", "works": "電燈、留聲機等逾千項專利", "bio": "美國發明家，以堅持不懈的實驗精神照亮現代文明。", "story": "幼時被老師認為遲鈍而退學，靠母親教導與自學成長。他堅信天才是努力得來，為改良電燈試驗上千種材料而不放棄，一生取得逾千項專利，以不懈精神照亮現代生活。", "hard": "他幼時被老師認為反應遲鈍而僅上了三個月的學，由母親在家教導。年少時因一次意外導致聽力嚴重受損，此後幾近全聾，他卻說這讓他更能專心思考。研發電燈燈絲時，他測試了上千種材料才找到可行的方案，被問及失敗，他回答自己只是找到了行不通的方法。六十七歲那年，他的實驗室與廠房遭遇大火幾乎全毀，多年成果付之一炬。他隔天便著手重建，並說火把過去的錯誤全燒光了，可以重新開始。"}, {"name": "富蘭克林", "job": "政治家", "works": "《富蘭克林自傳》", "bio": "美國開國元勳、科學家與作家，發明避雷針。", "story": "出身貧寒、少年輟學當學徒，靠自學成為印刷商、作家與科學家。他冒險以風箏實驗探究雷電並發明避雷針，更參與草擬獨立宣言，以勤勉自律成為受人敬重的開國元勳。", "hard": "家中十七個孩子他排行第十五，家境貧寒，十歲便輟學到父親的作坊幫忙，十二歲起在兄長的印刷廠當學徒。兄長對他嚴厲甚至動輒責打，他寫的文章也不被接受，只好化名投稿。十七歲那年他偷偷出走，身上幾乎沒有錢，隻身抵達費城時只買得起三個麵包卷。他從最基層的排字工做起，靠自學與自律逐步立足，成為印刷商、報人、科學家，最終參與草擬美國獨立宣言，成為受人敬重的開國元勳。"}, {"name": "居里夫人", "job": "科學家", "works": "《居里夫人自傳》", "bio": "波蘭裔法國物理與化學家，兩度榮獲諾貝爾獎。", "story": "生於被壓迫的波蘭，為求學遠赴巴黎，在清貧中苦讀。她與丈夫在簡陋棚屋裡歷經數千次實驗，發現鐳與釙，成為史上首位兩度獲諾貝爾獎的科學家，卻淡泊名利、奉獻科學。", "hard": "她生於被外國統治的波蘭，當地大學不收女學生，她只能參加祕密開設的「流動大學」旁聽，並與姊姊約定輪流工作供對方讀書，自己先當了六年家庭教師。赴巴黎求學後，她住在沒有暖氣的閣樓，冬天冷到把所有衣服蓋在身上，曾因營養不良而昏倒。與丈夫在漏雨的棚屋中處理數噸礦渣，歷經四年才提煉出微量的鐳。丈夫車禍驟逝後，她獨自撫養兩個女兒並接下他的教職，晚年因長期接觸輻射而健康受損。"}, {"name": "羅丹", "job": "雕塑家", "works": "《羅丹藝術論》（葛賽爾記述）", "bio": "法國現代雕塑大師，作品強調生命情感與真實質感。", "story": "三度報考皇家美術學校皆落榜，仍在工作室苦練不輟。他打破傳統雕塑的僵硬規範，以生動線條刻畫人性，並在與友人的對談中留下名言：美到處都有，缺的是發現的眼睛。", "hard": "他自幼近視嚴重、學業不佳，三度報考巴黎美術學院都落榜，只能到工坊當裝飾工人維持生計。二十二歲時最疼愛的姊姊過世，他悲痛到一度進入修道院，經院長勸導才重返雕塑。成名之路同樣坎坷：他的《青銅時代》寫實到被評審誣指是直接翻模真人，他花了數年才洗清指控。晚年受託創作的《巴爾扎克像》因造型大膽被委託方拒絕接收，飽受嘲諷，他卻堅持不改，多年後這件作品被公認為現代雕塑的開端。"}, {"name": "池田大作", "job": "作家", "works": "《人生的座標》、《青春對話》", "bio": "日本作家與和平運動者，倡導對話與生命尊嚴。", "story": "青年時期歷經二戰苦難，立志以和平與教育改變世界。他一生與各國學者對話、創辦大學與文化機構，著述宏富，鼓勵青年在挑戰中堅持到底、活出自己的價值。", "hard": "他生於海苔養殖之家，家境因父親臥病而陷入困頓。二次大戰期間，四位兄長全部被徵召上戰場，最敬愛的長兄戰死緬甸，噩耗傳來時母親強忍悲痛的背影讓他終生難忘；空襲又燒毀了他們的家。戰後他自己罹患肺結核，醫生斷言他活不過三十歲，只能一邊工作一邊治療、夜校進修。他把這些苦難轉化為對和平的信念，畢生投入教育與國際對話，創辦學校與研究機構，鼓勵青年在挑戰中堅持到底。"}, {"name": "羅蘭", "job": "作家", "works": "《羅蘭小語》", "bio": "臺灣廣播人與勵志散文作家，短語溫婉智慧。", "story": "在廣播節目中以溫柔的聲音陪伴聽眾，將人生體悟化為一則則短語。《羅蘭小語》問世後風靡華人社會，以平實智慧談友誼、成長與生活，陪伴一代又一代年輕人。", "hard": "她出生於河北，青年時期正逢對日抗戰，學業與生活都在戰亂中顛沛流離，後來隨政府播遷來臺，隻身在陌生的島嶼重新開始。初期她在廣播電臺工作，經濟並不寬裕，也曾面對婚姻與生活的壓力。她把自己在困頓中慢慢想通的道理，化為一則則平實的短語在節目中與聽眾分享，後來集結成《羅蘭小語》。那些話沒有華麗的辭藻，卻因為出自親身的體會，陪伴了幾個世代的年輕人度過迷惘。"}, {"name": "雨果", "job": "文學家", "works": "《悲慘世界》、《鐘樓怪人》", "bio": "法國浪漫主義文學代表，關懷底層人民與人道精神。", "story": "曾因反對帝制而流亡海外近二十年，仍持續創作不輟。他以《悲慘世界》寫盡窮苦者的掙扎與寬恕的力量，畢生為弱勢與人道發聲，去世時法國舉國哀悼。", "hard": "他四十一歲那年，剛新婚的長女與丈夫在塞納河翻船溺斃，他在旅途中從報紙上讀到噩耗，悲痛欲絕，此後多年幾乎無法寫作。四十九歲時他因公開反對拿破崙三世稱帝而遭通緝，被迫流亡海外，輾轉於比利時與英吉利海峽的小島，一去十九年。流亡期間政府沒收他的財產、查禁他的作品，多次勸誘他回國他都拒絕，直到帝制垮臺才返回巴黎。正是在這段流亡歲月裡，他 function catIndex(){
  const m=new Map();
  DATA.quotes.forEach(qt=>{ if(!m.has(qt.cat))m.set(qt.cat,[]); m.get(qt.cat).push(qt); });
  return [...m.entries()];
}

function quoteCard(qt,kw){
  const a=findAuthor(qt.author);
  const btn=a
    ? `<button class="author-btn" data-author="${esc(a.name)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>${hl(qt.author,kw)}</button>`
    : `<span class="author-btn plain">${hl(qt.author,kw)}</span>`;
  const chips=qt.topics.map(t=>`<span class="chip" data-topic="${esc(t)}">${hl(t,kw)}</span>`).join('');
  const lv=(qt.lvl||'')[0]||'C';
  return `<div class="card">
    <div class="quote">${hl(qt.quote,kw)}</div>
    <div class="meta">${btn}<span class="chips">${chips}</span></div>
    <div class="src"><span class="lv ${lv}">${esc(qt.lvl||'')}</span><span>${hl(qt.src||'',kw)}</span></div>
  </div>`;
}

function matches(qt,kw){
  if(!kw) return true;
  const hay=(qt.quote+' '+qt.author+' '+qt.cat+' '+(qt.src||'')+' '+(qt.lvl||'')+' '+qt.topics.join(' ')).toLowerCase();
  return hay.indexOf(kw.toLowerCase())>-1;
}

function render(){
  const kw=q.value.trim();
  clearBtn.style.display=kw?'block':'none';
  let html='', total=0;

  if(view==='author'){
    const arr=DATA.authors.filter(a=>!kw||(a.name+a.job+a.works+a.bio+a.story).toLowerCase().indexOf(kw.toLowerCase())>-1);
    total=arr.length;
    html=`<div class="group"><div class="group-h"><span class="t">作者總覽</span><span class="n">${total} 位</span></div>`;
    html+=arr.map(a=>`<div class="card" style="cursor:pointer" data-author="${esc(a.name)}">
        <div class="quote" style="padding-left:30px">${hl(a.name,kw)}
          <span class="a-job" style="margin-left:8px">${esc(a.job)}</span></div>
        <div class="meta"><span style="padding-left:30px;color:var(--muted);font-size:14px">${hl(a.bio,kw)}</span></div>
      </div>`).join('');
    html+=`</div>`;
    if(!total) html=emptyHTML(kw);
  } else {
    const idx = view==='topic'?topicIndex():catIndex();
    const blocks=[];
    idx.forEach(([name,qts])=>{
      const shown=qts.filter(qt=>matches(qt,kw));
      if(!shown.length) return;
      total+=shown.length;
      const label = view==='topic'?'講題':'則';
      blocks.push(`<div class="group"><div class="group-h"><span class="t">${hl(name,kw)}</span><span class="n">${shown.length} 則</span></div>${shown.map(qt=>quoteCard(qt,kw)).join('')}</div>`);
    });
    html = blocks.length?blocks.join(''):emptyHTML(kw);
  }
  list.innerHTML=html;

  if(view==='author') countEl.textContent = kw?`找到 ${total} 位作者`:`共 ${DATA.authors.length} 位作者　·　點卡片看生命故事`;
  else if(view==='topic') countEl.textContent = kw?`符合「${kw}」的佳句 ${total} 則`:`共 ${topicIndex().length} 個講題　·　點作者看故事`;
  else countEl.textContent = kw?`符合「${kw}」的佳句 ${total} 則`:`共 ${DATA.quotes.length} 則佳句，分 ${catIndex().length} 類`;
}
function emptyHTML(kw){
  return `<div class="empty">找不到含「<b>${esc(kw)}</b>」的內容。<br>試試較短的關鍵字，例如「夢想」「友誼」「閱讀」「挫折」。</div>`;
}

// ---- events ----
q.addEventListener('input',render);
clearBtn.addEventListener('click',()=>{q.value='';q.focus();render();});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true'); view=t.dataset.view; window.scrollTo(0,0); render();
}));
list.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){ q.value=chip.dataset.topic;
    if(view==='author'){document.querySelector('.tab[data-view="topic"]').click();}
    render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const ab=e.target.closest('[data-author]');
  if(ab){ openAuthor(ab.dataset.author); }
});

// ---- modal ----
const modal=document.getElementById('modal'), aBody=document.getElementById('aBody');
function openAuthor(name){
  const a=findAuthor(name); if(!a) return;
  aBody.innerHTML=`
    <h2 class="a-name" id="aName">${esc(a.name)} <span class="a-job">${esc(a.job)}</span></h2>
    <div class="a-lab">知名著作</div><div class="a-works">${esc(a.works)}</div>
    <div class="a-lab">簡介</div><div class="a-bio">${esc(a.bio)}</div>
    <div class="a-lab">生命故事</div><div class="a-story">${esc(a.story)}</div>
    ${(a.hard&&!a.hard.startsWith('無'))?`<div class="a-lab">面對困境</div><div class="a-story hard">${esc(a.hard)}</div>`:''}`;
  modal.classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';}
document.getElementById('closeBtn').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
