<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>社會科拔河大挑戰</title>
  <meta name="description" content="適合教室觸控大螢幕的雙隊獨立答題拔河遊戲">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23182b49'/%3E%3Cpath d='M8 32h48' stroke='%23f0b44d' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M32 17v30' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23e86767'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17243b;--muted:#68758a;--paper:#f5f7fb;--card:#fff;--line:#dbe2ec;--blue:#2878d0;--blue-soft:#eaf4ff;--red:#df5962;--red-soft:#fff0f1;--gold:#f0b44d;--green:#2f9b68;--shadow:0 14px 34px rgba(26,46,78,.11)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#fff 0,#f5f7fb 48%,#eef2f7 100%);color:var(--ink);overflow:hidden}
    button,input,textarea{font:inherit}
    button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .app{height:100dvh;min-height:680px;padding:16px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px}
    .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
    .team-label{display:flex;align-items:center;gap:10px;font-size:clamp(18px,1.5vw,25px);font-weight:950;letter-spacing:.03em}
    .team-label.right{justify-content:flex-end}
    .team-dot{width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 5px rgba(40,120,208,.1)}
    .team-dot.blue{background:var(--blue)}.team-dot.red{background:var(--red);box-shadow:0 0 0 5px rgba(223,89,98,.1)}
    .clock{position:relative;min-width:178px;text-align:center;background:#17243b;color:#fff;border-radius:19px;padding:8px 25px;box-shadow:var(--shadow)}
    .clock small{display:block;font-size:12px;color:#cbd6e5;font-weight:800;letter-spacing:.12em}
    .clock strong{display:block;font-size:32px;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:.05em}
    .clock.urgent{animation:pulse .7s infinite;background:#a52e37}
    @keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(223,89,98,.16)}}
    .toolbar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
    .tool{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:9px 16px;min-height:44px;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(25,45,75,.05)}
    .tool:hover{transform:translateY(-1px)}.tool:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .tool.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .game{min-height:0;display:grid;grid-template-columns:minmax(285px,29%) minmax(360px,42%) minmax(285px,29%);gap:14px}
    .team-panel{min-width:0;min-height:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;border:2px solid;box-shadow:var(--shadow);overflow:hidden}
    .team-panel.blue{background:linear-gradient(155deg,#fff 0,var(--blue-soft) 100%);border-color:#9cc8f2}
    .team-panel.red{background:linear-gradient(205deg,#fff 0,var(--red-soft) 100%);border-color:#efadb2}
    .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .team-name{font-size:clamp(21px,1.8vw,29px);font-weight:950}
    .type{display:inline-flex;margin-top:5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid var(--line);font-size:13px;font-weight:850;color:var(--muted)}
    .score{font-size:clamp(38px,3vw,56px);font-weight:1000;line-height:.9;font-variant-numeric:tabular-nums}
    .question{display:flex;align-items:center;justify-content:center;flex:1;min-height:105px;padding:14px 2px;text-align:center;font-size:clamp(19px,1.55vw,25px);line-height:1.45;font-weight:950}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .answer{min-width:0;min-height:70px;border:2px solid;border-radius:17px;background:#fff;padding:10px;font-size:clamp(16px,1.25vw,20px);font-weight:900;color:var(--ink);cursor:pointer;box-shadow:0 6px 14px rgba(35,63,100,.07);transition:transform .08s,background .15s,border .15s}
    .blue .answer{border-color:#afd3f4}.red .answer{border-color:#f1bcc0}
    .answer:active:not(:disabled){transform:scale(.95)}.answer:disabled{cursor:default}
    .answer.correct{background:#e9f8f0;border-color:var(--green);color:#176743}.answer.wrong{background:#fff0f1;border-color:var(--red);color:#a92c35}
    .feedback{min-height:28px;padding-top:7px;text-align:center;font-weight:950}
    .arena{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#e9f6ff 0,#fafcff 60%,#e7dfcf 60%,#f5efe5 100%);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:14px}
    .arena-title{text-align:center;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.16em}
    .field{position:relative;min-height:310px;overflow:hidden}
    .cloud{position:absolute;width:75px;height:24px;background:#fff;border-radius:50px;opacity:.65}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:35px;height:35px;left:12px;bottom:4px}.cloud:after{width:28px;height:28px;right:10px;bottom:3px}.cloud.c1{left:9%;top:16%}.cloud.c2{right:7%;top:27%;transform:scale(.78)}
    .midline{position:absolute;left:50%;top:12px;bottom:25px;border-left:3px dashed rgba(24,43,73,.2)}
    .ground{position:absolute;left:3%;right:3%;bottom:78px;height:4px;border-radius:9px;background:#bbaa8b}
    .rope{position:absolute;left:4%;right:4%;bottom:150px;height:10px;border-radius:50px;background:repeating-linear-gradient(105deg,#7e4c29 0 9px,#ba7c43 9px 18px);box-shadow:0 3px 6px rgba(64,37,19,.2)}
    .battle{position:absolute;inset:0;transition:transform .32s cubic-bezier(.2,.8,.3,1)}
    .people{position:absolute;bottom:78px;width:43%;height:190px;display:flex;align-items:flex-end;justify-content:center}
    .people.left{left:0}.people.right{right:0}.people svg{width:100%;height:100%;overflow:visible}
    .knot{position:absolute;left:50%;bottom:120px;transform:translateX(-50%)}
    .flag{width:28px;height:38px;background:var(--gold);clip-path:polygon(0 0,100% 12%,78% 50%,100% 88%,0 100%);box-shadow:0 3px 8px rgba(0,0,0,.2)}
    .pole{width:4px;height:70px;background:#26374f;margin:-3px auto 0;border-radius:4px}
    .pull-left{animation:pullLeft .33s ease}.pull-right{animation:pullRight .33s ease}
    @keyframes pullLeft{50%{transform:translateX(-16px) rotate(-2deg)}}@keyframes pullRight{50%{transform:translateX(16px) rotate(2deg)}}
    .status{text-align:center;min-height:30px;font-size:18px;font-weight:950}
    .meter{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;color:var(--muted);font-size:12px;font-weight:900}
    .track{height:9px;border-radius:99px;background:#d7dee8;overflow:hidden}.fill{height:100%;width:0;transition:width .3s}.fill.blue{float:right;background:var(--blue)}.fill.red{background:var(--red)}
    .modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(12,26,46,.62);backdrop-filter:blur(6px)}.modal.open{display:grid}
    .settings-card{width:min(980px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
    .settings-card h2{margin:0 0 15px;font-size:25px}.set-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    label{display:block;font-size:14px;font-weight:900}input,textarea{width:100%;margin-top:6px;border:1px solid #cbd5e2;border-radius:12px;padding:10px 12px;background:#fbfcfe;color:var(--ink)}textarea{min-height:190px;resize:vertical;font-family:ui-monospace,monospace;line-height:1.5}
    .import-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.import-hint{color:var(--muted);font-size:13px}.message{min-height:24px;font-weight:900}.settings-actions{display:flex;justify-content:flex-end;gap:9px}
    .winner{position:absolute;inset:0;z-index:15;display:none;place-items:center;text-align:center;background:rgba(255,255,255,.93);backdrop-filter:blur(4px)}.winner.show{display:grid;animation:fadeIn .25s ease}
    .winner-card{width:min(620px,94%);max-height:92%;overflow:auto;padding:18px;animation:celebrate .7s cubic-bezier(.18,.8,.28,1.15)}.winner .cup{font-size:64px}.winner h2{margin:3px 0;font-size:clamp(28px,3vw,44px)}.winner p{font-size:18px;font-weight:900;color:var(--muted)}
    .mistakes{margin:14px 0 18px;text-align:left}.mistakes h3{margin:0 0 8px;text-align:center;font-size:19px}.mistake-list{display:grid;gap:8px}.mistake-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(25,45,75,.06)}.mistake-rank{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#fff0f1;color:#a92c35;font-weight:950}.mistake-q{font-size:14px;line-height:1.4;font-weight:900}.mistake-answer{display:block;margin-top:3px;color:var(--green);font-size:12px}.mistake-stat{text-align:right;color:var(--red);font-size:13px;font-weight:950;white-space:nowrap}.mistake-empty{text-align:center;padding:13px;border-radius:14px;background:#e9f8f0;color:#176743;font-weight:900}
    .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-10%;width:10px;height:18px;background:var(--gold);animation:fall 2.1s linear infinite}.confetti i:nth-child(2n){background:var(--blue);animation-delay:.2s}.confetti i:nth-child(3n){background:var(--red);animation-delay:.45s}.confetti i:nth-child(4n){border-radius:50%;animation-delay:.7s}
    @keyframes fadeIn{from{opacity:0}}@keyframes celebrate{0%{transform:scale(.35) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1)}}@keyframes fall{to{transform:translateY(125vh) rotate(720deg)}}
    @media(max-width:1050px){.app{padding:10px}.game{grid-template-columns:minmax(240px,30%) minmax(320px,40%) minmax(240px,30%);gap:8px}.team-panel{padding:13px}.answer{min-height:62px}.people{height:165px}}
    @media(max-width:780px){body{overflow:auto}.app{height:auto;min-height:100dvh}.game{grid-template-columns:1fr}.arena{order:-1;min-height:430px}.question{min-height:100px}.set-grid{grid-template-columns:1fr}.topbar{grid-template-columns:1fr auto 1fr}.clock{min-width:130px;padding-inline:13px}.team-label{font-size:15px}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="team-label"><span class="team-dot blue"></span><span id="headL">第一隊</span></div>
    <div class="clock" id="clock"><small>剩餘時間</small><strong id="timer">01:30</strong></div>
    <div class="team-label right"><span id="headR">第二隊</span><span class="team-dot red"></span></div>
  </header>
  <nav class="toolbar" aria-label="遊戲控制">
    <button class="tool" id="settingsBtn">⚙ 教師設定</button><button class="tool primary" id="startBtn">開始挑戰</button><button class="tool" id="pauseBtn">暫停</button><button class="tool" id="resetBtn">重新開始</button>
  </nav>
  <section class="game">
    <article class="team-panel blue" aria-label="第一隊答題區">
      <div class="panel-head"><div><div class="team-name" id="nameL">第一隊</div><span class="type" id="typeL">選擇題</span></div><div class="score" id="scoreL">0</div></div>
      <div class="question" id="qL"></div><div class="answers" id="optsL"></div><div class="feedback" id="msgL" aria-live="polite"></div>
    </article>
    <section class="arena" aria-label="拔河戰況">
      <div class="arena-title">拔河戰況</div>
      <div class="field"><div class="cloud c1"></div><div class="cloud c2"></div><div class="midline"></div><div class="ground"></div><div class="rope"></div>
        <div class="battle" id="battle">
          <div class="people left" id="peopleL"><svg viewBox="0 0 300 190" aria-hidden="true"><g stroke="#244c72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 20)"><circle cx="45" cy="30" r="22" fill="#efb98a" stroke="none"/><path d="M25 20Q45-5 65 18" fill="#253b51" stroke="none"/><path d="M44 55l18 55M50 73l48 18M61 108l-22 55M61 108l31 51"/><path d="M33 56q17-11 32 0l8 39q-23 12-47 0z" fill="#2878d0" stroke="none"/></g><g transform="translate(92 28)"><circle cx="45" cy="30" r="22" fill="#dca276" stroke="none"/><path d="M24 19Q44-3 67 19" fill="#49352f" stroke="none"/><path d="M44 55l18 53M50 72l48 18M61 106l-20 53M61 106l31 49"/><path d="M33 56q17-11 32 0l8 38q-23 12-47 0z" fill="#2878d0" stroke="none"/></g><g transform="translate(172 36)"><circle cx="45" cy="30" r="22" fill="#f1bd8c" stroke="none"/><path d="M25 20Q46 1 65 19" fill="#182e43" stroke="none"/><path d="M44 55l18 51M50 72l49 17M61 104l-19 51M61 104l31 47"/><path d="M33 56q17-11 32 0l8 37q-23 12-47 0z" fill="#2878d0" stroke="none"/></g></g></svg></div>
          <div class="people right" id="peopleR"><svg viewBox="0 0 300 190" aria-hidden="true"><g transform="translate(300 0) scale(-1 1)" stroke="#70434a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 20)"><circle cx="45" cy="30" r="22" fill="#efb98a" stroke="none"/><path d="M25 20Q45-5 65 18" fill="#43302d" stroke="none"/><path d="M44 55l18 55M50 73l48 18M61 108l-22 55M61 108l31 51"/><path d="M33 56q17-11 32 0l8 39q-23 12-47 0z" fill="#df5962" stroke="none"/></g><g transform="translate(92 28)"><circle cx="45" cy="30" r="22" fill="#dca276" stroke="none"/><path d="M24 19Q44-3 67 19" fill="#302b2b" stroke="none"/><path d="M44 55l18 53M50 72l48 18M61 106l-20 53M61 106l31 49"/><path d="M33 56q17-11 32 0l8 38q-23 12-47 0z" fill="#df5962" stroke="none"/></g><g transform="translate(172 36)"><circle cx="45" cy="30" r="22" fill="#f1bd8c" stroke="none"/><path d="M25 20Q46 1 65 19" fill="#233740" stroke="none"/><path d="M44 55l18 51M50 72l49 17M61 104l-19 51M61 104l31 47"/><path d="M33 56q17-11 32 0l8 37q-23 12-47 0z" fill="#df5962" stroke="none"/></g></g></svg></div>
          <div class="knot"><div class="flag"></div><div class="pole"></div></div>
        </div>
      </div>
      <div class="status" id="status">雙方準備！</div><div class="meter"><div class="track"><div class="fill blue" id="barL"></div></div><span id="distance">0 / 5</span><div class="track"><div class="fill red" id="barR"></div></div></div>
      <div class="winner" id="winner"><div class="confetti" id="confetti"></div><div class="winner-card"><div class="cup">🏆</div><h2 id="winnerTitle"></h2><p id="winnerScore"></p><section class="mistakes" aria-labelledby="mistakesTitle"><h3 id="mistakesTitle">本場最容易出錯的題目</h3><div class="mistake-list" id="mistakeList"></div></section><button class="tool primary" id="againBtn">再玩一次</button></div></div>
    </section>
    <article class="team-panel red" aria-label="第二隊答題區">
      <div class="panel-head"><div><div class="team-name" id="nameR">第二隊</div><span class="type" id="typeR">是非題</span></div><div class="score" id="scoreR">0</div></div>
      <div class="question" id="qR"></div><div class="answers" id="optsR"></div><div class="feedback" id="msgR" aria-live="polite"></div>
    </article>
  </section>
</main>
<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><section class="settings-card"><h2 id="settingsTitle">教師設定</h2>
  <div class="set-grid"><label>第一隊名稱<input id="nameLInput" value="第一隊"></label><label>第二隊名稱<input id="nameRInput" value="第二隊"></label><label>比賽時間（秒）<input id="timeInput" type="number" min="20" max="900" value="90"></label></div>
  <div class="import-row"><button class="tool" id="importBtn">匯入題目檔案</button><input id="fileInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden><span class="import-hint">支援 TXT／CSV；每行格式：題型｜題目｜選項1;選項2｜答案</span></div>
  <label>題庫<textarea id="bankInput">選擇題|1895年，清朝與日本簽訂哪一個條約，使臺灣進入日治時期？|南京條約;馬關條約;北京條約;天津條約|馬關條約
是非題|臺灣夏季常受到西南季風影響，帶來較多水氣。|⭕ 正確;❌ 錯誤|⭕ 正確
年分題|蔣渭水創立臺灣民眾黨是在西元哪一年？|1915年;1921年;1927年;1935年|1927年
選擇題|臺灣西部較常見哪一類海岸？|沙岸;峽灣;斷層海岸;珊瑚礁海岸|沙岸
是非題|網路圖片只要沒有營利，就一定可以任意公開使用。|⭕ 正確;❌ 錯誤|❌ 錯誤
年分題|甲午戰爭結束、簽訂馬關條約是在西元哪一年？|1885年;1895年;1905年;1915年|1895年
選擇題|臺灣颱風主要在哪個季節影響較頻繁？|春季;夏秋季;冬季;全年完全相同|夏秋季
是非題|消費者所有購物行為都一定享有七天無條件退貨。|⭕ 正確;❌ 錯誤|❌ 錯誤</textarea></label>
  <div class="message" id="bankMsg"></div><div class="settings-actions"><button class="tool" id="closeBtn">取消</button><button class="tool primary" id="applyBtn">套用設定</button></div>
</section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let bank=[],names={L:'第一隊',R:'第二隊'},score={L:0,R:0},stats={},pull=0,goal=5,total=90,time=90,running=false,paused=false,clock=null;let state={L:{q:null,used:[],locked:false,next:null},R:{q:null,used:[],locked:false,next:null}};
function parse(text){const rows=text.replace(/^\uFEFF/,'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean);const out=rows.map((row,i)=>{const delimiter=row.includes('|')?'|':',';const p=row.split(delimiter).map(v=>v.trim());if(p.length!==4)throw new Error(`第 ${i+1} 行格式不正確`);const opts=p[2].split(';').map(v=>v.trim()).filter(Boolean);if(opts.length<2||!opts.includes(p[3]))throw new Error(`第 ${i+1} 行的選項或答案有問題`);return{id:i,type:p[0],q:p[1],opts,ans:p[3]}});if(out.length<2)throw new Error('題庫至少需要 2 題');return out}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(side){const s=state[side],other=state[side==='L'?'R':'L'];let pool=shuffle(bank.filter(q=>q.id!==other.q?.id&&!s.used.includes(q.id)));if(!pool.length){s.used=[];pool=shuffle(bank.filter(q=>q.id!==other.q?.id))}const q=pool[0]||bank[0];s.used.push(q.id);return q}
function render(side){const s=state[side];s.q=pick(side);s.locked=false;$('type'+side).textContent=s.q.type;$('q'+side).textContent=s.q.q;$('msg'+side).textContent='';const box=$('opts'+side);box.replaceChildren();s.q.opts.forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.disabled=!running||paused;b.addEventListener('pointerup',e=>{e.preventDefault();answer(side,opt,b)});box.append(b)})}
function enable(side){[...$('opts'+side).children].forEach(b=>b.disabled=!running||paused||state[side].locked)}
function answer(side,opt,button){const s=state[side];if(!running||paused||s.locked)return;s.locked=true;enable(side);const item=stats[s.q.id]||(stats[s.q.id]={q:s.q.q,ans:s.q.ans,attempts:0,wrong:0});item.attempts++;if(opt===s.q.ans){button.classList.add('correct');$('msg'+side).textContent='✅ 正確！';score[side]++;pull+=side==='L'?-1:1;const person=$('people'+side);person.classList.add(side==='L'?'pull-left':'pull-right');setTimeout(()=>person.classList.remove('pull-left','pull-right'),350);$('status').textContent=names[side]+' 拉回一格！'}else{item.wrong++;button.classList.add('wrong');$('msg'+side).textContent='❌ 正確答案：'+s.q.ans}update();if(running){clearTimeout(s.next);s.next=setTimeout(()=>{if(running){render(side);enable(side)}},700)}}
function update(){$('scoreL').textContent=score.L;$('scoreR').textContent=score.R;const p=Math.max(-goal,Math.min(goal,pull));$('battle').style.transform=`translateX(${p/goal*22}%)`;$('distance').textContent=Math.abs(p)+' / '+goal;$('barL').style.width=(p<0?Math.abs(p)/goal*100:0)+'%';$('barR').style.width=(p>0?p/goal*100:0)+'%'}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(paused)return;time=Math.max(0,time-1);$('timer').textContent=fmt(time);$('clock').classList.toggle('urgent',time<=10);if(time===0)finish(score.L===score.R?'平手':score.L>score.R?names.L:names.R)}
function start(){if(running)return;running=true;paused=false;$('startBtn').disabled=true;$('winner').classList.remove('show');$('status').textContent='比賽開始！';enable('L');enable('R');clock=setInterval(tick,1000)}
function renderMistakes(){const box=$('mistakeList');box.replaceChildren();const rows=Object.values(stats).filter(x=>x.wrong>0).sort((a,b)=>b.wrong-a.wrong||b.wrong/b.attempts-a.wrong/a.attempts||b.attempts-a.attempts).slice(0,5);if(!rows.length){const empty=document.createElement('div');empty.className='mistake-empty';empty.textContent='🎉 本場沒有答錯的題目！';box.append(empty);return}rows.forEach((x,i)=>{const item=document.createElement('article');item.className='mistake-item';const rank=document.createElement('span');rank.className='mistake-rank';rank.textContent=i+1;const detail=document.createElement('div');const q=document.createElement('div');q.className='mistake-q';q.textContent=x.q;const ans=document.createElement('span');ans.className='mistake-answer';ans.textContent='正確答案：'+x.ans;q.append(ans);detail.append(q);const stat=document.createElement('div');stat.className='mistake-stat';stat.textContent=`答錯 ${x.wrong} 次\n${Math.round(x.wrong/x.attempts*100)}%`;stat.style.whiteSpace='pre-line';item.append(rank,detail,stat);box.append(item)})}
function finish(winner){if(!running)return;running=false;paused=false;clearInterval(clock);clock=null;clearTimeout(state.L.next);clearTimeout(state.R.next);enable('L');enable('R');$('pauseBtn').textContent='暫停';$('winnerTitle').textContent=winner==='平手'?'勢均力敵，平手！':winner+'獲勝！';$('winnerScore').textContent=`${names.L} ${score.L} ： ${score.R} ${names.R}`;renderMistakes();$('status').textContent='時間到！比賽結束';$('winner').classList.add('show');$('confetti').innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${(i*37)%100}%;animation-duration:${1.6+(i%6)*.18}s"></i>`).join('')}
function reset(){clearInterval(clock);clearTimeout(state.L.next);clearTimeout(state.R.next);score={L:0,R:0};stats={};pull=0;time=total;running=false;paused=false;state={L:{q:null,used:[],locked:false,next:null},R:{q:null,used:[],locked:false,next:null}};$('timer').textContent=fmt(time);$('clock').classList.remove('urgent');$('battle').style.transform='translateX(0)';$('status').textContent='雙方準備！';$('startBtn').disabled=false;$('pauseBtn').textContent='暫停';$('winner').classList.remove('show');render('L');render('R');update();enable('L');enable('R')}
function apply(){try{bank=parse($('bankInput').value);names.L=$('nameLInput').value.trim()||'第一隊';names.R=$('nameRInput').value.trim()||'第二隊';total=Math.max(20,Math.min(900,Number($('timeInput').value)||90));['L','R'].forEach(s=>{$('head'+s).textContent=names[s];$('name'+s).textContent=names[s]});$('bankMsg').textContent='✅ 已成功套用 '+bank.length+' 題';reset();setTimeout(()=>$('settingsModal').classList.remove('open'),450)}catch(e){$('bankMsg').textContent='❌ '+e.message}}
$('settingsBtn').onclick=()=>$('settingsModal').classList.add('open');$('closeBtn').onclick=()=>$('settingsModal').classList.remove('open');$('settingsModal').addEventListener('pointerdown',e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.remove('open')});$('applyBtn').onclick=apply;$('startBtn').onclick=start;$('resetBtn').onclick=reset;$('againBtn').onclick=reset;$('pauseBtn').onclick=()=>{if(!running)return;paused=!paused;$('pauseBtn').textContent=paused?'繼續':'暫停';$('status').textContent=paused?'遊戲暫停':'繼續挑戰！';enable('L');enable('R')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text();parse(text);$('bankInput').value=text;$('bankMsg').textContent='✅ 已匯入 '+file.name+'，請按「套用設定」'}catch(err){$('bankMsg').textContent='❌ 匯入失敗：'+err.message}e.target.value=''});bank=parse($('bankInput').value);reset();
})();
</script>
</body>
