<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>十大建設大富翁｜蓋出臺灣地圖</title>
<style>
:root{--bg:#0e1a26;--panel:#172838;--panel2:#203a50;--line:#2f4c63;--amber:#f2b544;--text:#eef4f8;--muted:#9fb3c4;--green:#4fd18b;--red:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08111a;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(circle at 25% 10%,#1b3248 0%,var(--bg) 60%);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:84px;padding:14px 34px;border-radius:22px;font-size:36px;font-weight:800;background:#4fd1c5;color:#06302c;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.amber{background:var(--amber);color:#2a1c00}
.btn.ghost{background:transparent;border:3px solid var(--line);color:var(--text)}
.btn.small{min-height:64px;font-size:26px;padding:8px 22px;border-radius:16px}
.screen{position:absolute;inset:0}
/* setup */
#setup{display:flex;flex-direction:column;align-items:center;padding:40px 80px}
#setup h1{font-size:92px;margin:10px 0 0;letter-spacing:.04em}
#setup h1 span{color:var(--amber)}
#setup .lead{font-size:32px;color:var(--muted);margin:10px 0 26px}
.modes{display:flex;gap:40px;margin-bottom:26px}
.mode{width:640px;padding:28px 34px;border-radius:28px;background:var(--panel);border:4px solid var(--line);text-align:left}
.mode.sel{border-color:var(--amber);background:#2c3020}
.mode>b{font-size:44px;display:block;margin-bottom:8px}
.mode p b{color:var(--amber)}
.mode p{font-size:26px;color:var(--muted);margin:0;line-height:1.5}
.setrow{display:flex;gap:30px;align-items:center;font-size:32px;margin:10px 0}
.step{display:flex;align-items:center;gap:16px}
.step button{width:72px;height:72px;border-radius:18px;background:var(--panel2);font-size:44px;font-weight:800}
.step span{font-size:52px;font-weight:900;min-width:60px;text-align:center}
.chips{display:flex;gap:14px}
.chip{padding:12px 26px;border-radius:999px;background:var(--panel2);font-size:30px;font-weight:700;border:3px solid transparent}
.chip.sel{border-color:var(--amber);color:var(--amber)}
#teamNames{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:14px 0 24px}
#teamNames input{width:230px;font-size:30px;padding:12px 16px;border-radius:14px;border:4px solid;background:#0f1d2a;color:#fff;font-family:inherit;text-align:center}
#cls{width:220px;font-size:30px;padding:12px;border-radius:14px;border:3px solid var(--line);background:#0f1d2a;color:#fff;text-align:center;font-family:inherit}
.credit{position:absolute;right:40px;bottom:24px;font-size:24px;color:var(--muted)}
/* game */
#map{position:absolute;left:30px;top:10px;width:660px;height:1060px}
#side{position:absolute;left:740px;top:24px;width:1150px;bottom:24px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:16px}
.topbar .title{font-size:40px;font-weight:900;flex:1}
.topbar .title small{font-size:26px;color:var(--muted);font-weight:600;margin-left:10px}
.clock{font-size:38px;font-weight:800;background:var(--panel2);padding:8px 22px;border-radius:16px;font-variant-numeric:tabular-nums}
.clock.over{background:#7a2328;animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.6}}
.turn{border-radius:28px;padding:26px 34px;font-size:46px;font-weight:900;line-height:1.35;border:5px solid;background:var(--panel)}
.turn small{display:block;font-size:30px;font-weight:600;color:var(--muted);margin-top:6px}
.teams{display:grid;gap:14px}
.team{display:flex;align-items:center;gap:18px;padding:14px 24px;border-radius:20px;background:var(--panel);border:4px solid transparent;font-size:36px;font-weight:800}
.team.cur{border-color:var(--amber);box-shadow:0 0 0 4px #f2b54433}
.team .dot{width:44px;height:44px;border-radius:12px;flex:none}
.team .nm{flex:1}
.team .cnt{font-size:28px;color:var(--muted);font-weight:700}
.team .sc{font-size:46px;min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.coopbar{background:var(--panel);border-radius:24px;padding:22px 30px;font-size:34px;font-weight:800}
.coopbar .bar{height:44px;border-radius:22px;background:#0d1822;overflow:hidden;margin-top:14px}
.coopbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#f2b544,#ffd77a);transition:width .5s}
.legend{display:flex;gap:16px;font-size:26px;color:var(--muted);flex-wrap:wrap}
.legend span{background:var(--panel);padding:8px 18px;border-radius:999px}
.tools{margin-top:auto;display:flex;gap:14px;flex-wrap:wrap}
/* map svg */
.site{cursor:pointer}
.site .ring{transition:stroke-width .2s}
.site.pulse .ring{animation:pulse 1.4s infinite}
@keyframes pulse{50%{stroke-width:14}}
.site text{pointer-events:none}
/* modal */
#modal{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.card{width:1500px;max-height:1020px;background:var(--panel);border:4px solid var(--line);border-radius:36px;padding:40px 56px;box-shadow:0 30px 80px #000a;overflow:auto}
.card .head{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.card .ico{font-size:84px;line-height:1}
.card .head b{font-size:54px;display:block}
.card .tag{display:inline-block;font-size:26px;padding:6px 18px;border-radius:999px;background:var(--panel2);margin-right:10px;font-weight:700}
.card .q{font-size:52px;font-weight:800;line-height:1.4;margin:16px 0 26px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{min-height:120px;border-radius:24px;background:var(--panel2);border:5px solid var(--line);font-size:40px;font-weight:700;padding:16px 26px;text-align:left;display:flex;align-items:center;gap:18px;line-height:1.3}
.opt .k{flex:none;width:62px;height:62px;border-radius:16px;background:#0d1822;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--amber)}
.opt.ok{border-color:var(--green);background:#1d4430}
.opt.bad{border-color:var(--red);background:#4a2126}
.opt.dim{opacity:.45}
.opts.ox .opt{justify-content:center;font-size:60px;min-height:170px}
.fb{margin-top:24px;padding:22px 28px;border-radius:22px;font-size:36px;line-height:1.5;display:none}
.fb.ok{display:block;background:#173a29;border:3px solid var(--green)}
.fb.bad{display:block;background:#3d1f22;border:3px solid var(--red)}
.fb .info{display:block;font-size:30px;color:#cfe0ec;margin-top:10px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:20px}
.big{font-size:64px;font-weight:900;text-align:center;margin:10px 0}
.teambtns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px}
.teambtns button{min-height:96px;padding:12px 32px;border-radius:22px;font-size:38px;font-weight:900;color:#fff}
/* toast */
#toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,300px);background:#000d;padding:20px 40px;border-radius:20px;font-size:36px;font-weight:800;transition:transform .3s;z-index:40;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
/* result */
#result{display:flex;flex-direction:column;align-items:center;padding:30px 60px}
#result h1{font-size:72px;margin:0}
.podium{display:flex;align-items:flex-end;gap:30px;margin:10px 0}
.pod{width:280px;border-radius:26px 26px 0 0;text-align:center;padding:14px;font-size:36px;font-weight:900;color:#fff}
.pod .medal{font-size:64px}
.pod .s{font-size:56px}
.rlist{font-size:34px;width:1100px}
.rlist div{display:flex;justify-content:space-between;padding:8px 26px;border-radius:16px;background:var(--panel);margin:8px 0;font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:1760px;margin-top:16px}
.sumgrid>div{background:var(--panel);border-radius:16px;padding:10px 14px;font-size:24px;border-left:12px solid #555;display:flex;align-items:center;gap:12px;text-align:left}
.sumgrid b{display:block;font-size:27px}
.sumgrid .ic{font-size:44px}
#side .sumgrid{grid-template-columns:1fr 1fr;width:auto}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:30}
.onl{font-size:26px}
#lobby{display:flex;flex-direction:column;align-items:center;padding:40px 80px}
#lobby h1{font-size:64px;margin:0 0 10px}
.lobrow{display:flex;gap:60px;align-items:center;margin:20px 0}
.roomcode{font-size:200px;font-weight:900;letter-spacing:.12em;color:var(--amber);line-height:1}
.qrbox{background:#fff;border-radius:28px;padding:18px;text-align:center;color:#0e1a26;font-size:26px;font-weight:800}
.qrbox img{width:300px;height:300px;display:block}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:1400px}
.jt{display:flex;align-items:center;gap:16px;font-size:36px;font-weight:900;padding:18px 26px;border-radius:22px;background:var(--panel);border:4px solid var(--line)}
.jt.on{border-color:var(--green)}
.jt .dot{width:40px;height:40px;border-radius:12px}
.jt .st{margin-left:auto;font-size:28px;color:var(--muted)}
.jt.on .st{color:var(--green)}
.achips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.achips span{padding:10px 22px;border-radius:999px;font-size:28px;font-weight:800;background:var(--panel2);border:3px solid transparent}
.achips span.y{border-color:var(--green)}
.cdown{font-size:64px;font-weight:900;color:var(--amber);font-variant-numeric:tabular-nums}
.rtab{width:100%;border-collapse:collapse;font-size:32px;margin-top:16px}
.rtab td{padding:10px 16px;border-bottom:2px solid var(--line)}
#netbar{position:absolute;left:0;right:0;bottom:0;background:#7a2328;color:#fff;font-size:30px;font-weight:800;padding:14px 30px;display:flex;align-items:center;gap:20px;z-index:25}
#netbar[hidden]{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
  <canvas id="confetti" width="1920" height="1080"></canvas>
  <div id="netbar" hidden>⚠️ 平板連線不穩定，可能是學校網路的問題。<button class="btn small amber" id="netTouch">👆 先改成上台觸控</button><button class="btn small ghost" id="netHide">先不要</button></div>
</div>
<script>
/* ================== 資料 ================== */
const COLORS=['#e5484d','#3e8ef7','#30a46c','#f08c00','#8e4ec6','#e93d82'];
const EMO=['🟥','🟦','🟩','🟧','🟪','🩷'];
const CAT={traffic:'🚗 交通建設',heavy:'🏭 重工業',energy:'⚡ 能源'};
const OX=['⭕ 對','❌ 錯'];
const SITES=[
 {id:'hwy',name:'中山高速公路',icon:'🛣️',cat:'traffic',p:[300,470],
  info:'北起基隆、南到高雄，是臺灣第一條高速公路，民國67年全線通車，南北往來快很多。',
  qs:[{q:'中山高速公路北起哪裡、南到哪裡？',o:['基隆 → 高雄','臺北 → 臺中','宜蘭 → 花蓮','桃園 → 臺南'],a:0},
      {q:'中山高速公路是臺灣第一條高速公路。',o:OX,a:0},
      {q:'中山高速公路通車後，西部發生什麼改變？',o:['南北往來時間大幅縮短','東部不用再走山路','漁獲量增加一倍','從此不需要鐵路'],a:0}],
  ch:{q:'中山高速公路在哪一年全線通車？',o:['民國67年（1978年）','民國50年（1961年）','民國80年（1991年）','民國57年（1968年）'],a:0}},
 {id:'north',name:'北迴鐵路',icon:'🚞',cat:'traffic',p:[592,410],anchor:[121.70,24.30],
  info:'連接宜蘭蘇澳和花蓮，沿線多山、隧道很多，讓東部和北部往來更方便。',
  qs:[{q:'北迴鐵路連接哪兩個地方？',o:['蘇澳和花蓮','臺北和基隆','高雄和屏東','臺中和彰化'],a:0},
      {q:'北迴鐵路讓東部和北部之間的交通更方便。',o:OX,a:0},
      {q:'政府興建北迴鐵路，最主要是為了什麼？',o:['改善東部對外交通','把石油運到高雄','讓飛機降落','發展漁港'],a:0}],
  ch:{q:'北迴鐵路完成後，還要再蓋哪一段，臺灣鐵路才能繞全島一圈？',o:['南迴鐵路','縱貫線','平溪線','阿里山鐵路'],a:0}},
 {id:'elec',name:'鐵路電氣化',icon:'🚆',cat:'traffic',p:[96,560],anchor:[120.45,23.60],
  info:'西部縱貫線的火車改用電力行駛，速度更快、載運量更大，也比較少黑煙。',
  qs:[{q:'「鐵路電氣化」是讓火車改用什麼當動力？',o:['電力','燒煤的蒸汽','風力','人力'],a:0},
      {q:'鐵路電氣化主要在哪一條鐵路進行？',o:['西部縱貫線','阿里山森林鐵路','北迴鐵路','南迴鐵路'],a:0},
      {q:'鐵路電氣化以後，火車速度更快、能載的人和貨更多。',o:OX,a:0}],
  ch:{q:'電氣化火車和蒸汽火車比起來，哪一項「不是」它的好處？',o:['需要燒大量的煤','速度比較快','比較少黑煙','載運量比較大'],a:0}},
 {id:'tcport',name:'臺中港',icon:'⚓',cat:'traffic',p:[110,330],anchor:[120.52,24.27],
  info:'位在中部西海岸，分擔基隆港和高雄港的貨運，也帶動中部發展。',
  qs:[{q:'臺中港位在臺灣的哪裡？',o:['中部西海岸','東部海岸','北部海岸','恆春半島'],a:0},
      {q:'為什麼要興建臺中港？',o:['分擔基隆港和高雄港的運輸','蓋海水浴場','舉辦捕魚比賽','方便蓋機場'],a:0},
      {q:'臺中港是十大建設之一。',o:OX,a:0}],
  ch:{q:'十大建設裡有兩個港口，是哪兩個？',o:['臺中港、蘇澳港','基隆港、高雄港','安平港、花蓮港','臺中港、高雄港'],a:0}},
 {id:'suao',name:'蘇澳港',icon:'🚢',cat:'traffic',p:[604,250],anchor:[121.86,24.60],
  info:'位在宜蘭縣東北部海岸，輔助基隆港，分擔北部的貨運。',
  qs:[{q:'蘇澳港位在哪一個縣？',o:['宜蘭縣','屏東縣','臺南市','新竹縣'],a:0},
      {q:'蘇澳港主要的功能是什麼？',o:['輔助基隆港，分擔北部貨運','發射火箭','煉製石油','種植稻米'],a:0},
      {q:'蘇澳港位在臺灣的西海岸。',o:OX,a:1}],
  ch:{q:'蘇澳港旁邊接著哪一項十大建設，讓北部和東部交通連起來？',o:['北迴鐵路','中山高速公路','臺中港','中正國際機場'],a:0}},
 {id:'air',name:'中正國際機場',icon:'✈️',cat:'traffic',p:[318,104],anchor:[121.23,25.08],
  info:'位在桃園，民國68年啟用，取代不夠用的松山機場，現在叫「桃園國際機場」。',
  qs:[{q:'十大建設的「中正國際機場」，現在叫什麼名字？',o:['桃園國際機場','松山機場','高雄國際機場','清泉崗機場'],a:0},
      {q:'為什麼要蓋新的國際機場？',o:['原本的松山機場不夠用','臺灣以前沒有機場','為了生產飛機','為了運送稻米'],a:0},
      {q:'中正國際機場位在桃園。',o:OX,a:0}],
  ch:{q:'中正國際機場在哪一年啟用？',o:['民國68年（1979年）','民國38年（1949年）','民國90年（2001年）','民國55年（1966年）'],a:0}},
 {id:'steel',name:'中國鋼鐵公司',icon:'🔩',cat:'heavy',p:[100,885],anchor:[120.35,22.56],
  info:'設在高雄的大型鋼鐵廠，生產造船、建築、機械需要的鋼鐵。',
  qs:[{q:'中國鋼鐵公司（中鋼）設在哪個城市？',o:['高雄','花蓮','新竹','基隆'],a:0},
      {q:'為什麼要發展鋼鐵業？',o:['提供造船、建築、機械需要的鋼鐵','生產衣服','種植茶葉','發展觀光'],a:0},
      {q:'鋼鐵業屬於「重工業」。',o:OX,a:0}],
  ch:{q:'十大建設中，哪三項屬於重工業？',o:['鋼鐵、造船、石油化學','高速公路、鐵路、機場','港口、核電、鐵路','鋼鐵、機場、港口'],a:0}},
 {id:'ship',name:'中國造船公司',icon:'⛴️',cat:'heavy',p:[100,720],anchor:[120.30,22.62],
  info:'設在高雄，可以建造大型船隻，帶動航運和貿易。',
  qs:[{q:'中國造船公司設在哪裡？',o:['高雄','臺中','宜蘭','臺東'],a:0},
      {q:'臺灣四面環海，發展造船業有什麼好處？',o:['自己造大船，發展航運和貿易','讓農田變大','減少颱風','生產電腦晶片'],a:0},
      {q:'造船需要大量鋼鐵，所以造船廠和中鋼都設在高雄很方便。',o:OX,a:0}],
  ch:{q:'高雄能成為重工業中心，最重要的條件是什麼？',o:['有大型港口，原料和產品方便進出','位在臺灣最北邊','有很多溫泉','人口最少'],a:0}},
 {id:'petro',name:'石油化學工業',icon:'🛢️',cat:'heavy',p:[300,950],anchor:[120.40,22.52],
  info:'在高雄發展，把石油做成塑膠、人造纖維等原料，提供給民生工業使用。',
  qs:[{q:'石油化學工業可以生產什麼？',o:['塑膠、人造纖維的原料','稻米','茶葉','木材'],a:0},
      {q:'石化工業的產品，主要提供給哪些工業使用？',o:['紡織、塑膠等民生工業','只給軍隊','漁業捕魚','觀光業'],a:0},
      {q:'石油化學工業屬於重工業。',o:OX,a:0}],
  ch:{q:'民國62年發生「石油危機」，造成什麼影響？',o:['油價大漲，世界經濟變差','臺灣挖到大油田','石油變得很便宜','汽車全部停產'],a:0}},
 {id:'nuke',name:'核能發電廠',icon:'⚛️',cat:'energy',p:[566,66],anchor:[121.56,25.29],
  info:'核一廠位在新北市石門，提供工業發展需要的大量電力。',

let AC=null;
function tone(seq){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);t+=d*.8;});}catch(e){}}
const sOk=()=>tone([[523,.15],[659,.15],[784,.3]]),sBad=()=>tone([[220,.25,'sawtooth'],[165,.35,'sawtooth']]),sWin=()=>tone([[523,.15],[659,.15],[784,.15],[1046,.5]]);
function confetti(){const c=$('#confetti'),x=c.getContext('2d');const ps=Array.from({length:160},()=>({x:Math.random()*1920,y:-20-Math.random()*400,v:4+Math.random()*6,r:Math.random()*6,c:COLORS[Math.random()*6|0],w:10+Math.random()*12}));let n=0;
  (function f(){x.clearRect(0,0,1920,1080);ps.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x+Math.sin(p.r)*20,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-4,p.w,8);x.restore();});if(++n<200)requestAnimationFrame(f);else x.clearRect(0,0,1920,1080);})();}

function mapSVG(interactive){

  let h=`<svg id="mapsvg" viewBox="0 0 660 1060" width="660" height="1060">
    <defs><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".45"/></filter></defs>

    <polygon points="${pts(COAST)}" fill="#3f6b4a" stroke="#9ec7a6" stroke-width="4"/>
    <polygon points="${pts([[121.0,24.6],[121.3,24.3],[121.2,23.6],[120.95,23.0],[120.8,22.6],[120.75,23.4],[120.85,24.1]])}" fill="#4f7d55" opacity=".7"/>
    ${line('hwy',HWY,12)}${line('elec',RAIL.map(p=>[p[0]-0.05,p[1]]),8,'16 6')}${line('north',NRAIL,9,'16 6')}
    ${CITY.map(([n,lo,la])=>{const [x,y]=P(lo,la);return `<circle cx="${x}" cy="${y}" r="6" fill="#fff"/><text x="${x+(lo>121.4?-12:12)}" y="${y+8}" font-size="24" fill="#e8f3ea" font-weight="700" text-anchor="${lo>121.4?'end':'start'}">${n}</text>`;}).join('')}`;
  SITES.forEach(s=>{
    const st=S.sites[s.id],c=own(s.id),[x,y]=s.p;
    if(s.anchor){const [ax,ay]=P(...s.anchor);h+=`<line x1="${x}" y1="${y}" x2="${ax}" y2="${ay}" stroke="#ffffffaa" stroke-width="3" stroke-dasharray="6 6"/><circle cx="${ax}" cy="${ay}" r="8" fill="${c||'#fff'}" stroke="#000" stroke-width="2"/>`;}
    const half=S.mode==='coop'&&st.prog===1;

      <circle class="ring" cx="${x}" cy="${y}" r="50" fill="${c||(half?'#6b5a2a':'#1c2f40')}" stroke="${can?'#ffe08a':(c?'#fff':'#9fb3c4')}" stroke-width="${can?7:4}"/>
      ${half?`<circle cx="${x}" cy="${y}" r="50" fill="none" stroke="#f2b544" stroke-width="8" stroke-dasharray="157 400" transform="rotate(-90 ${x} ${y})"/>`:''}
      <text x="${x}" y="${y+17}" font-size="50" text-anchor="middle">${s.icon}</text>
      <rect x="${x-78}" y="${y+56}" width="156" height="38" rx="12" fill="#000b"/>
      <text x="${x}" y="${y+83}" font-size="23" fill="#fff" font-weight="800" text-anchor="middle">${s.name.replace('公司','')}</text>
      ${c&&S.mode==='team'?`<text x="${x+40}" y="${y-30}" font-size="34">🚩</text>`:''}${half?`<text x="${x+40}" y="${y-30}" font-size="34">🚧</text>`:''}${c&&S.mode==='coop'?`<text x="${x+40}" y="${y-30}" font-size="34">✅</text>`:''}
    </g>`;

}

function tick(){const c=$('#clock');if(!c||!S)return;const s=Math.floor((Date.now()-S.start)/1000);
  if(S.limit){const left=S.limit*60-s;c.textContent=(left>=0?'⏳ ':'⏰ +')+mmss(Math.abs(left));c.classList.toggle('over',left<0);
    if(left===0)toast('⏰ 時間到！這題結束後可以按「結束看結果」');}
  else c.textContent='⏱ '+mmss(s);}

function pickSite(id){
  const s=SITES.find(x=>x.id===id),st=S.sites[id];
  if(S.phase==='build'&&built(id)){toast('這項建設已經完工了，選別的吧！');return;}
  if(S.phase==='steal'){
    if(!built(id))return;
    if(st.owner===S.turn){toast('這是你們自己的建設，選別組的！');return;}
    (isPad()?askPad:ask)(s,s.ch,'steal');return;
  }
  (isPad()?askPad:ask)(s,s.qs[st.qi%s.qs.length],'build');
}
function ask(s,q,kind){
  const T=S.teams[S.turn],ox=q.o===OX;
  const order=ox?[0,1]:shuffle([0,1,2,3]);
  const st=S.sites[s.id];
  const stageTag=kind==='steal'?`<span class="tag" style="background:#7a2328">⚔️ 搶建設挑戰題｜目前屬於 ${S.teams[st.owner].name}</span>`
    :S.mode==='coop'?`<span class="tag">${st.prog===0?'🚧 第 1 題：動工':'🏁 第 2 題：完工'}</span>`:'';
  modal(`<div class="head"><div class="ico">${s.icon}</div><div><b>${s.name}</b><span class="tag">${CAT[s.cat]}</span>${stageTag}<span class="tag" style="background:${T.color}">${T.name} 作答</span></div></div>
    <div class="q">${q.q}</div>
    <div class="opts ${ox?'ox':''}">${order.map((oi,k)=>`<button class="opt" data-o="${oi}">${ox?'':`<span class="k">${'ABCD'[k]}</span>`}<span>${q.o[oi]}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <div class="actions"><button class="btn ghost small" id="cancel">✖ 點錯了，換一個建設</button><span></span></div>`);
  $('#cancel').onclick=closeModal;
  let done=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const ok=+b.dataset.o===q.a;
    document.querySelectorAll('.opt').forEach(x=>{const o=+x.dataset.o;if(o===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');else x.classList.add('dim');});
    snap();
    T.tries++;S.tries++;
    let head;
    if(ok){T.right++;S.right++;}
    if(kind==='build'){
      st.qi++;
      if(ok){
        if(S.mode==='coop'){st.prog++;head=st.prog>=2?`🎉 答對了！「${s.name}」完工！`:`👍 答對了！「${s.name}」動工了，再答對一題就完工！`;}
        else{st.prog=1;st.owner=S.turn;T.score+=100;head=`🎉 答對了！${T.name} 蓋好「${s.name}」，+100 分！`;}
      }else head=`😅 可惜答錯了！這項建設還沒蓋好，${S.mode==='coop'?'換下一組來挑戰':'其他組還有機會'}。`;
    }else{
      if(ok){const old=S.teams[st.owner];old.score-=100;T.score+=100;head=`⚔️ 挑戰成功！「${s.name}」從 ${old.name} 搶過來了！`;st.owner=S.turn;}
      else head=`🛡️ 挑戰失敗！「${s.name}」還是屬於 ${S.teams[st.owner].name}。`;
    }
    logQ({kind:kind==='steal'?'搶建設':'建設',site:s.name,q:q.q,correct:q.o[q.a],n:1,ok:ok?1:0,fast:ok?T.name:'',detail:T.name+(ok?'✓':'✗')});
    ok?(built(s.id)?sWin():sOk()):sBad();
    if(ok&&built(s.id))confetti();
    const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');
    fb.innerHTML=`${head}<span class="info">📘 ${s.name}：${s.info}</span>`;
    const a=$('.actions');a.innerHTML=`<span></span><button class="btn amber" id="nextBtn">下一組 ➜</button>`;
    $('#nextBtn').onclick=()=>{closeModal();nextTurn(true);};
    save();
  });
}
function nextTurn(counted){
  if(S.phase==='steal'&&counted){S.stealLeft--;}
  S.turn=(S.turn+1)%S.teams.length;
  if(counted)S.turns++;
  save();
  if(S.phase==='steal'){
    // 跳過沒有別組建設可搶的組
    let guard=0;while(S.stealLeft>0&&!SITES.some(s=>S.sites[s.id].owner!==S.turn)&&guard++<10){S.turn=(S.turn+1)%S.teams.length;S.stealLeft--;}
    if(S.stealLeft<=0){finish();return;}
    renderGame();return;
  }
  if(allBuilt()){
    renderGame();
    if(isPad())padState({phase:'wait',seq:++S.padSeq,msg:'十大建設全部完工！看大螢幕，等老師決定要不要進入「搶建設」回合。'},true);
    if(S.mode==='coop'){setTimeout(finish,600);return;}
    modal(`<div class="big">🎉 十大建設全部完工！</div><div style="font-size:38px;text-align:center;color:var(--muted)">還有時間的話，可以進入「搶建設」回合：<br>每組輪流 1 次，答對挑戰題就能搶走別組的建設！</div>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="toRes">直接看結果 🏆</button><button class="btn amber" id="toSteal">進入搶建設回合 ⚔️</button></div>`);
    $('#toRes').onclick=()=>{closeModal();finish();};
    $('#toSteal').onclick=()=>{snap();S.phase='steal';S.stealLeft=S.teams.length;
      const lowest=S.teams.map((t,i)=>[t.score,i]).sort((a,b)=>a[0]-b[0])[0][1];S.turn=lowest;
      closeModal();save();renderGame();toast(`分數最低的 ${S.teams[S.turn].name} 先挑戰！`);};
    return;
  }
  renderGame();
  if(counted&&S.turns%4===0&&S.eventIdx<EVENTS.length)setTimeout(eventCard,350);
}
function eventCard(){
  const e=EVENTS[S.eventIdx];S.eventIdx++;save();
  if(isPad()){askPad(null,e,'event');return;}
  modal(`<div class="head"><div class="ico">📰</div><div><b>時事快報：全班搶答！</b><span class="tag">${S.mode==='coop'?'全班一起想':'第一個舉手答對的組 +50 分'}</span></div></div>
    <div class="q">${e.q}</div>
    <div class="opts">${e.o.map((o,k)=>`<div class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></div>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <div class="actions" id="evAct" style="justify-content:center"><button class="btn amber" id="reveal">揭曉答案 👀</button></div>`);
  // 打亂顯示：簡單地把正確答案換到隨機位置
  const opts=[...document.querySelectorAll('.opt')];const pos=Math.random()*4|0;
  if(pos!==e.a){const a=opts[e.a].innerHTML,b=opts[pos].innerHTML;opts[e.a].innerHTML=b;opts[pos].innerHTML=a;
    opts[e.a].querySelector('.k').textContent='ABCD'[e.a];opts[pos].querySelector('.k').textContent='ABCD'[pos];}
  $('#reveal').onclick=()=>{
    opts.forEach((o,k)=>o.classList.add(k===pos?'ok':'dim'));
    $('#fb').className='fb ok';$('#fb').innerHTML=`✅ 答案是「${e.o[e.a]}」<span class="info">📘 ${e.ex}</span>`;sOk();
    if(S.mode==='coop'){$('#evAct').innerHTML=`<button class="btn amber" id="evOk">繼續建設 ➜</button>`;$('#evOk').onclick=closeModal;return;}
    $('#evAct').outerHTML=`<div style="text-align:center;font-size:34px;margin-top:20px;font-weight:800">哪一組最先答對？</div>
      <div class="teambtns">${S.teams.map((t,i)=>`<button data-t="${i}" style="background:${t.color}">${t.name} +50</button>`).join('')}<button data-t="-1" style="background:#455a6b">沒有組答對</button></div>`;
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=+b.dataset.t;if(i>=0){snap();S.teams[i].score+=50;save();toast(`${S.teams[i].name} +50 分！`);}closeModal();renderGame();});
  };
}

/* ================== 結果 ================== */
function finish(){S.stage='result';S.end=S.end||Date.now();save();clearInterval(clockT);
  const rank=S.teams.map((t,i)=>({i,name:t.name,color:t.color,score:t.score,n:SITES.filter(s=>built(s.id)&&S.sites[s.id].owner===i).length})).sort((a,b)=>b.score-a.score||b.n-a.n);
  if(isPad()){padState({phase:'end',seq:++S.padSeq,rank});padLoop(false);}
  if(GAS_URL&&!S.logged){S.logged=true;save();
    logGAS('game',{cls:S.cls,mode:S.mode==='coop'?'全班合作':'分組對抗',link:S.link==='pad'?'平板連線':'上台觸控',
      teams:rank.map(t=>({name:t.name,score:t.score,sites:S.mode==='coop'?'-':t.n})),used:Math.floor((S.end-S.start)/1000),right:S.right,tries:S.tries});}
  renderResult();sWin();confetti();}
function renderResult(){
  const used=Math.floor(((S.end||Date.now())-S.start)/1000),coop=S.mode==='coop';
  const sum=`<div class="sumgrid">${SITES.map(s=>{const st=S.sites[s.id],b=built(s.id);const col=b?(coop?'#f2b544':S.teams[st.owner].color):'#555';
    return `<div style="border-left-color:${col}"><div class="ic">${s.icon}</div><div><b>${s.name}</b>${b?(coop?'✅ 完工':`🚩 ${S.teams[st.owner].name}`):'🚧 未完工'}</div></div>`;}).join('')}</div>`;
  let body;
  if(coop){
    const n=builtCount();
    body=`<h1>${n===10?'🎉 全班完成十大建設！':`🏗️ 全班完成 ${n} / 10 項建設`}</h1>
      <div style="font-size:44px;font-weight:800;margin:10px 0">⏱ 用時 ${mmss(used)}　✅ 答對 ${S.right} / ${S.tries} 題　🎯 答對率 ${S.tries?Math.round(S.right/S.tries*100):0}%</div>
      <div class="rlist">${S.teams.map(t=>`<div><span style="color:${t.color}">● ${t.name}</span><span>答對 ${t.right} / ${t.tries} 題</span></div>`).join('')}</div>`;
  }else{
    const rank=S.teams.map((t,i)=>({...t,i,n:SITES.filter(s=>built(s.id)&&S.sites[s.id].owner===i).length})).sort((a,b)=>b.score-a.score||b.n-a.n);
    const pod=[rank[1],rank[0],rank[2]].filter(Boolean);
    const H={0:230,1:170,2:120},M=['🥇','🥈','🥉'];
    body=`<h1>🏆 十大建設 建設王</h1>
      <div class="podium">${pod.map(t=>{const r=rank.indexOf(t);return `<div class="pod" style="background:${t.color};min-height:${H[r]+150}px"><div class="medal">${M[r]}</div>${t.name}<div class="s">${t.score} 分</div><div style="font-size:28px">🚩 ${t.n} 項</div></div>`;}).join('')}</div>
      ${rank.length>3?`<div class="rlist">${rank.slice(3).map((t,k)=>`<div><span style="color:${t.color}">${k+4}. ${t.name}</span><span>${t.score} 分｜🚩 ${t.n} 項</span></div>`).join('')}</div>`:''}
      <div style="font-size:30px;color:var(--muted)">⏱ 遊戲時間 ${mmss(used)}｜全班答對 ${S.right} / ${S.tries} 題</div>`;
  }
  app().innerHTML=`<div class="screen" id="result">${body}${sum}
    <div style="display:flex;gap:30px;margin-top:26px"><button class="btn ghost" id="backMap">🗺️ 回地圖看看</button><button class="btn amber" id="again">再玩一次 🔄</button></div>
    <div class="credit">✨ Zeiyen老師製作</div></div>`;
  $('#again').onclick=()=>{S=null;try{localStorage.removeItem(KEY);}catch(e){}renderSetup();};
  $('#backMap').onclick=()=>{app().innerHTML=`<div class="screen"><div id="map">${mapSVG(false)}</div><div id="side"><div class="turn" style="border-color:var(--amber)">🗺️ 最後的臺灣地圖<small>${coop?'金色是全班完工的建設':'旗子顏色就是蓋好那項建設的組別'}</small></div>
    ${sum}
    <div class="tools"><button class="btn amber" id="backRes">🏆 回到結果</button></div></div></div>`;$('#backRes').onclick=renderResult;};
}

/* ================== 平板連線 ================== */
const GAS_URL='';
let PAD={loop:null,busy:false,joined:{},ans:{},now:0,skew:0,fails:0,cur:null,pickOpen:false,netHidden:false};
const isPad=()=>!!(S&&S.link==='pad');
const online=i=>!!(PAD.joined[i]&&PAD.now-PAD.joined[i]<12000);
function api(params){
  const u=GAS_URL+'?'+new URLSearchParams(Object.assign({},params,{_:Date.now()}));
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
  return fetch(u,{signal:ctl.signal}).then(r=>r.json()).then(j=>{clearTimeout(to);PAD.fails=0;netBar(false);return j;})
    .catch(e=>{clearTimeout(to);PAD.fails++;if(PAD.fails>=4&&isPad())netBar(true);throw e;});
}
function netBar(on){const b=$('#netbar');if(!b)return;if(on&&PAD.netHidden)return;b.hidden=!on;}
function logGAS(kind,d){if(!GAS_URL)return;api({a:'log',r:S.room||'0000',kind,d:JSON.stringify(d)}).catch(()=>{});}
function logQ(d){if(!GAS_URL||!S||!S.cls)return;d.cls=S.cls;logGAS('q',d);}
function padState(st,reset){if(!isPad())return Promise.resolve();return api({a:'state',r:S.room,st:JSON.stringify(st),reset:reset?1:0}).catch(()=>{});}
function padLoop(on){clearInterval(PAD.loop);PAD.loop=null;if(on)PAD.loop=setInterval(hostTick,1200);}
function openRoom(){
  app().innerHTML=`<div class="screen" id="lobby"><h1>連線中…</h1></div>`;
  api({a:'open',r:S.room,cls:S.cls,teams:JSON.stringify(S.teams.map(t=>({name:t.name,color:t.color})))})
    .then(j=>{if(!j.ok)throw 0;renderLobby();padLoop(true);})
    .catch(()=>{modal(`<div class="big">😥 連不上平板伺服器</div><div style="font-size:34px;text-align:center;color:var(--muted)">可能是學校網路擋住了，先改用上台觸控吧！</div>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="retry">再試一次</button><button class="btn amber" id="useTouch">👆 改用上台觸控</button></div>`);
      $('#retry').onclick=()=>{closeModal();openRoom();};
      $('#useTouch').onclick=()=>{closeModal();S.link='touch';S.stage='game';save();renderGame();};});
}
function renderLobby(){
  S.stage='lobby';save();
  app().innerHTML=`<div class="screen" id="lobby">
    <h1>📱 各組拿出平板，加入房間！</h1>
    <div class="lobrow">
      <div class="qrbox"><img src="pad-qr.png" alt="平板加入 QR code"><div>用相機掃描</div></div>
      <div style="text-align:center"><div style="font-size:40px;color:var(--muted);font-weight:800">房間號碼</div><div class="roomcode">${S.room}</div>
        <div style="font-size:30px;color:var(--muted)">或打開 trzeiyen.github.io/ten-projects/pad.html</div></div>
    </div>
    <div class="jgrid">${S.teams.map((t,i)=>`<div class="jt" id="jt${i}"><div class="dot" style="background:${t.color}"></div>${t.name}<span class="st">等待加入…</span></div>`).join('')}</div>
    <div style="display:flex;gap:30px;margin-top:34px">
      <button class="btn ghost" id="lobBack">↩ 回設定</button>
      <button class="btn ghost" id="lobTouch">👆 不用平板，改上台觸控</button>
      <button class="btn amber" id="lobGo">開始建設 ▶</button></div>
    <div class="credit">✨ Zeiyen老師製作</div></div>`;
  lobbyStatus();
  $('#lobBack').onclick=()=>{padLoop(false);S=null;try{localStorage.removeItem(KEY);}catch(e){}renderSetup();};
  $('#lobTouch').onclick=()=>switchLink('touch');
  $('#lobGo').onclick=()=>{
    const n=S.teams.filter((t,i)=>online(i)).length;
    const go=()=>{closeModal();S.start=Date.now();S.stage='game';save();renderGame();toast(`${S.teams[S.turn].name} 先用平板選建設！`);};
    if(n<S.teams.length){modal(`<div class="big">還有 ${S.teams.length-n} 組沒連上</div><div style="font-size:34px;text-align:center;color:var(--muted)">沒連上的組也可以晚點再加入，要先開始嗎？</div>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="no">再等一下</button><button class="btn amber" id="yes">先開始 ▶</button></div>`);
      $('#no').onclick=closeModal;$('#yes').onclick=go;}else go();
  };
}
function lobbyStatus(){S.teams.forEach((t,i)=>{const e=$('#jt'+i);if(!e)return;const on=online(i);e.classList.toggle('on',on);e.querySelector('.st').textContent=on?'✅ 已加入':'等待加入…';});}
function switchLink(to){
  if(to==='touch'){padState({phase:'off',seq:++S.padSeq},true);clearPadQ();S.link='touch';padLoop(false);netBar(false);closeModal();S.stage='game';save();renderGame();toast('已改成上台觸控，平板會顯示「看大螢幕」');}
  else{S.link='pad';padLoop(true);closeModal();save();renderGame();toast('已改回平板連線');}
}
function hostTick(){
  if(!isPad()||PAD.busy)return;PAD.busy=true;
  api({a:'hpoll',r:S.room}).then(j=>{PAD.busy=false;if(!j.ok)return;
    PAD.now=j.now;PAD.skew=j.now-Date.now();PAD.joined=j.join||{};PAD.ans=j.ans||{};
    if(S.stage==='lobby'){lobbyStatus();return;}
    document.querySelectorAll('[data-on]').forEach(e=>e.textContent=online(+e.dataset.on)?' 📶':' ⚪');
    if(PAD.cur&&!PAD.cur.done){padQTick();return;}
    if(j.pick&&j.pick.seq===S.padSeq&&PAD.pickOpen&&$('#modal').hidden&&S.stage==='game'){PAD.pickOpen=false;pickSite(j.pick.site);}
  }).catch(()=>{PAD.busy=false;});
}
function padPick(){
  if(PAD.cur&&!PAD.cur.done)return;
  if(S.phase==='build'&&allBuilt())return;
  const avail=SITES.filter(s=>S.phase==='steal'?(built(s.id)&&S.sites[s.id].owner!==S.turn):!built(s.id))
    .map(s=>({id:s.id,name:s.name,icon:s.icon,owner:S.phase==='steal'?S.sites[s.id].owner:null}));
  S.padSeq++;save();PAD.pickOpen=true;
  padState({phase:'pick',seq:S.padSeq,turn:S.turn,steal:S.phase==='steal',avail},true);
}
function clearPadQ(){if(PAD.cur){PAD.cur.done=true;clearInterval(PAD.cur.cdT);}PAD.cur=null;}
function askPad(s,q,kind){
  clearPadQ();PAD.pickOpen=false;
  const ox=q.o===OX,order=ox?[0,1]:shuffle([0,1,2,3]);
  S.padSeq++;save();
  const seq=S.padSeq,dur=kind==='steal'?30:25,only=kind==='steal'?S.turn:null,T=S.teams[S.turn];
  PAD.cur={seq,s,q,kind,order,dur,only,start:Date.now(),done:false};
  padState({phase:'q',seq,kind,site:s?{name:s.name,icon:s.icon}:null,q:q.q,opts:order.map(i=>q.o[i]),ox,dur,only,turn:S.turn},true)
    .then(()=>{if(PAD.cur&&PAD.cur.seq===seq)PAD.cur.start=Date.now();});
  const st=s?S.sites[s.id]:null;
  const tag=kind==='event'?`<span class="tag">全部組用平板搶答｜最快答對 +50、其他答對 +20</span>`
    :kind==='steal'?`<span class="tag" style="background:#7a2328">⚔️ 挑戰題｜只有 ${T.name} 作答｜目前屬於 ${S.teams[st.owner].name}</span>`
    :`<span class="tag">${CAT[s.cat]}</span><span class="tag" style="background:${T.color}">${T.name} 選的</span><span class="tag">全部組搶答｜最快答對 +100、其他答對 +30</span>`;
  modal(`<div class="head"><div class="ico">${s?s.icon:'📰'}</div><div style="flex:1"><b>${s?s.name:'時事快報：全班搶答！'}</b>${tag}</div><div class="cdown" id="cdn">${dur}</div></div>
    <div class="q">${q.q}</div>
    <div class="opts ${ox?'ox':''}">${order.map((oi,k)=>`<div class="opt" data-d="${k}">${ox?'':`<span class="k">${'ABCD'[k]}</span>`}<span>${q.o[oi]}</span></div>`).join('')}</div>
    <div class="achips" id="achips"></div>
    <div class="fb" id="fb"></div>
    <div class="actions" id="pact"><button class="btn ghost small" id="pcancel">✖ 取消這題</button><button class="btn amber" id="preveal">揭曉答案 👀</button></div>`);
  $('#pcancel').onclick=()=>{clearPadQ();closeModal();if(kind==='event')padPick();else padPick();};
  $('#preveal').onclick=()=>revealPad();
  padQTick();PAD.cur.cdT=setInterval(()=>{const c=PAD.cur;if(!c||c.done)return;const e=$('#cdn');if(e)e.textContent=Math.max(0,Math.ceil(c.dur-(Date.now()-c.start)/1000));},250);
}
function padAnswers(){const c=PAD.cur,a=PAD.ans;if(!c||!a||a.seq!==c.seq)return {};return a.by||{};}
function padQTick(){
  const c=PAD.cur;if(!c||c.done)return;
  const by=padAnswers(),expect=c.only!=null?[c.only]:S.teams.map((t,i)=>i).filter(i=>online(i)||by[i]);
  const box=$('#achips');
  if(box)box.innerHTML=(c.only!=null?[c.only]:S.teams.map((t,i)=>i)).map(i=>{const t=S.teams[i];return `<span class="${by[i]?'y':''}" style="color:${t.color}">${t.name} ${by[i]?'✅ 已作答':online(i)?'🤔 思考中':'⚪ 未連線'}</span>`;}).join('');
  const left=c.dur-(Date.now()-c.start)/1000;
  if(left<=0||(expect.length&&expect.every(i=>by[i])))revealPad();
}
function revealPad(){
  const c=PAD.cur;if(!c||c.done)return;c.done=true;clearInterval(c.cdT);
  const btn=$('#preveal');if(btn){btn.disabled=true;btn.textContent='統計中…';}
  // 先把題目關起來，再拿最後一次的作答
  padState({phase:'closing',seq:c.seq,kind:c.kind,q:c.q.q,opts:c.order.map(i=>c.q.o[i]),ox:c.q.o===OX,only:c.only,turn:S.turn,site:c.s?{name:c.s.name,icon:c.s.icon}:null})
  .then(()=>api({a:'hpoll',r:S.room}).then(j=>{if(j.ok)PAD.ans=j.ans||{};}).catch(()=>{}))
  .then(()=>finishPadQ(c));
}
function finishPadQ(c){
  if(PAD.cur!==c)return;
  const by=(PAD.ans&&PAD.ans.seq===c.seq&&PAD.ans.by)||{},t0=PAD.ans.t0||0;
  const res={};let win=null;
  Object.keys(by).forEach(k=>{const i=+k,a=by[k];if(c.only!=null&&i!==c.only)return;
    const ok=c.order[a.c]===c.q.a,sec=t0?Math.max(0,(a.t-t0)/1000):null;res[i]={c:a.c,ok,sec:sec==null?null:Math.round(sec*10)/10,t:a.t,pts:0};
    if(ok&&(win===null||a.t<res[win].t))win=i;});
  snap();
  const s=c.s,st=s?S.sites[s.id]:null;let head;
  Object.keys(res).forEach(k=>{S.tries++;S.teams[k].tries++;if(res[k].ok){S.right++;S.teams[k].right++;}});
  if(c.kind==='build'){
    st.qi++;
    if(win!==null){st.prog=1;st.owner=win;res[win].pts=100;S.teams[win].score+=100;
      Object.keys(res).forEach(k=>{if(+k!==win&&res[k].ok){res[k].pts=30;S.teams[k].score+=30;}});
      head=`🎉 ${S.teams[win].name} 最快答對，蓋好「${s.name}」！`;}
    else head=`😅 沒有組答對，「${s.name}」還沒蓋好，下次再來！`;
  }else if(c.kind==='steal'){
    const me=c.only,r=res[me];
    if(r&&r.ok){const old=S.teams[st.owner];old.score-=100;S.teams[me].score+=100;r.pts=100;head=`⚔️ 挑戰成功！${S.teams[me].name} 把「${s.name}」從 ${old.name} 搶過來了！`;st.owner=me;}
    else head=`🛡️ 挑戰失敗！「${s.name}」還是屬於 ${S.teams[st.owner].name}。`;
  }else{
    if(win!==null){res[win].pts=50;S.teams[win].score+=50;}
    Object.keys(res).forEach(k=>{if(+k!==win&&res[k].ok){res[k].pts=20;S.teams[k].score+=20;}});
    head=win!==null?`📰 ${S.teams[win].name} 最快答對 +50！`:'📰 這題沒有組答對！';
  }
  save();
  const cdn=$('#cdn');if(cdn)cdn.style.visibility='hidden';
  const correctD=c.order.indexOf(c.q.a);
  document.querySelectorAll('[data-d]').forEach(e=>e.classList.add(+e.dataset.d===correctD?'ok':'dim'));
  const okN=Object.values(res).filter(r=>r.ok).length;
  (win!==null||(c.kind==='steal'&&res[c.only]&&res[c.only].ok))?((s&&built(s.id))?(sWin(),confetti()):sOk()):sBad();
  const ex=s?s.info:c.q.ex;
  const fb=$('#fb');if(fb){fb.className='fb '+(okN?'ok':'bad');fb.innerHTML=`${head}<span class="info">📘 ${s?s.name+'：':''}${ex}</span>`;}
  const rows=(c.only!=null?[c.only]:S.teams.map((t,i)=>i)).map(i=>{const t=S.teams[i],r=res[i];
    return `<tr><td style="color:${t.color};font-weight:900">${i===win?'🏆 ':''}${t.name}</td><td>${r?(c.q.o===OX?'':'ABCD'[r.c]+'. ')+(c.q.o[c.order[r.c]]):'— 沒作答'}</td><td>${r?(r.ok?'✅':'❌'):''}</td><td>${r&&r.sec!=null?r.sec+' 秒':''}</td><td style="color:var(--amber);font-weight:900">${r&&r.pts?'+'+r.pts:''}</td></tr>`;}).join('');
  const box=$('#achips');if(box)box.outerHTML=`<table class="rtab">${rows}</table>`;
  const act=$('#pact');if(act){act.innerHTML=`<span></span><button class="btn amber" id="pnext">${c.kind==='event'?'繼續建設 ➜':'下一組 ➜'}</button>`;
    $('#pnext').onclick=()=>{clearPadQ();closeModal();if(c.kind==='event')renderGame();else nextTurn(true);};}
  const resOut={};Object.keys(res).forEach(k=>resOut[k]={c:res[k].c,ok:res[k].ok,sec:res[k].sec,pts:res[k].pts});
  padState({phase:'reveal',seq:c.seq,kind:c.kind,q:c.q.q,opts:c.order.map(i=>c.q.o[i]),ox:c.q.o===OX,correct:correctD,res:resOut,winner:win,only:c.only,turn:S.turn,msg:head.replace(/^\S+ /,''),ex});
  const fast=win!==null?S.teams[win].name:'';
  logQ({kind:{build:'建設',steal:'搶建設',event:'時事快報'}[c.kind],site:s?s.name:'時事快報',q:c.q.q,correct:c.q.o[c.q.a],n:Object.keys(res).length,ok:okN,fast,sec:win!==null?res[win].sec:'',
    detail:Object.keys(res).map(k=>`${S.teams[k].name}:${res[k].ok?'✓':'✗'}${res[k].sec!=null?res[k].sec+'s':''}`).join(' ')});
}
$('#netTouch').onclick=()=>switchLink('touch');
$('#netHide').onclick=()=>{PAD.netHidden=true;netBar(false);};

fit();renderSetup();
</script>
</body>
