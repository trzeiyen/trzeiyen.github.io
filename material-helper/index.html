<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動教材設計幫手</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e5e1d8;
  --accent:#2f6f5e;--accent-soft:#e3f0eb;--warn:#b45309;--warn-soft:#fef3c7;--radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 16px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{font-size:28px}
h1{font-size:20px;margin:0}
.brand p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.timer.over{background:var(--warn-soft);color:var(--warn)}
.progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
#bar{height:100%;background:var(--accent);width:0;transition:width .3s}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:20px;max-width:1400px;margin:0 auto;padding:20px}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px;align-self:start}
.railbtn{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;white-space:nowrap}
.railbtn .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px;font-weight:700;flex:none}
.railbtn.done .num{background:var(--accent);color:#fff}
.railbtn.cur{background:var(--card);border-color:var(--accent)}
.railbtn.cur .num{background:var(--ink);color:#fff}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.stephead{display:flex;gap:14px;align-items:flex-start}
.stepicon{font-size:36px;line-height:1.1}
.stepno{font-size:13px;color:var(--muted)}
h2{margin:2px 0 4px;font-size:24px}
.hint{margin:0;color:var(--muted)}
.q{margin-top:26px}
.qlabel{font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.tag.req{color:var(--warn);background:var(--warn-soft)}
.tag.multi{color:var(--accent);background:var(--accent-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opts.compact{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.ogroup{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.ogroup:first-child{margin-top:0}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:56px;padding:12px 28px 12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.opts.compact .opt{justify-content:center;align-items:center;text-align:center;padding:12px}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--accent);font-weight:800}
.oi{font-size:24px;line-height:1.2}
.ot b{display:block}
.ot small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:middle}
.txt{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
.txt:focus{outline:none;border-color:var(--accent)}
textarea.txt{min-height:140px;resize:vertical}
.qnote{font-size:13px;color:var(--muted);margin-top:8px}
.nav{display:flex;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.miss{flex:1;font-size:14px;color:var(--warn);text-align:center}
.primary{background:var(--accent);color:#fff;border:none;border-radius:12px;min-height:48px;padding:0 22px;font-weight:700}
.primary:disabled{background:#b8c4bf;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 16px}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 116px);overflow:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.count{font-size:12px;color:var(--muted);font-weight:400}
.sumrow{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 0;border-bottom:1px dashed var(--line)}
.sumrow:last-child{border-bottom:none}
.sumrow .k{display:block;font-size:12px;color:var(--muted)}
.sumrow .v{font-size:14px}
.empty{color:var(--muted);font-size:14px;margin:0}
ul.list{margin:0;padding-left:18px;font-size:14px}
ul.list li{margin:4px 0}
ul.warns li{color:var(--warn)}
.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;transition:width .3s}
.cx{font-size:14px}
.cxnote{font-size:13px;color:var(--muted);margin:6px 0 0}
.final .block{margin-top:22px}
.brand p.maker{font-size:12px;color:var(--muted);opacity:.85;margin-top:1px}
.foot{max-width:1400px;margin:8px auto 0;padding:22px 20px 34px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.foot p{margin:4px 0}
.foot a{color:var(--accent);font-weight:600}
.ask{position:fixed;inset:0;z-index:70;background:rgba(20,24,28,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ask[hidden]{display:none}
.askbox{background:var(--card);border-radius:16px;padding:22px 22px 16px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.askbox p{margin:0 0 6px;font-size:16px;line-height:1.6}
.askbox .btnrow{justify-content:flex-end}
.rpanel{position:fixed;inset:0;z-index:55;background:rgba(20,24,28,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.rpanel[hidden]{display:none}
.rbox{background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0}
.rbody{padding:4px 18px 18px}
.rbody textarea{margin-top:8px;min-height:110px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.refok{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-top:10px}
details.hand{border:2px dashed var(--accent);border-radius:14px;padding:12px 16px;background:#fbfdfc}
details.hand>summary{font-weight:700;color:var(--accent);cursor:pointer;line-height:1.5}
.hsteps{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:14px;font-size:15px}
.hsteps textarea{margin-top:8px;min-height:110px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.hlist{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;margin-top:8px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.hbtns{display:flex;gap:6px}
.ghost.sm2{min-height:40px;padding:0 12px;font-size:14px}
.hrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.hrow:first-of-type{border-top:none}
.hchk{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.hin{flex:1;min-width:200px;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font:15px/1.4 inherit;font-family:inherit;color:var(--ink)}
.hin:focus{outline:none;border-color:var(--accent)}
.hrow.bad .hin{border-color:#f0b4a8;background:#fff5f3}
.hnote{font-size:12px;color:var(--warn);flex-basis:100%;padding-left:34px;margin-top:-2px}
.hnote:empty{display:none}
.gtip{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.gacct{background:var(--warn-soft);color:#7c2d12;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:8px}
.gstep{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;background:#fff}
.gdots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gdot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.gdot.on{border-color:var(--accent);background:var(--accent);color:#fff}
.gdot.done{border-color:var(--accent);color:var(--accent)}
.gstep h4{margin:6px 0 10px;font-size:17px}
.gwarnh{color:var(--warn)}
.gimg{display:flex;flex-direction:column;gap:10px}
.gimg figure{margin:0;position:relative}
.gimg figcaption{position:absolute;left:8px;top:8px;background:var(--warn);color:#fff;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:15px}
.gimg img{display:block;width:100%;max-width:720px;border:1px solid var(--line);border-radius:10px}
.gdiag{background:var(--warn-soft);border-radius:12px;padding:12px 14px;color:#7c2d12;font-size:14px;line-height:1.7}
.gdiag ol{margin:6px 0 0;padding-left:20px}.gdiag li{margin:4px 0}
.gdiag code{background:#fff;padding:1px 6px;border-radius:6px;font-size:12px}
.gdiag a{color:var(--accent);font-weight:700}
.gph{border:2px dashed var(--line);border-radius:10px;padding:26px 12px;text-align:center;color:var(--muted);font-size:14px;background:#faf9f6}
.gbody{margin:0 0 12px;line-height:1.7}
.glink{display:inline-flex;align-items:center;text-decoration:none;padding:0 20px}
.okc{color:var(--accent)} .errc{color:var(--warn)} .small{font-size:13px}
#gasUrl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;color:var(--muted);line-height:1.5}
.thumb{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fdf8ee;position:relative;cursor:zoom-in}
.thumb iframe{border:0;transform-origin:0 0;pointer-events:none;display:block;position:absolute;left:0;top:0}
.ghost.wide{width:100%;margin-top:10px;min-height:44px;font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,24,28,.72);display:flex;flex-direction:column;align-items:center}
.modal[hidden]{display:none}
.mbar{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);flex-wrap:wrap}
.mbar .sp{flex:1}
.mnote{font-size:13px;color:var(--muted)}
.mbtn{min-height:44px}
.mstage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:12px}
.mframe{position:relative;overflow:hidden;border-radius:16px;background:#fdf8ee;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mframe iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0}
.trybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fdf8ee;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.trybar p{margin:0;flex:1;min-width:200px;font-size:14px}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;min-height:44px;padding:0 18px;font-weight:600}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rec{font-size:11px;margin-left:6px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;vertical-align:middle}
.howto{background:var(--accent-soft);border-radius:12px;padding:10px 16px;font-size:14px}
.howto ol{margin:0;padding-left:20px}
.pbox{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:#f3f1ec;flex-wrap:wrap}
.phead small{color:var(--muted)}
.primary.sm{min-height:44px;padding:0 18px}
.ptext{margin:0;padding:14px;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#fff;border-radius:0}
.mlabel{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.mtxt{min-height:96px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.mmsg{font-size:14px;margin:10px 0 0;min-height:1em}
.mmsg.err{color:var(--warn)} .mmsg.ok{color:var(--accent)}
.final h3{font-size:17px;margin:0 0 8px}
.todo{background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-top:22px;font-size:15px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
details{margin-top:18px;font-size:14px}
pre{background:#f3f1ec;padding:12px;border-radius:10px;overflow:auto;font-size:12px}
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr) 300px}
  .rail{grid-column:1/-1;flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  .railbtn{flex:none}
}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;padding:12px;gap:14px}
  .aside{position:static;max-height:none}
  .stage{padding:18px}
  .top{padding:10px 14px 14px}
  h2{font-size:21px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🧩</span><div><h1>互動教材設計幫手</h1><p>點一點，釐清你想做的互動網頁</p><p class="maker">Zeiyen 老師 設計製作</p></div></div>
  <div class="meta"><span id="timer" class="timer">⏱ 00:00</span><button id="refBtn" class="ghost" title="參考別人做的互動網頁，讓 AI 分析後自動幫你點好選項">🔍 參考網站</button><button id="saveBtn" class="ghost" title="把目前的規格存成檔案，下次或在別台電腦繼續">💾 存檔</button><button id="loadBtn" class="ghost" title="讀取之前存的規格檔，或同事分享的檔案">📂 讀檔</button><button id="resetBtn" class="ghost">重新開始</button>
    <input type="file" id="loadFile" accept=".json,application/json" hidden></div>
  <div class="progress"><div id="bar"></div></div>
</header>
<main class="layout">
  <nav id="rail" class="rail" aria-label="步驟"></nav>
  <section id="stage" class="stage"></section>
  <aside id="aside" class="aside"></aside>
</main>
<footer class="foot">
  <p>🧩 互動教材設計幫手・由 <b>Zeiyen 老師</b> 設計製作</p>
  <p>使用上有問題，或想許願新功能？歡迎來信：<a href="mailto:trzeiyen@gmail.com?subject=%E3%80%90%E4%BA%92%E5%8B%95%E6%95%99%E6%9D%90%E8%A8%AD%E8%A8%88%E5%B9%AB%E6%89%8B%E3%80%91%E5%95%8F%E9%A1%8C%E8%88%87%E8%A8%B1%E9%A1%98">trzeiyen@gmail.com</a></p>
</footer>
<div id="ask" class="ask" hidden role="alertdialog" aria-modal="true" aria-labelledby="askMsg">
  <div class="askbox"><p id="askMsg"></p><div class="btnrow"><button class="ghost" id="askNo">取消</button><button class="primary" id="askYes">確定</button></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="refPanel" class="rpanel" hidden role="dialog" aria-modal="true" aria-labelledby="refTitle">
  <div class="rbox">
    <div class="rhead"><b id="refTitle">🔍 參考網站：讓 AI 分析，自動幫你點好選項</b><button class="ghost" id="refClose">關閉</button></div>
    <div class="rbody" id="refBody"></div>
  </div>
</div>
<div id="modal" class="modal" hidden>
  <div class="mbar"><b id="mtitle">雛形試玩</b><span class="mnote">示意畫面：實際外觀由 AI 生成，會有所不同</span>
    <span class="sp"></span><button class="ghost mbtn" id="mRestart">↺ 重來</button><button class="primary mbtn" id="mClose">關閉</button></div>
  <div class="mstage"><div class="mframe" id="mframe"><iframe id="mf" title="雛形試玩"></iframe></div></div>
</div>

<!-- ========== 假畫面預覽的樣板（放進 iframe 執行，不影響主程式） ========== -->
<script type="text/plain" id="mockCss">
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:var(--fs,17px)/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#fdf8ee;color:#2b2b2b}
#app{min-height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#2f6f5e;color:#fff;flex-wrap:wrap}
.ttl{font-weight:700}.sp{flex:1}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:.9em}
.tl{position:relative;height:18px;background:#e7e1d3}
#tbar{height:100%;background:#f59e0b;transition:width 1s linear}
#tnum{position:absolute;right:8px;top:0;font-size:12px;line-height:18px}
.screen{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:900px;width:100%;margin:0 auto}
.center{align-items:center;justify-content:center;text-align:center}
.big{font-size:3.2em;line-height:1.2}
h1{margin:0;font-size:1.6em}
.sub{margin:0;color:#6b6b6b}
.form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.form label{display:flex;flex-direction:column;font-size:.85em;text-align:left;gap:4px}
.form input{font:inherit;padding:10px;border:2px solid #d9d2c3;border-radius:10px;width:120px}
.err{color:#c2410c;min-height:1.4em;margin:0}
.btn{font:inherit;font-weight:700;border:none;background:#2f6f5e;color:#fff;border-radius:12px;min-height:48px;padding:0 26px;cursor:pointer}
.btn.ghost{background:#fff;color:#2f6f5e;border:2px solid #2f6f5e}
.btn:disabled{opacity:.7}
.prog{margin:0;color:#6b6b6b;font-size:.9em}
.q{margin:0;font-size:1.35em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone .opts{grid-template-columns:1fr}
.opt,.card{font:inherit;color:inherit;min-height:56px;padding:10px 14px;border:2px solid #d9d2c3;background:#fff;border-radius:12px;cursor:pointer;text-align:left}
.opt.ok,.card.ok{border-color:#16a34a;background:#dcfce7}
.opt.no,.card.no{border-color:#dc2626;background:#fee2e2}
.opt.picked,.card.sel{border-color:#2f6f5e;background:#e3f0eb}
.fb{padding:10px 14px;border-radius:12px;font-weight:700}
.fb small{display:block;font-weight:400;margin-top:2px}
.fb.good{background:#dcfce7}.fb.bad{background:#fee2e2}
.link{background:none;border:none;color:#2f6f5e;font:inherit;cursor:pointer;align-self:flex-start;padding:6px 0}
.hinttxt{margin:0;color:#92400e}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{display:flex;flex-direction:column;gap:8px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.box{border:2px dashed #b9b09c;border-radius:12px;padding:10px;min-height:110px;background:#fff}
.in{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px}
.chip{padding:10px 14px;background:#fff;border:2px solid #d9d2c3;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.sel{border-color:#2f6f5e;background:#e3f0eb}
.chip.ok{border-color:#16a34a;background:#dcfce7}
.chip.placed{border-color:#2f6f5e}
.chip.ghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%);z-index:9;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fc{font:inherit;min-height:84px;border-radius:12px;border:2px solid #2f6f5e;background:#2f6f5e;color:#fff;cursor:pointer;padding:8px}
.fc .face{display:none}.fc.open{background:#fff;color:#2b2b2b}
.fc.open .face{display:inline}.fc.open .back{display:none}
.fc.ok{border-color:#16a34a;background:#dcfce7}
.back{font-size:1.6em;font-weight:700}
.score{font-size:3em;font-weight:800;color:#2f6f5e;line-height:1.1}
.score small{font-size:.4em}
.who{margin:0;font-weight:700}.meta{margin:0;color:#6b6b6b;font-size:.85em}
.review,.lb{background:#fff;border:1px solid #e7e1d3;border-radius:12px;padding:10px 16px;text-align:left;min-width:260px}
.review ul,.lb ol{margin:6px 0 0;padding-left:20px}
.lb li span{float:right;font-weight:700;margin-left:16px}
.lb li.me{color:#2f6f5e;font-weight:700}
.note{margin:0;color:#92400e;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row.left{justify-content:flex-start;align-items:center}
.wf{display:flex;flex-direction:column;gap:4px}
.wl{font-weight:700;color:#2f6f5e;margin:0}
textarea{font:inherit;font-size:max(18px,1em);line-height:1.5;padding:10px 12px;border:2px solid #d9d2c3;border-radius:12px;resize:none;min-height:64px;background:#fff;color:inherit}
textarea:focus{outline:none;border-color:#2f6f5e}
textarea.empty{border-color:#dc2626;background:#fff5f5}
textarea:disabled{background:#f3f1ec}
.cnt{font-size:.8em;color:#6b6b6b;align-self:flex-end}.cnt.okc{color:#16a34a}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kwb{font:inherit;font-size:.9em;border:1px solid #2f6f5e;color:#2f6f5e;background:#fff;border-radius:999px;padding:4px 14px;min-height:40px;cursor:pointer}
.tagc{background:#fff;border:1px solid #d9d2c3;border-radius:999px;padding:4px 12px}
.voice{margin:0;font-size:.82em;color:#6b6b6b}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rolec{font:inherit;color:inherit;text-align:left;background:#fff;border:2px solid #d9d2c3;border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rolec small{color:#6b6b6b}.rolec.done{border-color:#16a34a;background:#f0fdf4}
.rolec em{font-style:normal;color:#16a34a;font-size:.85em;font-weight:700}
.re{font-size:2em;line-height:1.2}
.who2{font-size:1.2em;font-weight:700;display:flex;align-items:center;gap:8px}
.scene b{display:block;margin-bottom:4px;font-size:.85em;color:#2f6f5e}.scene p{margin:0}
.scene.small{font-size:.95em;padding:10px 14px}
.refbox{background:#eef6ff;border-radius:12px;padding:12px 16px}
.refbox small{display:block;color:#6b6b6b}.refbox p{margin:6px 0 0}.refbox p.mine{color:#1e40af}
.chk{background:#fff;border:1px solid #e7e1d3;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chk label{display:flex;gap:8px;align-items:center;min-height:36px}.chk input{width:22px;height:22px}
.tblwrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;background:#fff;font-size:.92em}
.cmp th,.cmp td{border:1px solid #e7e1d3;padding:8px 10px;text-align:left;vertical-align:top}
.cmp th{background:#f3efe4}
.link.sm{font-size:.85em;padding:2px 0}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice2 .opt{text-align:center;font-weight:700}
.ans{background:#fff;border:1px solid #e7e1d3;border-radius:12px;padding:10px 14px;text-align:left;width:100%;max-width:720px}
.ans b{color:#2f6f5e}.ans p{margin:4px 0 0;white-space:pre-line}
.picks{display:flex;flex-direction:column;gap:8px}
.pk{background:#fff;border:1px solid #e7e1d3;border-radius:12px;padding:8px 14px;display:flex;flex-direction:column}
.pk small{color:#6b6b6b}.pk b{color:#2f6f5e}.pk span{font-size:.92em}
.refrow td{background:#eef6ff}
.cmp small{color:#6b6b6b}
.stars{font-size:1.2em;margin:0}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #d9d2c3;border-radius:12px;padding:6px 8px 6px 12px}
.srow.ok{border-color:#16a34a;background:#dcfce7}.srow.no{border-color:#dc2626;background:#fee2e2}
.sn{width:28px;height:28px;border-radius:50%;background:#2f6f5e;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:.85em}
.st{flex:1}
.mv{font:inherit;width:48px;height:44px;border:1px solid #d9d2c3;background:#fdf8ee;border-radius:10px;cursor:pointer}
.mv:disabled{opacity:.3}
.scene{background:#fff;border-left:6px solid #2f6f5e;border-radius:10px;padding:14px 16px;font-size:1.15em}
.opts.one{grid-template-columns:1fr}
.fb.story{background:#fef3c7;font-weight:600}
.map{position:relative;width:100%;aspect-ratio:16/9;max-height:52vh;border-radius:12px;cursor:crosshair;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,0,0,.06) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(0,0,0,.06) 39px 40px),#dfe7d6}
.mapnote{position:absolute;left:10px;bottom:8px;font-size:12px;color:#5f6b55}
.pin{position:absolute;transform:translate(-50%,-90%);font-size:28px;pointer-events:none}
.ring{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #16a34a;border-radius:50%;background:rgba(22,163,74,.15);pointer-events:none}
.arena{display:flex;align-items:center;justify-content:space-around;background:#fff;border-radius:14px;padding:12px;border:1px solid #e7e1d3}
.fighter{text-align:center;width:38%}
.av{font-size:3.2em;line-height:1.2}
.av.hurt{animation:sh .4s}
.hp{height:12px;background:#e7e1d3;border-radius:999px;overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:#16a34a;transition:width .4s}
.hp.en i{background:#dc2626}
.fighter small{color:#6b6b6b}
.vs{font-weight:800;color:#b45309;font-size:1.3em}
</script>
<script type="text/plain" id="mockJs">
(function(){
const app=document.getElementById('app');
const N=C.data.length;
const TT=C.open?180:60;
let S, timerId=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has=m=>C.mech.indexOf(m)>=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const $id=id=>document.getElementById(id);
function reset(){S={score:0,lives:3,i:0,wrong:[],t0:Date.now(),qStart:Date.now(),who:{},timeLeft:TT,level:1,php:100,ehp:100,items:{},order:[],draft:{},cur:null};}
function stopTimer(){clearInterval(timerId);timerId=null;}
function startTimer(){
  if(!has('timer'))return; stopTimer();
  timerId=setInterval(()=>{S.timeLeft--;const b=$id('tbar');
    if(b){b.style.width=(S.timeLeft/TT*100)+'%';$id('tnum').textContent=S.timeLeft+'s';}
    if(S.timeLeft<=0){stopTimer();result('time');}},1000);
}
function hud(){
  let h='<div class="hud"><span class="ttl">'+esc(C.title)+'</span><span class="sp"></span>';
  if(has('levels')) h+='<span class="pill">第 '+S.level+' 關</span>';
  if(has('lives')) h+='<span class="pill">'+'❤️'.repeat(Math.max(0,S.lives))+'🤍'.repeat(3-Math.max(0,S.lives))+'</span>';
  if(C.scoring!=='none') h+='<span class="pill">'+(C.open?'⭐ × '+S.score:'⭐ '+S.score+' 分')+'</span>';
  h+='</div>';
  if(has('timer')) h+='<div class="tl"><div id="tbar" style="width:'+(S.timeLeft/TT*100)+'%"></div><span id="tnum">'+S.timeLeft+'s</span></div>';
  return h;
}
const refreshHud=()=>{const w=$id('hudwrap');if(w)w.innerHTML=hud();};
function hit(ok,label){
  if(C.scoring==='fixed'){ if(ok) S.score+=Math.round(100/N); }
  else if(C.scoring==='penalty'){ S.score=Math.max(0,S.score+(ok?10:-5)); }
  else if(C.scoring==='speed'){ if(ok){ S.score+=10; if((Date.now()-S.qStart)/1000<5) S.score+=5; } }
  if(!ok){ S.wrong.push(label); if(has('lives')) S.lives--; }
  S.qStart=Date.now();
}
const dead=()=>has('lives')&&S.lives<=0;
function bindHint(d){const h=$id('hint');if(h)h.onclick=()=>{$id('ht').textContent='提示：'+(d.hint||'（提示內容由老師在資料區填寫）');h.disabled=true;};}
const hintHTML=()=>has('hint')?'<button class="link" id="hint">💡 提示</button><p class="hinttxt" id="ht"></p>':'';
function interlude(t,s,next){
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen center"><div class="big">'+t+'</div><p class="sub">'+esc(s)+'</p><button class="btn" id="cont">繼續</button></div>';
  $id('cont').onclick=next;
}

function start(){
  reset(); stopTimer();
  let f='';
  if(C.identity!=='none'){
    f='<label>班級<input id="cls" inputmode="numeric" maxlength="3" placeholder="例：401"></label><label>座號<input id="seat" inputmode="numeric" maxlength="2" placeholder="1～40"></label>';
    if(C.identity==='name') f+='<label>姓名<input id="nm" maxlength="10"></label>';
    f='<div class="form">'+f+'</div><p class="err" id="err"></p>';
  }
  app.innerHTML='<div class="screen center"><div class="big">'+C.icon+'</div><h1>'+esc(C.title)+'</h1><p class="sub">'+esc(C.subtitle)+'</p>'+f+'<button class="btn" id="go">開始</button></div>';
  $id('go').onclick=()=>{
    if(C.identity!=='none'){
      const c=$id('cls').value.trim(), s=$id('seat').value.trim(), n=C.identity==='name'?$id('nm').value.trim():'';
      let e='';
      if(!/^[1-6][0-9]{2}$/.test(c)) e='班級請輸入三位數字，例如 401';
      else if(!/^[0-9]{1,2}$/.test(s)||+s<1||+s>40) e='座號請輸入 1～40';
      else if(C.identity==='name'&&!n) e='請輸入姓名';
      if(e){$id('err').textContent=e;return;}
      S.who={c:c,s:s,n:n};
    }
    S.t0=Date.now(); S.qStart=Date.now(); startTimer();
    ({quiz:quiz,match:match,drag:drag,flip:flip,sort:sort,scenario:scenario,map:map,battle:battle,role:roleHome,multi:multiIntro,dilemma:C.mode==='write'?dilemma:dilemmaChoice})[C.form]();
  };
}

function quiz(){
  if(dead()) return result('dead');
  if(S.i>=N) return result('done');
  if(has('levels')){ const lv=Math.floor(S.i/Math.ceil(N/3))+1; if(lv>S.level){ S.level=lv; return interlude('🎉 過關！','進入第 '+lv+' 關',quiz); } }
  const d=C.data[S.i]; S.qStart=Date.now();
  const opts=shuffle(d.options.map((t,k)=>({t:t,ok:k===0})));
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">第 '+(S.i+1)+' / '+N+' 題</p><h2 class="q">'+esc(d.q)+'</h2><div class="opts">'
    +opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>').join('')+'</div>'+hintHTML()+'<div id="fb"></div></div>';
  bindHint(d);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.k]; hit(o.ok,d.q+' → '+d.options[0]);
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true); S.i++;
    if(C.feedback==='end'){ b.classList.add('picked'); refreshHud(); setTimeout(quiz,400); return; }
    b.classList.add(o.ok?'ok':'no');
    if(!o.ok) app.querySelectorAll('.opt').forEach((x,k)=>{ if(opts[k].ok) x.classList.add('ok'); });
    refreshHud();
    $id('fb').innerHTML='<div class="fb '+(o.ok?'good':'bad')+'">'+(o.ok?'✅ 答對了！':'❌ 答錯了')+'<small>'+esc(d.explain)+'</small></div><button class="btn" id="nx">'+(C.mode==='group'?'換下一位同學 👉':'下一題 →')+'</button>';
    $id('nx').onclick=quiz;
  });
}

function match(){
  const items=C.data; let sel=null, left=items.length;
  const R=shuffle(items.map((d,k)=>({t:d.right,k:k})));
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">先點左邊，再點右邊完成配對</p><div class="cols"><div class="col">'
    +items.map((d,k)=>'<button class="card L" data-k="'+k+'">'+esc(d.left)+'</button>').join('')+'</div><div class="col">'
    +R.map(r=>'<button class="card R" data-k="'+r.k+'">'+esc(r.t)+'</button>').join('')+'</div></div>'+hintHTML()+'</div>';
  bindHint({});
  app.querySelectorAll('.L').forEach(b=>b.onclick=()=>{ app.querySelectorAll('.L').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  app.querySelectorAll('.R').forEach(b=>b.onclick=()=>{
    if(!sel) return;
    const d=items[+sel.dataset.k], ok=sel.dataset.k===b.dataset.k; hit(ok,d.left+' ↔ '+d.right);
    if(ok){ [sel,b].forEach(x=>{x.disabled=true;x.classList.remove('sel');x.classList.add('ok');}); left--; }
    else { sel.classList.remove('sel'); if(C.feedback!=='end'){ b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),600); } }
    sel=null; refreshHud();
    if(dead()) return setTimeout(()=>result('dead'),500);
    if(left===0) setTimeout(()=>result('done'),500);
  });
}

function drag(){
  let left=C.data.length, picked=null;
  const cards=shuffle(C.data.map((d,k)=>({text:d.text,k:k})));
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">把卡片拖進正確的類別（也可以先點卡片、再點類別）</p><div class="boxes">'
    +C.cats.map((c,i)=>'<div class="box" data-i="'+i+'"><b>'+esc(c)+'</b><div class="in"></div></div>').join('')+'</div><div class="pool">'
    +cards.map(d=>'<div class="chip" data-k="'+d.k+'">'+esc(d.text)+'</div>').join('')+'</div>'+hintHTML()+'</div>';
  bindHint({});
  const drop=(chip,box)=>{
    const d=C.data[+chip.dataset.k], ok=C.cats[+box.dataset.i]===d.cat;
    hit(ok,d.text+' → '+d.cat); chip.classList.remove('sel');
    if(ok||C.feedback==='end'){ box.querySelector('.in').appendChild(chip); chip.classList.add(C.feedback==='end'?'placed':'ok'); chip.dataset.done='1'; left--; }
    else { chip.classList.add('shake'); setTimeout(()=>chip.classList.remove('shake'),450); }
    refreshHud();
    if(dead()) return setTimeout(()=>result('dead'),500);
    if(left===0) setTimeout(()=>result('done'),500);
  };
  app.querySelectorAll('.box').forEach(box=>box.addEventListener('click',()=>{ if(picked){ const p=picked; picked=null; drop(p,box); } }));
  app.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('pointerdown',e=>{
    if(chip.dataset.done) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null;
    try{chip.setPointerCapture(e.pointerId);}catch(_){}
    const mv=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ ghost=chip.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
      if(ghost){ ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; }
    };
    const up=ev=>{
      chip.removeEventListener('pointermove',mv); chip.removeEventListener('pointerup',up); chip.removeEventListener('pointercancel',up);
      if(ghost){ ghost.remove(); const el=document.elementFromPoint(ev.clientX,ev.clientY); const box=el&&el.closest('.box'); if(box) drop(chip,box); }
      else { const was=picked===chip; app.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); picked=was?null:chip; if(!was) chip.classList.add('sel'); }
    };
    chip.addEventListener('pointermove',mv); chip.addEventListener('pointerup',up); chip.addEventListener('pointercancel',up);
  }));
}

function flip(){
  const cards=shuffle([].concat.apply([],C.data.map((d,k)=>[{t:d.a,k:k},{t:d.b,k:k}])));
  let open=[], left=C.data.length, lock=false;
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">翻開兩張成對的卡片</p><div class="grid">'
    +cards.map((c,i)=>'<button class="fc" data-i="'+i+'"><span class="back">?</span><span class="face">'+esc(c.t)+'</span></button>').join('')+'</div></div>';
  app.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')) return;
    b.classList.add('open'); open.push(b);
    if(open.length<2) return;
    const x=open[0], y=open[1]; open=[];
    const ok=cards[+x.dataset.i].k===cards[+y.dataset.i].k;
    hit(ok,cards[+x.dataset.i].t+' ↔ '+cards[+y.dataset.i].t); refreshHud();
    if(ok){ x.classList.add('ok'); y.classList.add('ok'); left--; if(left===0) setTimeout(()=>result('done'),600); }
    else { lock=true; setTimeout(()=>{ x.classList.remove('open'); y.classList.remove('open'); lock=false; if(dead()) result('dead'); },1000); }
  });
}

function sort(){
  if(S.i>=N) return result('done');
  const d=C.data[S.i]; S.qStart=Date.now();
  let order=shuffle(d.items.map((t,k)=>({t:t,k:k})));
  if(order.length>1&&order.every((o,i)=>o.k===i)){ const t=order[0]; order[0]=order[1]; order[1]=t; }
  let checked=false;
  const draw=()=>{
    $id('list').innerHTML=order.map((o,i)=>'<div class="srow" data-i="'+i+'"><span class="sn">'+(i+1)+'</span><span class="st">'+esc(o.t)+'</span>'
      +'<button class="mv" data-up="'+i+'" '+(i===0||checked?'disabled':'')+' aria-label="上移">▲</button>'
      +'<button class="mv" data-dn="'+i+'" '+(i===order.length-1||checked?'disabled':'')+' aria-label="下移">▼</button></div>').join('');
  };
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">第 '+(S.i+1)+' / '+N+' 題・用 ▲▼ 調整順序</p><h2 class="q">'+esc(d.title)+'</h2><div id="list" class="slist"></div>'
    +hintHTML()+'<div id="fb"><button class="btn" id="chk">檢查順序</button></div></div>';
  draw(); bindHint(d);
  $id('list').onclick=e=>{
    const u=e.target.getAttribute('data-up'), dn=e.target.getAttribute('data-dn');
    if(u!==null){ const i=+u; const t=order[i-1]; order[i-1]=order[i]; order[i]=t; draw(); }
    if(dn!==null){ const i=+dn; const t=order[i+1]; order[i+1]=order[i]; order[i]=t; draw(); }
  };
  $id('chk').onclick=()=>{
    checked=true; const ok=order.every((o,i)=>o.k===i); hit(ok,d.title+'：'+d.items.join(' → ')); S.i++; draw(); refreshHud();
    if(C.feedback==='end'){ setTimeout(()=>dead()?result('dead'):sort(),400); return; }
    app.querySelectorAll('.srow').forEach((r,i)=>r.classList.add(order[i].k===i?'ok':'no'));
    $id('fb').innerHTML='<div class="fb '+(ok?'good':'bad')+'">'+(ok?'✅ 順序正確！':'❌ 還不對喔')+'<small>正確順序：'+esc(d.items.join(' → '))+'</small></div><button class="btn" id="nx">'+(C.mode==='group'?'換下一位同學 👉':'下一題 →')+'</button>';
    $id('nx').onclick=()=>dead()?result('dead'):sort();
  };
}

function scenario(){
  if(S.i>=N) return result('story');
  const d=C.data[S.i];
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">情境 '+(S.i+1)+' / '+N+'</p><div class="scene">'+esc(d.text)+'</div><div class="opts one">'

function battle(){
  if(S.php<=0) return result('lose');
  if(S.ehp<=0) return result('win');

  if(S.i>=N) return result('done');

    +'<div class="fighter"><div class="av" id="me">🧑‍🚀</div><div class="hp"><i style="width:'+S.php+'%"></i></div><small>我方</small></div><div class="vs">VS</div>'
    +'<div class="fighter"><div class="av" id="foe">👾</div><div class="hp en"><i style="width:'+S.ehp+'%"></i></div><small>敵方</small></div></div>'
    +'<p class="prog">第 '+(S.i+1)+' / '+N+' 題・答對就攻擊！</p><h2 class="q">'+esc(d.q)+'</h2><div class="opts">'
    +opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>').join('')+'</div>'+hintHTML()+'<div id="fb"></div></div>';
  bindHint(d);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.k]; hit(o.ok,d.q+' → '+d.options[0]); S.i++;
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(o.ok){ S.ehp=Math.max(0,S.ehp-Math.ceil(100/N)); $id('foe').classList.add('hurt'); app.querySelector('.hp.en i').style.width=S.ehp+'%'; }
    else { S.php=Math.max(0,S.php-34); $id('me').classList.add('hurt'); app.querySelector('.hp:not(.en) i').style.width=S.php+'%'; }
    refreshHud();
    if(C.feedback==='end'){ b.classList.add('picked'); setTimeout(battle,600); return; }
    b.classList.add(o.ok?'ok':'no');

    $id('fb').innerHTML='<div class="fb '+(o.ok?'good':'bad')+'">'+(o.ok?'⚔️ 攻擊成功！':'💥 受到攻擊！')+'<small>'+esc(d.explain)+'</small></div><button class="btn" id="nx">'+(C.mode==='group'?'換下一位同學 👉':'繼續戰鬥 →')+'</button>';
    $id('nx').onclick=battle;
  });
}

const CHECKS=['我有用角色或立場的身分說話','我有說明理由（因為……）','我有提到具體的事實或例子'];
const tlen=v=>v.replace(/\s/g,'').length;
let lastTA=null;
function putItem(key,title,text){
  if(!(key in S.items)){ S.order.push(key); if(C.scoring!=='none') S.score++; }
  S.items[key]={title:title,text:text};
}
function wf(id,label,val){
  return '<label class="wf"><span class="wl">'+esc(label)+'</span><textarea id="'+id+'" rows="2" placeholder="在這裡寫下你的想法">'+esc(val||'')+'</textarea><span class="cnt" id="'+id+'c"></span></label>';
}
function writeTools(){
  return (C.kw?'<div class="kw">'+C.kw.map(k=>'<button class="kwb" type="button">'+esc(k)+'</button>').join('')+'</div>':'')
    +'<p class="voice">🎤 打字太慢？可以用鍵盤上的麥克風語音輸入</p>';
}
function cnt(t){
  const c=$id(t.id+'c'); if(!c) return;
  if(C.scoring==='minlen'){ const need=C.minlen-tlen(t.value); c.textContent=need>0?'還差 '+need+' 字':'✓ 字數足夠'; c.className='cnt'+(need>0?'':' okc'); }
  else c.textContent=tlen(t.value)+' 字';
}
function grow(t){ t.style.height='auto'; t.style.height=Math.min(Math.max(t.scrollHeight,64),220)+'px'; }
function bindWrite(ids,key){
  ids.forEach(id=>{ const t=$id(id);
    t.addEventListener('focus',()=>{lastTA=t;});
    t.addEventListener('input',()=>{ grow(t); cnt(t); t.classList.remove('empty'); S.draft[key]=ids.map(x=>$id(x).value); });
    grow(t); cnt(t); });
  lastTA=$id(ids[0]);
  app.querySelectorAll('.kwb').forEach(b=>b.onclick=()=>{
    const t=lastTA; if(!t||t.disabled) return;
    const st=t.selectionStart==null?t.value.length:t.selectionStart, en=t.selectionEnd==null?t.value.length:t.selectionEnd;
    t.value=t.value.slice(0,st)+b.textContent+t.value.slice(en);
    const p=st+b.textContent.length; t.focus(); try{t.setSelectionRange(p,p);}catch(_){}
    t.dispatchEvent(new Event('input'));
  });
}
function checkWrite(ids){
  const vals=ids.map(id=>$id(id).value.trim());
  const flag=i=>{ $id(ids[i]).classList.add('empty'); $id(ids[i]).focus(); };
  if(C.scoring==='minlen'){ const i=vals.findIndex(v=>tlen(v)<C.minlen); if(i>=0){ flag(i); return '每一格至少要寫 '+C.minlen+' 個字喔'; } }
  else if(C.scoring==='scaffold'||C.scoring==='complete'){ const i=vals.findIndex(v=>!v); if(i>=0){ flag(i); return C.scoring==='scaffold'?'句型的每個空格都要填寫喔':'每一格都至少要寫一點喔'; } }
  else if(!vals.some(v=>v)){ flag(0); return '先寫下你的想法再送出喔'; }
  return '';
}
function afterWrite(refHTML){
  if(C.feedback==='discuss') return '<div class="fb story">🗣️ 想法已記錄，等一下全班一起討論</div>';
  let h=refHTML?'<div class="refbox"><b>💬 參考觀點</b><small>這只是其中一種想法，沒有標準答案</small>'+refHTML+'</div>':'';

    +'<button class="btn ghost" id="edit">✏️ 修改作答</button></div>';
  return h;
}

/* ===== 處境選擇題模式 ===== */
const CHECKS_C=['我有站在角色的處境想','我有想過其他選項的理由'];
const sampleNote='<p class="voice">範例題目：實際題目由 AI 依角色與情境設計</p>';
function pickLine(p){ return p.q+'\n→ 我選「'+p.t+'」'+(p.reason?'，因為'+p.reason:'')+'（'+p.why+'）'; }
function runChoices(head,qs,key,title,done){
  let j=0; const picks=[];
  S.cur={key:key,title:title,make:()=>picks.map(pickLine).join('\n')};
  const step=()=>{
    if(j>=qs.length){ S.cur=null; return done(picks); }
    const q=qs[j];
    app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen">'+head()+'<p class="prog">處境 '+(j+1)+' / '+qs.length+'</p><h2 class="q">'+esc(q.q)+'</h2>'+sampleNote
      +'<div class="opts one">'+q.options.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>').join('')+'</div><div id="why"></div></div>';
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=q.options[+b.dataset.k];
      app.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add('picked');
      const last=j===qs.length-1, label=last?'完成這一組 ✓':'下一題 →';
      let h='<div class="fb story">💭 '+esc(o.why)+'</div>';
      if(C.mode==='choice_reason') h+=wf('w1','我這樣選，是因為',(S.draft[key+'_'+j]||[''])[0])+writeTools()+errHTML;
      h+='<button class="btn" id="nx">'+label+'</button>';
      $id('why').innerHTML=h;
      if(C.mode==='choice_reason') bindWrite(['w1'],key+'_'+j);
      $id('nx').onclick=()=>{
        let reason='';
        if(C.mode==='choice_reason'){ const e=checkWrite(['w1']); $id('werr').textContent=e; if(e) return; reason=$id('w1').value.trim(); }
        picks.push({q:q.q,t:o.t,why:o.why,reason:reason}); j++; step();
      };
    });
  };
  step();
}
function afterChoice(refHTML){
  if(C.feedback==='discuss') return '<div class="fb story">🗣️ 選擇已記錄，等一下全班一起討論</div>';

  if(C.feedback==='refcheck') h+='<div class="chk"><b>✅ 自我檢核</b>'+CHECKS_C.map(c=>'<label><input type="checkbox"> '+c+'</label>').join('')+'<button class="btn ghost" id="edit">🔄 重新選擇</button></div>';

}

function roleChoice(i){
  const r=C.data[i], key='r'+i;
  runChoices(()=>'<div class="who2"><span class="re">'+r.emoji+'</span>現在你是「'+esc(r.role)+'」</div>'+sceneHTML(true), r.qs, key, '扮演「'+r.role+'」', picks=>{
    putItem(key,'扮演「'+r.role+'」',picks.map(pickLine).join('\n')); refreshHud();
    app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><div class="who2"><span class="re">'+r.emoji+'</span>「'+esc(r.role)+'」的選擇</div>'+pickList(picks)
      +afterChoice(C.data.map((x,k)=>'<p'+(k===i?' class="mine"':'')+'><b>'+x.emoji+' '+esc(x.role)+'：</b>'+esc(x.ref)+'</p>').join(''))
      +'<div class="row left"><button class="btn ghost" id="more">換一個角色</button><button class="btn" id="fin">完成，看我的思考彙整</button></div></div>';
    $id('more').onclick=roleHome; $id('fin').onclick=()=>result('think');
    const ed=$id('edit'); if(ed) ed.onclick=()=>roleChoice(i);
  });
}

function multiChoice(i,back){
  if(i>=N) return multiCompareC();
  const x=C.data[i], key='m'+i;
  runChoices(()=>'<p class="prog">立場 '+(i+1)+' / '+N+'</p><div class="who2"><span class="re">'+x.emoji+'</span>站在「'+esc(x.stance)+'」的立場</div>'+sceneHTML(true), C.qs, key, '站在「'+x.stance+'」的立場', picks=>{
    S.mc=S.mc||{}; S.mc[i]=picks; putItem(key,'站在「'+x.stance+'」的立場',picks.map(pickLine).join('\n'));
    back?multiCompareC():multiChoice(i+1,false);
  });
}
function multiCompareC(){
  const showRef=C.feedback!=='discuss', edit=C.feedback==='refcheck'; let pick=null;
  const cell=(i,j)=>{ const p=((S.mc||{})[i]||[])[j]; return p?esc(p.t)+(p.reason?'<br><small>因為'+esc(p.reason)+'</small>':''):''; };
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><h2 class="q">🔍 觀點比較表</h2><p class="voice">同一個處境，站在不同立場，你的選擇一樣嗎？</p><div class="tblwrap"><table class="cmp"><tr><th>處境</th>'
    +C.data.map((x,i)=>'<th>'+x.emoji+' '+esc(x.stance)+(edit?'<br><button class="link sm" data-e="'+i+'">🔄 重新選</button>':'')+'</th>').join('')+'</tr>'
    +C.qs.map((q,j)=>'<tr><td>'+esc(q.q)+'</td>'+C.data.map((_,i)=>'<td>'+cell(i,j)+'</td>').join('')+'</tr>').join('')
    +(showRef?'<tr class="refrow"><td>💬 參考觀點</td>'+C.data.map(x=>'<td>'+esc(x.ref)+'</td>').join('')+'</tr>':'')+'</table></div>'
    +(showRef?'':'<div class="fb story">🗣️ 等一下全班一起比較大家的選擇</div>')
    +(edit?'<div class="chk"><b>✅ 自我檢核</b>'+CHECKS_C.map(c=>'<label><input type="checkbox"> '+c+'</label>').join('')+'</div>':'')
    +'<p class="wl">綜合來看，我最認同的立場是……</p><div class="opts">'+C.data.map((x,i)=>'<button class="opt" data-s="'+i+'">'+x.emoji+' '+esc(x.stance)+'</button>').join('')+'</div>'
    +(C.mode==='choice_reason'?wf('w9','因為',(S.draft.m_sum||[''])[0])+writeTools():'')+errHTML+'<button class="btn" id="send">完成，看我的思考彙整</button></div>';
  if(C.mode==='choice_reason') bindWrite(['w9'],'m_sum');
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>multiChoice(+b.dataset.e,true));
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ app.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('picked')); b.classList.add('picked'); pick=+b.dataset.s; });
  $id('send').onclick=()=>{
    if(pick===null){ $id('werr').textContent='先點選你最認同的立場喔'; return; }
    let reason='';
    if(C.mode==='choice_reason'){ const e=checkWrite(['w9']); $id('werr').textContent=e; if(e) return; reason=$id('w9').value.trim(); }
    putItem('m_sum','我的綜合看法','綜合來看，我最認同「'+C.data[pick].stance+'」的立場'+(reason?'，因為'+reason:'')+'。'); result('think');
  };
}

function dilemmaChoice(){
  if(S.i>=N) return result('think');
  const i=S.i, d=C.data[i], key='d'+i;
  app.innerHTML='<div id="hudwrap">'+hud()+'</div><div class="screen"><p class="prog">兩難情境 '+(i+1)+' / '+N+'</p><div class="scene"><b>⚖️ 你會怎麼選？</b><p>'+esc(d.q)+'</p></div>'
    +'<div class="choice2"><button class="opt" data-c="a">'+esc(d.a)+'</button><button class="opt" data-c="b">'+esc(d.b)+'</button></div><div id="step"></div></div>';
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    app.querySelectorAll('[data-c]').forEach(x=>x.disabled=true); b.classList.add('picked');
    const side=b.dataset.c, choice=d[side], other=side==='a'?d.b:d.a, counter=side==='a'?d.counterA:d.counterB, reasons=side==='a'?d.reasonsA:d.reasonsB;
    S.cur={key:key,title:d.q,make:()=>'我選擇「'+choice+'」'};
    $id('step').innerHTML='<p class="wl">你最主要的理由是……</p>'+sampleNote+'<div class="opts one">'+reasons.map((r,k)=>'<button class="opt" data-r="'+k+'">'+esc(r)+'</button>').join('')+'</div><div id="step2"></div>';
    app.querySelectorAll('[data-r]').forEach(rb=>rb.onclick=()=>{
      app.querySelectorAll('[data-r]').forEach(x=>x.disabled=true); rb.classList.add('picked');
      const reason=reasons[+rb.dataset.r];
      S.cur={key:key,title:d.q,make:()=>'我選擇「'+choice+'」，理由是'+reason+'。'};
      $id('step2').innerHTML='<div class="refbox"><b>🤔 也有人這樣想（支持「'+esc(other)+'」）</b><p>'+esc(counter)+'</p></div><p class="wl">看完之後，你要……</p>'
        +'<div class="choice2"><button class="opt" data-k="keep">維持「'+esc(choice)+'」</button><button class="opt" data-k="change">改成「'+esc(other)+'」</button></div><div id="step3"></div>';
      app.querySelectorAll('[data-k]').forEach(kb=>kb.onclick=()=>{
        app.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('picked')); kb.classList.add('picked');
        const head='我選擇「'+choice+'」，理由是'+reason+'。看完反方論點後，我決定'+(kb.dataset.k==='keep'?'維持原本的立場':'改成「'+other+'」');
        S.cur={key:key,title:d.q,make:()=>head+'。'};
        $id('step3').innerHTML=(C.mode==='choice_reason'?wf('w2','因為',''):'')+errHTML+'<div id="fb"><button class="btn" id="send2">確定</button></div>';
        if(C.mode==='choice_reason') bindWrite(['w2'],key+'b');
        $id('send2').onclick=()=>{
          let why='';
          if(C.mode==='choice_reason'){ const e=checkWrite(['w2']); $id('werr').textContent=e; if(e) return; why=$id('w2').value.trim(); $id('w2').disabled=true; }
          app.querySelectorAll('[data-k]').forEach(x=>x.disabled=true);
          putItem(key,d.q,head+(why?'，因為'+why:'')+'。'); S.cur=null; S.i++; refreshHud();
          $id('fb').innerHTML=afterChoice('<p><b>支持「'+esc(d.b)+'」的人會說：</b>'+esc(d.counterA)+'</p><p><b>支持「'+esc(d.a)+'」的人會說：</b>'+esc(d.counterB)+'</p>')
            +'<button class="btn" id="nx">'+(S.i>=N?'看我的思考彙整':'下一個兩難情境 →')+'</button>';
          $id('nx').onclick=dilemmaChoice;
          const ed=$id('edit'); if(ed) ed.onclick=()=>{ delete S.items[key]; S.order=S.order.filter(k=>k!==key); if(C.scoring!=='none') S.score--; S.i--; dilemmaChoice(); };
        };
      });
    });
  });
}

function openResult(why){
  stopTimer();
  if(S.cur){ try{ const t=S.cur.make(); if(t&&!(S.cur.key in S.items)) putItem(S.cur.key,S.cur.title+'（時間到，未送出）',t); }catch(_){} S.cur=null; }
  const sec=Math.round((Date.now()-S.t0)/1000);
  let h='<div class="screen center"><h1>'+(why==='time'?'⏰ 時間到！這是你的思考彙整':'📝 我的思考彙整')+'</h1>';
  if(C.identity!=='none') h+='<p class="who">'+esc(S.who.c||'')+' 班 '+esc(S.who.s||'')+' 號 '+esc(S.who.n||'')+'</p>';
  h+='<p class="meta">用時 '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒・'+new Date().toLocaleString('zh-TW')+'</p>';
  if(C.scoring!=='none') h+='<p class="stars">'+'⭐'.repeat(Math.min(S.score,10))+' 完成 '+S.score+' 題</p>';
  h+=S.order.length?S.order.map(k=>'<div class="ans"><b>'+esc(S.items[k].title)+'</b><p>'+esc(S.items[k].text)+'</p></div>').join(''):'<p class="sub">還沒有完成的作答</p>';
  if(C.submit==='screenshot') h+='<p class="note">📸 請截圖這個畫面繳交</p>';
  h+='<div class="row">'+(C.submit==='sheet'?'<button class="btn" id="send">送出作答</button>':'')+'<button class="btn ghost" id="again">重新開始</button></div></div>';
  app.innerHTML=h;
  $id('again').onclick=start;
  const sd=$id('send'); if(sd) sd.onclick=()=>{sd.textContent='✅ 已送出（示意）';sd.disabled=true;};
}

function result(why){
  if(C.open) return openResult(why);
  stopTimer();
  const sec=Math.round((Date.now()-S.t0)/1000);
  const title={dead:'💔 生命值用完了',time:'⏰ 時間到！',win:'🏆 勝利！',lose:'💔 被打敗了',story:'📖 故事結束'}[why]||'🎉 完成！';
  let h='<div class="screen center"><h1>'+title+'</h1>';
  if(C.scoring!=='none') h+='<div class="score">'+S.score+'<small> 分</small></div>';
  if(C.identity!=='none') h+='<p class="who">'+esc(S.who.c||'')+' 班 '+esc(S.who.s||'')+' 號 '+esc(S.who.n||'')+'</p>';
  h+='<p class="meta">用時 '+sec+' 秒・'+new Date().toLocaleString('zh-TW')+'</p>';
  if((C.feedback==='end'||C.feedback==='instant_review')&&S.wrong.length&&C.form!=='flip')
    h+='<div class="review"><b>答錯的題目</b><ul>'+S.wrong.slice(0,5).map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></div>';
  if(why==='story') h+='<div class="review"><b>學習重點</b><p style="margin:4px 0 0">（這裡會顯示 AI 依單元主題寫的學習重點說明）</p></div>';
  if(C.submit==='screenshot') h+='<p class="note">📸 請截圖這個畫面繳交</p>';
  if(has('leaderboard')){
    const me={n:S.who.c?S.who.c+'-'+S.who.s:'你',s:S.score};
    const lb=[{n:'402-05',s:95},{n:'401-12',s:88},{n:'403-07',s:76},{n:'401-03',s:60},me].sort((a,b)=>b.s-a.s);
    h+='<div class="lb"><b>🏆 排行榜（示意）</b><ol>'+lb.map(r=>'<li'+(r===me?' class="me"':'')+'>'+esc(r.n)+'<span>'+r.s+'</span></li>').join('')+'</ol></div>';
  }
  h+='<div class="row">'+(C.submit==='sheet'?'<button class="btn" id="send">送出成績</button>':'')+'<button class="btn ghost" id="again">重新開始</button></div></div>';
  app.innerHTML=h;
  $id('again').onclick=start;
  const sd=$id('send'); if(sd) sd.onclick=()=>{sd.textContent='✅ 已送出（示意）';sd.disabled=true;};
}
start();
})();
</script>

/* 前端送出的欄位名稱固定，和通用後台（互動教材通用後台.gs）對得上 */
function gasContract(a){
  const f=['活動（填 GAME_NAME）','班級','座號'];
  if(a.identity==='name') f.push('姓名');
  if(isOpen(a)) f.push('完成題數','用時秒數','完成時間','作答1、作答2……（每題一個欄位，內容是組好的完整作答句子）');
  else { f.push('分數','滿分','用時秒數','完成時間'); if(a.feedback==='instant_review'||a.feedback==='end') f.push('答錯題目（用「、」串起來）'); }
  if(a.identity==='none') f.splice(1,2);
  const game=(a.topic||'互動教材').replace(/['"\\`]/g,'');
  return `繳交到 Google 試算表：設定區寫 const GAS_URL = '';（老師之後填入）與 const GAME_NAME = '${game}';。用 fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(資料)}) 送出（no-cors 讀不到回應是正常的，可避免跨網域錯誤），body 的 JSON 欄位名稱一律用中文且固定為：${f.join('、')}。送出時按鈕顯示「送出中…」並停用，fetch 完成就顯示「✅ 已送出」（不要因為讀不到回應而判定失敗）；只有 fetch 拋出錯誤（例如網路斷線）時才顯示「送出失敗，請檢查網路後重送」並恢復按鈕。GAS_URL 是空字串時，不顯示送出按鈕，改顯示「請截圖這個畫面繳交」。`;
}

/* ========== 3. 複雜度估算（決定是否分段、是否提醒減量） ========== */
const FORM_W = {quiz:1,match:2,drag:3,flip:2,sort:2,scenario:2,map:3,battle:4,role:3,multi:3,dilemma:3};
const MECH_W = {timer:1,lives:1,levels:2,random:1,hint:1,leaderboard:3,keywords:1};
function complexity(a){
  let s = FORM_W[a.form]||0;
  (a.mech||[]).forEach(m=>s+=MECH_W[m]||0);
  if(a.submit==='sheet') s+=2;
  if(a.identity&&a.identity!=='none') s+=1;
  if(a.scoring==='speed') s+=1;
  const c = +a.count||0; if(c>=15) s+=1; if(c>=20) s+=1;
  const level = s<=4?'簡單':s<=7?'中等':'複雜';
  const free = a.plan!=='paid';
  let advice='', warn=false;
  if(!a.plan) advice='選擇 AI 方案後會給出建議。';
  else if(free){
    if(s>7) advice='功能較多，AI 生成時間會比較長；如果程式碼中途斷掉，輸入「繼續」也接不上時，改用分段版。';
    else advice='可以一次生成完整網頁；萬一中途斷掉，再改用分段版。';
  } else {
    if(s>9) advice='功能很多，可以一次生成；如果結果有地方不對，用「修改用指令」逐項修正。';
    else advice='可以一次生成完整網頁。';
  }
  return {score:s, level, advice, warn, split: free};
}

/* ========== 4. 狀態與存檔 ========== */
const STORE='tig_wizard_v1';
const fresh=()=>({answers:{mech:[]},current:0,visited:{},startedAt:null,finishedAt:null});
let state=fresh();
try{ const s=JSON.parse(localStorage.getItem(STORE)); if(s&&s.answers) state=Object.assign(fresh(),s); }catch(e){}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){} }

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visibleQs=step=>step.questions.filter(q=>!q.showIf||q.showIf(state.answers));
function answered(q){
  const v=state.answers[q.key];
  if(q.type==='multi') return true;
  if(q.type==='text'||q.type==='textarea') return !!(v&&String(v).trim());
  return v!=null&&v!=='';
}
const missing=i=>visibleQs(STEPS[i]).filter(q=>q.required&&!answered(q)).map(q=>q.label);
const stepOk=i=>missing(i).length===0;
const allOk=()=>STEPS.every((_,i)=>stepOk(i));
const optLabel=(q,v)=>{ const o=(q.options||[]).find(o=>o.v===v); return o?o.label:v; };

const visibleOpts=q=>(q.options||[]).filter(o=>!o.showIf||o.showIf(state.answers));
/* 換了互動形式等選擇後，自動清掉已經不適用的選項 */
function pruneAnswers(){
  const a=state.answers;
  STEPS.forEach(st=>st.questions.forEach(q=>{
    if(!q.options||a[q.key]==null) return;
    const ok=new Set(visibleOpts(q).map(o=>o.v));
    if(q.type==='multi') a[q.key]=(a[q.key]||[]).filter(x=>ok.has(x));
    else if(!ok.has(a[q.key])) delete a[q.key];
  }));
}
function setAnswer(k,v){ if(!state.startedAt) state.startedAt=Date.now(); state.answers[k]=v; pruneAnswers(); save(); }
function goTo(i){
  state.visited[state.current]=true;
  state.current=i;
  if(i===STEPS.length && allOk() && !state.finishedAt) state.finishedAt=Date.now();
  save(); renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ========== 5. 畫面 ========== */
function renderRail(){
  const items=STEPS.map((s,i)=>{
    const done=state.visited[i]&&stepOk(i);
    return `<button class="railbtn ${i===state.current?'cur':''} ${done?'done':''}" data-go="${i}">
      <span class="num">${done&&i!==state.current?'✓':i+1}</span><span>${s.title}</span></button>`;
  }).join('');
  const fin=STEPS.length;
  $('#rail').innerHTML=items+`<button class="railbtn ${state.current===fin?'cur':''} ${allOk()?'done':''}" data-go="${fin}">
    <span class="num">★</span><span>完成</span></button>`;
  const cur=$('#rail .cur'); if(cur&&cur.scrollIntoView&&window.innerWidth<=1180) cur.scrollIntoView({inline:'center',block:'nearest'});
  const done=STEPS.filter((_,i)=>state.visited[i]&&stepOk(i)).length;
  $('#bar').style.width=(done/STEPS.length*100)+'%';
}

function renderQ(q){
  const v=state.answers[q.key];
  const ph=typeof q.placeholder==='function'?q.placeholder(state.answers):(q.placeholder||'');
  const note=typeof q.note==='function'?q.note(state.answers):q.note;
  const tags=(q.required?'<span class="tag req">必填</span>':'')+(q.type==='multi'?'<span class="tag multi">可複選</span>':'');
  let body='';
  if(q.type==='single'||q.type==='multi'){
    const btn=o=>{
      const on=q.type==='multi'?(v||[]).includes(o.v):v===o.v;
      return `<button class="opt ${on?'on':''}" data-key="${q.key}" data-v="${esc(o.v)}" data-multi="${q.type==='multi'?1:0}" aria-pressed="${on}">
        ${o.icon?`<span class="oi">${o.icon}</span>`:''}
        <span class="ot"><b>${esc(o.label)}${o.badge?`<span class="badge">${o.badge}</span>`:''}</b>${o.desc?`<small>${esc(o.desc)}</small>`:''}</span></button>`;
    };

    body=groups.map(g=>(g?`<div class="ogroup">${esc(g)}</div>`:'')+`<div class="opts ${q.compact?'compact':''}">`+opts.filter(o=>(o.group||'')===g).map(btn).join('')+`</div>`).join('');

/* 貼回組裝：去掉 ``` 程式碼框，合併分段結果 */
function stripFence(t){
  t=(t||'').trim();
  const m=t.match(/```[a-zA-Z]*\s*\n([\s\S]*?)```/);
  if(m) t=m[1].trim();
  return t.replace(/^<script[^>]*>/i,'').replace(/<\/script>\s*$/i,'').trim();
}
function stripHtmlFence(t){
  t=(t||'').trim();
  const m=t.match(/```[a-zA-Z]*\s*\n([\s\S]*?)```/);
  return (m?m[1]:t).trim();
}
function assemble(mode,vals){
  if(mode==='full'){
    const h=stripHtmlFence(vals[0]);
    if(!/<html|<!doctype/i.test(h)) return {err:'看起來不是完整的網頁程式碼，請確認貼上的是 AI 給的整段程式碼。'};
    return {html:h};
  }
  let h=stripHtmlFence(vals[0]);
  if(!/<html|<!doctype/i.test(h)) return {err:'第 1 段看起來不是完整的網頁程式碼。'};
  if(!h.includes(MARK2)) return {err:`第 1 段裡找不到 ${MARK2}，請請 AI 重新輸出第 1 部分並保留這行註解。`};
  if(!vals[1]||!vals[1].trim()) return {err:'第 2 段還沒貼上。'};
  h=h.replace(MARK2,()=>stripFence(vals[1]));
  if(vals.length>2){
    if(!vals[2]||!vals[2].trim()) return {err:'第 3 段還沒貼上。'};
    if(!h.includes(MARK3)) return {err:`第 1 段裡找不到 ${MARK3}。`};
    h=h.replace(MARK3,()=>stripFence(vals[2]));
  }
  return {html:h};
}

function checkGasUrl(u){

  if(/docs\.google\.com\/spreadsheets/.test(u)) return {ok:false,msg:'這是試算表的網址。請到 Apps Script 的「部署」完成畫面，複製「網頁應用程式」下方的網址。'};
  if(/script\.google\.com\/(home|d\/)/.test(u)) return {ok:false,msg:'這是程式編輯頁的網址。請按「部署」→「管理部署作業」，複製「網頁應用程式」的網址。'};
  if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\//.test(u)) return {ok:false,msg:'網址格式不對：開頭應該是 https://script.google.com/macros/s/'};
  if(/\/dev(\?|$)/.test(u)) return {ok:false,msg:'這是測試用網址（結尾 /dev），學生用不了。請改複製結尾是 /exec 的網址。'};
  if(!/\/exec(\?|$)/.test(u)) return {ok:false,msg:'網址結尾應該是 /exec，請確認整段都有複製到。'};
  if(/\/a\/[^/]+\/macros/.test(u)) return {ok:true,warn:true,msg:'⚠️ 格式正確，但這是學校（組織）帳號的網址，學生可能會被擋。建議改用個人 Gmail 重做；也可以先按「測試連線」看看。'};

/* 下載時把網址自動填進網頁的 GAS_URL */
function injectGas(html){
  const a=state.answers;
  if(a.submit!=='sheet') return {html,note:''};
  const c=checkGasUrl(state.gasUrl);
  if(!c.ok) return {html,note:'ℹ️ 還沒有填入試算表網址，學生會先用截圖繳交。'};
  const re=/\b(const|let|var)\s+GAS_URL\s*=\s*(['"`])[^'"`\n]*\2/;
  if(!re.test(html)) return {html,note:'⚠️ 網頁裡找不到 GAS_URL 設定，試算表網址沒有填進去。請用「修改用指令」請 AI 加上 const GAS_URL = \'\';'};
  const u=state.gasUrl.trim().replace(/'/g,'');
  return {html:html.replace(re,(m0,kw)=>`${kw} GAS_URL = '${u}'`),note:'🔗 已自動填入試算表網址。'};
}

/* ========== 8. 可點假畫面預覽 ========== */
const MVP_FORMS=['quiz','match','drag','flip','sort','scenario','map','battle','role','multi','dilemma'];
const FORM_ICON={quiz:'❓',match:'🔗',drag:'🗂️',flip:'🃏',sort:'🔢',scenario:'🧭',map:'🗺️',battle:'⚔️',role:'🎭',multi:'🔄',dilemma:'⚖️'};
function pasteLines(a){
  if(a.source==='ai'||!a.paste) return [];
  return a.paste.split(/\n+/).map(l=>l.split(/[｜|]/).map(x=>x.trim()).filter(Boolean)).filter(p=>p.length);
}
/* 預覽用的範例處境題（實際題目由 AI 依角色設計） */
function sampleQs(who,n){
  const B=[
    [`${who}聽到這個消息，第一個感受是？`,[['很期待，覺得是新機會','你在乎改變帶來的機會'],['很擔心，怕原本的生活被打亂','你在乎生活的穩定'],['有點不服氣，覺得沒有人問過我的意見','你在乎被尊重、被聽見']]],
    ['接下來，你最可能怎麼做？',[['主動去了解，想辦法參與','你在乎掌握自己的未來'],['先觀察別人怎麼做再決定','你在乎謹慎與安全'],['找身邊的人一起表達意見','你在乎團體的力量']]],
    ['你最想對做決定的人說什麼？',[['請多想想我們一般人的生活','你在乎一般人的處境'],['請給我們一點時間準備','你在乎循序漸進'],['我支持這個決定','你在乎整體的發展']]],
    ['五年後回頭看，你覺得這件事對你……',[['好處比壞處多','你看重長遠的好處'],['壞處比好處多','你看重付出的代價'],['好壞都有','你看見事情的不同面向']]],
    ['如果可以改變一件事，你會選？',[['讓更多人一起討論','你在乎公平參與'],['放慢改變的速度','你在乎穩定'],['讓好處分給更多人','你在乎公平分配']]]];
  return B.slice(0,Math.min(Math.max(+n||3,1),5)).map(([q,o])=>({q,options:o.map(([t,why])=>({t,why}))}));
}
function mockData(a){
  const T=(a.topic||'單元').trim()||'單元', L=pasteLines(a);
  const ex='這裡會顯示一句解說';
  if(a.form==='quiz'||a.form==='battle'){
    let d=L.filter(p=>p.length>=3).slice(0,5).map(p=>({q:p[0],options:p.slice(1,5),explain:'（解說由 AI 補上）'}));
    if(!d.length) d=[1,2,3,4].map(i=>({q:`（範例）${T} 第 ${i} 題`,options:['正確答案','選項 B','選項 C','選項 D'],explain:ex}));
    return {data:d};
  }
  if(a.form==='match'){
    let d=L.filter(p=>p.length>=2).slice(0,5).map(p=>({left:p[0],right:p[1]}));
    if(!d.length) d=[1,2,3,4].map(i=>({left:`項目 ${i}`,right:`對應說明 ${i}`}));
    return {data:d};
  }
  if(a.form==='drag'){
    let d=L.filter(p=>p.length>=2).slice(0,8).map(p=>({cat:p[0],text:p[1]}));
    if(!d.length) d=[['類別 A','卡片 1'],['類別 B','卡片 2'],['類別 A','卡片 3'],['類別 B','卡片 4'],['類別 A','卡片 5'],['類別 B','卡片 6']].map(p=>({cat:p[0],text:p[1]}));
    return {data:d,cats:[...new Set(d.map(x=>x.cat))]};
  }
  if(a.form==='sort'){
    let items=L.map(p=>p[0]).slice(0,6);
    if(items.length<2) items=['第 1 步','第 2 步','第 3 步','第 4 步'];
    return {data:[{title:L.length>=2?'請排出正確的順序':`（範例）${T}：請排出正確的順序`,items:items}]};
  }
  if(a.form==='scenario'){
    let d=L.filter(p=>p.length>=2).slice(0,4).map(p=>({text:p[0],choices:p.slice(1,4).map(c=>{const m=c.split(/→|->/);return {label:m[0].trim(),result:(m[1]||'（這裡會說明這個選擇帶來的結果）').trim()};})}));
    if(!d.length) d=[
      {text:`（範例）關於「${T}」的第一個情境描述`,choices:[{label:'選擇 A',result:'選 A 帶來的結果與說明'},{label:'選擇 B',result:'選 B 帶來的結果與說明'}]},
      {text:'（範例）接下來發生的第二個情境',choices:[{label:'選擇 A',result:'結果說明'},{label:'選擇 B',result:'結果說明'},{label:'選擇 C',result:'結果說明'}]}];
    return {data:d};
  }
  const EMO=['🧑‍🌾','🧔','👩‍💼','👲','🧑‍🏫','👷'];
  const REF='（這裡會顯示 AI 依主題寫的參考觀點）';
  const nOpen=Math.min(+a.count||3,4);
  if(a.form==='role'){
    let d=L.slice(0,4).map((p,i)=>({role:p[0],emoji:EMO[i%EMO.length],intro:p[1]||'（身分介紹）',ref:p[2]||REF}));
    if(!d.length) d=['A','B','C','D'].slice(0,nOpen).map((c,i)=>({role:`角色 ${c}`,emoji:EMO[i],intro:'（一句身分介紹）',ref:REF}));
    d.forEach(r=>r.qs=sampleQs(`身為「${r.role}」，你`,a.qcount));
    return {data:d};
  }
  if(a.form==='multi'){
    let d=L.slice(0,4).map((p,i)=>({stance:p[0],emoji:EMO[i%EMO.length],ref:p[1]||REF}));
    if(!d.length) d=['A','B','C','D'].slice(0,nOpen).map((c,i)=>({stance:`立場 ${c}`,emoji:EMO[i],ref:REF}));
    return {data:d,qs:sampleQs('站在這個立場，你',a.qcount)};
  }
  if(a.form==='dilemma'){
    let d=L.filter(p=>p.length>=1).slice(0,4).map(p=>({q:p[0],a:p[1]||'選項 A',b:p[2]||'選項 B',counterA:'（給選 A 的人看的反方論點，由 AI 撰寫）',counterB:'（給選 B 的人看的反方論點，由 AI 撰寫）'}));
    if(!d.length) d=Array.from({length:Math.min(nOpen,2)},(_,i)=>({q:`（範例）關於「${T}」的第 ${i+1} 個兩難情境`,a:'選項 A',b:'選項 B',counterA:'（給選 A 的人看的反方論點）',counterB:'（給選 B 的人看的反方論點）'}));
    d.forEach(x=>{ x.reasonsA=[1,2,3].map(k=>`（支持「${x.a}」的理由 ${k}）`); x.reasonsB=[1,2,3].map(k=>`（支持「${x.b}」的理由 ${k}）`); });
    return {data:d};
  }
  if(a.form==='map'){
    const P=[[28,38],[66,30],[48,70],[78,62],[20,72]];
    let d=L.slice(0,5).map((p,i)=>({q:p[0],x:P[i][0],y:P[i][1],r:9,explain:'（正確座標在網頁完成後調整）'}));
    if(!d.length) d=['A','B','C'].map((c,i)=>({q:`（範例）請點出地點 ${c}`,x:P[i][0],y:P[i][1],r:9,explain:'綠色圈是正確位置'}));
    return {data:d};
  }
  let d=L.filter(p=>p.length>=2).slice(0,6).map(p=>({a:p[0],b:p[1]}));
  if(!d.length) d=[1,2,3,4].map(i=>({a:`名詞 ${i}`,b:`解釋 ${i}`}));
  return {data:d};
}
function deviceOf(a){
  if(a.device==='phone') return {w:390,h:720,label:'手機直向'};
  if(a.device==='pc') return {w:1100,h:680,label:'電腦'};
  return {w:1024,h:680,label:a.device==='mixed'?'混合裝置（以平板顯示）':'平板橫向'};
}
function mockHTML(a){
  const md=mockData(a);
  const C={form:a.form,mech:a.mech||[],feedback:a.feedback||(isOpen(a)?'ref':'instant'),
    identity:a.identity||'none',submit:a.submit||'none',mode:a.mode||'solo',
    scoring:a.form==='scenario'?'none':(a.scoring||(isOpen(a)?'complete':'fixed')),
    title:(a.topic||'').trim()||'我的互動教材',subtitle:`${a.subject||''}${a.grade?'・'+a.grade+' 年級':''}`||'',
    icon:FORM_ICON[a.form],data:md.data,cats:md.cats||[],
    open:isOpen(a),minlen:+a.minlen||20,mode:a.answerMode||'choice',qs:md.qs||[],
    scene:(a.scene||'').trim()||`（範例）這裡是關於「${(a.topic||'單元').trim()||'單元'}」的事件情境，學生會先讀這段文字，再開始作答。`,
    kw:typing(a)&&has(a,'keywords')?['因為','所以','我擔心','我希望','生活','工作','家人','未來']:null};
  const json=JSON.stringify(C).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'

    +json+';<\/script><script>'+$('#mockJs').textContent+'<\/script></body></html>';
}

function fitThumb(){
  const th=$('#thumb'), f=$('#pvf'); if(!th||!f) return;
  const dev=deviceOf(state.answers), W=th.clientWidth||288;
  const sc=Math.min(W/dev.w, dev.w<500?0.5:1);
  f.style.width=dev.w+'px'; f.style.height=dev.h+'px'; f.style.transform=`scale(${sc})`;
  th.style.height=Math.round(dev.h*sc)+'px';
}
function openModal(){
  const a=state.answers; if(!MVP_FORMS.includes(a.form)) return;
  $('#mtitle').textContent='雛形試玩・'+optOf('form',a.form).label+'（'+deviceOf(a).label+'）';
  $('#modal').hidden=false; document.body.style.overflow='hidden';
  $('#mf').srcdoc=mockHTML(a); fitModal();
}
function fitModal(){
  if($('#modal').hidden) return;
  const dev=deviceOf(state.answers), f=$('#mf'), box=$('#mframe');
  const sc=Math.min(1,(window.innerWidth-32)/dev.w,(window.innerHeight-110)/dev.h);
  f.style.width=dev.w+'px'; f.style.height=dev.h+'px'; f.style.transform=`scale(${sc})`;
  box.style.width=Math.round(dev.w*sc)+'px'; box.style.height=Math.round(dev.h*sc)+'px';
}
function closeModal(){ $('#modal').hidden=true; $('#mf').srcdoc=''; document.body.style.overflow=''; }
