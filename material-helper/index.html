/* ========== 9. 存檔／讀檔（規格檔，可跨電腦、可分享） ========== */
const FILE_APP='tig-wizard';
/* 網頁內的確認視窗：預覽視窗會擋掉瀏覽器內建的 confirm()，所以自己做一個 */
let askResolve=null;
function askConfirm(msg,yes){
  $('#askMsg').textContent=msg; $('#askYes').textContent=yes||'確定'; $('#ask').hidden=false; $('#askYes').focus();
  return new Promise(r=>{ askResolve=r; });
}
function askDone(v){ $('#ask').hidden=true; const r=askResolve; askResolve=null; if(r) r(v); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200); }
function saveFile(){
  const a=state.answers;
  if(!Object.keys(a).some(k=>k!=='mech'&&a[k])&&!(a.mech||[]).length){ toast('還沒有任何選擇，先點選幾步再存檔吧'); return; }
  const data={app:FILE_APP,version:1,savedAt:new Date().toISOString(),answers:a,current:state.current,visited:state.visited};
  const name=((a.topic||'').replace(/[\\/:*?"<>|]/g,'').trim()||'互動教材規格')+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const link=document.createElement('a'); link.href=url; link.download=name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('已存成「'+name+'」');
}
function sanitizeAnswers(src){
  const out={mech:[]};
  STEPS.forEach(st=>st.questions.forEach(q=>{
    const v=src[q.key]; if(v==null) return;
    if(q.type==='single'){ if(q.options.some(o=>o.v===String(v))) out[q.key]=String(v); }
    else if(q.type==='multi'){ if(Array.isArray(v)) out[q.key]=[...new Set(v.map(String))].filter(x=>q.options.some(o=>o.v===x)); }
    else out[q.key]=String(v).slice(0,8000);
  }));
  return out;
}
async function loadText(txt){
  let d; try{ d=JSON.parse(txt); }catch(e){ toast('讀不懂這個檔案，請確認是從這個工具存下的規格檔'); return; }
  if(!d||d.app!==FILE_APP||typeof d.answers!=='object'){ toast('這不是這個工具的規格檔'); return; }
  const cur=state.answers;
  const hasWork=Object.keys(cur).some(k=>k!=='mech'&&cur[k])||(cur.mech||[]).length;
  if(hasWork&&!(await askConfirm('讀檔會取代目前畫面上的選擇，確定要讀取嗎？','讀取'))) return;
  const answers=sanitizeAnswers(d.answers);
  const keepGas=state.gasUrl;
  state=Object.assign(fresh(),{answers}); if(keepGas) state.gasUrl=keepGas; pruneAnswers();
  STEPS.forEach((_,i)=>{ if(stepOk(i)) state.visited[i]=true; });
  const firstMissing=STEPS.findIndex((_,i)=>!stepOk(i));
  state.current=firstMissing<0?STEPS.length:firstMissing;
  promptTab=null; mergeVals.full=['']; mergeVals.split=['','',''];
  save(); renderAll(); window.scrollTo({top:0});
  toast(firstMissing<0?'讀取完成！規格已完整，可以直接拿指令':'讀取完成，從「'+STEPS[firstMissing].title+'」繼續');
}

/* ========== 10. 講義變題目：產生指令 → 貼回 → 勾選＋修改 → 填入 ========== */
const HANDOUT_FORMS=['quiz','match','drag','flip','sort','scenario','map','battle','role','multi'];
const HAND_MIN={quiz:3,battle:3,match:2,drag:2,flip:2,scenario:2,sort:1,map:1,role:1,multi:1};
const HAND_RULE={
  quiz:'錯誤選項要合理、像真的，但必須明確是錯的；正確答案只能有一個；每題 4 個選項。',
  battle:'錯誤選項要合理、像真的，但必須明確是錯的；正確答案只能有一個；每題 4 個選項。',
  match:'左右一對一：右邊的內容不能重複，也不能同時符合兩個左邊。',
  drag:'類別 2～4 個；同一個類別每次都要寫成一模一樣的名稱。',
  flip:'兩張卡片要明確成對，例如名詞和它的解釋。',
  sort:'挑一段講義裡有明確先後順序的內容（時間、步驟或流程），依正確順序每行列一個項目。',
  scenario:'每個情境 2～3 個選項，每個選項寫成「選項→結果」。',
  map:'只出講義裡提到、而且能在地圖上標出來的地點。',
  role:'挑出講義裡立場不同的人物或群體；參考觀點用第一人稱，寫 2～3 句。',
  multi:'挑出講義裡對同一件事看法不同的立場；參考觀點寫 2～3 句。'
};
let handOpen=false;
const handTarget=a=>{ const n=+a.count||10; return a.form==='sort'?n:Math.ceil(n*1.5); };
function handoutPrompt(a){
  const n=+a.count||10, f=(PASTE_FMT[a.form]||PASTE_FMT.quiz).fmt, unit=UNIT[a.form]||'題';
  const want=a.form==='sort'?`請列出 ${Math.min(n,8)} 個以內的項目。`:`請產生 ${handTarget(a)} 筆（我會再從中挑選 ${n} 筆）。`;
  return `請閱讀我附上的講義（檔案或照片），只根據講義裡的內容出題，不要加入講義沒有提到的知識。
用途：國小 ${a.grade||''} 年級「${(a.topic||'').trim()||'本單元'}」的互動教材，形式是「${optOf('form',a.form).label}」，單位是「${unit}」。
${want}
格式：${f}
${HAND_RULE[a.form]||''}

輸出規則：
1. 每行一筆，欄位之間用全形「｜」分隔。
2. 不要編號、不要標題、不要解說，全部放在一個程式碼區塊裡。
3. 用字適合國小 ${a.grade||''} 年級；講義裡看不清楚的地方就跳過，不要猜。`;
}
function handCheck(t,form){
  t=(t||'').trim(); if(!t) return {ok:false,msg:'空白'};
  const cols=t.split('｜').map(x=>x.trim());
  const min=HAND_MIN[form]||1;
  if(min>1&&cols.length<2) return {ok:false,msg:'缺少「｜」分隔'};
  if(cols.length<min||cols.some((c,i)=>i<min&&!c)) return {ok:false,msg:`至少要有 ${min} 個欄位`};
  if((form==='quiz'||form==='battle')&&cols.length<5) return {ok:true,warn:'選項少於 4 個'};
  return {ok:true};
}
function handParse(raw,form){
  let t=raw||''; const m=t.match(/```[a-zA-Z]*\s*\n?([\s\S]*?)```/); if(m) t=m[1];
  const seen=new Set();
  return t.split(/\r?\n/).map(l=>l.replace(/\|/g,'｜').replace(/^\s*(?:\d+\s*[\.\)、．:：]|[-*•●]|[（(]\d+[）)])\s*/,'').trim()).filter(Boolean)
    .map(l=>{ const c=handCheck(l,form), key=l.split('｜')[0]; const dup=c.ok&&seen.has(key); if(c.ok) seen.add(key); return {t:l,on:c.ok&&!dup,dup}; });
}
function handRowHTML(it,i,form){
  const c=handCheck(it.t,form); const bad=!c.ok, note=bad?c.msg:(it.dup?'和前面重複':c.warn||'');
  return `<div class="hrow ${bad?'bad':''}" data-i="${i}"><input type="checkbox" class="hchk" data-i="${i}" ${it.on&&!bad?'checked':''} ${bad?'disabled':''} aria-label="保留第 ${i+1} 筆">
    <input class="hin" data-i="${i}" value="${esc(it.t)}" spellcheck="false" aria-label="第 ${i+1} 筆內容"><span class="hnote">${esc(note)}</span></div>`;
}
function handCountHTML(){
  const a=state.answers, h=state.hand||{items:[]}, n=+a.count||10;
  const on=h.items.filter(x=>x.on&&handCheck(x.t,a.form).ok).length;
  const open=isOpen(a), goal=a.form==='sort'?'':`／目標 ${n} ${UNIT[a.form]||'筆'}`;
  let tip=''; if(!open&&a.form!=='sort'){ if(on>n) tip=`，多了 ${on-n} 筆，取消勾選不要的`; else if(on<n) tip=`，還少 ${n-on} 筆（可以手動新增，或之後由 AI 補齊）`; else tip='，剛剛好 👍'; }
  return `已勾選 <b>${on}</b> 筆${goal}${tip}`;
}
function handListHTML(){
  const a=state.answers, h=state.hand; if(!h||!h.items.length) return '';
  return `<div class="hlist"><div class="hhead"><span id="handCount">${handCountHTML()}</span>
      <span class="hbtns"><button class="ghost sm2" data-hand="all">全選</button><button class="ghost sm2" data-hand="none">全不選</button></span></div>
    ${h.items.map((it,i)=>handRowHTML(it,i,a.form)).join('')}
    <div class="btnrow"><button class="ghost" data-hand="add">＋ 新增一筆</button><button class="primary" data-hand="use">✓ 使用勾選的題目</button></div></div>`;
}
function handoutHTML(){
  const a=state.answers, h=state.hand||{raw:'',items:[]};
  return `<details class="hand" ${handOpen?'open':''}><summary>手上有講義？讓 AI 從講義出題，你再勾選要保留的題目</summary>
    <ol class="hsteps">
      <li><b>複製指令</b>，到 ChatGPT 或 Gemini 開新對話，<b>附上講義檔或用平板拍照</b>（5 頁以內），貼上指令送出。
        ${promptBox('hand','講義出題指令','',handoutPrompt(a))}</li>
      <li><b>貼上 AI 的回覆</b>（含 \`\`\` 框也沒關係），按「整理成清單」。
        <textarea class="txt" id="handRaw" placeholder="把 AI 的回覆整段貼在這裡">${esc(h.raw||'')}</textarea>
        <div class="btnrow"><button class="primary" data-hand="parse">整理成清單</button></div></li>
      <li><b>勾選要保留的題目</b>，有需要可以直接修改文字，最後按「使用勾選的題目」。<div id="handList">${handListHTML()}</div></li>
    </ol></details>`;
}
function handRefresh(){ const l=$('#handList'); if(l) l.innerHTML=handListHTML(); }
async function handAction(act){
  const a=state.answers; state.hand=state.hand||{raw:'',items:[]}; const h=state.hand;
  if(act==='parse'){
    h.raw=($('#handRaw')||{}).value||h.raw; h.items=handParse(h.raw,a.form);
    if(!h.items.length){ toast('沒有讀到任何題目，請確認有貼上 AI 的回覆'); return; }
    const bad=h.items.filter(x=>!handCheck(x.t,a.form).ok).length;
    save(); handRefresh(); toast(`整理出 ${h.items.length} 筆`+(bad?`，其中 ${bad} 筆格式不對（已標紅）`:''));
  } else if(act==='all'||act==='none'){
    h.items.forEach(x=>{ x.on=act==='all'&&handCheck(x.t,a.form).ok; }); save(); handRefresh();
  } else if(act==='add'){
    h.items.push({t:'',on:true}); save(); handRefresh();
    const ins=document.querySelectorAll('.hin'); if(ins.length) ins[ins.length-1].focus();
  } else if(act==='use'){
    const lines=h.items.filter(x=>x.on&&handCheck(x.t,a.form).ok).map(x=>x.t.trim());
    if(!lines.length){ toast('還沒有勾選任何題目'); return; }
    if((a.paste||'').trim()&&!(await askConfirm('要用勾選的題目取代目前已貼上的題目嗎？','取代'))) return;
    if(a.source==='ai') setAnswer('source','teacher');
    setAnswer('paste',lines.join('\n')); handOpen=false;
    renderAll(); toast(`已填入 ${lines.length} 筆題目`);
    const pa=document.querySelector('.txt[data-key="paste"]'); if(pa&&pa.scrollIntoView) pa.scrollIntoView({block:'center'});
  }
}

/* ========== 11. 參考網站：分析指令 → 貼回規格 → 自動點好選項 ========== */
/* AI 只能改這些「設計類」欄位；單元、題目、方案等老師自己的資料一律保留 */
const REF_KEYS=['mode','form','answerMode','mech','feedback','scoring','minlen','identity','submit','device','style','qcount'];
let refState={url:'',raw:'',result:''};
function refOptionsText(){
  const lines=[];
  STEPS.forEach(st=>st.questions.forEach(q=>{
    if(!REF_KEYS.includes(q.key)) return;
    if(q.options){
      const o=q.options.map(o=>`${o.v}=${o.label}${o.group?`（${o.group.includes('開放')?'開放題':'有標準答案'}）`:''}`).join('、');
      lines.push(`- ${q.key}（${q.label}${q.type==='multi'?'，可複選，用陣列':''}）：${o}`);
    } else if(q.key==='style') lines.push('- style（視覺風格，文字）：用 2～4 句描述配色（附色碼）、版面配置、按鈕與卡片樣式、字體感覺、動畫或音效');
  }));
  return lines.join('\n');
}
function refPrompt(){
  const a=state.answers, u=(refState.url||'').trim();
  return `請幫我分析一個「國小互動教學網頁」的設計，我想參考它的形式，用自己的單元內容重新製作。
${u?`參考網址：${u}\n（如果打不開或讀不到內容，請直接說明，並只根據我附上的截圖分析，不要用猜的。）`:'請根據我附上的截圖分析。'}
${a.topic?`我的單元：國小 ${a.grade||''} 年級${a.subject||''}「${a.topic}」\n`:''}
請判斷這個網頁的：互動形式、遊戲機制、回饋與計分方式、學生身分與繳交方式、適合的裝置、視覺風格。
從下面的選項中挑最接近的值（只能用列出的代號，沒有相符的就不要填）：
${refOptionsText()}

只參考形式與風格：不要抄錄原網站的文字、題目、圖片、角色名稱或商標。

請只輸出一個 JSON 程式碼區塊，不要其他說明，格式如下：
{"app":"tig-wizard","version":1,"answers":{"form":"…","mech":["…"],"feedback":"…","scoring":"…","identity":"…","submit":"…","device":"…","mode":"…","style":"…"},"analysis":"用 2～3 句說明你看到的玩法與判斷理由"}`;
}
function refBodyHTML(){
  return `<ol class="hsteps">
    <li><b>貼上參考網址</b>（其他老師做的互動網頁），再<b>截 1～2 張圖</b>：開始畫面、遊戲進行中的畫面最有幫助。
      <input class="txt" id="refUrl" value="${esc(refState.url)}" placeholder="https://……" inputmode="url" autocomplete="off" spellcheck="false" style="margin-top:8px">
      <p class="qnote">💡 很多網站 AI 打不開（需要登入或內容是程式動態產生的），截圖分析最穩定，請盡量附上。</p></li>
    <li><b>複製分析指令</b>，到 ChatGPT 或 Gemini 開新對話，<b>附上截圖</b>並貼上指令送出。
      <div id="refPromptBox">${promptBox('ref','網站分析指令','',refPrompt())}</div></li>
    <li><b>貼上 AI 的回覆</b>，按「讀入規格」，工具會自動幫你點好互動形式、機制、風格等選項。
      <textarea class="txt" id="refRaw" placeholder="把 AI 的回覆整段貼在這裡（含 \`\`\` 框也沒關係）">${esc(refState.raw)}</textarea>
      <div class="btnrow"><button class="primary" id="refApply">讀入規格</button></div>
      <div id="refResult">${refState.result}</div></li>
  </ol>
  <p class="hint small">✋ 你的單元、題目和 AI 方案不會被改動，只會改「怎麼玩、長什麼樣子」的選項。讀入後仍可在各步驟自由調整。<br>
  ©️ 只參考互動形式與版面風格；指令會要求 AI 不使用原網站的文字、圖片、商標與名稱。若要公開分享仿作，建議註明參考來源。</p>`;
}
function openRef(){ $('#refBody').innerHTML=refBodyHTML(); $('#refPanel').hidden=false; document.body.style.overflow='hidden'; }
function closeRef(){ $('#refPanel').hidden=true; document.body.style.overflow=''; }
function refExtract(raw){
  let t=raw||''; const m=t.match(/```[a-zA-Z]*\s*\n?([\s\S]*?)```/); if(m) t=m[1];
  const i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0||j<i) return null;
  try{ return JSON.parse(t.slice(i,j+1)); }catch(e){
    try{ return JSON.parse(t.slice(i,j+1).replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,'$1')); }catch(e2){ return null; }
  }
}
function applyRef(){
  const d=refExtract(refState.raw);
  if(!d){ refState.result='<p class="errc">讀不到規格。請確認貼上的是 AI 回覆的 JSON（以 { 開頭、} 結尾）。</p>'; $('#refResult').innerHTML=refState.result; return; }
  const src=d.answers&&typeof d.answers==='object'?d.answers:d;
  const clean=sanitizeAnswers(src), picked={};
  REF_KEYS.forEach(k=>{ if(clean[k]!=null&&!(Array.isArray(clean[k])&&!clean[k].length&&k!=='mech')) picked[k]=clean[k]; });
  if(src.mech&&Array.isArray(src.mech)) picked.mech=clean.mech||[];
  if(!picked.form){ refState.result='<p class="errc">AI 沒有判斷出互動形式，請 AI 再分析一次，或附上遊戲進行中的截圖。</p>'; $('#refResult').innerHTML=refState.result; return; }
  if(isOpen(picked)&&!picked.answerMode) picked.answerMode='choice';
  const prevForm=state.answers.form;
  Object.assign(state.answers,picked);
  if(prevForm&&prevForm!==picked.form) delete state.answers.count;
  pruneAnswers();
  if(!state.startedAt) state.startedAt=Date.now();
  STEPS.forEach((_,i)=>{ if(stepOk(i)) state.visited[i]=true; });
  const firstMissing=STEPS.findIndex((_,i)=>!stepOk(i));
  state.current=firstMissing<0?STEPS.length:firstMissing;
  promptTab=null; save(); renderAll();
  const rows=REF_KEYS.filter(k=>state.answers[k]!=null&&state.answers[k]!==''&&!(Array.isArray(state.answers[k])&&!state.answers[k].length)).map(k=>{
    const q=STEPS.flatMap(st=>st.questions).find(q=>q.key===k); const v=state.answers[k];
    const txt=q.options?(Array.isArray(v)?v.map(x=>optLabel(q,x)).join('、'):optLabel(q,v)):String(v);
    return `<li><b>${esc(q.label)}</b>：${esc(txt)}</li>`; }).join('');
  refState.result=`<div class="refok"><b>✅ 已讀入，幫你點好了這些選項：</b><ul class="list">${rows}</ul>`
    +(prevForm&&prevForm!==picked.form&&(state.answers.paste||'').trim()?`<p class="small errc">⚠️ 互動形式從「${esc(optOf('form',prevForm).label)}」改成「${esc(optOf('form',picked.form).label)}」，你原本貼的題目格式可能不合，請到「題目內容」重新檢查，或用「📄 從講義出題」重新產生。</p>`:'')
    +(d.analysis?`<p class="small"><b>AI 的分析：</b>${esc(String(d.analysis).slice(0,500))}</p>`:'')
    +`<p class="small">${firstMissing<0?'規格已完整，關閉這個視窗就能拿指令。':'關閉這個視窗後，從「'+esc(STEPS[firstMissing].title)+'」繼續完成剩下的選項。'}</p></div>`;
  $('#refResult').innerHTML=refState.result;
}

function renderAll(){ renderRail(); renderStage(); renderAside(); }

/* ========== 6. 事件 ========== */
document.addEventListener('click',e=>{
  if(e.target.id==='askYes'){ askDone(true); return; }
  if(e.target.id==='askNo'||e.target.id==='ask'){ askDone(false); return; }
  const go=e.target.closest('[data-go]'); if(go){ goTo(+go.dataset.go); return; }
  const opt=e.target.closest('.opt');
  if(opt){
    const k=opt.dataset.key, v=opt.dataset.v;
    if(opt.dataset.multi==='1'){
      const arr=[...(state.answers[k]||[])]; const at=arr.indexOf(v);
      at>=0?arr.splice(at,1):arr.push(v); setAnswer(k,arr);
    } else setAnswer(k,v);
    const y=window.scrollY; renderAll(); window.scrollTo(0,y); return;
  }
  if(e.target.closest('#thumb')||e.target.closest('[data-act="pv"]')){ openModal(); return; }
  if(e.target.id==='mClose'||e.target===$('#modal')){ closeModal(); return; }
  if(e.target.id==='mRestart'){ $('#mf').srcdoc=mockHTML(state.answers); return; }
  if(e.target.closest('#saveBtn')||e.target.closest('[data-act="save"]')){ saveFile(); return; }
  if(e.target.closest('#loadBtn')){ const f=$('#loadFile'); f.value=''; f.click(); return; }
  const gs=e.target.closest('[data-gs]');
  if(gs){ const n=GAS_SETUP.steps.length; gasStep=Math.max(0,Math.min(n-1,+gs.dataset.gs)); renderGas(); return; }
  if(e.target.id==='gasTest'){ testGas(); return; }
  if(e.target.closest('#refBtn')){ openRef(); return; }
  if(e.target.id==='refClose'||e.target===$('#refPanel')){ closeRef(); return; }
  if(e.target.id==='refApply'){ refState.raw=$('#refRaw').value; applyRef(); return; }
  const hb=e.target.closest('[data-hand]'); if(hb){ handAction(hb.dataset.hand); return; }
  const act=e.target.closest('[data-act]');
  if(act){ if(act.dataset.act==='prev'&&state.current>0) goTo(state.current-1);
           if(act.dataset.act==='next'&&stepOk(state.current)) goTo(state.current+1); return; }
  const cp=e.target.closest('[data-copy]');
  if(cp&&cp.dataset.copy==='hand'){ copyText(handoutPrompt(state.answers),cp); return; }
  if(cp&&cp.dataset.copy==='ref'){ copyText(refPrompt(),cp); return; }
  if(cp&&lastPrompts){
    const id=cp.dataset.copy;
    const txt=id==='full'?lastPrompts.full:id==='fix'?lastPrompts.fix:lastPrompts.segs[+id.slice(3)];
    copyText(txt,cp); return;
  }
  const tb=e.target.closest('[data-tab]');
  if(tb){ promptTab=tb.dataset.tab; renderStage(); return; }
  if(e.target.id==='mergeBtn'||e.target.id==='previewBtn'){
    const tab=promptTab||(lastPrompts&&lastPrompts.recommend)||'full';
    const n=tab==='full'?1:lastPrompts.segs.length;
    const r=assemble(tab,mergeVals[tab].slice(0,n));
    const msg=$('#mmsg');
    if(r.err){ msg.textContent='⚠️ '+r.err; msg.className='mmsg err'; return; }
    const g=injectGas(r.html); r.html=g.html;
    const blob=new Blob([r.html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    if(e.target.id==='previewBtn'){ window.open(url,'_blank'); if(g.note){ msg.textContent=g.note; msg.className='mmsg'; } }
    else{
      const name=((state.answers.topic||'互動教材').replace(/[\\/:*?"<>|]/g,'').trim()||'互動教材')+'.html';
      const link=document.createElement('a'); link.href=url; link.download=name; document.body.appendChild(link); link.click(); link.remove();
      msg.textContent='✅ 已下載「'+name+'」。用瀏覽器打開就能試玩；平板上請實際點一輪確認。'+(g.note?' '+g.note:''); msg.className='mmsg '+(g.note.startsWith('⚠️')?'err':'ok');
    }
    setTimeout(()=>URL.revokeObjectURL(url),60000); return;
  }
  if(e.target.id==='copySpec'){
    const txt=JSON.stringify(getSpec(),null,2);
    const done=()=>{e.target.textContent='已複製 ✓';setTimeout(()=>e.target.textContent='複製規格（JSON）',1500);};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done);
  }
  if(e.target.id==='resetBtn'){
    askConfirm('確定要清除所有選擇，重新開始嗎？','清除重來').then(ok=>{ if(!ok) return; const g=state.gasUrl; state=fresh(); if(g) state.gasUrl=g; promptTab=null; mergeVals.full=['']; mergeVals.split=['','','']; save(); renderAll(); window.scrollTo({top:0}); toast('已清除，可以重新開始'); });
  }
});
function copyText(txt,btn){
  const orig=btn.textContent;
  const done=()=>{btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent=orig,1500);};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done);
}
function fallbackCopy(t,cb){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');cb();}catch(e){} ta.remove(); }

document.addEventListener('change',e=>{
  if(e.target.matches('.hchk')){ const it=state.hand.items[+e.target.dataset.i]; it.on=e.target.checked; it.dup=false; save(); $('#handCount').innerHTML=handCountHTML(); return; }
  if(e.target.id!=='loadFile'||!e.target.files||!e.target.files[0]) return;
  const r=new FileReader(); r.onload=()=>loadText(String(r.result)); r.onerror=()=>toast('檔案讀取失敗，請再試一次'); r.readAsText(e.target.files[0],'utf-8');
});
document.addEventListener('toggle',e=>{ if(e.target.classList&&e.target.classList.contains('hand')) handOpen=e.target.open; },true);
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='gasUrl'){ state.gasUrl=el.value.trim(); save(); $('#gasMsg').innerHTML=gasMsgHTML(); $('#gasTestMsg').innerHTML=''; return; }
  if(el.id==='refUrl'){ refState.url=el.value; const b=$('#refPromptBox'); if(b) b.innerHTML=promptBox('ref','網站分析指令','',refPrompt()); return; }
  if(el.id==='refRaw'){ refState.raw=el.value; return; }
  if(el.id==='handRaw'){ state.hand=state.hand||{raw:'',items:[]}; state.hand.raw=el.value; save(); return; }
  if(el.matches('.hin')){
    const it=state.hand.items[+el.dataset.i]; it.t=el.value.replace(/\|/g,'｜');
    const c=handCheck(it.t,state.answers.form), row=el.closest('.hrow'), chk=row.querySelector('.hchk');
    row.classList.toggle('bad',!c.ok); chk.disabled=!c.ok; if(!c.ok){ chk.checked=false; it.on=false; } else if(!it.dup){ it.on=it.on||it.t.length>0; chk.checked=it.on; }
    row.querySelector('.hnote').textContent=c.ok?(c.warn||''):c.msg; $('#handCount').innerHTML=handCountHTML(); save(); return;
  }
  if(el.matches('.mtxt')){ const tab=promptTab||(lastPrompts&&lastPrompts.recommend)||'full'; mergeVals[tab][+el.dataset.m]=el.value; return; }
  if(!el.matches('.txt[data-key]')) return;
  setAnswer(el.dataset.key,el.value);
  const nav=$('#nav'); if(nav) nav.innerHTML=navHTML(state.current);
  renderAside(); renderRail();
});

/* 計時：驗收用（目標 10 分鐘內完成） */
setInterval(()=>{
  const t=$('#timer'); if(!state.startedAt){ t.textContent='⏱ 00:00'; t.classList.remove('over'); return; }
  const ms=(state.finishedAt||Date.now())-state.startedAt, sec=Math.floor(ms/1000);
  t.textContent='⏱ '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  t.classList.toggle('over',sec>600&&!state.finishedAt);
},1000);

renderAll();
</script>
</body>
