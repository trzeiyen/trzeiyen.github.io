<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>時光社會島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 明亮、童趣、像暑假的海邊，給五六年級學生的探險入口
   IDEA: 一座漂在藍海上的時光小島，繞著地球儀廣場一圈，從史前走到現代
   PICTURE: 全螢幕 3D 小島，每個時代一棟建築，點建築跳出作品卡片
   COLOUR and TYPE: 海藍主色、草綠島、珊瑚紅點綴；Noto Sans TC 900 標題
   LAYOUT: 左上島名、建築上浮動名牌、底部可橫滑的快速前往列與下拉卡片 */
:root{color-scheme:light;--ink:#16324a;--coral:#ef476f;--sun:#ffd166;--card:#fffdf7}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none}
body{font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(#5cc8f5 0%,#9fdcf8 45%,#cdeefc 70%,#cdeefc 100%);-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
header{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none}
header h1{margin:0;font-weight:900;font-size:clamp(30px,5vw,48px);line-height:1.05;color:#fff;
  text-shadow:0 3px 0 #1689b8,0 6px 18px rgba(10,70,110,.35);letter-spacing:.04em}
header p{margin:6px 0 0;font-weight:700;font-size:15px;color:#0d4a6b;background:rgba(255,255,255,.75);display:inline-block;padding:3px 12px;border-radius:99px}
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;font:inherit;font-weight:900;font-size:14px;color:var(--ink);
  background:#fff;padding:5px 12px 5px 8px;border-radius:99px;box-shadow:0 3px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,40,80,.18);
  white-space:nowrap;display:flex;gap:7px;align-items:center;min-height:36px;transition:opacity .2s}
.tag i{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tag small{font-size:13px;font-weight:700;color:#5b7287}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.tag:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.nav{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:4px 12px 6px;
  scrollbar-width:none;touch-action:pan-x;justify-content:safe center}
.nav::-webkit-scrollbar{display:none}
.nav button,.close,.go{font:inherit;font-weight:700;border:0;cursor:pointer;min-height:44px;border-radius:14px}
.nav button{flex:none;background:rgba(255,255,255,.92);color:var(--ink);padding:8px 14px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;gap:7px;align-items:center}
.nav button i{width:11px;height:11px;border-radius:50%}
.nav button:active{transform:translateY(2px);box-shadow:none}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));font-size:13px;font-weight:700;
  color:#0d4a6b;background:rgba(255,255,255,.7);padding:6px 12px;border-radius:99px;max-width:46vw;text-align:center}
.credit{position:fixed;right:12px;bottom:max(66px,calc(env(safe-area-inset-bottom) + 60px));font-size:13px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,50,80,.6);pointer-events:none}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:78vh;transform:translate(-50%,105%);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.15);background:var(--card);border-radius:26px 26px 0 0;
  box-shadow:0 -10px 40px rgba(0,40,80,.28);display:flex;flex-direction:column;z-index:5}
.sheet.open{transform:translate(-50%,0)}
.sheet .top{padding:18px 64px 14px 20px;border-radius:26px 26px 0 0;color:#fff;position:relative}
.sheet h2{margin:0;font-size:28px;font-weight:900;line-height:1.1}
.sheet .who{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.28);padding:2px 10px;border-radius:99px}
.sheet .intro{margin:8px 0 0;font-size:16px;font-weight:500;opacity:.95}
.close{position:absolute;right:12px;top:12px;width:44px;background:rgba(255,255,255,.3);color:#fff;font-size:22px;line-height:1}
.list{overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;touch-action:pan-y}
.item{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 4px 14px rgba(0,40,80,.08);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.item h3{margin:0;font-size:17px;font-weight:900;line-height:1.3}
.item .g{font-size:13px;font-weight:700;color:#0d6b94}
.item p{margin:2px 0 0;font-size:15px;color:#3b5266;grid-column:1}
.go{grid-row:1/span 3;grid-column:2;background:var(--sun);color:var(--ink);padding:10px 16px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;box-shadow:0 3px 0 #e0a92e}
.go.soft{background:#e8f4fb;box-shadow:0 3px 0 #c5dfee}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 6px rgba(0,60,100,.4);pointer-events:none;transition:opacity .5s}
header .vis{display:block;width:max-content;margin-top:6px;background:#7a4a2a;color:#fff3d6;font-size:14px}
.bubble{position:absolute;left:0;top:0;max-width:min(240px,70vw);background:#fff;color:var(--ink);font-weight:700;font-size:15px;line-height:1.45;
  padding:8px 12px;border-radius:16px;box-shadow:0 4px 14px rgba(0,40,80,.22);pointer-events:none;opacity:0;transition:opacity .25s;white-space:normal}
.bubble b{display:block;font-size:13px;color:#0d6b94}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.on{opacity:1}
.msg{background:#fff4ec;border:2px solid #f6c3ae;border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.msg h3{margin:0;font-size:17px;font-weight:900}
.msg .note{margin:0;font-size:13px;color:#8a4b37}
.msg input:not([type=radio]),.msg textarea{font:inherit;font-size:16px;width:100%;border:2px solid #f0d2c4;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);resize:vertical}
.msg input:focus,.msg textarea:focus{outline:3px solid #e76f51;outline-offset:1px}
.roles{display:flex;gap:8px;flex-wrap:wrap}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles span{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:99px;background:#fff;border:2px solid #f0d2c4;font-weight:700;font-size:15px;cursor:pointer}
.roles input:checked+span{background:#e76f51;border-color:#e76f51;color:#fff}
.roles input:focus-visible+span{outline:3px solid var(--ink)}
.msg .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msg .row span{font-size:14px;font-weight:700;color:#8a4b37}
.msg .go{grid-row:auto;grid-column:auto;min-height:44px}
@media(min-width:820px) and (orientation:landscape){
  .sheet{left:auto;right:16px;top:16px;bottom:16px;width:400px;max-height:none;border-radius:26px;transform:translateX(calc(100% + 40px))}
  .sheet.open{transform:none}.sheet .top{border-radius:26px 26px 0 0}.list{padding-bottom:18px}}
@media(max-width:819px),(orientation:portrait){.sheet{max-height:62vh}}
@media(max-width:600px){.hint{display:none}.nav button{padding:8px 12px;font-size:14px}.tag{font-size:13px;min-height:32px;padding:4px 10px 4px 7px}.tag small{display:none}}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>

<canvas id="c" aria-label="3D 小島，可拖曳旋轉"></canvas>
<div class="loading" id="loading">小島浮出海面中…</div>
<header><h1>時光社會島</h1><p>Zeiyen 老師的社會科學習島</p><p class="vis" id="vis" hidden></p></header>

<nav class="nav" id="nav" aria-label="快速前往"></nav>
<div class="labels" id="bubbles"></div>
<div class="credit">Zeiyen老師製作</div>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="top" id="sheetTop">
    <button class="close" id="closeBtn" aria-label="關閉">×</button>

    <p class="intro" id="sIntro"></p>
  </div>
  <div class="list" id="sList"></div>
</section>

  if(j.ok){lastSent=Date.now();document.getElementById('msgText').value='';st.textContent='收到了！謝謝你的留言～';sayHost('收到你的留言了，謝謝你！')}
  else st.textContent=j.why||'留言沒有送出，再試一次看看。'}catch(err){st.textContent='網路好像不太穩，等一下再試試。'}});
const closeSheet=()=>sheet.classList.remove('open');
document.getElementById('closeBtn').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* 點擊 3D 建築 */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
function pick(e){ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
 const h=ray.intersectObjects(clickables,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.zone&&o.userData.npc==null)o=o.parent;if(!o)return null;return o.userData.npc!=null?'npc:'+o.userData.npc:o.userData.zone}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});
canvas.addEventListener('pointerup',e=>{if(!down)return;
 if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<600){const id=pick(e);if(id&&id.startsWith('npc:'))say(+id.slice(4));else id?openZone(id):closeSheet()}down=null});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!down)canvas.style.cursor=pick(e)?'pointer':'grab'});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?58:40;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const v=new THREE.Vector3(),clock=new THREE.Clock(),ease=x=>1-Math.pow(1-x,3);
function frame(){const t=reduce?0:clock.getElapsedTime();
 const p=seaGeo.attributes.position.array;
 for(let i=0;i<p.length;i+=3){const x=seaBase[i],z=seaBase[i+2];p[i+1]=Math.sin(x*.16+t*1.1)*.28+Math.cos(z*.19+t*.9)*.22-.35}
 seaGeo.attributes.position.needsUpdate=true;
 anim.forEach(f=>f(t));
 const ba=-t*.09+.9;boat.position.set(Math.cos(ba)*29,Math.sin(t*1.6)*.15-.2,Math.sin(ba)*29);boat.rotation.y=-ba;boat.rotation.z=Math.sin(t*1.3)*.05;
 clouds.forEach(c=>{const a=c.userData.a+t*.008;c.position.x=Math.cos(a)*c.userData.r;c.position.z=Math.sin(a)*c.userData.r});
 if(tween){const q=Math.min(1,(performance.now()-tween.t0)/900),e=ease(q);
  camera.position.lerpVectors(tween.fromP,tween.toP,e);controls.target.lerpVectors(tween.fromT,tween.toT,e);if(q>=1)tween=null}
 controls.update();renderer.render(scene,camera);
 const shown=[];
 tags.map((o,i)=>{v.copy(anchorOf(o.z));v.y+=Math.sin(t*2+i)*.15;v.project(camera);
   return {...o,x:(v.x*.5+.5)*innerWidth,y:(-v.y*.5+.5)*innerHeight,d:v.z,ok:v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05}})
  .sort((p,q)=>p.d-q.d).forEach(o=>{const w=o.el.offsetWidth+6,h=o.el.offsetHeight+6;
   let vis=o.ok&&!shown.some(s=>Math.abs(s.x-o.x)<(s.w+w)/2&&Math.abs(s.y-o.y)<(s.h+h)/2);
   if(vis)shown.push({x:o.x,y:o.y,w,h});
   o.el.style.opacity=vis?1:0;o.el.style.pointerEvents=vis?'auto':'none';
   o.el.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,-130%)`});
 const now=performance.now();
 npcs.forEach((o,i)=>{const talking=now<o.until;if(!talking&&!reduce)o.a+=o.n.dir*o.n.sp*.016;
  const r=8+(i%2?.35:-.35),x=Math.cos(o.a)*r,z=Math.sin(o.a)*r;o.g.position.set(x,G+(talking?0:Math.abs(Math.sin(t*8+i))*.06),z);
  if(talking)o.g.lookAt(camera.position.x,G,camera.position.z);else o.g.rotation.set(0,Math.atan2(-Math.sin(o.a)*o.n.dir,Math.cos(o.a)*o.n.dir),0);
  o.legs.forEach((l,k)=>l.rotation.x=talking?0:Math.sin(t*8+k*Math.PI)*.5);
  v.set(x,G+(o.n.cat?2:3),z).project(camera);
  const vis=talking&&v.z<1&&Math.abs(v.x)<1&&Math.abs(v.y)<1;o.el.classList.toggle('on',vis);
  o.el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-110%)`});
 {yan.getWorldPosition(v);v.y+=4;v.project(camera);
  const vis=now<hostUntil&&v.z<1&&Math.abs(v.x)<1&&Math.abs(v.y)<1;hostBub.classList.toggle('on',vis);
  hostBub.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-110%)`}
 if(now>nextAuto&&!sheet.classList.contains('open')){nextAuto=now+9000;
  const seen=npcs.map((o,i)=>{v.copy(o.g.position).project(camera);return v.z<1&&Math.abs(v.x)<.8&&Math.abs(v.y)<.8?i:-1}).filter(i=>i>=0);
  if(seen.length)say(seen[(Math.random()*seen.length)|0])}
 requestAnimationFrame(frame)}
frame();
document.getElementById('loading').style.opacity=0;
</script>
