<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嫣嫣老師・課堂互動工具</title>
<style>
:root{
  --cream:#fbf5ea;--brown:#67402b;--hair:#9a6339;--ink:#4a3124;
  --skin:#f6d5b6;--shirt:#f2e4cf;--pants:#a56d3f;--green:#73806a;
  --red:#b95c50;--gold:#d79a33;--border:#dfd4c7;--muted:#766d65;
}
*{box-sizing:border-box}
body{
  margin:0;padding:24px;background:#fffaf4;color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
button{font:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto}
.stage{
  background:linear-gradient(135deg,var(--cream),#fffaf4);
  border:1px solid var(--border);border-radius:24px;overflow:hidden;padding:20px;
}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.muted{font-size:14px;color:var(--muted)}
.mode{font-size:19px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:44px;border-radius:999px;padding:9px 16px;border:1px solid var(--border);
  background:white;color:var(--ink);font-weight:700
}
.btn.primary{background:#eadfcb}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.board{
  background:#4e5c50;color:white;border:9px solid #9a693e;border-radius:18px;
  box-shadow:inset 0 0 0 2px #3d493f;min-height:310px;padding:26px;
  display:flex;flex-direction:column;justify-content:space-between
}
.board-label{font-size:14px;opacity:.8;margin-bottom:8px}
.board-title{font-size:clamp(30px,4vw,52px);font-weight:900;line-height:1.2}
.board-sub{font-size:clamp(18px,2vw,25px);margin-top:12px;opacity:.92;line-height:1.45}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;margin-top:26px}
.score-caption{font-size:14px;opacity:.78}
.score{font-size:clamp(48px,7vw,78px);font-weight:900;line-height:1}
.log{text-align:right;font-size:14px;line-height:1.8;opacity:.9}
.character-panel{min-width:0}
.avatar-wrap{position:relative;transition:transform .5s ease;padding-top:14px}
.avatar-wrap.to-board{transform:translateX(30px)}
.bubble{
  background:white;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;
  max-width:245px;font-weight:700;margin:0 auto 7px;position:relative
}
.bubble:after{
  content:"";position:absolute;left:22px;bottom:-12px;border:10px solid transparent;
  border-top-color:var(--ink);border-bottom:0
}
.teacher{
  width:200px;height:295px;position:relative;margin:auto;cursor:pointer;user-select:none;
  filter:drop-shadow(0 7px 0 rgba(86,57,39,.09));transition:transform .25s
}
.teacher *{box-sizing:border-box}
.bun{position:absolute;width:52px;height:52px;border-radius:50%;background:var(--hair);border:5px solid var(--ink);left:111px;top:4px}
.hair{position:absolute;width:132px;height:116px;border-radius:55% 55% 48% 48%;background:var(--hair);border:5px solid var(--ink);left:34px;top:28px}
.face{position:absolute;width:102px;height:96px;border-radius:48% 48% 50% 50%;background:var(--skin);border:4px solid var(--ink);left:49px;top:52px;z-index:3;transition:.2s}
.bang1,.bang2{position:absolute;background:var(--hair);z-index:5;border-bottom:3px solid var(--ink)}
.bang1{width:60px;height:31px;left:48px;top:49px;border-radius:70% 30% 60% 20%;transform:rotate(-7deg)}
.bang2{width:48px;height:27px;left:98px;top:52px;border-radius:35% 70% 25% 60%;transform:rotate(8deg)}
.eye{position:absolute;width:9px;height:14px;border-radius:50%;background:var(--ink);top:98px;z-index:7;transition:.2s}
.eye.l{left:73px}.eye.r{left:116px}
.brow{position:absolute;width:16px;height:3px;background:var(--ink);border-radius:99px;top:89px;z-index:7;transition:.2s}
.brow.l{left:67px}.brow.r{left:112px}
.blush{position:absolute;width:18px;height:8px;border-radius:50%;background:#eda894;top:118px;z-index:6;opacity:.45}
.blush.l{left:59px}.blush.r{left:121px}
.mouth{position:absolute;left:88px;top:120px;width:24px;height:13px;border:4px solid var(--ink);border-top:0;border-radius:0 0 20px 20px;z-index:7;background:#ef9a88;transition:.2s}
.tear{display:none;position:absolute;width:8px;height:18px;background:#8ec6e8;border-radius:50% 50% 60% 60%;top:111px;z-index:8}
.tear.l{left:68px}.tear.r{left:124px}
.torso{position:absolute;width:106px;height:102px;background:var(--shirt);border:5px solid var(--ink);border-radius:28px 28px 20px 20px;left:47px;top:149px;z-index:2}
.arm{position:absolute;width:30px;height:78px;background:var(--shirt);border:5px solid var(--ink);border-radius:16px;top:158px;z-index:4;transform-origin:top center;transition:.25s}
.arm.l{left:31px}.arm.r{right:31px}
.hand{position:absolute;width:24px;height:24px;background:var(--skin);border:4px solid var(--ink);border-radius:50%;z-index:6;transition:.25s}
.hand.l{left:29px;top:221px}.hand.r{right:29px;top:221px}
.pants{position:absolute;width:88px;height:53px;background:var(--pants);border:5px solid var(--ink);border-radius:14px;left:56px;top:230px;z-index:1}
.leg{position:absolute;width:31px;height:46px;background:var(--pants);border:5px solid var(--ink);border-radius:0 0 12px 12px;top:242px}
.leg.l{left:62px}.leg.r{left:107px}
.strap{position:absolute;width:7px;height:112px;background:var(--ink);left:117px;top:148px;transform:rotate(-28deg);z-index:6;border-radius:4px}
.bag{position:absolute;width:45px;height:36px;background:#c48a4f;border:4px solid var(--ink);border-radius:10px;left:129px;top:201px;transform:rotate(-7deg);z-index:7}

.lv10{transform:translateY(-10px) rotate(-2deg)}
.lv10 .eye{height:5px;border-radius:99px;top:103px}.lv10 .mouth{width:34px;height:24px;left:83px;top:113px}
.lv10 .arm.l{transform:rotate(-130deg);left:38px;top:154px}.lv10 .arm.r{transform:rotate(130deg);right:38px;top:154px}
.lv10 .hand.l{left:15px;top:142px}.lv10 .hand.r{right:15px;top:142px}
.lv9 .eye{height:5px;border-radius:99px;top:103px}.lv9 .mouth{width:28px;height:18px;left:86px}
.lv9 .arm.l{transform:rotate(-50deg);left:48px}.lv9 .arm.r{transform:rotate(50deg);right:48px}
.lv9 .hand.l{left:84px;top:194px}.lv9 .hand.r{right:84px;top:194px}
.lv8 .mouth{height:18px;width:28px;left:86px}.lv8 .arm.r{transform:rotate(135deg);right:44px;top:158px}.lv8 .hand.r{right:43px;top:146px}
.lv67 .mouth{height:17px;width:27px;left:86px}
.lv5 .mouth{height:4px;border:0;background:var(--ink);border-radius:99px;top:126px}
.lv34 .brow.l{transform:rotate(12deg)}.lv34 .brow.r{transform:rotate(-12deg)}
.lv34 .mouth{height:4px;border:0;background:var(--ink);border-radius:99px;top:126px}
.lv34 .arm.l{transform:rotate(-65deg);left:58px}.lv34 .arm.r{transform:rotate(65deg);right:58px}
.lv34 .hand.l{left:92px;top:202px}.lv34 .hand.r{right:92px;top:202px}
.lv2 .brow.l{transform:rotate(17deg)}.lv2 .brow.r{transform:rotate(-17deg)}
.lv2 .mouth{border-top:4px solid var(--ink);border-bottom:0;background:transparent;border-radius:18px 18px 0 0;top:128px}
.lv1 .face{background:#f1b3a1}.lv1 .brow.l{transform:rotate(24deg)}.lv1 .brow.r{transform:rotate(-24deg)}
.lv1 .mouth{width:31px;height:24px;left:84px;top:112px;border:4px solid var(--ink);border-radius:50%;background:#ed8e7c}.lv1 .blush{opacity:.9}
.lv0 .brow.l{transform:rotate(-15deg)}.lv0 .brow.r{transform:rotate(15deg)}
.lv0 .eye{height:5px;border-radius:99px;top:103px}
.lv0 .mouth{border-top:4px solid var(--ink);border-bottom:0;background:transparent;border-radius:18px 18px 0 0;top:129px}
.lv0 .tear{display:block}

.meter{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.tick{height:12px;border-radius:99px;background:#e5ddd2}
.tick.on.good{background:var(--green)}.tick.on.mid{background:#c58a4f}.tick.on.bad{background:var(--red)}
.mood-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px}
.mood-value{font-size:28px;font-weight:900}
.mood-name{font-weight:800}
.adjust{display:flex;gap:12px;margin-top:14px}
.adjust button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--border);background:white;font-size:24px;font-weight:900}
.adjust .plus{background:#eadfcb}
.commands{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}
.commands h3{margin:0 0 4px;font-size:18px}
.cmd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.cmd{min-height:50px;border-radius:14px;border:1px solid var(--border);background:white;padding:10px 12px;font-weight:800;color:var(--ink)}
.spark{position:absolute;font-size:31px;animation:pop .65s ease-out both;pointer-events:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25) translateY(-10px);opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){.layout{grid-template-columns:1fr}.cmd-grid{grid-template-columns:repeat(2,1fr)}.board{min-height:280px}}
@media(max-width:460px){body{padding:10px}.stage{padding:14px}.score-row{grid-template-columns:1fr}.log{text-align:left}.teacher{transform:scale(.88);transform-origin:top center;margin-bottom:-28px}}
@media(prefers-reduced-motion:reduce){.avatar-wrap,.teacher{transition:none}.spark{animation:none}}

.pass-btn{background:#fff5df;border-color:#d8b36a}
.pass-overlay{
  position:fixed;inset:0;background:rgba(44,31,23,.48);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:9999
}
.pass-overlay.open{display:flex}
.pass-dialog{
  width:min(720px,96vw);background:#fffaf4;border:3px solid var(--ink);border-radius:26px;padding:22px;
  box-shadow:0 18px 50px rgba(48,34,24,.28)
}
.pass-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.pass-head h2{margin:0;font-size:clamp(24px,4vw,38px)}
.pass-close{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:white;
  font-size:24px;line-height:1
}
.dice-area{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;margin:18px 0
}
.die-card{
  background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;text-align:center;min-width:0
}
.die-label{font-weight:800;color:var(--muted);margin-bottom:12px}
.direction-die{
  width:150px;height:150px;margin:0 auto;background:#f1dfbf;border:5px solid var(--ink);
  border-radius:22px;
  display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:var(--ink)
}
.number-die{
  width:150px;height:150px;margin:0 auto;background:#efe7da;border:5px solid var(--ink);
  border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:var(--ink)
}
.die-note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}

.direction-die.rolling,
.number-die.rolling{
  animation:diceFlip .18s ease-in-out infinite alternate;
  transform-style:preserve-3d;
}
@keyframes diceFlip{
  from{transform:rotateX(0deg) scale(.96)}
  to{transform:rotateX(180deg) scale(1.04)}
}
.roll-btn:disabled{opacity:.65;cursor:wait}

.pass-result{
  min-height:78px;border-radius:18px;background:#4e5c50;color:white;padding:16px;text-align:center;
  display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vw,38px);font-weight:900
}
.roll-btn{
  width:100%;margin-top:14px;min-height:56px;border:0;border-radius:16px;background:#d7b16c;color:#3d2a1d;
  font-size:20px;font-weight:900
}
@media(max-width:600px){
  .dice-area{grid-template-columns:1fr}
  .direction-die,.number-die{width:128px;height:128px}
}

</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <div class="topbar">
      <div>
        <div class="muted">今日課堂狀態</div>
        <div id="modeLabel" class="mode">老師模式</div>
      </div>
      <div class="actions">
        <button id="modeBtn" class="btn" type="button">切換學生模式</button>
        <button id="resetBtn" class="btn primary" type="button">重新開始</button>
      </div>
    </div>

    <div class="layout">
      <section class="board" aria-label="嫣嫣老師的黑板">
        <div>
          <div class="board-label">嫣嫣老師的黑板</div>
          <div id="boardText" class="board-title">今天一起好好上課 ♡</div>
          <div id="boardSub" class="board-sub">目前還算滿意喔～</div>
        </div>
        <div class="score-row">
          <div>
            <div class="score-caption">班級積分</div>
            <div class="score"><span id="classScore">0</span> <span style="font-size:.42em">★</span></div>
          </div>
          <div class="log">
            <div id="log1">尚未觸發獎懲</div>
            <div id="log2">一起累積好表現！</div>
          </div>
        </div>
      </section>

      <section class="character-panel">
        <div style="display:flex;justify-content:center;min-height:365px">
          <div id="avatarWrap" class="avatar-wrap">
            <div id="speech" class="bubble">點我一下＝開心＋1<br>點兩下＝生氣－1</div>
            <div id="teacher" class="teacher lv5" role="button" tabindex="0" aria-label="嫣嫣老師角色；單擊增加心情，雙擊降低心情">
              <div class="bun"></div><div class="hair"></div><div class="face"></div><div class="bang1"></div><div class="bang2"></div>
              <div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div>
              <div class="blush l"></div><div class="blush r"></div><div class="tear l"></div><div class="tear r"></div><div class="mouth"></div>
              <div class="torso"></div><div class="arm l"></div><div class="arm r"></div><div class="hand l"></div><div class="hand r"></div>
              <div class="pants"></div><div class="leg l"></div><div class="leg r"></div><div class="strap"></div><div class="bag"></div>
            </div>
          </div>
        </div>

        <div class="mood-row">
          <div><div class="muted">心情值</div><div id="moodText" class="mood-value">5 / 10</div></div>
          <div id="moodName" class="mood-name">平常 😐</div>
        </div>
        <div id="meter" class="meter" aria-label="心情值"></div>
        <div id="teacherControls" class="adjust">
          <button id="minusBtn" type="button" aria-label="心情減一">−</button>
          <button id="plusBtn" type="button" class="plus" aria-label="心情加一">＋</button>
        </div>
      </section>
    </div>

    <section class="commands">
      <h3>角色指令</h3>
      <div class="muted">按下後，嫣嫣老師會走向黑板代替妳發話。</div>
      <div class="cmd-grid">
        <button type="button" class="cmd" data-command="請安靜 🤫" data-sub="眼睛看前面，耳朵聽老師～">🤫 請安靜</button>
        <button type="button" class="cmd" data-command="開始討論 💬" data-sub="和組員交換想法吧！">💬 開始討論</button>
        <button type="button" class="cmd" data-command="準備收東西 🎒" data-sub="留下課本、習作、鉛筆盒，收拾其他東西。">🎒 收東西</button>
        <button type="button" class="cmd" data-command="時間到！ ⏰" data-sub="停筆、看前面。">⏰ 時間到</button>
        <button type="button" id="passGameBtn" class="cmd pass-btn">🎲 我該往哪傳？</button>
      </div>
    </section>
  </section>
</main>

<div id="passOverlay" class="pass-overlay" aria-hidden="true">
  <section class="pass-dialog" role="dialog" aria-modal="true" aria-labelledby="passTitle">
    <div class="pass-head">
      <div>
        <div class="muted">課堂互動小工具</div>
        <h2 id="passTitle">🎲 我該往哪傳？</h2>
      </div>
      <button id="passCloseBtn" class="pass-close" type="button" aria-label="關閉">×</button>
    </div>

    <div class="dice-area">
      <div class="die-card">
        <div class="die-label">方向骰</div>
        <div id="directionDie" class="direction-die" aria-label="方向骰結果">？</div>
        <div class="die-note">前、後、左、右各 2 個機會（共 8 個等機率）</div>
      </div>
      <div class="die-card">
        <div class="die-label">距離骰・六面骰</div>
        <div id="numberDie" class="number-die" aria-label="距離骰結果">？</div>
        <div class="die-note">1、2、3 各出現 2 次</div>
      </div>
    </div>

    <div id="passResult" class="pass-result" aria-live="polite">按下「一起擲骰」看看要往哪裡傳！</div>
    <button id="rollPassBtn" class="roll-btn" type="button">🎲 一起擲骰</button>
  </section>
</div>

<div id="announcer" class="sr-only" aria-live="polite"></div>

<script>
(() => {
  let mood = 5, score = 0, studentMode = false, clickTimer = null, commandTimer = null;
  const fired = {8:false,10:false,2:false,0:false};
  const q = s => document.querySelector(s);
  const qa = s => [...document.querySelectorAll(s)];
  const e = {
    teacher:q('#teacher'), avatar:q('#avatarWrap'), speech:q('#speech'),
    moodText:q('#moodText'), moodName:q('#moodName'), meter:q('#meter'),
    score:q('#classScore'), board:q('#boardText'), sub:q('#boardSub'),
    log1:q('#log1'), log2:q('#log2'), controls:q('#teacherControls'),
    modeBtn:q('#modeBtn'), modeLabel:q('#modeLabel'), ann:q('#announcer')
  };

  for(let i=0;i<=10;i++){ const d=document.createElement('div'); d.className='tick'; e.meter.appendChild(d); }

  function info(v){
    if(v===10) return ['超級滿意 🤩','太棒了！！','good','lv10'];
    if(v===9) return ['非常開心 😆','好開心～','good','lv9'];
    if(v===8) return ['很滿意 😄','繼續加油！','good','lv8'];
    if(v>=6) return ['開心 🙂','不錯喔！','good','lv67'];
    if(v===5) return ['平常 😐','繼續努力！','mid','lv5'];
    if(v>=3) return ['有點不滿 😑','要更專注喔！','mid','lv34'];
    if(v===2) return ['不滿 😠','再調整一下！','bad','lv2'];
    if(v===1) return ['很生氣 😡','這樣不行喔！','bad','lv1'];
    return ['極度不滿 😭','老師好難過……','bad','lv0'];
  }

  function spark(txt){
    const s=document.createElement('div');
    s.className='spark'; s.textContent=txt;
    s.style.left=(50+Math.random()*70)+'px'; s.style.top=(150+Math.random()*40)+'px';
    e.avatar.appendChild(s); setTimeout(()=>s.remove(),700);
  }

  function threshold(oldV,newV){
    let msg='';
    if(oldV<8 && newV>=8 && !fired[8]){ fired[8]=true; score+=1; msg='達到 8 分，全班 +1！'; spark('⭐ +1'); }
    if(oldV<10 && newV===10 && !fired[10]){ fired[10]=true; score+=2; msg='超級滿意！全班 +2！'; spark('✨ +2'); }
    if(oldV>2 && newV<=2 && !fired[2]){ fired[2]=true; score-=1; msg='降到 2 分，全班 −1。'; spark('−1'); }
    if(oldV>0 && newV===0 && !fired[0]){ fired[0]=true; score-=2; msg='歸零，全班 −2。'; spark('💢 −2'); }
    if(msg){ e.log2.textContent=e.log1.textContent; e.log1.textContent=msg; e.ann.textContent=msg; }
  }

  function render(){
    const [name,sub,tone,cls]=info(mood);
    e.score.textContent=score;
    e.moodText.textContent=studentMode ? '隱藏' : mood+' / 10';
    e.moodName.textContent=name;
    e.sub.textContent=sub;
    e.teacher.className='teacher '+cls;
    [...e.meter.children].forEach((x,i)=>x.className='tick'+(i<=mood?' on '+tone:''));
    e.controls.style.display=studentMode?'none':'flex';
    e.modeLabel.textContent=studentMode?'學生模式':'老師模式';
    e.modeBtn.textContent=studentMode?'切換老師模式':'切換學生模式';
  }

  function change(delta){
    const old=mood;
    mood=Math.max(0,Math.min(10,mood+delta));
    if(old===mood) return;
    threshold(old,mood);
    render();
    spark(delta>0?'♡':'💢');
  }

  e.teacher.addEventListener('click',()=>{
    clearTimeout(clickTimer);
    clickTimer=setTimeout(()=>change(1),260);
  });
  e.teacher.addEventListener('dblclick',ev=>{
    ev.preventDefault(); clearTimeout(clickTimer); change(-1);
  });
  e.teacher.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); change(1); }
    if(ev.key==='ArrowDown'){ ev.preventDefault(); change(-1); }
  });

  q('#plusBtn').addEventListener('click',()=>change(1));
  q('#minusBtn').addEventListener('click',()=>change(-1));
  e.modeBtn.addEventListener('click',()=>{ studentMode=!studentMode; render(); });

  q('#resetBtn').addEventListener('click',()=>{
    mood=5; score=0; Object.keys(fired).forEach(k=>fired[k]=false);
    e.board.textContent='今天一起好好上課 ♡';
    e.log1.textContent='尚未觸發獎懲';
    e.log2.textContent='一起累積好表現！';
    e.speech.innerHTML='點我一下＝開心＋1<br>點兩下＝生氣－1';
    render();
  });

  qa('.cmd').forEach(btn=>btn.addEventListener('click',()=>{
    clearTimeout(commandTimer);
    e.board.textContent=btn.dataset.command;
    e.sub.textContent=btn.dataset.sub;
    e.speech.textContent=btn.dataset.command;
    e.avatar.classList.add('to-board');
    e.ann.textContent=btn.dataset.command+'，'+btn.dataset.sub;
    commandTimer=setTimeout(()=>{
      e.avatar.classList.remove('to-board');
      e.speech.textContent='收到～';
      e.sub.textContent=info(mood)[1];
    },2700);
  }));


  const passBtn=q('#passGameBtn'), passOverlay=q('#passOverlay'), passClose=q('#passCloseBtn'),
        rollPass=q('#rollPassBtn'), directionDie=q('#directionDie'), numberDie=q('#numberDie'),
        passResult=q('#passResult');

  const directions=['前','前','後','後','左','左','右','右'];
  const directionIcons={前:'↑',後:'↓',左:'←',右:'→'};
  const distances=[1,1,2,2,3,3];

  function openPassGame(){
    passOverlay.classList.add('open');
    passOverlay.setAttribute('aria-hidden','false');
    passResult.textContent='按下「一起擲骰」看看要往哪裡傳！';
    directionDie.textContent='？';
    numberDie.textContent='？';
    setTimeout(()=>rollPass.focus(),0);
  }

  function closePassGame(){
    passOverlay.classList.remove('open');
    passOverlay.setAttribute('aria-hidden','true');
    passBtn.focus();
  }

  function randomItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function rollPassingDice(){
    if(rollPass.disabled) return;

    rollPass.disabled=true;
    rollPass.textContent='🎲 擲骰中…';
    directionDie.classList.add('rolling');
    numberDie.classList.add('rolling');
    passResult.textContent='骰子滾動中……';

    let ticks=0;
    const preview=setInterval(()=>{
      const d=randomItem(directions), n=randomItem(distances);
      directionDie.textContent=directionIcons[d];
      numberDie.textContent=n;
      ticks++;

      if(ticks>=12){
        clearInterval(preview);

        const finalD=randomItem(directions);
        const finalN=randomItem(distances);

        directionDie.classList.remove('rolling');
        numberDie.classList.remove('rolling');

        directionDie.textContent=directionIcons[finalD];
        directionDie.setAttribute('aria-label','方向骰結果：'+finalD);
        numberDie.textContent=finalN;
        numberDie.setAttribute('aria-label','距離骰結果：'+finalN);

        passResult.textContent='往'+finalD+'傳 '+finalN+' 位！';
        e.ann.textContent='往'+finalD+'傳 '+finalN+' 位';

        rollPass.disabled=false;
        rollPass.textContent='🎲 再擲一次';
      }
    },90);
  }

  passBtn.addEventListener('click',openPassGame);
  passClose.addEventListener('click',closePassGame);
  rollPass.addEventListener('click',rollPassingDice);
  passOverlay.addEventListener('click',ev=>{ if(ev.target===passOverlay) closePassGame(); });
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && passOverlay.classList.contains('open')) closePassGame(); });

  render();
})();
</script>
</body>
</html>
