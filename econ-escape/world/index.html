<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>經濟時光機大逃脫｜3D 時光走廊版</title>
<style>
:root{
  --bg:#0f1a24;--panel:#182836;--panel2:#20364a;--line:#2f4c63;
  --amber:#f2b544;--teal:#4fd1c5;--red:#ff6b6b;--green:#5fd38d;
  --text:#eef4f8;--muted:#9fb3c4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:radial-gradient(circle at 20% 0%,#1d3347 0%,var(--bg) 60%);min-height:100%}
#app{max-width:880px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:.2em 0 .5em}
button{font:inherit;color:inherit;border:none;cursor:pointer}
.hud{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:space-between;align-items:center;
  background:rgba(15,26,36,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:10px 12px;border-bottom:1px solid var(--line);font-size:16px}
.hud .chip{background:var(--panel2);padding:6px 10px;border-radius:999px;white-space:nowrap}
.hud .who{color:var(--amber);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.era{display:inline-block;background:var(--amber);color:#2a1c00;font-weight:800;padding:4px 12px;border-radius:999px;font-size:15px}
.story{font-size:19px;line-height:1.8;color:#dfe9f0}
.q{font-size:21px;line-height:1.6;font-weight:700;margin-bottom:14px}
.sub{color:var(--muted);font-size:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:12px 22px;
  border-radius:14px;font-size:19px;font-weight:700;background:var(--teal);color:#06302c;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);color:#2a1c00}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:16px 18px;
  font-size:19px;line-height:1.5;min-height:56px}
.opt.sel{border-color:var(--amber);background:#3a3420}
.opt.used{opacity:.35}
.opt.ok{border-color:var(--green);background:#1d3d2c}
.opt.bad{border-color:var(--red);background:#3d1f22}
.seq{display:flex;flex-direction:column;gap:8px;margin:12px 0;min-height:40px}
.seq .slot{background:#13212c;border:2px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:18px;color:var(--muted)}
.seq .slot.filled{border-style:solid;border-color:var(--teal);color:var(--text)}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--amber);color:#2a1c00;
  font-weight:800;align-items:center;justify-content:center;margin-right:8px;flex:none}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tag{display:inline-block;min-width:28px;padding:2px 8px;border-radius:8px;margin-left:6px;font-weight:800;font-size:16px;color:#111}
.sortitem{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sortitem .t{font-size:18px;margin-bottom:10px;line-height:1.5}
.sortitem.bad{border-color:var(--red)}
.binbtn{flex:1;min-height:48px;border-radius:12px;background:#13212c;border:2px solid var(--line);font-size:17px;font-weight:700}
.binbtn.on{background:var(--teal);color:#06302c;border-color:var(--teal)}
.cloze{font-size:20px;line-height:2.4;background:#13212c;border-radius:14px;padding:14px 16px}
.blank{min-width:96px;min-height:40px;padding:4px 12px;margin:0 4px;border-radius:10px;border:2px dashed var(--amber);background:#2a2a18;font-size:19px;font-weight:700;color:var(--amber);vertical-align:middle}
.blank.filled{border-style:solid;background:#3a3420;color:#fff}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip2{min-height:48px;padding:8px 18px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-size:19px;font-weight:700}
.chip2.used{opacity:.3}
.lock{display:flex;gap:12px;justify-content:center;margin:18px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel button{width:72px;height:52px;border-radius:12px;background:var(--panel2);font-size:24px}
.wheel .d{width:72px;height:84px;border-radius:14px;background:#0b141c;border:3px solid var(--amber);
  font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.hintbox{margin-top:14px;background:#2a2a18;border-left:5px solid var(--amber);border-radius:10px;padding:12px 14px;font-size:17px;line-height:1.6}
.feedback{min-height:30px;font-size:18px;font-weight:700;margin-top:12px}
.feedback.ok{color:var(--green)} .feedback.bad{color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.node{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:110px}
.node .ic{font-size:34px}
.node .nm{font-size:19px;font-weight:800;margin-top:6px}
.node .yr{color:var(--muted);font-size:15px}
.node.cur{border-color:var(--amber);animation:pulse 1.6s infinite}
.node.done{border-color:var(--green);background:#1b3427}
.node.lock{opacity:.4}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,181,68,.5)}50%{box-shadow:0 0 0 10px rgba(242,181,68,0)}}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.part{width:48px;height:48px;border-radius:12px;background:#13212c;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px}
.part.got{border:2px solid var(--amber);background:#3a3420}
input[type=text],textarea{width:100%;font-size:20px;padding:14px;border-radius:12px;border:2px solid var(--line);background:#0b141c;color:var(--text)}
textarea{min-height:120px;line-height:1.6;font-size:18px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:18px}
.big{font-size:64px;text-align:center}
.reward{text-align:center}
.reward .icon{font-size:96px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--panel2);border-radius:14px;padding:14px;text-align:center}
.stat .v{font-size:32px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:15px}
.progress{height:8px;background:#13212c;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--teal)}
.banner{background:#3d2a12;border:1px solid var(--amber);color:#ffd88a;padding:10px 14px;border-radius:12px;margin-top:10px;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .card{max-width:460px;width:100%}
.small{font-size:14px;color:var(--muted)}
svg{max-width:100%;height:auto}
@media (max-width:560px){.match{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.q{font-size:19px}}

/* ===== 3D 世界版 ===== */
html,body{overflow:hidden;height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;background:#0f1a24}
#hud{position:fixed;top:0;left:0;right:0;z-index:5}
.hud{flex-wrap:wrap}
#goal{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;
  background:rgba(15,26,36,.88);border:1px solid var(--amber);color:#ffe2a3;padding:8px 16px;border-radius:999px;
  font-size:17px;font-weight:700;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ov{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(8,14,20,.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);-webkit-user-select:text;user-select:text}
#ov.full{background:radial-gradient(circle at 20% 0%,#1d3347 0%,#0f1a24 60%)}
#ov[hidden]{display:none}
#ov #app{padding-top:calc(64px + env(safe-area-inset-top))}
#ov.full #app{padding-top:16px}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));z-index:4;
  width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:rgba(242,181,68,.85);box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .05s}
#act{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));z-index:4;
  min-width:150px;min-height:72px;padding:12px 22px;border-radius:20px;font-size:21px;font-weight:800;
  background:var(--amber);color:#2a1c00;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:pulse 1.6s infinite}
#act[hidden],#joy[hidden],#goal[hidden],#edge[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:6;background:rgba(15,26,36,.94);
  border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:18px;max-width:86vw;text-align:center;pointer-events:none;
  transition:opacity .3s;opacity:0}
#toast.on{opacity:1}
#edge{position:fixed;z-index:4;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;
  font-size:34px;line-height:44px;text-align:center;color:var(--amber);text-shadow:0 2px 6px #000}
.say{display:flex;gap:12px;align-items:flex-start;background:#13212c;border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.say .who{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.say b{display:block;color:var(--amber);margin-bottom:2px}
.say p{margin:0;font-size:18px;line-height:1.6}
.leave{background:transparent;border:2px solid var(--line);color:var(--muted);min-height:44px;padding:6px 14px;border-radius:12px;font-size:16px}
.keys{color:var(--muted);font-size:15px;margin-top:8px}
@media (max-width:700px){#goal{font-size:15px}#joy{width:128px;height:128px}#act{min-width:120px;font-size:18px}}

#hud{z-index:12}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"></div>
<div id="goal" hidden></div>
<div id="edge" hidden>➤</div>
<div id="joy" hidden><i></i></div>
<button id="act" hidden></button>
<div id="toast"></div>
<div id="ov" class="full"><div id="app"></div></div>
<div id="modal"></div>
<script src="three.min.js"></script>
<script>
/* ======================================================
   經濟時光機大逃脫｜六年級 第三單元 第1課
   戰後經濟發展如何影響人們生活？（課本 P.62–73）
   ====================================================== */
/* ===== 後台設定：貼上 Google Apps Script 網頁應用程式網址（…/exec）===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyeyYRc_S6Aq1Ya9El02PNe1_Kb1UUc_8Xg3Ivl3tHtQNOP30XRB-4lDroIm1TbA8mEiA/exec';
/* ======================================================================= */
const STORE_KEY = 'escape_econ_world_v1';
const ATTEMPT_KEY = 'escape_postwar_econ_attempts';
const COOLDOWN = 5; // 答錯後冷卻秒數
const LIMIT_MIN = 40;

const DAM_SVG = `<svg viewBox="0 0 400 180" role="img" aria-label="水庫示意圖">
<rect width="400" height="180" rx="14" fill="#13212c"/>
<path d="M0 120 L80 40 L150 95 L220 30 L300 90 L400 50 L400 180 L0 180Z" fill="#2a4a3a"/>
<path d="M0 110 Q100 95 190 108 L190 180 L0 180Z" fill="#3a86c8"/>
<path d="M190 70 L240 70 L270 180 L190 180Z" fill="#c9d2d8"/>
<rect x="196" y="78" width="40" height="6" fill="#8a97a1"/><rect x="200" y="95" width="44" height="6" fill="#8a97a1"/>
<path d="M245 150 Q300 140 400 160 L400 180 L250 180Z" fill="#3a86c8" opacity=".8"/>
<text x="16" y="28" fill="#9fb3c4" font-size="15">❓ 這是什麼設施？</text></svg>`;

const ROOMS = [
 { id:'r1', icon:'🏚️', name:'戰後的街頭', era:'民國34年（1945）', reward:{icon:'⚙️',name:'時間齒輪'},
   story:'時光機轟的一聲停下來，螢幕顯示：<b>民國34年</b>。街上的人說日本投降了，中華民國政府來接收臺灣。可是沒過多久，東西愈來愈貴、米也買不到……先弄清楚發生了什麼事，才能修好「時間齒輪」！<br>📖 請翻開課本 P.64。',
   puzzles:[
    {type:'order', q:'依照發生的先後順序，依序點選下面的事件。',
     items:['甲午戰爭，簽訂馬關條約','推翻清帝國，建立中華民國','第二次世界大戰結束，日本投降','國共內戰，中共建國'],
     hint:'臺灣被割讓給日本，是因為哪一場戰爭？日本投降之後，中國大陸又打了什麼仗？'},
    {type:'cloze', q:'修復破損的課本：點選下方詞語，填入空格。',
     text:'民國34年日本戰敗後，中華民國接收臺灣、{0}。因官員{1}及與中國共產黨作戰失利，導致當時臺灣經濟{2}，民眾生活大多困苦。',
     blanks:['澎湖','施政不當','困頓'], extra:['琉球','認真負責','繁榮'],
     hint:'課本 P.64「戰後的臺灣」第一段。'},
    {type:'mcq', q:'日本時期臺灣農業發展快速，為什麼戰後反而糧食和物資短缺？',
     opts:['中國大陸爆發國共內戰，臺灣的糧食物資被運送出去','戰後臺灣的農民都不想種田了','美國禁止臺灣種稻米','颱風把全臺灣的稻田都吹壞了'], ans:0,
     hint:'政府和中國共產黨作戰……東西被送到哪裡去了？'},
    {type:'multi', q:'戰後初期，政府遇到哪些問題？（選出<u>所有</u>正確的）',
     opts:['建築受到戰火波及','物價飛漲','糧食不足','高速公路大塞車','手機太貴買不起'], ans:[0,1,2],
     hint:'剛打完仗、東西又被運走，生活會出現什麼狀況？注意：當時還沒有高速公路和手機喔！'},
    {type:'lock', q:'🔐 時間齒輪密碼：日本戰敗、中華民國接收臺灣，是民國幾年？', code:'34',
     hint:'時光機螢幕一開始就顯示過了！'}
   ]},
 { id:'r2', icon:'🌾', name:'農村地契室', era:'民國38～42年', reward:{icon:'🌾',name:'稻穗能源棒'},
   story:'時光機飄到一片稻田旁。農夫阿土伯嘆氣：「我辛苦種的稻子，大部分都要交給地主當租金……」政府決定推動<b>土地改革</b>。地契室的保險箱裡藏著下一個零件！<br>📖 請翻開課本 P.64–65。',
   puzzles:[
    {type:'match', q:'把土地改革政策和它的做法配對起來。（先點左邊，再點右邊）',

     right:['降低農民要繳給地主的租金','政府把公有的土地放領給農民','政府徵收地主的土地，讓農民分期付款購買'],

     hint:'誰原本要「繳」租金？誰原本「收」租金？'},
    {type:'mcq', q:'「三七五減租」和「耕者有其田」都能幫助農民。哪一項讓農民真正成為土地的主人？',
     opts:['耕者有其田','三七五減租','兩項都沒有','兩項都一樣'], ans:0,
     hint:'減租之後，農民還是在「別人的土地」上耕作嗎？'},
    {type:'lock', q:'🔐 保險箱密碼：就是那個「減租政策」名稱裡的三個數字！', code:'375',
     hint:'租金最高不超過主要作物收成的 37.5%。'}
   ]},
 { id:'r3', icon:'📦', name:'美援倉庫', era:'民國40～50年代', reward:{icon:'📦',name:'美援補給箱'},
   story:'倉庫裡堆滿印著「中美合作」握手圖案的麵粉袋。隨著國際局勢變化，美國開始援助臺灣。找出<b>美援</b>怎麼改變大家的生活！<br>📖 請翻開課本 P.66。',
   puzzles:[
    {type:'mcq', q:'美國為什麼要援助臺灣？',
     opts:['基於軍事防衛的考量','因為臺灣幫美國蓋了水庫','因為臺灣借錢給美國','為了讓美國人來臺灣觀光'], ans:0,
     hint:'課本 P.66：隨著國際局勢變化，美國基於……的考量。'},
    {type:'sort', q:'美援同時提供「物資」和「資金」。把下面的項目分類。', bins:['🥫 物資援助','💰 資金援助'],
     items:[['麵粉',0],['奶粉',0],['棉花',0],['興建發電廠',1],['興建石門水庫',1]],

/* ---------- state ---------- */
let S = null;
function fresh(){return {cls:'',seat:'',start:0,end:0,room:0,pz:0,hints:0,errors:0,hintUsed:{},done:[],reflect:null,stage:'login',roomErr:{},roomHint:{},roomTime:{},roomStart:0,attempt:1,submit:''};}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY));if(v&&v.stage)return v;}catch(e){}return null;}
S = load() || fresh();
['roomErr','roomHint','roomTime'].forEach(k=>{if(!S[k])S[k]={};});
if(S.submit==='sending')S.submit='fail';

const $ = s => document.querySelector(s);
const app = () => $('#app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function elapsed(){if(!S.start)return 0;return (S.end||Date.now())-S.start;}
const totalPz = ROOMS.reduce((n,r)=>n+r.puzzles.length,0);
function progress(){
  let solved=0;S.done.forEach(i=>solved+=ROOMS[i].puzzles.length);
  const inRoom=(S.stage==='puzzle'||S.stage==='story')&&!S.done.includes(S.room);
  if(inRoom)solved+=S.pz;
  return {reached:S.done.length+(inRoom?1:0),solved};
}
function donePz(){let n=0;for(let i=0;i<S.room;i++)n+=ROOMS[i].puzzles.length;return n+(S.stage==='puzzle'||S.stage==='story'?S.pz:0);}

/* ---------- HUD ---------- */
function hud(){
  const h=$('#hud');
  if(S.stage==='login'||!S.start){h.innerHTML='';return;}
  h.className='hud';
  h.innerHTML=`<span class="chip who">${S.cls} 班 ${S.seat} 號</span>
   <span class="chip">⏱ <b id="clock">${fmt(elapsed())}</b></span>
   <span class="chip">💡 ${S.hints}</span>
   <span class="chip">❌ ${S.errors}</span>
   ${!S.end&&S.stage!=='result'?'<button class="chip" id="earlyBtn" style="background:var(--red);color:#fff;font-weight:800">📤 交卷</button>':''}`;
  const eb=$('#earlyBtn');if(eb)eb.onclick=askEarly;
}
function askEarly(){
  const pg=progress();
  modal(`<h3>📤 確定要交卷嗎？</h3>
    <div class="sub">你目前完成 <b>${pg.solved}</b> / ${totalPz} 題（${S.done.length} / ${ROOMS.length} 關）。<br>交卷後就不能繼續作答了喔！</div>
    <div class="row"><button class="btn ghost" id="no">繼續挑戰</button><button class="btn amber" id="yes">確定交卷</button></div>`);
  $('#no').onclick=closeModal;
  $('#yes').onclick=()=>{closeModal();finish('提早交卷');};
}
function finish(status){
  if(S.end&&S.stage==='result')return;
  const pg=progress();
  if((S.stage==='puzzle'||S.stage==='story')&&!S.done.includes(S.room)&&S.roomStart)
    S.roomTime[S.room]=Math.round((Date.now()-S.roomStart)/1000);
  S.reached=pg.reached;S.solved=pg.solved;S.status=status;
  if(!S.end)S.end=Date.now();
  S.stage='result';render();
}
// 老師一鍵收卷：每 30 秒問一次後台
setInterval(async()=>{
  if(!GAS_URL||!S.start||S.end||S.stage==='result'||S.stage==='login')return;
  try{
    const j=await (await fetch(GAS_URL+'?action=status&cls='+encodeURIComponent(S.cls)+'&t='+Date.now())).json();
    if(j&&j.collect&&j.collect>S.start&&!S.end){
      finish('老師收卷');
      modal(`<h3>🔔 老師收卷囉！</h3><div class="sub">你的作答進度已經自動交給老師了。</div><button class="btn amber" id="no">好</button>`);
      $('#no').onclick=closeModal;
    }
  }catch(e){}
},30000);
setInterval(()=>{const c=$('#clock');if(c)c.textContent=fmt(elapsed());
  const w=$('#warn');if(w&&!S.end&&elapsed()>30*60000)w.style.display='block';},1000);

function modal(html){$('#modal').innerHTML=`<div class="modal"><div class="card">${html}</div></div>`;}
function closeModal(){$('#modal').innerHTML='';}

function hintKey(){return S.room+'-'+S.pz;}
function puzzleShell(r,p,body){
  const used=S.hintUsed[hintKey()];
  return `
  <div class="card">
    <div class="row spread"><span class="era">${r.icon} ${r.name}</span><span class="small">謎題 ${S.pz+1} / ${r.puzzles.length}</span></div>
    <div class="progress" style="margin-top:12px"><i style="width:${(S.pz)/r.puzzles.length*100}%"></i></div>
    <div class="q" style="margin-top:14px">${p.q}</div>
    ${p.img?`<div style="margin-bottom:14px">${p.img}</div>`:''}
    <div id="body">${body}</div>
    <div class="feedback" id="fb"></div>
    <div class="row spread" style="margin-top:12px">
      <button class="btn ghost" id="hintBtn">💡 ${used?'再看提示':'提示'}</button>
      <button class="btn" id="submit" style="display:none">送出答案</button>
    </div>
    <div id="hint">${used?`<div class="hintbox">💡 ${p.hint}</div>`:''}</div>
  </div>`;
}

function renderPuzzle(){
  const r=ROOMS[S.room], p=r.puzzles[S.pz];
  clearInterval(coolTimer);
  const T={order:pOrder,mcq:pMcq,multi:pMulti,match:pMatch,sort:pSort,lock:pLock,reflect:pReflect,cloze:pCloze}[p.type];
  T(r,p);
  $('#hintBtn').onclick=()=>{
    if(!S.hintUsed[hintKey()]){
      if(p.type==='reflect'){ S.hintUsed[hintKey()]=true; } // 開放題提示不扣
      else {S.hintUsed[hintKey()]=true;S.hints++;S.roomHint[S.room]=(S.roomHint[S.room]||0)+1;}
      save();hud();
    }
    $('#hint').innerHTML=`<div class="hintbox">💡 ${p.hint}</div>`;
    $('#hintBtn').textContent='💡 再看提示';
  };
}

let coolTimer=null;
function wrong(msg){
  S.errors++;S.roomErr[S.room]=(S.roomErr[S.room]||0)+1;save();hud();
  const fb=$('#fb');fb.className='feedback bad';
  const c=$('#body');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  // 冷卻：暫時鎖住所有可按的按鈕
  const locked=[...document.querySelectorAll('#body button, #submit')].filter(b=>!b.disabled);
  locked.forEach(b=>b.disabled=true);
  const base=msg||'❌ 不對喔，再想想看！';
  let n=COOLDOWN; fb.textContent=`${base}（🔒 冷卻 ${n} 秒）`;
  clearInterval(coolTimer);
  coolTimer=setInterval(()=>{n--;
    if(n>0){fb.textContent=`${base}（🔒 冷卻 ${n} 秒）`;return;}
    clearInterval(coolTimer);fb.textContent=base;
    locked.forEach(b=>{if(document.body.contains(b))b.disabled=false;});
    document.dispatchEvent(new Event('cooldown-end'));
  },1000);
}
function right(){
  const fb=$('#fb');fb.className='feedback ok';fb.textContent='✅ 答對了！';
  document.querySelectorAll('#body button, #submit').forEach(b=>b.disabled=true);
  setTimeout(next,750);
}
function next(){
  const r=ROOMS[S.room];
  if(S.pz<r.puzzles.length-1){S.pz++;render();}
  else{S.roomTime[S.room]=S.roomStart?Math.round((Date.now()-S.roomStart)/1000):0;S.done.push(S.room);S.stage='reward';render();}
}

/* --- puzzle types --- */
function pOrder(r,p){
  const disp=shuffle(p.items.map((t,i)=>({t,i})));
  let seq=[];
  app().innerHTML=puzzleShell(r,p,`
    <div class="opts" id="pool">${disp.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join('')}</div>
    <div class="sub" style="margin-top:14px">你排的順序：</div>
    <div class="seq" id="seq"></div>
    <button class="btn ghost" id="reset">↺ 重新排</button>`);
  const sub=$('#submit');sub.style.display='';
  function draw(){
    $('#seq').innerHTML=p.items.map((_,k)=>seq[k]!==undefined
      ?`<div class="slot filled"><span class="num">${k+1}</span>${p.items[seq[k]]}</div>`
      :`<div class="slot"><span class="num" style="opacity:.4">${k+1}</span>（點上方的事件）</div>`).join('');
    document.querySelectorAll('#pool .opt').forEach(b=>{b.classList.toggle('used',seq.includes(+b.dataset.i));});
    sub.disabled=seq.length<p.items.length;
  }
  document.querySelectorAll('#pool .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!seq.includes(i)){seq.push(i);draw();}});
  $('#reset').onclick=()=>{seq=[];$('#fb').textContent='';draw();};
  sub.onclick=()=>{if(seq.every((v,k)=>v===k))right();else{wrong('❌ 順序不對，按「重新排」再試一次！');}};
  draw();
}

function pMcq(r,p){
  const disp=shuffle(p.opts.map((t,i)=>({t,i})));
  app().innerHTML=puzzleShell(r,p,`<div class="opts">${disp.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join('')}</div>`);
  document.querySelectorAll('#body .opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===p.ans){b.classList.add('ok');right();}
    else{b.classList.add('bad');b.disabled=true;wrong();}
  });
}

function pMulti(r,p){
  const disp=shuffle(p.opts.map((t,i)=>({t,i})));
  const sel=new Set();
  app().innerHTML=puzzleShell(r,p,`<div class="opts">${disp.map(o=>`<button class="opt" data-i="${o.i}">☐ ${o.t}</button>`).join('')}</div>`);
  const sub=$('#submit');sub.style.display='';sub.disabled=true;
  document.querySelectorAll('#body .opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;const t=p.opts[i];
    if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.textContent='☐ '+t;}
    else{sel.add(i);b.classList.add('sel');b.textContent='☑ '+t;}
    sub.disabled=sel.size===0;$('#fb').textContent='';
  });
  sub.onclick=()=>{
    const ok=sel.size===p.ans.length&&p.ans.every(a=>sel.has(a));
    if(ok)right();
    else{
      const missing=p.ans.filter(a=>!sel.has(a)).length, extra=[...sel].filter(a=>!p.ans.includes(a)).length;
      wrong(extra?'❌ 有選項選錯了，再檢查一次！':`❌ 還少選了 ${missing} 個喔！`);
    }
  };
}

const TAGC=['#f2b544','#4fd1c5','#ff9ad5','#9ad0ff','#b8f27a'];
function pMatch(r,p){
  const rdisp=shuffle(p.right.map((t,i)=>({t,i})));
  let pick=null; const pair={}; // left -> right
  app().innerHTML=puzzleShell(r,p,`<div class="match">
    <div class="col">${p.left.map((t,i)=>`<button class="opt" data-l="${i}">${t}</button>`).join('')}</div>
    <div class="col">${rdisp.map(o=>`<button class="opt" data-r="${o.i}">${o.t}</button>`).join('')}</div></div>`);
  const sub=$('#submit');sub.style.display='';
  function draw(){
    document.querySelectorAll('#body [data-l]').forEach(b=>{const l=+b.dataset.l;b.classList.toggle('sel',pick===l);
      b.innerHTML=p.left[l]+(pair[l]!==undefined?`<span class="tag" style="background:${TAGC[l]}">${l+1}</span>`:'');});
    document.querySelectorAll('#body [data-r]').forEach(b=>{const ri=+b.dataset.r;const l=Object.keys(pair).find(k=>pair[k]===ri);
      b.innerHTML=p.right[ri]+(l!==undefined?`<span class="tag" style="background:${TAGC[l]}">${+l+1}</span>`:'');});
    sub.disabled=Object.keys(pair).length<p.left.length;
  }
  document.querySelectorAll('#body [data-l]').forEach(b=>b.onclick=()=>{pick=+b.dataset.l;$('#fb').textContent='';draw();});
  document.querySelectorAll('#body [data-r]').forEach(b=>b.onclick=()=>{
    if(pick===null){$('#fb').className='feedback';$('#fb').textContent='👆 請先點左邊的政策';return;}
    const ri=+b.dataset.r;
    Object.keys(pair).forEach(k=>{if(pair[k]===ri)delete pair[k];});
    pair[pick]=ri;pick=null;draw();
  });
  sub.onclick=()=>{
    const bad=p.left.map((_,l)=>l).filter(l=>pair[l]!==l);
    if(!bad.length)right();
    else{bad.forEach(l=>delete pair[l]);draw();wrong(`❌ 有 ${bad.length} 組配錯了，已幫你拿掉，再配一次！`);}
  };
  draw();
}

function pSort(r,p){
  const disp=shuffle(p.items.map((it,i)=>({t:it[0],i})));
  const choice={};
  app().innerHTML=puzzleShell(r,p,disp.map(o=>`
    <div class="sortitem" data-i="${o.i}"><div class="t">${o.t}</div>
    <div class="row">${p.bins.map((b,k)=>`<button class="binbtn" data-i="${o.i}" data-k="${k}">${b}</button>`).join('')}</div></div>`).join(''));
  const sub=$('#submit');sub.style.display='';
  function draw(){
    document.querySelectorAll('.binbtn').forEach(b=>b.classList.toggle('on',choice[b.dataset.i]===+b.dataset.k));
    sub.disabled=Object.keys(choice).length<p.items.length;
  }
  document.querySelectorAll('.binbtn').forEach(b=>b.onclick=()=>{
    choice[b.dataset.i]=+b.dataset.k;
    document.querySelector(`.sortitem[data-i="${b.dataset.i}"]`).classList.remove('bad');
    $('#fb').textContent='';draw();});
  sub.onclick=()=>{
    const bad=p.items.map((_,i)=>i).filter(i=>choice[i]!==p.items[i][1]);
    if(!bad.length)right();
    else{bad.forEach(i=>{delete choice[i];document.querySelector(`.sortitem[data-i="${i}"]`).classList.add('bad');});
      draw();wrong(`❌ 有 ${bad.length} 個分錯了（紅框），再分一次！`);}
  };
  draw();
}

function pCloze(r,p){
  const words=shuffle(p.blanks.concat(p.extra||[]));
  const fill=Array(p.blanks.length).fill(null);
  const parts=p.text.split(/\{(\d+)\}/);
  const html=parts.map((t,k)=>k%2?`<button class="blank" data-b="${t}"></button>`:t).join('');
  app().innerHTML=puzzleShell(r,p,`
    <div class="cloze">${html}</div>
    <div class="sub" style="margin-top:14px">詞語庫（點一下填入；點空格可以拿掉）：</div>
    <div class="bank">${words.map(w=>`<button class="chip2" data-w="${w}">${w}</button>`).join('')}</div>`);
  const sub=$('#submit');sub.style.display='';
  function draw(){
    document.querySelectorAll('.blank').forEach(b=>{const v=fill[+b.dataset.b];b.textContent=v||'　？　';b.classList.toggle('filled',!!v);});
    document.querySelectorAll('.chip2').forEach(c=>{const used=fill.includes(c.dataset.w);c.classList.toggle('used',used);});
    sub.disabled=fill.some(v=>!v);
  }
  document.querySelectorAll('.chip2').forEach(c=>c.onclick=()=>{
    if(fill.includes(c.dataset.w))return;
    const k=fill.indexOf(null);if(k<0)return;fill[k]=c.dataset.w;$('#fb').textContent='';draw();});
  document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{fill[+b.dataset.b]=null;$('#fb').textContent='';draw();});
  sub.onclick=()=>{
    const bad=fill.map((v,k)=>v===p.blanks[k]?-1:k).filter(k=>k>=0);
    if(!bad.length)right();
    else{bad.forEach(k=>fill[k]=null);draw();wrong(`❌ 有 ${bad.length} 個空格填錯了，已幫你清掉！`);}
  };
  document.addEventListener('cooldown-end',draw,{once:true});
  draw();
}

function pLock(r,p){
  const n=p.code.length; const d=Array(n).fill(0);
  app().innerHTML=puzzleShell(r,p,`<div class="lock">${d.map((_,k)=>`
    <div class="wheel"><button data-k="${k}" data-v="1">▲</button><div class="d" id="d${k}">0</div><button data-k="${k}" data-v="-1">▼</button></div>`).join('')}</div>`);
  const sub=$('#submit');sub.style.display='';sub.textContent='🔓 開鎖';
  document.querySelectorAll('.wheel button').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;d[k]=(d[k]+ +b.dataset.v+10)%10;$('#d'+k).textContent=d[k];$('#fb').textContent='';});
  sub.onclick=()=>{if(d.join('')===p.code)right();else wrong('🔒 密碼錯誤！鎖還是打不開……');};
}

function pReflect(r,p){
  let c=null;
  app().innerHTML=puzzleShell(r,p,`
    <div class="opts">${p.choices.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join('')}</div>
    <label for="why">我的理由（至少 ${p.min} 個字）</label>
    <textarea id="why" placeholder="因為……"></textarea>
    <div class="small" id="cnt">0 字</div>`);
  const sub=$('#submit');sub.style.display='';sub.textContent='🚀 啟動時光機，回家！';
  const chk=()=>{const len=$('#why').value.trim().length;$('#cnt').textContent=len+' 字';sub.disabled=!(c!==null&&len>=p.min);};
  document.querySelectorAll('#body .opt').forEach(b=>b.onclick=()=>{c=+b.dataset.i;
    document.querySelectorAll('#body .opt').forEach(x=>x.classList.toggle('sel',x===b));chk();});
  $('#why').oninput=chk;chk();
  sub.onclick=()=>{S.reflect={choice:p.choices[c],text:$('#why').value.trim()};
    $('#fb').className='feedback ok';$('#fb').textContent='✅ 收到你的想法了！';sub.disabled=true;setTimeout(next,700);};
}

function payload(){
  const per=k=>ROOMS.map((_,i)=>S[k][i]||0).join(',');
  return {cls:S.cls,seat:S.seat,attempt:S.attempt||1,seconds:Math.round(elapsed()/1000),
    hints:S.hints,errors:S.errors,title:escaped()?title().replace(/^\S+\s/,''):'',
    status:S.status||'逃脫成功',reached:S.reached!=null?S.reached:ROOMS.length,solved:S.solved!=null?S.solved:totalPz,
    stance:S.reflect?S.reflect.choice:'',reason:S.reflect?S.reflect.text:'',
    roomErr:per('roomErr'),roomHint:per('roomHint'),roomTime:per('roomTime')};
}
function showSend(){
  const el=$('#sendStatus');if(!el)return;
  if(!GAS_URL){el.innerHTML='ℹ️ 老師還沒設定後台，請截圖給老師。';return;}
  if(S.submit==='ok'){el.innerHTML='✅ 成績已經送到老師的後台了！';return;}
  if(S.submit==='sending'){el.innerHTML='⏳ 正在把成績送給老師……';return;}
  el.innerHTML='⚠️ 成績還沒送出（可能是網路不穩）<br><button class="btn amber" id="resend" style="margin-top:8px">🔁 重新送出</button>';
  $('#resend').onclick=()=>{S.submit='';submitResult(true);};
}
function submitResult(force){
  if(!GAS_URL||S.submit==='ok'||(S.submit==='sending'&&!force)){showSend();return;}
  S.submit='sending';save();showSend();
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload())})
    .then(()=>{S.submit='ok';save();showSend();})
    .catch(()=>{S.submit='fail';save();showSend();});
}
function escaped(){return !S.status||S.status==='逃脫成功';}
function title(){
  const m=elapsed()/60000;
  if(S.hints<=3&&S.errors<=6&&m<=LIMIT_MIN)return '🏆 時光大師';
  if(S.hints<=10&&S.errors<=15)return '🥈 歷史偵探';
  return '🥉 勇敢的時光旅人';
}
function renderResult(){
  hud();
  const t=elapsed(), esc=escaped();
  app().innerHTML=`
  <div class="card" style="text-align:center">
    <div class="big">${esc?'🎉':'📤'}</div>
    <h1>${esc?'逃脫成功！':'已交卷！'}</h1>
    <div style="font-size:22px;font-weight:800;color:var(--amber)">${S.cls} 班 ${S.seat} 號</div>
    <div style="font-size:24px;margin-top:6px">${esc?title():`完成 ${S.solved} / ${totalPz} 題（${S.done.length} / ${ROOMS.length} 關）`}</div>
    <div class="stats">
      <div class="stat"><div class="v">${fmt(t)}</div><div class="k">${esc?'逃脫時間':'作答時間'}</div></div>
      <div class="stat"><div class="v">${S.hints}</div><div class="k">提示次數</div></div>
      <div class="stat"><div class="v">${S.errors}</div><div class="k">答錯次數</div></div>
    </div>
    <div class="sub">${!esc?(S.status==='老師收卷'?'🔔 下課囉，老師已經收卷。':'你提早交卷了，下次再挑戰逃脫吧！'):t<=LIMIT_MIN*60000?'✅ 在 40 分鐘內完成':'⏰ 超過 40 分鐘，但你堅持到最後了！'}</div>
    ${S.reflect?`<div class="hintbox" style="text-align:left">📝 我的想法：<b>${S.reflect.choice}</b><br>${S.reflect.text.replace(/</g,'&lt;')}</div>`:''}
    <div class="banner" id="sendStatus" style="margin-top:14px"></div>
    <div class="small" style="margin-top:10px">📸 也可以讓老師看這個畫面，或截圖上傳</div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" id="again">🔁 重新挑戰</button>
    </div>
  </div>`;
  submitResult();
  $('#again').onclick=()=>{
    modal(`<h3>確定要重新挑戰嗎？</h3><div class="sub">目前的成績會被清除。</div>
      <div class="row"><button class="btn ghost" id="no">取消</button><button class="btn amber" id="yes">確定重來</button></div>`);
    $('#no').onclick=closeModal;
    $('#yes').onclick=()=>{const c=S.cls,s=S.seat;S=fresh();S.cls=c;S.seat=s;S.stage='intro';closeModal();render();};
  };
}

      stations.push({i,j,x:p[0],z:p[1],grp,lb,top});
    });
  });

  // 目標指示器
  const marker=new T.Mesh(new T.ConeGeometry(0.3,0.6,4),new T.MeshBasicMaterial({color:0xf2b544}));marker.rotation.x=Math.PI;scene.add(marker);
  const ring=new T.Mesh(new T.RingGeometry(0.55,0.75,28),new T.MeshBasicMaterial({color:0xf2b544,transparent:true,opacity:0.7,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;scene.add(ring);

  // 玩家
  const me=makeChar({shirt:0x4fd1c5,pants:0x2c3e50,hair:0x3b2416});scene.add(me);
  const meTag=tag('你','#f2b544','#2a1c00',1.4);meTag.position.y=2.3;me.add(meTag);
  const SPAWN=[X0+4.2,0];
  me.position.set(SPAWN[0],0,SPAWN[1]);

  // ---------- 狀態同步 ----------
  function stState(st){
    if(st.i<S.room||S.done.includes(st.i)||(st.i===S.room&&st.j<S.pz))return 'done';
    if(st.i===S.room&&st.j===S.pz)return 'next';
    return 'todo';
  }
  function refresh(){
    doors.forEach((d,i)=>{const open=i<=S.room||!!S.end;
      if(open&&!d.open){d.open=true;const k=solids.indexOf(d.sol);if(k>=0)solids.splice(k,1);d.lock.visible=false;d.anim=d.anim||0.0001;}
      if(!open&&d.open){d.open=false;solids.push(d.sol);d.mesh.position.y=0.75;d.mesh.visible=true;d.lock.visible=true;d.anim=0;}
      d.sign.userData.set(`${S.done.includes(i)?'✅':open?'🚪':'🔒'} ${i+1}｜${ROOMS[i].name}`,S.done.includes(i)?'#1d3d2c':open?'#3a3420':'#1b2a38',open?'#ffe2a3':'#9fb3c4');
    });
    stations.forEach(st=>{const s=stState(st);st.lb.visible=st.i<=S.room;
      st.lb.userData.set((s==='done'?'✓ ':'')+STATIONS[st.i][st.j].n,s==='done'?'#2f6b45':s==='next'?'#f2b544':'#33454f',s==='next'?'#2a1c00':'#ffffff');});
  }
  let placed=false;
  function sync(){
    refresh();
    if(!placed)doors.forEach(d=>{if(d.open){d.anim=1;d.mesh.visible=false;}});
    if(!placed||!S.pos){
      if(S.pos&&isFinite(S.pos[0]))me.position.set(S.pos[0],0,S.pos[1]);else me.position.set(SPAWN[0],0,SPAWN[1]);
      S.pos=[me.position.x,me.position.z];placed=true;snapCam=true;
    }
  }

  // ---------- 輸入 ----------
  const keys={};
  addEventListener('keydown',e=>{if($('#ov').hidden===false||$('#modal').innerHTML)return;
    keys[e.code]=true;
    if((e.code==='KeyE'||e.code==='Enter'||e.code==='Space')&&!$('#act').hidden){e.preventDefault();$('#act').click();}});
  addEventListener('keyup',e=>{keys[e.code]=false;});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
  const joy=$('#joy'), knob=joy.querySelector('i');let jv=[0,0],jid=null;
  const jmove=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width*0.36,L=Math.hypot(dx,dy);if(L>R){dx*=R/L;dy*=R/L;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;jv=L>6?[dx/R,dy/R]:[0,0];};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}jmove(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
  const jend=e=>{if(e.pointerId!==jid)return;jid=null;jv=[0,0];knob.style.transform='';};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,jend));

  function blocked(x,z){const r=0.3;for(const s of solids){if(x+r>s.x0&&x-r<s.x1&&z+r>s.z0&&z-r<s.z1)return true;}return false;}
  function inRoom(i,x,z){const g=roomGeo(i);const zz=g.side*z;return x>g.cx-RW/2&&x<g.cx+RW/2&&zz>CH+0.5&&zz<CH+RD;}

  // ---------- 互動 ----------
  let near=null;
  function findNear(){
    const px=me.position.x,pz=me.position.z;let best=null,bd=1e9;
    stations.forEach(st=>{if(st.i>S.room)return;const d=Math.hypot(st.x-px,st.z-pz);if(d<1.9&&d<bd){bd=d;best={type:'st',st};}});
    doors.forEach((d,i)=>{if(d.open)return;const dd=Math.hypot(d.cx-px,d.z-pz);if(dd<2.2&&dd<bd){bd=dd;best={type:'door',i};}});
    if(Math.hypot(start.position.x-px,start.position.z-pz)<2.2&&!best)best={type:'start'};
    return best;
  }
  function act(){
    if(!near)return;
    if(near.type==='door'){toast(`🔒 先完成「${ROOMS[near.i-1].name}」，這扇門才會打開`);return;}
    if(near.type==='start'){toast('⚠ 時光機故障了！沿著走廊往右，闖過 9 個年代，蒐集零件修好它。');return;}
    const st=near.st, s=stState(st);
    if(s==='done'){toast('✓ 這裡已經完成了');return;}
    if(s==='todo'){toast(`👀 先去找「${STATIONS[S.room][S.pz].n}」吧！（頭上有黃色箭頭的那個）`);return;}
    openPuzzle();
  }
  $('#act').onclick=act;

  // ---------- 主迴圈 ----------
  let last=performance.now(), snapCam=true, saveT=0, uiT=0;
  const camPos=new T.Vector3(), look=new T.Vector3();
  function target(){
    if(S.end||S.stage!=='world')return null;
    const g=roomGeo(S.room);
    if(!(S.entered&&S.entered[S.room])){return [g.cx,g.side*(CH+1.2),1.2];}
    const st=stations.find(s=>s.i===S.room&&s.j===S.pz);return st?[st.x,st.z,st.top]:null;
  }
  function goalText(){
    if(S.stage!=='world'||S.end)return '';
    if(!(S.entered&&S.entered[S.room]))return `🚪 前往第 ${S.room+1} 關：${ROOMS[S.room].name}`;
    return `🔎 第 ${S.room+1} 關｜去找「${STATIONS[S.room][S.pz].n}」（${S.pz+1}/${ROOMS[S.room].puzzles.length}）`;
  }
  function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?52:42;cam.updateProjectionMatrix();}
  addEventListener('resize',resize);resize();
  const v3=new T.Vector3();
  function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden)return;
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    const canMove=S.stage==='world'&&$('#ov').hidden&&!$('#modal').innerHTML&&!S.end;
    let mx=0,mz=0;
    if(canMove){
      mx=jv[0]+((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
      mz=jv[1]+((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
      const L=Math.hypot(mx,mz);if(L>1){mx/=L;mz/=L;}
    }
    const moving=Math.hypot(mx,mz)>0.05;
    if(moving){
      const sp=4.6*dt, nx=me.position.x+mx*sp, nz=me.position.z+mz*sp;
      if(!blocked(nx,me.position.z))me.position.x=nx;
      if(!blocked(me.position.x,nz))me.position.z=nz;
      const ang=Math.atan2(mx,mz);let d=ang-me.rotation.y;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;me.rotation.y+=d*Math.min(1,dt*12);
    }
    animChar(me,moving,dt);
    // 進入房間
    if(S.stage==='world'&&!S.end&&!(S.entered&&S.entered[S.room])&&inRoom(S.room,me.position.x,me.position.z)){
      S.entered=S.entered||{};S.entered[S.room]=true;S.roomStart=Date.now();save();enterRoom(S.room);
    }
    // 門動畫
    doors.forEach(d=>{if(d.anim>0&&d.anim<1){d.anim=Math.min(1,d.anim+dt*1.5);d.mesh.position.y=0.75-d.anim*1.6;if(d.anim>=1)d.mesh.visible=false;}});
    stations.forEach(st=>{if(st.grp.userData.spin)st.grp.userData.spin.rotation.z+=dt*1.5;});
    // 目標
    const tg=target();
    marker.visible=ring.visible=!!tg;
    if(tg){const b=Math.sin(now/250)*0.15;marker.position.set(tg[0],tg[2]+0.75+b,tg[1]);marker.rotation.y+=dt*2;ring.position.set(tg[0],0.03,tg[1]);}
    // 鏡頭
    const px=me.position.x,pz=me.position.z,portrait=innerWidth<innerHeight;
    camPos.set(px,portrait?15:12.5,pz+(portrait?11:10));look.set(px,0.4,pz-0.6);
    if(snapCam){cam.position.copy(camPos);snapCam=false;}else cam.position.lerp(camPos,Math.min(1,dt*6));
    cam.lookAt(cam.position.x,0.4,cam.position.z-(portrait?11:10)-0.6);
    renderer.render(scene,cam);
    // UI（每 0.12 秒）
    if(now-uiT>120){uiT=now;
      near=canMove?findNear():null;
      const a=$('#act');
      if(near){const lbl=near.type==='door'?'🔒 門鎖著':near.type==='start'?'⚠ 時光機':(STATIONS[near.st.i][near.st.j].k==='npc'?'💬 對話：':'🔍 調查：')+STATIONS[near.st.i][near.st.j].n;
        if(a.dataset.lbl!==lbl){a.textContent=lbl;a.dataset.lbl=lbl;}a.hidden=false;}else a.hidden=true;
      const gt=goalText(),ge=$('#goal');ge.hidden=!gt||!canMove;if(ge.textContent!==gt)ge.textContent=gt;
      // 畫面外箭頭
      const ed=$('#edge');
      if(tg&&canMove){v3.set(tg[0],1,tg[1]).project(cam);const sx=(v3.x+1)/2*innerWidth,sy=(1-v3.y)/2*innerHeight,m=60;
        const off=v3.z>1||sx<m||sx>innerWidth-m||sy<110||sy>innerHeight-m;
        if(off){const cx=innerWidth/2,cy=innerHeight/2;let dx=sx-cx,dy=sy-cy;if(v3.z>1){dx=-dx;dy=-dy;}
          const k=Math.min(Math.abs((cx-m)/(dx||1e-6)),Math.abs((cy-110)/(dy||1e-6)));ed.style.left=(cx+dx*k)+'px';ed.style.top=(cy+dy*k)+'px';
          ed.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;ed.hidden=false;}else ed.hidden=true;}else ed.hidden=true;
    }
    if(now-saveT>2000&&S.stage==='world'){saveT=now;S.pos=[+me.position.x.toFixed(2),+me.position.z.toFixed(2)];save();}
  }
  requestAnimationFrame(loop);
  return {sync,refresh,unlock:refresh,me};
})();


/* =====================================================================
   3D 版的流程：登入 → 說明 → 走廊探索 → 謎題彈窗 → 結果
   （以下函式會覆蓋原版同名函式）
   ===================================================================== */
function fresh(){return {cls:'',seat:'',start:0,end:0,room:0,pz:0,hints:0,errors:0,hintUsed:{},done:[],reflect:null,stage:'login',
  roomErr:{},roomHint:{},roomTime:{},roomStart:0,attempt:1,submit:'',entered:{},open:false,pos:null};}
if(!S.entered)S.entered={};
if(S.stage&&!['login','intro','world','result'].includes(S.stage))S.stage='world';

function progress(){
  let solved=0;S.done.forEach(i=>solved+=ROOMS[i].puzzles.length);
  const inRoom=!S.done.includes(S.room)&&!!(S.entered&&S.entered[S.room]);
  if(!S.done.includes(S.room))solved+=S.pz;
  return {reached:S.done.length+(inRoom?1:0),solved};
}
function hud(){
  const h=$('#hud');
  if(S.stage==='login'||!S.start){h.innerHTML='';h.className='';return;}
  h.className='hud';
  h.innerHTML=`<span class="chip who">${S.cls} 班 ${S.seat} 號</span>
   <span class="chip">⏱ <b id="clock">${fmt(elapsed())}</b></span>
   <span class="chip">🧩 ${progress().solved}/${totalPz}</span>
   <span class="chip">💡 ${S.hints}</span>
   <span class="chip">❌ ${S.errors}</span>
   ${!S.end&&S.stage==='world'?'<button class="chip" id="earlyBtn" style="background:var(--red);color:#fff;font-weight:800">📤 交卷</button>':''}`;
  const eb=$('#earlyBtn');if(eb)eb.onclick=askEarly;
}
function finish(status){
  if(S.stage==='result')return;
  const pg=progress();
  if(S.entered&&S.entered[S.room]&&!S.done.includes(S.room)&&S.roomStart)
    S.roomTime[S.room]=Math.round((Date.now()-S.roomStart)/1000);
  S.reached=pg.reached;S.solved=pg.solved;S.status=status;
  if(!S.end)S.end=Date.now();
  S.open=false;S.stage='result';render();
}
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}

function controls(on){$('#joy').hidden=!on;if(!on){$('#act').hidden=true;$('#goal').hidden=true;$('#edge').hidden=true;}}
function render(){
  hud();
  const ov=$('#ov');
  if(S.stage==='world'&&!S.open){ov.hidden=true;controls(true);}
  else{
    ov.hidden=false;ov.className=S.stage==='world'?'':'full';controls(false);
    if(S.stage==='world')renderPuzzle();
    else ({login:renderLogin,intro:renderIntro,result:renderResult})[S.stage]();
    ov.scrollTop=0;
  }
  if(W)W.sync();
  save();
}

function enterRoom(i){

function openPuzzle(){S.open=true;render();}
function closePuzzle(){S.open=false;clearInterval(coolTimer);render();}

function renderPuzzle(){
  const r=ROOMS[S.room], p=r.puzzles[S.pz];
  if(!p){S.open=false;render();return;}
  clearInterval(coolTimer);
  const Tf={order:pOrder,mcq:pMcq,multi:pMulti,match:pMatch,sort:pSort,lock:pLock,reflect:pReflect,cloze:pCloze}[p.type];
  Tf(r,p);
  $('#leave').onclick=closePuzzle;
  $('#hintBtn').onclick=()=>{
    if(!S.hintUsed[hintKey()]){
      if(p.type==='reflect'){S.hintUsed[hintKey()]=true;}
      else{S.hintUsed[hintKey()]=true;S.hints++;S.roomHint[S.room]=(S.roomHint[S.room]||0)+1;}
      save();hud();
    }
    $('#hint').innerHTML=`<div class="hintbox">💡 ${p.hint}</div>`;
    $('#hintBtn').textContent='💡 再看提示';
  };
}
function partsBar(){
  return `<div class="parts" style="justify-content:center">${ROOMS.map((r,i)=>`<div class="part ${S.done.includes(i)?'got':''}">${S.done.includes(i)?r.reward.icon:'？'}</div>`).join('')}</div>`;
}
function next(){
  const r=ROOMS[S.room], i=S.room;
  S.pz++;
  if(S.pz<r.puzzles.length){save();closePuzzle();toast(`✅ 完成！下一個：「${STATIONS[i][S.pz].n}」`);return;}
  S.roomTime[i]=S.roomStart?Math.round((Date.now()-S.roomStart)/1000):0;
  S.done.push(i);
  const last=i===ROOMS.length-1;
  if(last){S.end=Date.now();S.status='逃脫成功';S.reached=ROOMS.length;S.solved=totalPz;}
  else{S.room=i+1;S.pz=0;}
  S.open=false;save();render();
  modal(`<div class="reward"><div class="icon">${r.reward.icon}</div>
    <h2>${last?'時光機啟動成功！':'獲得零件：'+r.reward.name}</h2>
    <div class="sub">${last?'轟——！時光機穿過雪山隧道，帶你回到了現代！':`第 ${i+1} 關「${r.name}」通關！下一扇門「${ROOMS[i+1].name}」打開了。`}</div>
    ${partsBar()}
    <button class="btn amber" id="no" style="margin-top:16px">${last?'查看逃脫成績 🏆':'繼續前進 ➜'}</button></div>`);
  $('#no').onclick=()=>{closeModal();if(last){S.stage='result';render();}};
}
render();

</script>
</body>
</html>
