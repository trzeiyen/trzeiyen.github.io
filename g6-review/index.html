<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>六年級社會｜作答與學習檢討</title>
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#2b2a28; --sub:#6d6a64; --line:#e3ddd2;
  --pri:#2f6f73; --pri-soft:#e2efef; --ok:#3d8b4f; --ok-soft:#e4f2e6;
  --bad:#c0463b; --bad-soft:#fae6e3; --warn:#d18a1c; --warn-soft:#fbf0dc;
  --sure:#2f6f73; --mid:#d18a1c; --guess:#8a63b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
input,textarea{font-family:inherit;font-size:18px}
.hidden{display:none!important}
.screen{min-height:100vh}

/* ---------- login ---------- */
#login{display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--card);border-radius:20px;padding:36px 40px;max-width:520px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.login-card h1{margin:0 0 4px;font-size:26px}
.login-card p{margin:0 0 22px;color:var(--sub)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;letter-spacing:2px}
.field input:focus{outline:none;border-color:var(--pri)}
.err{color:var(--bad);min-height:24px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:18px;min-height:52px}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:disabled{background:#a9b9ba}
.btn-ghost{background:#efebe3;color:var(--ink)}
.btn-block{width:100%}
.howto{margin-top:22px;padding:14px 16px;background:var(--pri-soft);border-radius:12px;font-size:15px}
.howto b{color:var(--pri)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar .who{font-weight:700}
.topbar .prog{flex:1;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;background:#ece7de;border-radius:6px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
.prog span{font-size:15px;color:var(--sub);white-space:nowrap}
.body{display:flex;flex:1;min-height:0}
.nav{width:170px;flex-shrink:0;background:#ece7de;overflow-y:auto;padding:10px 8px}
.nav button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:10px;margin-bottom:4px;font-weight:600;font-size:16px}
.nav button small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.nav button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.nav button.done small{color:var(--ok)}
.main{flex:1;overflow-y:auto;padding:16px 18px 110px;-webkit-overflow-scrolling:touch}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 12px}
.sec-head h2{margin:0;font-size:22px}
.sec-head span{color:var(--sub);font-size:15px}
.note{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.q{background:var(--card);border-radius:14px;padding:12px 14px;border:2px solid transparent}
.q.missing{border-color:var(--bad)}
.q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qn{font-weight:800;font-size:19px;min-width:40px}
.qlabel{color:var(--sub);font-size:14px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-width:56px;min-height:52px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.opt small{font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
.opt.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.sel small{color:#dfeeee}
.opts.many .opt{min-width:62px;font-size:20px}
.conf{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.conf span.l{font-size:14px;color:var(--sub);align-self:center;margin-right:2px}
.cbtn{flex:1;min-height:46px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:600}
.cbtn.sel.sure{background:var(--sure);border-color:var(--sure);color:#fff}
.cbtn.sel.mid{background:var(--mid);border-color:var(--mid);color:#fff}
.cbtn.sel.guess{background:var(--guess);border-color:var(--guess);color:#fff}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:5}
.footer .sp{flex:1;color:var(--sub);font-size:15px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(30,28,25,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--card);border-radius:20px;padding:28px;max-width:560px;width:100%}
.modal h3{margin:0 0 8px;font-size:22px}
.est-val{font-size:56px;font-weight:800;text-align:center;color:var(--pri);margin:8px 0}
input[type=range]{width:100%;height:40px;accent-color:var(--pri)}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{flex:1}

/* ---------- result / review ---------- */
#result .wrap{max-width:1080px;margin:0 auto;padding:20px 18px 120px}
.step-tabs{display:flex;gap:8px;margin-bottom:16px}
.step-tabs div{flex:1;padding:10px;border-radius:12px;background:#ece7de;text-align:center;font-weight:700;font-size:15px;color:var(--sub)}
.step-tabs div.on{background:var(--pri);color:#fff}
.step-tabs div.done{background:var(--pri-soft);color:var(--pri)}
.panel{background:var(--card);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:20px}
.panel .hint{color:var(--sub);font-size:15px;margin:0 0 14px}
.score-row{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.score-big{flex:0 0 200px;background:var(--pri-soft);border-radius:16px;padding:16px;text-align:center}
.score-big b{display:block;font-size:64px;line-height:1;color:var(--pri)}
.score-big span{color:var(--sub);font-size:15px}
.calib{flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:17px}
.calib .tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:15px}
.quad{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px}
.quad .h{font-weight:700;color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.qc{border-radius:14px;padding:12px 14px;min-height:110px}
.qc .t{font-weight:800;font-size:17px}
.qc .n{font-size:34px;font-weight:800;line-height:1.1}
.qc .d{font-size:13px;color:var(--sub)}
.qc .ids{font-size:13px;margin-top:4px;word-break:break-all}
.qc.a{background:var(--ok-soft)} .qc.a .n{color:var(--ok)}
.qc.b{background:var(--bad-soft);border:2px solid var(--bad)} .qc.b .n{color:var(--bad)}
.qc.c{background:#efe8f7} .qc.c .n{color:var(--guess)}
.qc.d{background:var(--warn-soft)} .qc.d .n{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hbar{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.hbar .track{height:20px;background:#efebe3;border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px}
.hbar .pct{text-align:right;font-weight:700}
.insight{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.insight b{color:#9a5f05}
.rv{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rv.doneit{border-color:#bcd9da;background:#fbfdfd}
.rv-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rv-top .qn{min-width:auto}
.pill{padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700}
.pill.wrong{background:var(--bad-soft);color:var(--bad)}
.pill.lucky{background:#efe8f7;color:var(--guess)}
.pill.trap{background:var(--bad);color:#fff}
.ans{font-size:16px}
.ans .you{color:var(--bad);font-weight:700}
.ans .key{color:var(--ok);font-weight:800}
.ex{margin:8px 0 10px;font-size:15px;background:#f7f5f0;border-radius:10px;padding:8px 12px}
.causes{display:flex;gap:8px;flex-wrap:wrap}
.cause{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600;min-height:48px}
.cause.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.strat{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;width:100%;text-align:left;font-size:16px}
.strat .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.strat.sel{border-color:var(--pri);background:var(--pri-soft)}
.strat.sel .box{background:var(--pri);border-color:var(--pri);color:#fff}
.strat-group{margin-bottom:12px}
.strat-group h4{margin:6px 0 8px;font-size:16px}
textarea{width:100%;min-height:80px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--pri)}
.chal{margin-top:12px;background:#f3f8f8;border:2px dashed #bcd9da;border-radius:12px;padding:10px 12px}
.chal h5{margin:0 0 8px;font-size:15px}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #e3ecec}
.st-row:first-of-type{border-top:none}
.st-row .txt{flex:1;font-size:16px}
.tf{width:56px;height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.tf.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.st-row.bad .txt{color:var(--bad)}
.st-row.good .txt{color:var(--ok)}
.chal .act{display:flex;align-items:center;gap:10px;margin-top:8px}
.chal .act .btn{min-height:44px;padding:8px 16px;font-size:16px}
.passed{background:var(--ok-soft);border:2px solid #a9d3b2;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700;color:var(--ok)}
.empty{padding:20px;text-align:center;color:var(--sub)}

/* final report */
.report{background:var(--card);border-radius:18px;padding:18px 22px;border:3px solid var(--pri)}
.report-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.report-head h2{margin:0;font-size:21px}
.report-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mini h4{margin:0 0 6px;font-size:15px;color:var(--sub)}
.mini .hbar{grid-template-columns:132px 1fr 40px;font-size:13px;margin:5px 0}
.mini .hbar .track{height:14px}
.mq{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mq div{border-radius:10px;padding:6px 8px;font-size:13px}
.mq b{font-size:22px;display:block;line-height:1.1}
.goalbox{margin-top:10px;background:var(--pri-soft);border-radius:12px;padding:10px 14px;font-size:16px}
.send{margin-top:12px;font-size:15px;color:var(--sub);text-align:center}

@media (max-width:820px){
  .nav{width:110px}
  .grid{grid-template-columns:1fr}
  .two,.report-grid{grid-template-columns:1fr}
  .quad{grid-template-columns:70px 1fr 1fr}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="screen">
  <div class="login-card">
    <h1 id="lgTitle">六年級社會｜作答與學習檢討</h1>
    <p id="lgSub">看紙本題目，在這裡點答案。交卷後會幫你分析學習狀況。</p>
    <div class="field">
      <label for="cls">班級（三位數，例如 609）</label>
      <input id="cls" inputmode="numeric" maxlength="3" autocomplete="off">
    </div>
    <div class="field">
      <label for="seat">座號</label>
      <input id="seat" inputmode="numeric" maxlength="2" autocomplete="off">
    </div>
    <div class="field" id="pwField">
      <label for="pw">通關密語（看黑板）</label>
      <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-pri btn-block" id="startBtn">開始</button>
    <div class="howto" id="lgHow">
      每一題都要點兩次：<b>先點答案，再點你的把握程度</b>
      <div class="legend"><span>😎 確定</span><span>🤔 有點把握</span><span>🎲 用猜的</span></div>
      誠實點選把握程度，交卷後的分析才會準確喔！
    </div>
    <div id="resumeBox" class="hidden" style="margin-top:16px;font-size:15px;color:var(--sub)"></div>
  </div>
</section>

<!-- ============ EXAM ============ -->
<section id="exam" class="screen hidden">
  <div class="topbar">
    <div class="who" id="who"></div>
    <div class="prog"><div class="bar"><i id="progBar"></i></div><span id="progTxt"></span></div>
  </div>
  <div class="body">
    <nav class="nav" id="nav"></nav>
    <div class="main" id="main"></div>
  </div>
  <div class="footer">
    <button class="btn btn-ghost" id="prevSec">‹ 上一大題</button>
    <div class="sp" id="footMsg"></div>
    <button class="btn btn-ghost" id="nextSec">下一大題 ›</button>
    <button class="btn btn-pri" id="submitBtn">交卷</button>
  </div>
</section>

<!-- ============ RESULT / REVIEW ============ -->
<section id="result" class="screen hidden">
  <div class="wrap">
    <div class="step-tabs" id="stepTabs"></div>
    <div id="stepBody"></div>
  </div>
  <div class="footer" id="resFoot"></div>
</section>

<div id="modalRoot"></div>

<script>
/* ==========================================================
   設定區（老師可以修改）
   ========================================================== */
const CONFIG = {
  STORAGE_KEY: 'meta6_115_1_mid',     // 換一份考卷時請改名，避免讀到舊資料
  CLASS_RULE: /^6\d{2}$/,             // 班級格式：6 開頭三位數
  CLASS_HINT: '請輸入 6 開頭的三位數班級，例如 609',
  TEACHER_CODE: '0000',               // 清除本機資料用的老師密碼（請自行修改）
  GAS_URL: '',                        // 貼上 Google Apps Script 網頁應用程式網址（https://script.google.com/macros/s/.../exec）
  EXAM_ID: '115-1-mid-g6',            // 考卷代號（換考卷時請改）
  REVIEW_OPEN: false,                 // 沒有 GAS 時才用這個開關；有 GAS 時，改由試算表「設定」工作表控制
  SHOW_SCORE: true,
  PAPER_MODE: true,                   // true＝紙本作答、老師匯入資料，學生只做檢討；false＝在 iPad 上作答                   // 交卷後是否立刻顯示分數（不顯示答案）
  TITLE: '115學年度第1學期第1次定期評量（模擬）六年級社會',
  DEMO: {cls:'699', seat:'99'},
  LUCKY_OPTIONAL: true,               // △ 猜對的題目改為選做（不影響進入下一步）
  NEXT_LINK: {text:'🚢 完成了！去玩「大航海時代」', url:'https://age-of-discovery-voyage.zeiyenst.chatgpt.site'}  // 完成後的延伸活動，不需要就設成 null        // 示範帳號：不連線、不存檔，每次登入都是全新狀態
};
let REVIEW_OPEN = CONFIG.REVIEW_OPEN;

/* 主題（單元概念） */
const TOPICS = {
  T1:'社會變遷與性別平等',
  T2:'多元文化與宗教信仰',
  T3:'日治到戒嚴時期',
  T4:'解嚴後的民主發展',
  T5:'人權與法律',
  T6:'政府組織與分工'
};
/* 題型（需要的能力） */
const SKILLS = {
  S1:'生活情境應用',
  S2:'判斷敘述對錯',
  S3:'年代順序',
  S4:'閱讀找證據',
  S5:'概念記憶'
};

const C4 = ['①','②','③','④'];
const OPT_EVENT = [['A','二二八事件'],['B','實施戒嚴'],['C','美麗島事件'],['D','解除戒嚴'],['E','政府遷臺'],['F','首次公投']];
const OPT_GOV = [['A','行政院'],['B','立法院'],['C','司法院'],['D','考試院'],['E','縣市政府'],['F','監察院'],['G','總統'],['H','縣市議會']];

/* 題目資料：a=正確答案, t=主題, s=題型, ex=解析（交卷後才顯示） */
const SECTIONS = [
 {id:'一', title:'一、選擇題', sub:'每題 2 分，共 36 分', opts:C4, items:[
  {n:1,a:'④',t:'T1',s:'S1',ex:'性別友善廁所不分性別都能使用，方便爸爸帶女兒、照顧者陪長輩或身障者如廁。'},
  {n:2,a:'③',t:'T2',s:'S1',ex:'學習當地語言，是為了和在地居民溝通交流。'},
  {n:3,a:'①',t:'T1',s:'S1',ex:'現代社會重視個人意願；②④是傳統農業社會的觀念。'},
  {n:4,a:'④',t:'T1',s:'S1',ex:'「保母」容易讓人以為只有女性能做，改名表示托育工作不分性別。'},
  {n:5,a:'②',t:'T1',s:'S1',ex:'籃球、圍棋、麥塊等各種社團＝多元的學習活動。'},
  {n:6,a:'③',t:'T3',s:'S2',ex:'①民國38年遷臺同年戒嚴，76年才解嚴；②陳儀沒有接受，還派兵鎮壓；④臺灣民主居亞洲前段。'},
  {n:7,a:'①',t:'T3',s:'S2',ex:'②人權博物館是解嚴後才成立；③戰後米價飛漲、物資缺乏；④重要職務多由外省人擔任。'},
  {n:8,a:'②',t:'T3',s:'S2',ex:'①雷震辦的是《自由中國》；③戒嚴時期禁止組新政黨；④許多人遭逮捕判刑。'},
  {n:9,a:'④',t:'T4',s:'S2',ex:'①②③都是解嚴後的民主發展，所以選「以上皆是」。'},
  {n:10,a:'②',t:'T4',s:'S1',ex:'民主得來不易，要珍惜並盡公民責任。'},
  {n:11,a:'①',t:'T4',s:'S1',ex:'民主指數居亞洲之冠＝民主改革成果獲得國際肯定。'},
  {n:12,a:'①',t:'T5',s:'S1',ex:'書信、訊息、電話受「秘密通訊自由」保障。'},
  {n:13,a:'④',t:'T6',s:'S2',ex:'①行政院執行政策、立法院制定法律（相反了）；②縣市議會是地方立法機關；③縣市政府要受議會監督。'},

 '八-3':[['「西瓜皮頭」是把頭髮剪短到齊耳的髮型。',true],['「西瓜皮頭」是綁成長辮子的髮型。',false],['「西瓜皮頭」是燙捲的髮型。',false]],

const ITEMS = [];
SECTIONS.forEach(sec=>sec.items.forEach(it=>{
  it.id = sec.id+'-'+it.n;
  it.sec = sec;
  it.optList = it.opts || sec.opts;
  it.label = sec.id + '-' + (sec.label ? sec.label(it.n) : it.n);
  ITEMS.push(it);
}));
const TOTAL = ITEMS.length*POINTS;

let S = null;
function blank(){return {cls:'',seat:'',answers:{},conf:{},est:null,submitted:false,step:0,causes:{},strategies:[],goal:'',start:Date.now(),sent:false};}
function save(){if(S&&S.demo)return;try{localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(CONFIG.STORAGE_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function clearStore(){try{localStorage.removeItem(CONFIG.STORAGE_KEY);}catch(e){}}

  const row=(EMBED[cls]||{})[seat]; if(!row) return null;
  const toks=row[1].split(' '); if(toks.length!==ITEMS.length) return null;
  const st=blank(); st.cls=cls; st.seat=seat;
  ITEMS.forEach((it,i)=>{
    const m=toks[i].match(/^(.+?)([?△]?)$/); let v=m[1];
    if(v==='-') v='－';
    if(/^[1-4]$/.test(v) && it.optList===C4) v=C4[+v-1];
    st.answers[it.id]=v; st.conf[it.id]= m[2]==='?'?'mid': m[2]==='△'?'guess':'sure';
  });
  st.est = row[0]===''?null:+row[0];
  st.scoreOverride = row[2]??null;
  st.submitted=true; st.sentSubmit=true; st.fromEmbed=true;
  return st;
}

/* 示範學生資料（虛構）：答錯題 [學生答案, 標記]、其他有標記的題目 */
function demoState(){
  const wrong={'一-13':['①',''],'二-3':['A','?'],'七-3':['③','△']};
  const marks={'一-6':'△','一-11':'?','六-4':'?'};
  const st=blank(); st.demo=true; st.cls=CONFIG.DEMO.cls; st.seat=CONFIG.DEMO.seat;
  ITEMS.forEach(it=>{
    let a=it.a, m=marks[it.id]||'';
    if(wrong[it.id]){a=wrong[it.id][0];m=wrong[it.id][1];}
    st.answers[it.id]=a; st.conf[it.id]= m==='?'?'mid': m==='△'?'guess':'sure';
  });
  st.est=90; st.submitted=true; st.sentSubmit=true; st.sent=true; st.submitAt=Date.now();
  return st;
}

   登入
   ========================================================== */
function initLogin(){
  if(CONFIG.PAPER_MODE){
    $('lgTitle').textContent='六年級社會｜我的錯題筆記本';
    $('lgSub').textContent='輸入班級和座號，看看你的考卷分析，完成錯題訂正。';
    $('lgHow').innerHTML='系統已經讀取你的考卷和你標的「？」「△」。<br>今天要做的事：<b>看分析 → 錯題訂正（用自己的話寫觀念）→ 擬定行動計畫</b>';
  }
  const saved = load();
  if(saved && saved.cls){
    const box=$('resumeBox');
    box.classList.remove('hidden');
    box.innerHTML = saved.submitted
      ? `這台平板已有 ${esc(saved.cls)} 班 ${esc(saved.seat)} 號的作答紀錄（已交卷）。<br>輸入相同班級座號可回到檢討頁。`
      : `這台平板有 ${esc(saved.cls)} 班 ${esc(saved.seat)} 號尚未交卷的作答，輸入相同班級座號即可繼續。`;
    box.innerHTML += `<br><button class="btn btn-ghost" style="margin-top:8px;min-height:40px;padding:8px 14px;font-size:15px" id="resetBtn">清除紀錄（需老師密碼）</button>`;
    $('resetBtn').onclick=()=>{
      const code=prompt('請輸入老師密碼');
      if(code===CONFIG.TEACHER_CODE){clearStore();location.reload();}
      else if(code!==null){alert('密碼錯誤');}
    };
  }
  $('startBtn').onclick=async()=>{
    const c=$('cls').value.trim(), s=$('seat').value.trim();
    if(!CONFIG.CLASS_RULE.test(c)){$('loginErr').textContent=CONFIG.CLASS_HINT;return;}
    const isDemo=CONFIG.DEMO && c===CONFIG.DEMO.cls && String(+s)===CONFIG.DEMO.seat;
    if(!isDemo && (!/^\d{1,2}$/.test(s)||+s<1||+s>40)){$('loginErr').textContent='請輸入正確的座號（1～40）';return;}
    const seat=String(+s);
    if(CONFIG.DEMO && c===CONFIG.DEMO.cls && seat===CONFIG.DEMO.seat){
      S=demoState(); REVIEW_OPEN=true; openResult(); return;
    }
    if(saved && saved.cls && !(saved.cls===c && saved.seat===seat)){
      $('loginErr').textContent=`這台平板正在使用中（${saved.cls} 班 ${saved.seat} 號）。如需換人，請老師協助清除紀錄。`;return;
    }
    if(!(saved && saved.cls) && !Object.keys(EMBED).length){
      $('startBtn').disabled=true; $('startBtn').textContent='解鎖中…';
      const ok=await unlockEmbed($('pw').value.trim());
      $('startBtn').disabled=false; $('startBtn').textContent='開始';
      if(!ok){$('loginErr').textContent='通關密語不正確，請看黑板再輸入一次。';return;}
    }
    $('loginErr').textContent=''; $('startBtn').disabled=true; $('startBtn').textContent='連線中…';
    const remote = await fetchStatus(c,seat);
    $('startBtn').disabled=false; $('startBtn').textContent='開始';
    const emb = embeddedState(c,seat);
    if(CONFIG.PAPER_MODE && !(saved && saved.cls) && !(remote && remote.record) && !emb){
      $('loginErr').textContent = CONFIG.GAS_URL
        ? (remote ? '找不到你的考卷資料，請確認班級座號，或請老師協助。' : '連線失敗，請確認網路後再試一次。')
        : '找不到你的考卷資料，請確認班級座號，或請老師協助。';
      return;
    }
    if(saved && saved.cls){ S=saved; }
    else if(emb && !(remote && remote.record)){ S=emb; if(!CONFIG.GAS_URL) REVIEW_OPEN=true; }
    else { S=blank(); S.cls=c; S.seat=seat; }
    if(S.fromEmbed && !CONFIG.GAS_URL) REVIEW_OPEN=true;
    // 換了平板：從雲端還原已交卷的紀錄
    if(remote && remote.record && (!S.submitted || CONFIG.PAPER_MODE && !S.sent && !Object.keys(S.causes||{}).length)){
      const r=remote.record;
      Object.assign(S,{scoreOverride:r.scoreOverride??null,answers:r.answers||{},conf:r.conf||{},est:(r.est===''||r.est==null)?null:r.est,submitted:true,submitAt:r.submitAt,sentSubmit:true,
        causes:r.causes||S.causes||{},strategies:r.strategies||[],goal:r.goal||'',sent:!!r.reflected,step:r.reflected?4:0});
    }
    save();
    if(S.submitted && !S.sentSubmit) sendSubmit();
    if(S.fromEmbed && CONFIG.GAS_URL && !(remote&&remote.record)){S.sentSubmit=false;sendSubmit();}
    S.submitted ? openResult() : openExam();
  };
}

let curSec = 0;
function isDone(it){return S.answers[it.id]!=null && S.conf[it.id]!=null;}

function openExam(){
  show('exam');

}
function renderNav(){
  $('nav').innerHTML = SECTIONS.map((sec,i)=>{
    const d=secDone(sec), n=sec.items.length;

function renderSec(highlightMissing){
  const sec=SECTIONS[curSec];
  let h=`<div class="sec-head"><h2>${esc(sec.title)}</h2><span>${esc(sec.sub)}</span></div>`;
  if(sec.note) h+=`<div class="note">${esc(sec.note)}</div>`;

  sec.items.forEach(it=>{
    const opts=it.optList, many=opts.length>4;
    const qn = sec.label? sec.label(it.n) : (String(it.n).match(/^\d+[A-E]$/)? it.n.replace(/(\d)([A-E])/,'$1-$2') : it.n+'.');
    h+=`<div class="q ${highlightMissing&&!isDone(it)?'missing':''}" id="q_${it.id}">
      <div class="q-top"><span class="qn">${esc(qn)}</span></div>
      <div class="opts ${many?'many':''}">${opts.map(o=>{
        const k=optKey(o), lab=Array.isArray(o)?o[1]:'';
        return `<button class="opt ${S.answers[it.id]===k?'sel':''}" data-q="${it.id}" data-v="${esc(k)}">${esc(k==='－'?'－':k)}${lab?'<small>'+esc(lab)+'</small>':''}</button>`;
      }).join('')}</div>
      <div class="conf"><span class="l">把握</span>${Object.entries(CONF).map(([k,c])=>
        `<button class="cbtn ${k} ${S.conf[it.id]===k?'sel':''}" data-q="${it.id}" data-c="${k}">${c.icon} ${c.name}</button>`).join('')}</div>
    </div>`;
  });
  h+='</div>';
  if(curSec===SECTIONS.length-1) h+=`<div style="margin-top:20px;text-align:center;color:var(--sub)">這是最後一大題了，檢查完就可以按右下角「交卷」。</div>`;
  $('main').innerHTML=h;
  $('main').scrollTop=0;
  $('main').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    S.answers[b.dataset.q]=b.dataset.v; save();
    b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
    afterTap(b.dataset.q);
  });
  $('main').querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{
    S.conf[b.dataset.q]=b.dataset.c; save();
    b.parentNode.querySelectorAll('.cbtn').forEach(x=>x.classList.toggle('sel',x===b));
    afterTap(b.dataset.q);
  });
}
function afterTap(id){
  const card=$('q_'+id); const it=ITEMS.find(x=>x.id===id);
  if(card && isDone(it)) card.classList.remove('missing');
  updateProg(); renderNavLight();
}
function renderNavLight(){
  $('nav').querySelectorAll('button').forEach((b,i)=>{
    const sec=SECTIONS[i], d=secDone(sec), n=sec.items.length;

function updateProg(){

  $('progBar').style.width=(d/ITEMS.length*100)+'%';
  $('progTxt').textContent=`已完成 ${d} / ${ITEMS.length} 小題`;

function trySubmit(){
  const miss=ITEMS.filter(it=>!isDone(it));
  if(miss.length){
    const secs=[...new Set(miss.map(m=>m.sec.id))];
    modal(`<h3>還有 ${miss.length} 小題沒完成</h3>

      setTimeout(()=>{const el=$('q_'+miss[0].id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);};

function modal(html){$('modalRoot').innerHTML=`<div class="mask"><div class="modal">${html}</div></div>`;}
function closeModal(){$('modalRoot').innerHTML='';}

/* ==========================================================
   計分與分析
   ========================================================== */
function analyze(){
  const res=ITEMS.map(it=>{
    const ok=S.answers[it.id]===it.a && !(S.extra&&S.extra[it.id]), c=S.conf[it.id];
    let q; // a 真的會 b 陷阱題 c 猜對 d 知道不會
    if(ok) q = c==='sure' ? 'a' : 'c';
    else q = c==='sure' ? 'b' : 'd';
    return {it,ok,c,q};
  });
  const score=(S.scoreOverride!=null&&S.scoreOverride!=='')?Number(S.scoreOverride):res.filter(r=>r.ok).length*POINTS;  // 老師批改分數優先
  const rate=(key,map)=>Object.keys(map).map(k=>{
    const rs=res.filter(r=>r.it[key]===k);
    return {k,name:map[k],n:rs.length,ok:rs.filter(r=>r.ok).length,pct:rs.length?Math.round(rs.filter(r=>r.ok).length/rs.length*100):0};
  }).filter(x=>x.n);
  return {res,score,topics:rate('t',TOPICS),skills:rate('s',SKILLS)};
}
function reviewList(A){
  // 錯題全部 + 猜對的題目
  return A.res.filter(r=>!r.ok || r.c==='guess');
}
function calibBlock(A,center){
  if(S.est==null || S.est==='') return `<div class="calib" ${center?'style="max-width:380px"':''}><div style="font-size:18px">這是你的考卷分析 📊</div><div style="color:var(--sub);font-size:16px">往下看看：哪些題目你是「真的會」，哪些是「以為會」？</div></div>`;
  const cb=calibText(S.est,A.score);
  return `<div class="calib" ${center?'style="max-width:380px"':''}><div>你預估 <b>${S.est}</b> 分，實際 <b>${A.score}</b> 分</div>
    <div><span class="tag" style="background:${cb.bg};color:${cb.c}">${cb.t}</span></div>
    <div style="color:var(--sub);font-size:16px">${cb.m}</div></div>`;
}
function calibText(est,score){
  const d=est-score;
  if(Math.abs(d)<=6) return {t:'估得很準！',c:'var(--ok)',bg:'var(--ok-soft)',m:'你很清楚自己會什麼、不會什麼。'};
  if(d>6) return {t:'太樂觀了',c:'var(--bad)',bg:'var(--bad-soft)',m:`你預估比實際多了 ${d} 分，有些題目你「以為會」，看看下面的陷阱題。`};
  return {t:'太沒自信了',c:'var(--guess)',bg:'#efe8f7',m:`你其實比自己想的多會了 ${-d} 分，給自己多一點信心！`};
}
function barColor(p){return p>=80?'var(--ok)':p>=60?'var(--warn)':'var(--bad)';}
function hbars(list,small){
  return list.map(x=>`<div class="hbar"><span>${esc(x.name)}</span><div class="track"><div class="fill" style="width:${Math.max(x.pct,2)}%;background:${barColor(x.pct)}"></div></div><span class="pct">${x.pct}%</span></div>`).join('');
}
function quadHTML(A){
  const g=k=>A.res.filter(r=>r.q===k);
  const box=(k,t,d)=>{const l=g(k);return `<div class="qc ${k}"><div class="t">${t}</div><div class="n">${l.length} <span style="font-size:15px">題</span></div><div class="d">${d}</div>${l.length&&k!=='a'?`<div class="ids">${l.map(r=>esc(r.it.label)).join('、')}</div>`:''}</div>`;};
  return `<div class="quad">
    <div></div><div class="h">✔ 答對</div><div class="h">✘ 答錯</div>
    <div class="h">${CONFIG.PAPER_MODE?'沒標<br>很確定':'😎<br>確定'}</div>${box('a','真的會','繼續保持！')}${box('b','⚠️ 陷阱題','以為很確定，其實還沒弄懂（最該複習）')}
    <div class="h">${CONFIG.PAPER_MODE?'？△<br>沒把握':'🤔🎲<br>沒把握'}</div>${box('c','答對但沒把握','還不穩，再確認一下')}${box('d','知道自己不熟','很誠實！這些要再學一次')}
  </div>`;
}

/* ==========================================================
   結果與檢討（三步驟）

const STEPS=['① 確認錯題','② 錯題訂正','③ 看成績與分析','④ 擬定行動計畫','⑤ 我的學習報告'];
function openResult(){
  show('result');
  if(S.demo && !$('demoBadge')){const d=document.createElement('div');d.id='demoBadge';d.textContent='示範模式（虛構學生，不會存檔）';d.style.cssText='position:fixed;bottom:80px;left:12px;z-index:30;background:#c0463b;color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px';document.body.appendChild(d);}
  if(!REVIEW_OPEN){ renderLocked(); return; }

}
function renderLocked(){
  const A=analyze();
  $('stepTabs').innerHTML='';
  $('stepBody').innerHTML=`<div class="panel" style="text-align:center;padding:40px 24px">
    <div style="font-size:56px">✅</div>
    <h2 style="margin:6px 0 4px">交卷完成！</h2>
    <p style="color:var(--sub);margin:0 0 20px">${esc(S.cls)} 班 ${esc(S.seat)} 號</p>
    ${CONFIG.SHOW_SCORE?`<div class="score-row" style="justify-content:center;text-align:left">
      <div class="score-big"><span>實際分數</span><b>${A.score}</b><span>滿分 ${TOTAL}</span></div>
      ${calibBlock(A,true)}</div>`:''}
    <div class="insight" style="text-align:left;margin-top:22px">📌 下一節課，我們會一起看「把握程度 × 答對答錯」的分析，找出你的錯誤原因。<br>到時候用同一個班級座號登入就可以繼續。</div>
    <div class="send" id="sendMsg">${sendMsgText()}</div>
  </div>`;

}
function sendMsgText(){
  if(!CONFIG.GAS_URL) return '📸 請把這個畫面截圖，交給老師。';
  return S.sentSubmit ? '☁️ 作答已送出給老師' : '☁️ 作答資料傳送中…';
}
function renderTabs(){
  $('stepTabs').innerHTML=STEPS.map((s,i)=>`<div class="${i===S.step?'on':i<S.step?'done':''}">${s}</div>`).join('');
}
function setFoot(html){$('resFoot').innerHTML=html;}
function goStep(n){S.step=n;save();renderStep();window.scrollTo(0,0);}

function renderStep(){
  renderTabs();
  const A=analyze();
  if(S.step===0) stepConfirm(A);
  else if(S.step===1) step1(A);
  else if(S.step===2) step0(A);
  else if(S.step===3) step2(A);
  else step3(A);
}

/* ① 確認錯題：系統判讀的錯題已標紅；沒出現的錯題，學生自己勾選 */
function stepConfirm(A){
  S.extra=S.extra||{};
  const sysWrong=id=>S.answers[id]!==ITEMS.find(i=>i.id===id).a;
  const disp=v=>v==='－'?'空白':v;
  const markTxt={sure:'',mid:'？',guess:'△'};
  let h=`<div class="panel"><h3>先確認：你錯了哪些題目？</h3>
    <p class="hint">拿出你的考卷對照一下。<b style="color:var(--bad)">紅色</b>是老師系統讀到你答錯的題目。<br>
    如果還有<b>答錯但沒出現</b>的題目，請點一下那一題，把它加進來（會變成橘色）。</p>`;
  SECTIONS.forEach(sec=>{
    h+=`<div style="font-weight:700;margin:14px 0 6px">${esc(sec.title)}</div><div style="display:flex;flex-wrap:wrap;gap:8px">`;
    sec.items.forEach(it=>{
      const sw=sysWrong(it.id), ex=!!S.extra[it.id];
      const bg= sw?'var(--bad-soft)':ex?'var(--warn-soft)':'#fff';
      const bd= sw?'var(--bad)':ex?'var(--warn)':'var(--line)';
      const lab=sec.label?sec.label(it.n):it.n;
      h+=`<button class="cf" data-q="${it.id}" ${sw?'disabled':''} style="min-width:76px;min-height:64px;border-radius:12px;border:2px solid ${bd};background:${bg};padding:6px 8px;text-align:center;line-height:1.25">
        <div style="font-size:14px;color:var(--sub)">${esc(String(lab))}</div>
        <div style="font-size:20px;font-weight:800">${esc(disp(S.answers[it.id]))}<span style="font-size:14px;color:var(--warn)">${markTxt[S.conf[it.id]]}</span></div>
        <div style="font-size:12px;font-weight:700;color:${sw?'var(--bad)':'var(--warn)'}">${sw?'✘ 錯':ex?'我也錯了':''}</div></button>`;
    });
    h+='</div>';
  });
  const nSys=ITEMS.filter(it=>sysWrong(it.id)).length, nEx=Object.keys(S.extra).filter(k=>S.extra[k]).length;
  h+=`<div class="insight" style="margin-top:16px">系統讀到你錯 <b>${nSys}</b> 題${nEx?`，你自己又加了 <b>${nEx}</b> 題`:''}。方格裡是系統讀到的答案，如果跟考卷上寫的不一樣，請告訴老師。</div></div>`;
  $('stepBody').innerHTML=h;
  $('stepBody').querySelectorAll('.cf').forEach(b=>b.onclick=()=>{

function step0(A){

    <div class="two">
      <div class="panel"><h3>各單元主題答對率</h3><p class="hint">哪些內容需要再複習？</p>${hbars(A.topics)}</div>
      <div class="panel"><h3>各題型答對率</h3><p class="hint">哪一種題目比較容易錯？</p>${hbars(A.skills)}</div>
    </div>
    <div class="insight">${ins}</div>`;
  setFoot(`<button class="btn btn-ghost" onclick="goStep(1)">‹ 回錯題訂正</button><div class="sp"></div><button class="btn btn-pri" onclick="goStep(3)">下一步：擬定行動計畫 ›</button>`);
}

function step1(A){
  const list=reviewList(A);
  if(!list.length){
    $('stepBody').innerHTML=`<div class="panel"><div class="empty">🎉 沒有錯題，也沒有用猜的題目！直接進入下一步。</div></div>`;
    setFoot(`<button class="btn btn-ghost" onclick="goStep(0)">‹ 上一步</button><div class="sp"></div><button class="btn btn-pri" onclick="goStep(2)">下一步：看我的分析 ›</button>`);
    return;
  }
  const optName=(it,v)=>{const o=it.optList.find(o=>optKey(o)===v);return Array.isArray(o)&&o[1]?v+' '+o[1]:v;};
  list.sort((a,b)=>(isOptional(a)?1:0)-(isOptional(b)?1:0));
  let h=`<div class="panel"><h3>錯題訂正</h3><p class="hint">看著考卷和下面的解析，每一題做兩件事：<b>① 選出錯誤原因　② 通過訂正挑戰（是非題全對）</b><br>答錯的話，要再讀一次解析才能重新挑戰喔！${CONFIG.LUCKY_OPTIONAL?'<br>標「選做」的是你猜對的題目，有時間的話也挑戰看看！':''}</p>`;

    h+=`<div class="rv ${sel?'doneit':''}" id="rv_${it.id}">
      <div class="rv-top"><span class="qn">${esc(it.label)}</span>${pill}
        <span class="ans">${lucky?'':'你的答案 <span class="you">'+esc(optName(it,S.answers[it.id]))+'</span>　'}正確答案 <span class="key">${esc(optName(it,it.a))}</span></span>
        <span style="color:var(--sub);font-size:14px">${CONF[r.c].icon}${CONF[r.c].name}</span></div>
      <div class="ex">💡 ${esc(it.ex)}</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">${lucky?'你為什麼沒有把握？':'你為什麼會錯？'}</div>
      <div class="causes">${keys.map(k=>`<button class="cause ${sel===k?'sel':''}" data-q="${it.id}" data-k="${k}">${CAUSES[k].icon} ${lucky&&k==='mixup'?'在兩個答案之間猶豫':lucky&&k==='concept'?'概念還不熟':CAUSES[k].name}</button>`).join('')}</div>

    markRv(b.dataset.q); foot1(list);
  });
  list.forEach(r=>{bindChal(r.it.id,list);markRv(r.it.id);});
  foot1(list);

/* 訂正挑戰：從 3 句是非題隨機抽 2 句，全對才通過；答錯要等 8 秒重讀解析 */
const TIMERS={};
function chState(id){
  S.ch=S.ch||{};
  if(!S.ch[id]){S.ch[id]={draw:pick2(id,null),ans:{},tries:0,pass:false,lockUntil:0};}
  return S.ch[id];
}
function pick2(id,prev){
  const n=(CHALLENGE[id]||[]).length; const all=[...Array(n).keys()];
  let d;
  for(let k=0;k<10;k++){
    const a=all.slice().sort(()=>Math.random()-0.5); d=a.slice(0,Math.min(2,n));
    if(!prev || d.slice().sort().join()!==prev.slice().sort().join()) break;
  }
  return d;
}
function chalHTML(id){
  const pool=CHALLENGE[id]; if(!pool) return '';
  const st=chState(id);
  if(st.pass) return `<div class="passed">🏆 訂正挑戰通過！${st.tries>1?'（挑戰 '+st.tries+' 次）':'（一次就過關）'}</div>`;
  const locked=Date.now()<st.lockUntil;
  return `<div class="chal"><h5>🎯 訂正挑戰：下面的句子是對（O）還是錯（X）？</h5>
    ${st.draw.map(i=>`<div class="st-row ${st.result?(st.result[i]?'good':'bad'):''}" data-i="${i}"><span class="txt">${esc(pool[i][0])}</span>
      <button class="tf ${st.ans[i]===true?'sel':''}" data-q="${id}" data-i="${i}" data-v="1">O</button>
      <button class="tf ${st.ans[i]===false?'sel':''}" data-q="${id}" data-i="${i}" data-v="0">X</button></div>`).join('')}
    <div class="act"><button class="btn btn-pri chk" data-q="${id}" ${locked?'disabled':''}>${locked?'請先重讀解析…':'送出檢查'}</button><span class="cmsg" style="font-size:15px">${st.msg||''}</span></div>
  </div>`;
}
function bindChal(id,list){
  const box=$('ch_'+id); if(!box) return;
  box.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{
    const st=chState(id); if(Date.now()<st.lockUntil) return;
    st.ans[b.dataset.i]= b.dataset.v==='1'; st.result=null; st.msg=''; save();
    box.innerHTML=chalHTML(id); bindChal(id,list);
  });
  const c=box.querySelector('.chk'); if(!c) return;
  c.onclick=()=>{
    const st=chState(id), pool=CHALLENGE[id];
    if(st.draw.some(i=>st.ans[i]===undefined)){st.msg='每一句都要選 O 或 X 喔！';box.innerHTML=chalHTML(id);bindChal(id,list);return;}
    st.tries++;
    const res={}; st.draw.forEach(i=>res[i]= st.ans[i]===pool[i][1]);
    if(Object.values(res).every(Boolean)){ st.pass=true; st.msg=''; save(); sendProgress(); }
    else{
      st.result=res; st.lockUntil=Date.now()+8000;
      st.msg='有句子判斷錯了（紅字），請再讀一次上面的解析，8 秒後換新題目重新挑戰。';
      setTimeout(()=>{ if(!st.pass){ st.draw=pick2(id,st.draw); st.ans={}; st.result=null; st.msg='新題目來了，再挑戰一次！'; save(); if($('ch_'+id)){$('ch_'+id).innerHTML=chalHTML(id);bindChal(id,list);} } },8000);
    }
    save(); box.innerHTML=chalHTML(id); bindChal(id,list); markRv(id); foot1(list);
  };
  // 重新整理後若仍在鎖定期，補上計時
  const st=chState(id);
  if(!st.pass && Date.now()<st.lockUntil && !TIMERS[id]){ TIMERS[id]=1; setTimeout(()=>{TIMERS[id]=0; if(!st.pass){st.draw=pick2(id,st.draw);st.ans={};st.result=null;st.msg='新題目來了，再挑戰一次！';save();if($('ch_'+id)){$('ch_'+id).innerHTML=chalHTML(id);bindChal(id,list);}}}, st.lockUntil-Date.now()); }
}
function itemDone(id){return !!S.causes[id] && (!CHALLENGE[id] || chState(id).pass);}
function markRv(id){const el=$('rv_'+id);if(el)el.classList.toggle('doneit',itemDone(id));}
function isOptional(r){return CONFIG.LUCKY_OPTIONAL && r.ok;}
/* 訂正分：答錯的題目通過訂正挑戰，每題加回 2 分；今日成績＝(原始分＋訂正分)÷2 */
function fixScore(A){
  A=A||analyze();
  const passed=A.res.filter(r=>!r.ok && S.ch && S.ch[r.it.id] && S.ch[r.it.id].pass).length;
  const fix=A.score+POINTS*passed;
  return {passed, fix, today:(A.score+fix)/2};
}
let progTimer=null;
function sendProgress(){
  if(!CONFIG.GAS_URL || S.demo) return;
  clearTimeout(progTimer);
  progTimer=setTimeout(()=>{const {p}=basePayload(); const f=fixScore(); Object.assign(p,{type:'progress',fixScore:f.fix,todayScore:f.today,passed:f.passed}); post(p).catch(()=>{});},1500);
}
function foot1(list){
  const req=list.filter(r=>!isOptional(r)), opt=list.filter(isOptional);
  const d=req.filter(r=>itemDone(r.it.id)).length, od=opt.filter(r=>itemDone(r.it.id)).length;
  setFoot(`<button class="btn btn-ghost" onclick="goStep(0)">‹ 上一步</button><div class="sp">已完成訂正 ${d} / ${req.length} 題${opt.length?`　（選做 ${od} / ${opt.length}）`:''}<br><b style="color:var(--pri)">訂正分 ${fixScore().fix}　今日成績 ${fixScore().today}</b></div><button class="btn btn-pri" id="to2" ${d<req.length?'disabled':''}>下一步：看我的分析 ›</button>`);
  $('to2').onclick=()=>goStep(2);
}
function causeStats(A){
  const list=reviewList(A);
  return Object.keys(CAUSES).map(k=>({k,name:CAUSES[k].icon+' '+CAUSES[k].name,n:list.filter(r=>S.causes[r.it.id]===k).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
}
function causeBars(cs,small){
  const max=Math.max(1,...cs.map(c=>c.n));

  h+=`</div><div class="panel"><h3>寫一句給下次的自己</h3><p class="hint">要具體喔！例如：「下次考試我要把題目的『不』和『錯誤』圈起來。」</p>

  });
  $('goal').oninput=e=>{S.goal=e.target.value;save();foot2();};
  foot2();
}
function foot2(){

/* ==========================================================
   送出到 Google Sheets（選用）
   ========================================================== */
function post(payload){
  return fetch(CONFIG.GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
}
function basePayload(){
  const A=analyze();
  return {A, p:{exam:CONFIG.EXAM_ID, title:CONFIG.TITLE, cls:S.cls, seat:S.seat, score:A.score, est:S.est,
    quad:{a:A.res.filter(r=>r.q==='a').length,b:A.res.filter(r=>r.q==='b').length,c:A.res.filter(r=>r.q==='c').length,d:A.res.filter(r=>r.q==='d').length},
    trap:A.res.filter(r=>r.q==='b').map(r=>r.it.label).join('、')}};
}
function sendSubmit(){
  if(!CONFIG.GAS_URL || S.demo) return;
  const {A,p}=basePayload();
  Object.assign(p,{type:'submit', submitAt:S.submitAt,
    answers:S.answers, conf:S.conf,
    items:A.res.map(r=>({id:r.it.id,label:r.it.label,key:r.it.a,ans:S.answers[r.it.id],conf:r.c,ok:r.ok,q:r.q,topic:TOPICS[r.it.t],skill:SKILLS[r.it.s]})),
    topics:Object.fromEntries(A.topics.map(t=>[t.name,t.pct])),
    skills:Object.fromEntries(A.skills.map(t=>[t.name,t.pct]))});
  post(p).then(()=>{S.sentSubmit=true;save();const m=$('sendMsg');if(m)m.textContent=sendMsgText();})
    .catch(()=>{const m=$('sendMsg');if(m)m.textContent='⚠️ 網路傳送失敗，請截圖交給老師（下次登入會自動重送）';});
}
function sendReflect(){
  if(!CONFIG.GAS_URL || S.sent || S.demo) return;
  const {A,p}=basePayload();
  Object.assign(p,{type:'reflect', causes:S.causes,
    causeCount:Object.fromEntries(causeStats(A).map(c=>[CAUSES[c.k].name,c.n])),
    causeByItem:Object.fromEntries(Object.entries(S.causes).map(([id,k])=>[ITEMS.find(i=>i.id===id).label,CAUSES[k].name])),
    fixScore:fixScore(A).fix, todayScore:fixScore(A).today,
    extraWrong:Object.keys(S.extra||{}).map(id=>ITEMS.find(i=>i.id===id).label).join('、'),
    challenge:Object.fromEntries(Object.entries(S.ch||{}).filter(([id,c])=>c.pass).map(([id,c])=>[ITEMS.find(i=>i.id===id).label,c.tries])),
    strategies:S.strategies, goal:S.goal});
  post(p).then(()=>{S.sent=true;save();const m=$('sendMsg');if(m)m.textContent='✅ 檢討結果已送出給老師';})
    .catch(()=>{const m=$('sendMsg');if(m)m.textContent='⚠️ 網路傳送失敗，請把這個畫面截圖交給老師。';});
}
async function sendMail(){
  const to=$('mailTo').value.trim(), m=$('mailMsg');
  const say=(t,c)=>{m.textContent=t;m.style.color=c||'var(--sub)';};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return say('Email 格式不太對，再檢查一下喔！','var(--bad)');
  if(S.demo) return say('🧪 示範模式不會真的寄出。','var(--guess)');
  if(!CONFIG.GAS_URL) return say('目前沒有設定寄信功能，請改用截圖保存。','var(--bad)');
  if(!S.sent) return say('報告還在送出中，請稍等幾秒再按一次。','var(--warn)');
  $('mailBtn').disabled=true; say('寄送中…');
  try{
    const u=CONFIG.GAS_URL+'?action=email&exam='+encodeURIComponent(CONFIG.EXAM_ID)+'&cls='+S.cls+'&seat='+S.seat+'&to='+encodeURIComponent(to);
    const j=await (await fetch(u)).json();
    say((j.ok?'✅ ':'⚠️ ')+j.msg, j.ok?'var(--ok)':'var(--bad)');
  }catch(e){ say('⚠️ 網路有問題，請稍後再試，或先截圖保存。','var(--bad)'); }
  $('mailBtn').disabled=false;
}
/* 登入時向雲端查詢：是否開放檢討、是否已有交卷紀錄 */
async function fetchStatus(cls,seat){
  if(!CONFIG.GAS_URL) return null;
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
    const u=CONFIG.GAS_URL+'?action=status&exam='+encodeURIComponent(CONFIG.EXAM_ID)+'&cls='+cls+'&seat='+seat;
    const r=await fetch(u,{signal:ctl.signal}); clearTimeout(t);
    const j=await r.json();
    if(typeof j.reviewOpen==='boolean') REVIEW_OPEN=j.reviewOpen;
    return j;
  }catch(e){ return null; }
}

initLogin();
