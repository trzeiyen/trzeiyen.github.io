<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>三大政權對對碰</title>
<style>
:root{
  --ink:#2b2118;--muted:#7a6a55;--paper:#f4ecdc;--card:#fffaf0;--line:#dccbaa;
  --red:#c8423b;--red-soft:#f8dfdb;--red-deep:#9b2f29;
  --blue:#2f6db0;--blue-soft:#dbe8f7;--blue-deep:#214f82;
  --ok:#2e8b57;--bad:#c0392b;--gold:#c9952b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;}
input{font-family:inherit;-webkit-user-select:text;user-select:text;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ===== 開始畫面 ===== */
#start{align-items:center;justify-content:center;padding:24px;overflow:auto;}
.start-box{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:32px 36px;max-width:760px;width:100%;box-shadow:0 8px 24px rgba(60,40,10,.12);}
.start-box h1{margin:0 0 4px;font-size:clamp(28px,4.5vw,42px);text-align:center;letter-spacing:2px;}
.start-box .sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:18px;}
.name-row{display:flex;gap:16px;margin-bottom:22px;}
.name-row label{flex:1;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:18px;}
.name-row input{font-size:22px;padding:12px 14px;border-radius:12px;border:3px solid;background:#fff;}
#nameA{border-color:var(--red);}#nameB{border-color:var(--blue);}
.rules{background:#f7f0e2;border-radius:14px;padding:14px 20px;font-size:17px;line-height:1.75;margin-bottom:24px;}
.rules b{color:var(--red-deep);}
.big-btn{display:block;width:100%;font-size:26px;font-weight:800;padding:18px;border-radius:16px;background:var(--ink);color:#fff;letter-spacing:4px;}
.big-btn:active{transform:scale(.98);}

/* ===== 遊戲畫面 ===== */
#game{padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;}
.topbar{display:flex;align-items:center;gap:10px;}
.progress{font-weight:800;font-size:18px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px;}
.topbar .spacer{flex:1;}
.small-btn{font-size:16px;font-weight:700;padding:8px 14px;border-radius:10px;background:var(--card);border:2px solid var(--line);color:var(--ink);}
.small-btn:active{background:#eadfc8;}
.question{
  background:var(--card);border:3px solid var(--ink);border-radius:20px;
  padding:18px 24px;text-align:center;min-height:110px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.question .tag{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:2px;}
.question .text{font-size:clamp(24px,3.6vw,38px);font-weight:800;line-height:1.35;}
.question .hint{font-size:15px;color:var(--muted);}
.arena{flex:1;display:flex;gap:12px;min-height:0;}
.team{flex:1;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;border:4px solid;min-height:0;}
.team.A{background:var(--red-soft);border-color:var(--red);}
.team.B{background:var(--blue-soft);border-color:var(--blue);}
.team-head{display:flex;align-items:center;justify-content:space-between;}
.team-name{font-size:24px;font-weight:800;}
.team.A .team-name{color:var(--red-deep);} .team.B .team-name{color:var(--blue-deep);}
.score{font-size:30px;font-weight:900;color:#fff;border-radius:14px;padding:2px 16px;min-width:72px;text-align:center;}
.team.A .score{background:var(--red);} .team.B .score{background:var(--blue);}
.opts{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;}
.opt{
  flex:1;min-height:58px;font-size:clamp(22px,3vw,30px);font-weight:800;border-radius:16px;
  background:#fff;color:var(--ink);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.opt .box{width:28px;height:28px;border-radius:8px;border:3px solid #b8a98e;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
.team.A .opt.on{background:var(--red);color:#fff;border-color:var(--red-deep);}
.team.B .opt.on{background:var(--blue);color:#fff;border-color:var(--blue-deep);}
.opt.on .box{border-color:#fff;}
.opt.on .box::after{content:"✓";}
.submit{font-size:24px;font-weight:900;padding:14px;border-radius:16px;color:#fff;letter-spacing:6px;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.team.A .submit{background:var(--red-deep);} .team.B .submit{background:var(--blue-deep);}
.submit:disabled{opacity:.35;}
.opt:active,.submit:active{transform:translateY(2px);}
.waiting{
  position:absolute;inset:60px 14px 14px;border-radius:16px;background:rgba(255,250,240,.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:26px;font-weight:800;text-align:center;
}
.waiting .ico{font-size:56px;}
.waiting small{font-size:17px;color:var(--muted);font-weight:600;}
.team.done .waiting{display:flex;}

/* ===== 揭曉視窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
.overlay.show{display:flex;}
.reveal{background:var(--card);border-radius:24px;padding:24px 28px;max-width:820px;width:100%;max-height:100%;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.3);}
.reveal .q{font-size:22px;font-weight:800;text-align:center;margin-bottom:12px;}
.answer-line{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px;}
.chip{display:inline-block;padding:6px 16px;border-radius:999px;color:#fff;font-weight:800;font-size:24px;margin:4px;}
.chip.nl{background:#d9761f;} .chip.es{background:#8e44ad;} .chip.zh{background:#2e7d5b;}
.exp{background:#f7f0e2;border-left:6px solid var(--gold);border-radius:10px;padding:12px 16px;font-size:19px;line-height:1.7;margin-bottom:16px;}
.res-row{display:flex;gap:12px;margin-bottom:18px;}
.res{flex:1;border-radius:16px;padding:12px 14px;border:3px solid;}
.res.A{border-color:var(--red);background:var(--red-soft);}
.res.B{border-color:var(--blue);background:var(--blue-soft);}
.res .who{font-weight:800;font-size:19px;}
.res .mark{font-size:30px;font-weight:900;}
.res .mark.ok{color:var(--ok);} .res .mark.bad{color:var(--bad);}
.res .picked{font-size:16px;color:var(--ink);margin:2px 0;}
.res .pts{font-size:20px;font-weight:900;}
.res .bonus{display:inline-block;background:var(--gold);color:#fff;border-radius:8px;padding:1px 8px;font-size:15px;margin-left:4px;}

/* ===== 結束畫面 ===== */
#end{align-items:center;padding:20px;overflow:auto;}
.end-box{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:26px 30px;max-width:900px;width:100%;}
.winner{text-align:center;font-size:clamp(30px,5vw,46px);font-weight:900;margin:0 0 8px;}
.final{display:flex;gap:14px;justify-content:center;margin-bottom:20px;}
.final div{flex:1;max-width:280px;text-align:center;border-radius:18px;padding:12px;color:#fff;}
.final .fa{background:var(--red);} .final .fb{background:var(--blue);}
.final .n{font-size:22px;font-weight:800;} .final .s{font-size:48px;font-weight:900;line-height:1.1;}
.final .c{font-size:15px;opacity:.9;}
.end-box h2{font-size:22px;margin:0 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
.review{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.rv{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;}
.rv .t{font-weight:800;font-size:19px;margin-bottom:4px;}
.rv .a{font-size:17px;margin-bottom:4px;}
.rv .a b{color:var(--ok);}
.rv .m{font-size:15px;color:var(--muted);}
.rv .m span{font-weight:700;}
.allgood{text-align:center;font-size:20px;padding:16px;color:var(--ok);font-weight:800;}

@media (max-height:700px){
  .question{min-height:80px;padding:10px 16px;}
  .opt{min-height:48px;}
  .submit{padding:10px;}
}
</style>
</head>
<body>

<!-- 開始畫面 -->
<section id="start" class="screen active">
  <div class="start-box">
    <h1>⚓ 三大政權對對碰</h1>
    <p class="sub">荷蘭人・西班牙人・鄭氏政權，這是誰做的事？</p>
    <div class="name-row">
      <label>左邊隊伍<input id="nameA" maxlength="8" value="紅隊"></label>
      <label>右邊隊伍<input id="nameB" maxlength="8" value="藍隊"></label>
    </div>
    <div class="rules">
      ① 兩隊<b>同時作答</b>，各自點選自己這一邊的按鈕。<br>
      ② 答案可能<b>不只一個</b>，選好後按「送出」。<br>
      ③ 答對 <b>+1 分</b>；兩隊中<b>最快答對</b>的那一隊再 <b>+1 分</b>。<br>
      ④ 答錯不扣分。兩隊都送出後才揭曉答案。
    </div>
    <button class="big-btn" id="btnStart">開始比賽</button>
  </div>
</section>

<!-- 遊戲畫面 -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="progress" id="progress">第 1 / 35 題</div>
    <div class="spacer"></div>
    <button class="small-btn" id="btnForce">直接揭曉</button>
    <button class="small-btn" id="btnQuit">結束比賽</button>
  </div>
  <div class="question">
    <div class="tag" id="qTag">在臺時間</div>
    <div class="text" id="qText">題目</div>
    <div class="hint">可能有一個以上的答案</div>
  </div>
  <div class="arena">
    <div class="team A" id="teamA">
      <div class="team-head"><span class="team-name" data-name>紅隊</span><span class="score" data-score>0</span></div>
      <div class="opts" data-opts></div>
      <button class="submit" data-submit disabled>送出</button>
      <div class="waiting"><div class="ico">🔒</div>已送出<small>等待對手作答…</small></div>
    </div>
    <div class="team B" id="teamB">
      <div class="team-head"><span class="team-name" data-name>藍隊</span><span class="score" data-score>0</span></div>
      <div class="opts" data-opts></div>
      <button class="submit" data-submit disabled>送出</button>
      <div class="waiting"><div class="ico">🔒</div>已送出<small>等待對手作答…</small></div>
    </div>
  </div>
</section>

<!-- 揭曉視窗 -->
<div class="overlay" id="overlay">
  <div class="reveal">
    <div class="q" id="rvQ"></div>
    <div class="answer-line">正確答案：<span id="rvAns"></span></div>
    <div class="exp" id="rvExp"></div>
    <div class="res-row" id="rvRes"></div>
    <button class="big-btn" id="btnNext">下一題 ➜</button>
  </div>
</div>

<!-- 結束畫面 -->
<section id="end" class="screen">
  <div class="end-box">
    <p class="winner" id="winner"></p>
    <div class="final">
      <div class="fa"><div class="n" id="fnA"></div><div class="s" id="fsA"></div><div class="c" id="fcA"></div></div>
      <div class="fb"><div class="n" id="fnB"></div><div class="s" id="fsB"></div><div class="c" id="fcB"></div></div>
    </div>
    <h2>📖 錯題複習</h2>
    <div class="review" id="review"></div>
    <button class="big-btn" id="btnAgain">再玩一次</button>
  </div>
</section>

<script>
const LABEL = { nl: '荷蘭人', es: '西班牙人', zh: '鄭氏政權' };
const KEYS = ['nl', 'es', 'zh'];

const QUESTIONS = [
  // 在臺時間
  { c: '在臺時間', t: '西元 1624 年～1662 年在臺灣', a: ['nl'], e: '荷蘭人 1624 年來臺，1662 年被鄭成功趕走，在臺約 38 年。' },
  { c: '在臺時間', t: '西元 1626 年～1642 年在臺灣', a: ['es'], e: '西班牙人 1626 年佔領北臺灣，1642 年被荷蘭人趕走，在臺約 16 年。' },
  { c: '在臺時間', t: '西元 1662 年～1684 年在臺灣', a: ['zh'], e: '鄭成功 1662 年趕走荷蘭人，鄭氏政權統治到 1684 年被清朝取代。' },
  // 來臺目的
  { c: '來臺目的', t: '來臺灣的目的是「貿易、傳教」', a: ['nl', 'es'], e: '荷蘭人和西班牙人都是為了貿易與傳教來到臺灣。' },
  { c: '來臺目的', t: '來臺灣的目的是「反清復明」', a: ['zh'], e: '鄭氏政權來臺是政治目的：以臺灣為基地，反清復明。' },
  // 據點
  { c: '在臺據點', t: '據點在今天的臺南安平', a: ['nl'], e: '荷蘭人的據點在今臺南安平。' },
  { c: '在臺據點', t: '據點在今天的基隆、淡水', a: ['es'], e: '西班牙人的據點在北臺灣的今基隆、淡水。' },
  { c: '在臺據點', t: '據點在今天的臺南、高雄一帶', a: ['zh'], e: '鄭氏政權以今臺南、高雄一帶為中心。' },
  // 被誰驅逐
  { c: '離開臺灣', t: '被鄭成功趕出臺灣', a: ['nl'], e: '荷蘭人被鄭成功打敗，1662 年離開臺灣。' },
  { c: '離開臺灣', t: '被荷蘭人趕出臺灣', a: ['es'], e: '西班牙人被荷蘭人打敗，1642 年離開臺灣。' },
  { c: '離開臺灣', t: '被清朝（施琅）打敗', a: ['zh'], e: '清朝派施琅攻臺，鄭氏政權於 1684 年結束。' },
  // 建築物
  { c: '建築物', t: '建造熱蘭遮城（今安平古堡）', a: ['nl'], e: '熱蘭遮城由荷蘭人建造，今名安平古堡。' },
  { c: '建築物', t: '建造普羅民遮城（今赤崁樓）', a: ['nl'], e: '普羅民遮城由荷蘭人建造，今名赤崁樓。' },
  { c: '建築物', t: '建造聖多明哥城（今紅毛城）', a: ['es'], e: '聖多明哥城由西班牙人在淡水建造，今名紅毛城。' },
  { c: '建築物', t: '建造聖薩爾瓦多城（現在已經不存在）', a: ['es'], e: '聖薩爾瓦多城由西班牙人在基隆建造，現在已經不存在了。' },
  { c: '建築物', t: '在臺南設立「承天府」作為行政中心', a: ['zh'], e: '鄭氏政權在臺南設承天府，作為行政中心。' },
  // 賣出商品
  { c: '賣出商品', t: '從臺灣賣出蔗糖', a: ['nl', 'zh'], e: '荷蘭人和鄭氏政權都賣出蔗糖、鹿皮；西班牙人則沒有。' },
  { c: '賣出商品', t: '從臺灣賣出鹿皮', a: ['nl', 'zh'], e: '荷蘭人和鄭氏政權都賣出蔗糖、鹿皮；西班牙人則沒有。' },
  // 買進商品
  { c: '買進商品', t: '買進香料', a: ['nl', 'zh'], e: '荷蘭人和鄭氏政權都買進香料、絲綢、瓷器。' },
  { c: '買進商品', t: '買進絲綢、瓷器', a: ['nl', 'zh'], e: '荷蘭人和鄭氏政權都買進香料、絲綢、瓷器。' },
  { c: '買進商品', t: '買進白銀', a: ['zh'], e: '鄭氏政權買進香料、白銀、軍需品、藥材、絲綢、瓷器。' },
  { c: '買進商品', t: '買進軍需品', a: ['zh'], e: '鄭氏政權要反清復明，需要買進軍需品。' },
  { c: '買進商品', t: '買進藥材', a: ['zh'], e: '鄭氏政權買進香料、白銀、軍需品、藥材、絲綢、瓷器。' },
  // 宗教
  { c: '傳入宗教', t: '傳入基督教', a: ['nl'], e: '荷蘭人傳入基督教。' },
  { c: '傳入宗教', t: '傳入天主教', a: ['es'], e: '西班牙人傳入天主教。' },
  { c: '傳入宗教', t: '帶來民間信仰（玄天上帝、媽祖）', a: ['zh'], e: '鄭氏政權帶來玄天上帝、媽祖等民間信仰。' },
  // 教育
  { c: '教育方面', t: '用羅馬拼音拼寫原住民族語言', a: ['nl'], e: '荷蘭傳教士用羅馬拼音拼寫原住民族語言，後來稱為「新港文書」。' },
  { c: '教育方面', t: '建立孔廟、設立學校', a: ['zh'], e: '鄭氏政權建立孔廟、設立學校。' },
  { c: '教育方面', t: '制定考試制度選拔人才', a: ['zh'], e: '鄭氏政權制定考試制度選拔人才。' },
  { c: '教育方面', t: '推動儒家思想文化', a: ['zh'], e: '鄭氏政權推動儒家思想文化。' },
  // 其他
  { c: '其他', t: '引進黃牛', a: ['nl'], e: '荷蘭人引進黃牛，以及豌豆、蓮霧、芒果等農作物。' },
  { c: '其他', t: '引進豌豆、蓮霧、芒果等農作物', a: ['nl'], e: '荷蘭人引進黃牛，以及豌豆、蓮霧、芒果等農作物。' },
  { c: '其他', t: '東北角「三貂角」的地名由來（Santiago 聖地牙哥）', a: ['es'], e: '西班牙人把東北角取名 Santiago（聖地牙哥），後來音譯成「三貂角」。' },
  { c: '其他', t: '臺南的「林鳳營、左鎮」地名由來', a: ['zh'], e: '鄭氏政權留下軍隊駐守的地名，如臺南的林鳳營、左鎮。' },
  { c: '其他', t: '高雄的「左營、前鎮」地名由來', a: ['zh'], e: '鄭氏政權留下軍隊駐守的地名，如高雄的左營、前鎮。' },
];

const $ = id => document.getElementById(id);
const teams = {
  A: { el: $('teamA'), name: '紅隊', score: 0, correct: 0 },
  B: { el: $('teamB'), name: '藍隊', score: 0, correct: 0 },
};
let order = [], idx = 0, qStart = 0, revealed = false, history = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const fmt = keys => keys.length ? KEYS.filter(k => keys.includes(k)).map(k => LABEL[k]).join('、') : '未作答';
const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));

// 建立兩邊的選項按鈕（用 pointerdown，讓 iPad 兩邊可同時點擊）
Object.entries(teams).forEach(([id, t]) => {
  const box = t.el.querySelector('[data-opts]');
  KEYS.forEach(k => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.k = k;
    b.innerHTML = `<span class="box"></span>${LABEL[k]}`;
    b.addEventListener('pointerdown', e => { e.preventDefault(); toggle(id, k, b); });
    box.appendChild(b);
  });
  const sub = t.el.querySelector('[data-submit]');
  sub.addEventListener('pointerdown', e => { e.preventDefault(); submit(id); });
  t.subBtn = sub; t.opts = box.querySelectorAll('.opt');
});

function toggle(id, k, btn) {
  const t = teams[id];
  if (t.submitted || revealed) return;
  t.sel.has(k) ? t.sel.delete(k) : t.sel.add(k);
  btn.classList.toggle('on', t.sel.has(k));
  t.subBtn.disabled = t.sel.size === 0;
}

function submit(id) {
  const t = teams[id];
  if (t.submitted || revealed || t.sel.size === 0) return;
  t.submitted = true;
  t.time = performance.now() - qStart;
  t.opts.forEach(o => o.classList.remove('on')); // 送出後藏起選擇，避免對手偷看
  t.el.classList.add('done');
  if (teams.A.submitted && teams.B.submitted) setTimeout(reveal, 350);
}

function loadQuestion() {
  const q = order[idx];
  revealed = false;
  $('progress').textContent = `第 ${idx + 1} / ${order.length} 題`;
  $('qTag').textContent = q.c;
  $('qText').textContent = q.t;
  Object.values(teams).forEach(t => {
    t.sel = new Set(); t.submitted = false; t.time = Infinity;
    t.opts.forEach(o => o.classList.remove('on'));
    t.subBtn.disabled = true;
    t.el.classList.remove('done');
  });
  qStart = performance.now();
}

function reveal() {
  if (revealed) return;
  revealed = true;
  const q = order[idx];
  const res = {};
  Object.entries(teams).forEach(([id, t]) => {
    const picked = t.submitted ? [...t.sel] : [];
    res[id] = { picked, ok: t.submitted && same(picked, q.a), time: t.time, pts: 0, bonus: false };
  });
  const okIds = Object.keys(res).filter(id => res[id].ok);
  okIds.forEach(id => res[id].pts += 1);
  if (okIds.length) {
    const fastest = okIds.reduce((a, b) => res[a].time <= res[b].time ? a : b);
    res[fastest].pts += 1; res[fastest].bonus = true;
  }
  Object.entries(res).forEach(([id, r]) => {
    teams[id].score += r.pts;
    if (r.ok) teams[id].correct += 1;
  });
  history.push({ q, res });
  updateScores();

  $('rvQ').textContent = `【${q.c}】${q.t}`;
  $('rvAns').innerHTML = KEYS.filter(k => q.a.includes(k)).map(k => `<span class="chip ${k}">${LABEL[k]}</span>`).join('');
  $('rvExp').textContent = q.e;
  $('rvRes').innerHTML = ['A', 'B'].map(id => {
    const r = res[id], t = teams[id];
    const sec = r.time === Infinity ? '' : `（${(r.time / 1000).toFixed(1)} 秒）`;
    return `<div class="res ${id}">
      <div class="who">${t.name} <span class="mark ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✔' : '✘'}</span></div>
      <div class="picked">選了：${fmt(r.picked)}${sec}</div>
      <div class="pts">+${r.pts} 分${r.bonus ? '<span class="bonus">⚡最快答對</span>' : ''}</div>
    </div>`;
  }).join('');
  $('btnNext').textContent = idx + 1 < order.length ? '下一題 ➜' : '看比賽結果 🏆';
  $('overlay').classList.add('show');
}

function updateScores() {
  Object.values(teams).forEach(t => t.el.querySelector('[data-score]').textContent = t.score);
}

function startGame() {
  teams.A.name = $('nameA').value.trim() || '紅隊';
  teams.B.name = $('nameB').value.trim() || '藍隊';
  Object.values(teams).forEach(t => {
    t.score = 0; t.correct = 0;
    t.el.querySelector('[data-name]').textContent = t.name;
  });
  updateScores();
  order = shuffle(QUESTIONS); idx = 0; history = [];
  show('game');
  loadQuestion();
}

function endGame() {
  $('overlay').classList.remove('show');
  const A = teams.A, B = teams.B;
  $('winner').textContent = A.score === B.score ? '🤝 平手！兩隊都很厲害！'
    : `🏆 ${A.score > B.score ? A.name : B.name} 獲勝！`;
  $('fnA').textContent = A.name; $('fsA').textContent = A.score; $('fcA').textContent = `答對 ${A.correct} / ${history.length} 題`;
  $('fnB').textContent = B.name; $('fsB').textContent = B.score; $('fcB').textContent = `答對 ${B.correct} / ${history.length} 題`;
  const wrong = history.filter(h => !h.res.A.ok || !h.res.B.ok);
  $('review').innerHTML = wrong.length ? wrong.map(h => {
    const miss = ['A', 'B'].filter(id => !h.res[id].ok)
      .map(id => `<span>${teams[id].name}</span> 選了「${fmt(h.res[id].picked)}」`).join('；');
    return `<div class="rv"><div class="t">【${h.q.c}】${h.q.t}</div>
      <div class="a">正解：<b>${fmt(h.q.a)}</b>　—　${h.q.e}</div>
      <div class="m">${miss}</div></div>`;
  }).join('') : '<div class="allgood">🎉 兩隊全部答對，沒有錯題！</div>';
  show('end');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

$('btnStart').addEventListener('click', startGame);
$('btnForce').addEventListener('click', () => { if (!revealed) reveal(); });
$('btnQuit').addEventListener('click', () => { if (confirm('確定要結束比賽並看結果嗎？')) endGame(); });
$('btnNext').addEventListener('click', () => {
  $('overlay').classList.remove('show');
  idx++;
  idx < order.length ? loadQuestion() : endGame();
});
$('btnAgain').addEventListener('click', () => show('start'));

// 防止 iPad 雙指縮放
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
