<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>散木樹心圖・停靠站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow portrait column, one step on screen at a time, like turning pages of a field notebook under the tree */
:root{
  --paper:#F1F4E8; --card:#FFFFFF; --ink:#26331A; --muted:#626C55; --line:#D6DCC6;
  --moss:#4A6328; --moss-ink:#FFFFFF; --bark:#6E4C2C; --sun:#D9A43A; --leaf:#B9CF8C; --leaf-soft:#E3EBCF;
  --shadow:0 10px 30px -18px rgba(38,51,26,.45);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161B11; --card:#1F2618; --ink:#E7ECDA; --muted:#A2AB92; --line:#343F29;
  --moss:#A8C47A; --moss-ink:#16200C; --bark:#D6AC7E; --sun:#E8B84F; --leaf:#55733A; --leaf-soft:#27321C;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#161B11; --card:#1F2618; --ink:#E7ECDA; --muted:#A2AB92; --line:#343F29;
  --moss:#A8C47A; --moss-ink:#16200C; --bark:#D6AC7E; --sun:#E8B84F; --leaf:#55733A; --leaf-soft:#27321C;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding-inline:18px;padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.55rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* progress: five leaves = five steps */
.steps{display:flex;gap:8px;align-items:center;justify-content:center;padding-block:4px 14px}
.steps i{width:16px;height:16px;border-radius:0 70% 0 70%;background:var(--line);transform:rotate(-12deg);transition:background .3s}
.steps i.on{background:var(--moss)}
.steps i.now{background:var(--sun)}

section.screen.enter{animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}

.eyebrow{font-size:.82rem;letter-spacing:.12em;color:var(--bark);font-weight:700}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 22px;font:700 1.05rem var(--f-body);background:var(--moss);color:var(--moss-ink);cursor:pointer;min-height:52px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--moss);border:1.5px solid var(--moss)}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.num:focus-visible,.spot:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--muted);font:500 .95rem var(--f-body);text-decoration:underline;cursor:pointer;padding:8px}

/* opening */
.hero{padding-block:8px 4px}
.hero h1 span{display:block;font-size:1rem;color:var(--bark);font-weight:400;margin-bottom:4px;letter-spacing:.08em}
.quote{border-left:3px solid var(--leaf);padding-left:14px;font-family:var(--f-display);font-size:1.12rem}
.phase{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phase button{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 10px;font:500 1rem var(--f-body);cursor:pointer;text-align:center;min-height:64px}
.phase button[aria-pressed="true"]{border-color:var(--moss);background:var(--leaf-soft);font-weight:700}

/* breathing leaf */
.breath{display:grid;place-items:center;gap:12px;padding-block:8px}
.breath canvas{width:200px;height:200px;max-width:100%}
.breath .cue{font-family:var(--f-display);font-size:1.5rem;min-height:2.2em;text-align:center}

/* tree picker */
.treebox{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#EAF0DC}
.treebox img{display:block;width:100%;height:auto}
.spot{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.spot.here{border:3px dashed #FFFFFF;box-shadow:0 0 0 2px var(--bark)}
.spot.sel{box-shadow:0 0 0 4px var(--sun),0 0 0 999px rgba(20,28,12,.35)}
.zoomtip{font-size:.85rem;color:var(--muted);text-align:center}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:700 1.1rem var(--f-body);min-height:48px;cursor:pointer;font-variant-numeric:tabular-nums}
.num[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.num.was{border-style:dashed;border-color:var(--bark)}

/* role reveal card */
.reveal{perspective:900px}
.rcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--leaf)}
.enter .rcard{animation:flip .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{transform:rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.rhead{display:flex;gap:14px;align-items:center}
.crop{width:96px;height:96px;flex:0 0 96px;border-radius:50%;background-repeat:no-repeat;border:3px solid var(--leaf);background-color:#EAF0DC}
.rno{font:700 .95rem var(--f-body);color:var(--bark);font-variant-numeric:tabular-nums}
.rname{font-family:var(--f-display);font-size:1.7rem;line-height:1.2}
.ask{font-family:var(--f-display);font-size:1.25rem;background:var(--leaf-soft);border-radius:14px;padding:12px 14px}
.label{font-weight:700;font-size:.95rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:500 1rem var(--f-body);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:400 1rem var(--f-body);resize:vertical}
.privacy{font-size:.82rem;color:var(--muted)}

/* recharge */
.charge{background:linear-gradient(180deg,var(--leaf-soft),var(--card));border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.charge .big{font-family:var(--f-display);font-size:1.45rem;line-height:1.5}
.battery{display:flex;gap:6px;align-items:center}
.battery b{flex:1;height:12px;border-radius:6px;background:var(--line);transition:background .5s}
.battery b.on{background:var(--moss)}
.move{font-family:var(--f-display);font-size:1.2rem;text-align:center;padding:10px;border:1.5px dashed var(--bark);border-radius:14px}
.cardimg{width:100%;border-radius:18px;box-shadow:var(--shadow)}
.care{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* dashboard */
.dash h2{margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;align-items:end;height:160px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px}
.bars u{display:block;width:100%;border-radius:3px 3px 0 0;text-decoration:none}
.bars .pre{background:var(--leaf)}
.bars .post{background:var(--moss)}
.bars em{font-style:normal;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;font-size:.62rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.scroll{overflow-x:auto}
.foot{margin-top:28px;text-align:center;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 3:{n:"並肩陪伴者",a:"兩人並肩坐在穩定枝幹上，靠近且安心。",q:"誰讓我覺得不用一直一個人撐著？",g:"C"},
 4:{n:"平衡前進者",a:"站在略細但安全枝幹上，雙手張開保持平衡，不抓繩。",q:"我最近是不是一直在維持某種平衡？",g:"B"},
 5:{n:"安靜整理者",a:"坐在樹下花草旁，低頭寫畫或整理小物。",q:"我現在需要答案，還是需要一點安靜？",g:"E"},

 10:{n:"自在閱讀者",a:"坐在穩定枝幹上看書，身體放鬆。",q:"我的安靜是在滋養我，還是隔離我？",g:"A"},

let breathTimer=null;
function sBreath(){
  app.innerHTML = `<section class="screen stack">${steps(1)}
    <h2>三次呼吸</h2>
    <p class="muted">跟著葉子：它長大時吸氣，縮回時慢慢吐氣。</p>
    <div class="breath"><canvas id="leaf" width="400" height="400" aria-hidden="true"></canvas><p class="cue" id="cue">準備</p></div>
    <button class="btn block" id="next">好了，看看那棵樹</button>
    <button class="linkbtn" id="skip">跳過呼吸</button>
  </section>`;
  const done=()=>{cancelAnimationFrame(breathTimer);go(2);};
  document.getElementById("next").onclick=done; document.getElementById("skip").onclick=done;
  runBreath(document.getElementById("leaf"),document.getElementById("cue"));
}
function drawLeaf(ctx,s){
  const c=getComputedStyle(document.documentElement);
  ctx.clearRect(0,0,400,400); ctx.save(); ctx.translate(200,210); ctx.rotate(-0.5); ctx.scale(s,s);
  ctx.beginPath(); ctx.moveTo(0,-150); ctx.bezierCurveTo(110,-90,110,70,0,150); ctx.bezierCurveTo(-110,70,-110,-90,0,-150);
  ctx.fillStyle=c.getPropertyValue("--leaf").trim(); ctx.fill();
  ctx.strokeStyle=c.getPropertyValue("--moss").trim(); ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(0,-140); ctx.lineTo(0,170); ctx.stroke();
  for(let i=-3;i<=3;i++){ if(!i) continue; const y=i*34; ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(Math.sign(i)*40,y-28,Math.sign(i)*62,y-40); ctx.lineWidth=3; ctx.stroke(); }
  ctx.restore();
}
function runBreath(cv,cue){
  const ctx=cv.getContext("2d"); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const plan=[["吸氣",4000,.55,1],["停一下",1500,1,1],["慢慢吐氣",6000,1,.55]]; let cycle=0,phase=0,t0=performance.now();
  drawLeaf(ctx,.55);
  function tick(t){
    const [label,dur,a,b]=plan[phase]; const k=Math.min(1,(t-t0)/dur);
    cue.textContent = cycle<3? `${label}・${cycle+1}/3` : "很好，你回來了";
    drawLeaf(ctx, reduce? b : a+(b-a)*(0.5-0.5*Math.cos(Math.PI*k)));
    if(k>=1){ phase++; t0=t; if(phase>=plan.length){phase=0;cycle++;} }
    if(cycle<3) breathTimer=requestAnimationFrame(tick); else drawLeaf(ctx,.8);
  }
  breathTimer=requestAnimationFrame(tick);
}

/* 樹葉卡：用 canvas 畫成圖片，方便長按儲存 */
async function makeCard(N, moveLine){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  const disp='"LXGW WenKai TC","Kaiti TC",serif', body='"Noto Sans TC","PingFang TC",sans-serif';
  x.fillStyle="#F1F4E8"; x.fillRect(0,0,W,H);
  // 大葉子底
  x.save(); x.translate(W/2,H/2+20); x.rotate(-0.28);
  x.beginPath(); x.moveTo(0,-640); x.bezierCurveTo(520,-380,520,360,0,640); x.bezierCurveTo(-520,360,-520,-380,0,-640);
  x.fillStyle="#E1EACB"; x.fill(); x.strokeStyle="#C9D8A6"; x.lineWidth=6; x.beginPath(); x.moveTo(0,-600); x.lineTo(0,660); x.stroke(); x.restore();
  // 角色頭像
  const img=new Image(); img.src=TREE_SRC; await img.decode().catch(()=>{});
  const [px,py]=SPOTS[S.now]; const sw=IMG_W*0.11, sx=px/100*IMG_W-sw/2, sy=py/100*IMG_H-sw/2;
  x.save(); x.beginPath(); x.arc(W/2,250,130,0,Math.PI*2); x.clip(); x.drawImage(img,sx,sy,sw,sw,W/2-130,120,260,260); x.restore();
  x.lineWidth=10; x.strokeStyle="#B9CF8C"; x.beginPath(); x.arc(W/2,250,135,0,Math.PI*2); x.stroke();
  x.textAlign="center"; x.fillStyle="#6E4C2C"; x.font=`700 40px ${body}`; x.fillText(`${S.now} 號`,W/2,445);
  x.fillStyle="#26331A"; x.font=`700 76px ${disp}`; x.fillText(ROLES[S.now].n,W/2,535);
  const lines=[];
  lines.push(["我現在最需要",S.need]);
  if(S.want) lines.push(["我想慢慢靠近",`${S.want} 號・${ROLES[S.want].n}`]);
  if(S.small.trim()) lines.push(["先做一件小事",S.small.trim()]);
  let y=640; x.textAlign="left";
  for(const [k,v] of lines){ x.fillStyle="#626C55"; x.font=`500 36px ${body}`; x.fillText(k,170,y); x.fillStyle="#26331A"; x.font=`700 46px ${disp}`; y=wrap(x,v,170,y+62,740,58)+70; }
  const tail = S.note.trim()? `「${S.note.trim()}」` : N.line;
  x.textAlign="center"; x.fillStyle="#4A6328"; x.font=`700 48px ${disp}`; wrapC(x,tail,W/2,Math.max(y+20,1060),800,66);
  x.fillStyle="#8A927C"; x.font=`400 28px ${body}`; x.fillText("散木樹心圖・向上，遇見不設限的自己",W/2,H-70);
  return cv.toDataURL("image/png");
}
function wrap(x,t,X,Y,maxW,lh){ let line=""; for(const ch of t){ if(x.measureText(line+ch).width>maxW){x.fillText(line,X,Y);line=ch;Y+=lh;} else line+=ch; } x.fillText(line,X,Y); return Y; }
function wrapC(x,t,X,Y,maxW,lh){ let line="",out=[]; for(const ch of t){ if(x.measureText(line+ch).width>maxW){out.push(line);line=ch;} else line+=ch; } out.push(line); out.slice(0,3).forEach((l,i)=>x.fillText(l,X,Y+i*lh)); }

/* ===== 匿名統計：只送號碼與選項，不送任何文字 ===== */
function submit(){
  if(S.phase==="pre") lsSet("treeheart_pre_"+CONFIG.EVENT, String(S.now));
  if(!CONFIG.GAS_URL) return;
  const payload={event:CONFIG.EVENT,phase:S.phase,cid:clientId,now:S.now,mirror:S.mirror,need:S.need,want:S.want||"",areas:S.areas.join("、")};
  try{ fetch(CONFIG.GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).catch(()=>{}); }catch(e){}
}

/* ===== 講者看板：網址後加 #dashboard ===== */
let dashTimer=null;
async function renderDash(){
  app.innerHTML = `<section class="dash stack"><p class="eyebrow">講者看板・${esc(CONFIG.EVENT)}</p><h2>全場在樹上的位置</h2><p class="muted small" id="st">讀取中…</p><div id="dv"></div></section>`;
  const st=document.getElementById("st");
  if(!CONFIG.GAS_URL){ st.textContent="尚未設定統計網址（CONFIG.GAS_URL），目前是預覽模式，沒有資料可顯示。"; return; }
  async function load(){
    try{
      const r=await fetch(CONFIG.GAS_URL+"?event="+encodeURIComponent(CONFIG.EVENT)); const rows=await r.json();
      drawDash(rows); st.textContent="每 15 秒自動更新・最後更新 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    }catch(e){ st.textContent="讀不到統計資料，請確認 GAS 已部署為「任何人皆可存取」。"; }
  }
  await load(); clearInterval(dashTimer); dashTimer=setInterval(load,15000);
}
function drawDash(rows){
  const last={pre:{},post:{}}; // 每支手機每階段只算最後一次
  rows.forEach(r=>{ if(last[r.phase]) last[r.phase][r.cid]=r; });
  const pre=Object.values(last.pre), post=Object.values(last.post);
  const cnt=a=>{const c=Array(26).fill(0); a.forEach(r=>c[+r.now]++); return c;};
  const cp=cnt(pre), cq=cnt(post), mx=Math.max(1,...cp,...cq);
  const pairs={}; let moved=0, both=0;
  Object.keys(last.post).forEach(id=>{ const a=last.pre[id], b=last.post[id]; if(a){ both++; if(+a.now!==+b.now) moved++; const k=`${a.now} → ${b.now}`; pairs[k]=(pairs[k]||0)+1; }});
  const needs={}; [...pre,...post].forEach(r=>{ if(r.need) needs[r.need]=(needs[r.need]||0)+1; });
  const bar=(c,cls)=>Array.from({length:25},(_,i)=>i+1).map(n=>`<div><em>${c[n]||""}</em><u class="${cls}" style="height:${c[n]/mx*100}%"></u></div>`).join("");
  document.getElementById("dv").innerHTML = `
    <div class="stack">
      <div class="kpis"><div class="kpi"><b>${pre.length}</b><span>開始時</span></div><div class="kpi"><b>${post.length}</b><span>結束時</span></div><div class="kpi"><b>${moved}/${both}</b><span>有移動</span></div></div>
      <div class="legend"><span><i style="background:var(--leaf)"></i>開始時</span><span><i style="background:var(--moss)"></i>結束時</span></div>
      <p class="label">開始時</p><div class="bars">${bar(cp,"pre")}</div><div class="axis">${Array.from({length:25},(_,i)=>`<span>${i+1}</span>`).join("")}</div>
      <p class="label">結束時</p><div class="bars">${bar(cq,"post")}</div><div class="axis">${Array.from({length:25},(_,i)=>`<span>${i+1}</span>`).join("")}</div>
      <p class="label">從哪裡移動到哪裡</p>
      <div class="scroll"><table class="tbl"><tr><th>移動</th><th>人數</th></tr>${Object.entries(pairs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")||`<tr><td colspan="2" class="muted">結束時有人填寫後，這裡會出現移動。</td></tr>`}</table></div>
      <p class="label">大家最需要的</p>
      <div class="chips">${Object.entries(needs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip" aria-pressed="false">${k}・${v}</span>`).join("")||`<span class="muted small">還沒有資料</span>`}</div>
      <p class="small muted">看板只呈現號碼與選項的匿名統計，用來理解全場的心理地圖，不作為分類或標籤。</p>
    </div>`;
}

window.addEventListener("hashchange",render);
render();
</script>
