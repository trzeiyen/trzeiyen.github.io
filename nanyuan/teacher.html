<body><div class="wrap">
<h1>讀懂選舉公報｜教師後台</h1>
<p class="lead">與〈穿越清帝國大逃脫〉共用同一個後台與密碼，作答存在「南園里-成績」工作表。<br>
為了維持中立，本頁不顯示任何「依候選人加總」的數字，政見也不標示是哪位候選人的。</p>
<div class="bar">
  <label>後台密碼<input id="key" type="password" autocomplete="off"></label>
  <label>篇<select id="ed"><option value="">全部</option><option value="li">里長篇</option><option value="council">議員篇</option><option value="mayor">市長篇</option></select></label>
  <label>班級<select id="cls"><option value="">全部</option><option>608</option><option>609</option><option>610</option></select></label>
  <label>顯示<select id="mode"><option value="last">每台最新一筆</option><option value="best">每台最高分</option></select></label>
  <button id="go">讀取</button>
  <span class="auto"><input type="checkbox" id="auto" checked>每 20 秒自動更新</span>
  <button id="proj" class="p">投影模式（隱藏分數）</button>
  <button id="csv" class="g private">下載 CSV</button>
</div>
<div id="msg"></div>
<div class="private">
<div class="cards" id="cards"></div>
<div class="box"><h2>正在作答的同學</h2>
  <div class="note">學生進入、換關、每量完一條政見時更新；超過 5 分鐘沒更新會變淡。</div>
  <div class="live" id="live"></div></div>
<div class="tbl"><table id="tb"></table></div>
</div>
<h2>各角色最在意的政見</h2>
<div class="note">可以投影出來，請同學說明：「我們這個角色，為什麼最在意這一條？」點「三把尺紀錄」看怎麼量。</div>
<div id="roles"></div>
<h2>全班的里民類型</h2>
<div class="note">測驗結果只代表同學在意的事，不對應任何候選人。可以問全班：「為什麼大家在意的事不一樣？」</div>
<div class="miss" id="types"></div>
<h2>換你當候選人：同學寫的政見</h2>
<div class="answers" id="mine"></div>
<div class="private">
<h2>第2關　最常放錯的卡片（全班錯誤次數）</h2>
<div class="miss" id="miss"></div>
</div>
</div>

  K27:'完善身障、銀髮、女性及適應體育資源，打造全齡運動生活圈。',
  K28:'爭取鶯歌公四公園內興建多功能運動中心暨各項設施。',

  K30:'將交通違規罰款收入優先投入道路安全改善，優化危險路口工程、標線及行人設施。',

  M22:'政見地圖上的地方建設：樹林大巨蛋、土城國際藝文中心、新莊三金博物館。'};
const NAMES = {'L1經歷':'第1關－經歷欄','L1政見':'第1關－政見欄',
  'L1誰寫':'第1關－公報內容是誰提供的','L1修路':'第1關－里長怎麼處理路破洞',
  'L2-A1':'第2關－守護','L2-A3':'第2關－接受監督','L2-A4':'第2關－做到','L2-A2':'第2關－追蹤',
  'L2-B1':'第2關－爭取','L2-B3':'第2關－配合','L2-B7':'第2關－開辦','L2-B8':'第2關－舉辦',
  'L1-w1':'議員篇第1關－報修路燈','L1-w2':'議員篇第1關－里民活動','L1-w3':'議員篇第1關－審預算','L1-w4':'議員篇第1關－質詢','L1-w5':'議員篇第1關－訂規定','L1-w6':'議員篇第1關－監督工程','L1-w7':'議員篇第1關－蓋捷運','L1-w8':'議員篇第1關－發敬老卡',
  'C席次':'議員篇第1關－選出幾位','C婦保':'議員篇第1關－婦女保障名額','C圈選':'議員篇第1關－一張票圈幾位','M席次':'市長篇第1關－選出幾位','M預算':'市長篇第1關－預算誰同意','M圈選':'市長篇第1關－一張票圈幾位','L2-X01':'市長篇第2關－交通減壓','L2-X02':'市長篇第2關－福利照顧','L2-X03':'市長篇第2關－產業升級','L2-X04':'市長篇第2關－鐵馬專用道','L2-X05':'市長篇第2關－監視系統','L2-X06':'市長篇第2關－國際賽事','L2-X07':'市長篇第2關－軌道建設','L2-X08':'市長篇第2關－育嬰留停','L2-X09':'市長篇第2關－巨蛋城科學城',
  'L2-V01':'議員篇第2關－提高到','L2-V02':'議員篇第2關－已爭取','L2-V03':'議員篇第2關－監督、督促','L2-V04':'議員篇第2關－嚴格監督','L2-V05':'議員篇第2關－爭取運動中心','L2-V06':'議員篇第2關－爭取假牙補助','L2-V07':'議員篇第2關－推動疫苗','L2-V08':'議員篇第2關－推動鐵路地下化','L2-V09':'議員篇第2關－監督捷運','L2-V10':'議員篇第2關－督促公托公幼','L2-V11':'議員篇第2關－路平燈明水溝通','L2-V12':'議員篇第2關－督促社宅'};
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let view = [], lastData=null;
const EDN={li:'里長篇',council:'議員篇',mayor:'市長篇'};
const seats = r=>[r.seat].concat(r.mates||[]).join('、')+' 號';
try{ $('#key').value=sessionStorage.getItem('ny-key')||''; }catch(e){}

async function load(){
  const key=$('#key').value.trim(); if(!key){ $('#msg').textContent='請輸入後台密碼。'; return; }
  try{ sessionStorage.setItem('ny-key',key); }catch(e){}
  $('#msg').textContent='讀取中……';
  try{
    const u=GAS_URL+'?game=nanyuan&key='+encodeURIComponent(key)+($('#cls').value?'&cls='+$('#cls').value:'');
    const d=await (await fetch(u)).json();
    if(!d.ok){ $('#msg').textContent=d.error==='key'?'密碼不正確（或試算表「設定」B1 還沒填）。':'讀取失敗。'; return; }
    $('#msg').textContent='更新時間 '+new Date().toLocaleTimeString();
    lastData=d; render(d.rows||[], d.live||[]);
  }catch(e){ $('#msg').textContent='連不上後台：請確認 Apps Script 已更新到含南園里的新版本。'; }
}
function pick(rows){
  const m={};
  rows.forEach(r=>{ const k=(r.ed||'li')+'-'+r.cls+'-'+r.seat, o=m[k];
    if(!o) m[k]=r;
    else if($('#mode').value==='best' ? (r.score>o.score || (r.score===o.score && r.ts>o.ts)) : r.ts>o.ts) m[k]=r; });
  return Object.values(m).sort((a,b)=>a.cls.localeCompare(b.cls)||a.seat-b.seat);
}
function render(rows, live){
  const edf=$('#ed').value; if(edf){ rows=rows.filter(r=>(r.ed||'li')===edf); live=live.filter(l=>(l.ed||'li')===edf); }
  view=pick(rows);
  const done=view.filter(r=>r.done).length, avg=view.length?Math.round(view.reduce((n,r)=>n+r.score,0)/view.length):0;
  $('#cards').innerHTML=`<div>平板數<b>${view.length}</b></div><div>完成／交卷<b>${done}</b></div><div>平均分數<b>${avg}</b></div>`;
  const now=Date.now();
  $('#live').innerHTML=live.filter(l=>l.status==='作答中').sort((a,b)=>a.cls.localeCompare(b.cls)||a.seat-b.seat)
    .map(l=>`<span class="${now-l.t>300000?'stale':''}">${EDN[l.ed||'li']}・${l.cls}・${seats(l)}・第${Math.min(3,l.lv)}關${l.role&&ROLES[l.role]?'・'+ROLES[l.role]:''}</span>`).join('')||'<span style="background:none">目前沒有正在作答的同學</span>';
  $('#tb').innerHTML='<tr><th>篇</th><th>班級</th><th>座號</th><th>測驗類型</th><th>角色</th><th>狀態</th><th>總分</th><th>第1關/20</th><th>第2關/40</th><th>第3關/40</th><th>用時</th><th>錯誤</th></tr>'+
    view.map(r=>`<tr class="${r.done?'done':'ing'}"><td>${EDN[r.ed||'li']}</td><td>${r.cls}</td><td>${seats(r)}</td><td>${esc(TYPES[r.qtype]||'－')}</td><td>${esc(ROLES[r.role]||'－')}</td><td>${r.done?(r.early?'提早交卷':'完成'):'作答中（'+r.cleared+'/3）'}</td>
      <td><b>${r.score}</b></td><td>${r.s1}</td><td>${r.s2}</td><td>${r.s3}</td><td>${fmt(r.secs)}</td><td>${r.errors}</td></tr>`).join('');
  // 依角色分組
  const byRole={}; view.forEach(r=>{ if(r.role) (byRole[r.role]=byRole[r.role]||[]).push(r); });
  $('#roles').innerHTML=Object.keys(ROLES).filter(k=>byRole[k]).map(k=>`<div class="roleSec"><h3>${ROLES[k]}</h3>${byRole[k].map(r=>{
    const rl=r.rulers||{};
    const det=Object.keys(rl).map(id=>{ const x=rl[id]; return `<li><b>${esc(POL[id]||id)}</b><br>具體：${esc(x.c||'－')}｜做得到：${esc(x.f||'－')}｜查得到：${esc(x.v||'－')}${x.why?'<br>理由：'+esc(x.why):''}</li>`; }).join('');
    return `<div class="grpCard"><span class="tag">${EDN[r.ed||'li']}・${r.cls}・${seats(r)}</span>${r.qtype?`<span class="small" style="font-weight:700">測驗：${esc(TYPES[r.qtype]||"")}${r.qtype!==r.role?"（換了角色）":""}</span>`:""}
      ${r.top?`<div class="t">${esc(POL[r.top]||r.topText)}</div><div class="w">💬 ${esc(r.topWhy)}</div>`:'<div class="w" style="color:#5b6875">還沒選最在意的政見</div>'}
      ${det?`<details><summary>三把尺紀錄</summary><ul>${det}</ul></details>`:''}</div>`; }).join('')}</div>`).join('')
    || '<div class="note">還沒有人選好角色。</div>';
  $('#mine').innerHTML=view.filter(r=>r.mine).map(r=>`<div><b>${r.cls}・${seats(r)}${ROLES[r.role]?'・'+ROLES[r.role]:''}</b>${esc(r.mine)}</div>`).join('')||'<div class="note">還沒有人寫完。</div>';
  const tc={}; view.forEach(r=>{ if(r.qtype) tc[r.qtype]=(tc[r.qtype]||0)+1; });
  const tmx=Math.max(1,...Object.values(tc));
  $('#types').innerHTML=Object.keys(TYPES).map(k=>`<div><span>${TYPES[k]}</span><i style="width:${(tc[k]||0)/tmx*240+4}px;background:#e8b23c"></i><b>${tc[k]||0}</b></div>`).join('');
  const mc={};
  view.forEach(r=>Object.entries(r.wrongBy||{}).forEach(([k,v])=>mc[k]=(mc[k]||0)+Number(v)));
  const arr=Object.entries(mc).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10), mx=arr.length?arr[0][1]:1;
  $('#miss').innerHTML=arr.map(([k,v])=>`<div><span>${esc(NAMES[k]||k)}</span><i style="width:${Math.max(8,v/mx*240)}px"></i><b>${v}</b></div>`).join('')||'<div class="note">還沒有錯誤紀錄。</div>';
}
function csv(){
  const head=['篇','班級','座號','測驗類型','角色','狀態','總分','第1關','第2關','第3關','用時秒','錯誤','最在意政見','理由','我的政見'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[head.join(',')].concat(view.map(r=>[EDN[r.ed||'li'],r.cls,seats(r),TYPES[r.qtype]||'',ROLES[r.role]||'',r.done?(r.early?'提早交卷':'完成'):'作答中',r.score,r.s1,r.s2,r.s3,r.secs,r.errors,POL[r.top]||r.topText||'',r.topWhy,r.mine].map(q).join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));
  a.download='南園里政見探究_'+($('#cls').value||'全部')+'.csv'; a.click();
}
$('#go').onclick=load; $('#csv').onclick=csv;
$('#cls').onchange=load; $('#ed').onchange=()=>{ if(lastData) render(lastData.rows||[],lastData.live||[]); }; $('#mode').onchange=load;
$('#proj').onclick=()=>{ const on=document.body.classList.toggle('proj'); $('#proj').textContent=on?'結束投影模式':'投影模式（隱藏分數）'; };
setInterval(()=>{ if($('#auto').checked && $('#key').value.trim()) load(); },20000);
if($('#key').value) load();
</script>
</body>
