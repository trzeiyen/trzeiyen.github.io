<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>讀懂選舉公報｜南園里政見探究</title>
<style>
:root{--ink:#22303d;--ink2:#5b6875;--paper:#f6f4ee;--card:#fffefa;--blue:#2b5d9b;--blue2:#dbe6f4;--green:#2f7d5b;--green2:#d9efe3;--gold:#e8b23c;--ok:#3d8a4f;--bad:#c23b3b;--line:#dcd6c6;--pur:#7a4f9a;--pur2:#ece2f4}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.screen{display:none;min-height:100vh}.screen.on{display:block}
#login.on{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#fff3d6,transparent 50%),radial-gradient(circle at 85% 90%,#dbe6f4,transparent 55%),var(--paper)}
.lg{width:min(580px,100%);background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:26px 26px 20px;box-shadow:8px 8px 0 var(--ink)}
.lg h1{margin:0;font-size:clamp(34px,7vw,48px);font-weight:900;line-height:1.12;letter-spacing:.03em}
.lg h1 span{color:var(--blue)}
.lg .sub{margin:8px 0 6px;font-weight:700;color:var(--green)}
.rule{background:var(--blue2);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;margin:8px 0 12px}
.lg ol{margin:0 0 14px;padding-left:22px;color:var(--ink2);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row label{flex:1 1 110px;font-weight:700;font-size:15px}
.row label.opt{color:var(--ink2)}
.row input,.row select{display:block;width:100%;height:54px;margin-top:4px;font-size:22px;text-align:center;border:2px solid var(--ink);border-radius:12px;background:#fff}
.big{display:block;width:100%;min-height:56px;margin-top:14px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:21px;box-shadow:0 4px 0 #1b3f6c}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3f6c}
.big.alt{background:var(--green);box-shadow:0 4px 0 #1d5a3f}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none;min-height:48px;font-size:17px}
.big:disabled{opacity:.45}
.edpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.edpick button{min-height:76px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:900;font-size:18px;line-height:1.3;padding:8px}
.edpick button small{display:block;font-size:13px;color:var(--ink2);font-weight:700}
.edpick button.on{background:var(--gold);box-shadow:0 4px 0 var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:14px}
.facts b{display:block;font-size:26px;color:var(--blue)}
.err{color:var(--bad);font-weight:700;min-height:1.6em;margin-top:8px}
.credit{text-align:center;margin-top:14px;font-size:14px;color:var(--ink2);font-weight:700}
header.top{position:sticky;top:0;z-index:10;row-gap:6px;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-left));background:var(--ink);color:#fff;flex-wrap:wrap}
header.top b{font-size:18px}
.steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.steps span{padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.14);font-size:14px;font-weight:700;white-space:nowrap}
.steps span.now{background:var(--gold);color:var(--ink)}
.steps span.ok{background:var(--ok)}
.meta{font-size:14px;font-weight:700;white-space:nowrap}
@media(max-width:860px){
  header.top{position:static;padding:8px 12px}
  header.top b{flex:1 1 auto}
  .steps{order:3;flex:1 1 100%;justify-content:flex-start}
  .steps span{font-size:13px;padding:2px 10px}
  .two>.q{order:-1}
}
#early{border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left)) 40px}
.lvtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 6px}
.lvtitle h2{margin:0;font-size:clamp(24px,4vw,32px);font-weight:900}
.lvtitle small{font-weight:700;color:var(--ink2)}
.task{background:#fff;border-left:6px solid var(--gold);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-weight:700}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
/* 範例公報 */
.bul{background:#fff;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.bul .bh{background:#eee8d8;padding:6px 12px;font-weight:900;text-align:center;border-bottom:2px solid var(--ink)}
.bul .fake{font-size:13px;color:var(--bad);font-weight:700;text-align:center;padding:2px;background:#fff4f4;border-bottom:1px solid var(--line)}
.fld{display:grid;grid-template-columns:122px 1fr;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff;border-left:0;border-right:0;border-top:0;padding:0;min-height:48px}
.fld:last-child{border-bottom:0}
.fld .k{background:#f5f1e6;font-weight:900;padding:8px 10px;border-right:1px solid var(--line);display:flex;align-items:center}
.fld .v{padding:8px 10px;font-size:16px}
.fld.ok{background:#dff0e2}.fld.ok .k{background:#bfe2c7}
.fld.no{animation:shake .3s;background:#f8dede}
.q h3{margin:0 0 8px;font-size:19px}
.opts{display:grid;gap:8px}
.opts button{min-height:54px;text-align:left;padding:8px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-weight:700}
.opts button.ok{background:#dff0e2;border-color:var(--ok)}
.opts button.no{background:#f8dede;border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:8px;font-weight:700;min-height:1.6em}
.fb.good{color:var(--ok)}.fb.warn{color:#9a6a00}
.qnum{display:inline-block;background:var(--gold);border-radius:99px;padding:1px 12px;font-size:14px;font-weight:900;margin-bottom:6px}
/* 第2關 */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;min-height:60px;margin-bottom:12px}
.card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;line-height:1.5;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;box-shadow:0 3px 0 var(--ink)}
.card mark{background:#ffe28a;padding:0 3px;border-radius:4px;font-weight:900;font-size:18px}
.card.sel{background:#fff4cf;border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.card.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.card.lift{opacity:.3}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.box{min-height:150px;border:3px dashed var(--green);border-radius:16px;background:var(--green2);padding:8px;transition:background .15s}
.box h4{margin:0;font-size:19px;color:var(--green);text-align:center}
.box p{margin:0 0 6px;font-size:13px;text-align:center;color:var(--ink2);font-weight:700}
.box.b2{border-color:var(--blue);background:var(--blue2)}.box.b2 h4{color:var(--blue)}
.box.b3{border-color:var(--pur);background:var(--pur2)}.box.b3 h4{color:var(--pur)}
.box.over{filter:brightness(.92)}
.box.no{animation:shake .3s;border-color:var(--bad)}
.box .in{font-size:14px;background:#fff;border-radius:8px;padding:5px 8px;margin-top:5px;font-weight:700;border-left:4px solid var(--ok)}
/* 第3關 */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:700px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.role{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:14px;text-align:center;font-weight:700;min-height:150px}
.role .ic{font-size:46px;line-height:1.2}
.role b{display:block;font-size:20px}
.role small{color:var(--ink2);font-size:14px}
.prog{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.prog span{padding:3px 12px;border-radius:99px;background:#e6e2d6;font-weight:700;font-size:14px}
.prog span.now{background:var(--gold)}.prog span.ok{background:var(--ok);color:#fff}
.pol{font-size:21px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:12px;line-height:1.55}
.pol small{display:block;font-size:13px;color:var(--ink2);font-weight:700}
.ruler{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.ruler h4{margin:0 0 6px;font-size:18px}
.ruler h4 span{font-weight:700;font-size:14px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:52px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-weight:700;font-size:16px;padding:4px 6px}
.tplfill{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:20px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px}
.tplfill input{width:9em;height:46px;font-size:19px;text-align:center;border:0;border-bottom:3px solid var(--blue);background:#f2f6fb;border-radius:6px}
.pickl u{text-decoration:none;color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:46px;border:2px solid var(--ink);border-radius:99px;background:#fff;font-weight:700;font-size:15px;padding:4px 14px}
.chips button.on{background:var(--gold);border-color:var(--ink)}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
textarea{width:100%;min-height:84px;font:inherit;font-size:19px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#fff;resize:vertical}
.pickl{display:grid;gap:8px}
.pickl button{text-align:left;min-height:54px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-weight:700;padding:8px 14px}
.pickl button.on{background:var(--gold);border-color:var(--ink)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(540px,92vw);background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.toast.on{display:block;animation:up .3s}
.toast b{color:var(--gold)}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:60;padding:20px}
.modal.on{display:grid}
.modal .in{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:20px;width:min(460px,100%)}
.res{max-width:760px;margin:0 auto}
.score{font-size:64px;font-weight:900;color:var(--blue);line-height:1}
.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.brk div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700}
.brk b{display:block;font-size:30px;color:var(--green)}
.sum{background:#fff;border-radius:14px;padding:12px 16px;border-left:6px solid var(--blue);text-align:left}
.sum li{margin:4px 0}
.center{text-align:center}
.small{font-size:14px;color:var(--ink2)}
</style>
</head>
<body>

<!-- ================= 登入 ================= -->
<section class="screen on" id="login">
  <div class="lg">
    <h1>讀懂<br><span>選舉公報</span></h1>
    <div class="sub">南園里長・第8選區議員・新北市長　政見探究（三關）</div>
    <div class="rule">🤝 這不是投票，也不比較誰比較好。<br>我們只練習：拿到公報時，怎麼讀懂一條政見。</div>
    <div class="small" style="font-weight:900;color:var(--ink)">先選一篇：</div>
    <div class="edpick"><button data-ed="li">🏘️ 里長篇<small>樹林區南園里・2 位候選人</small></button><button data-ed="council">🏛️ 議員篇<small>第8選區・12 位候選人</small></button><button data-ed="mayor">🏙️ 市長篇<small>新北市・3 位候選人</small></button></div>
    <ol id="edList"><li>第1關　公報解剖（約 6 分鐘）</li><li>第2關　動詞偵探（約 10 分鐘）</li><li>第3關　小測驗＋三把尺（約 17 分鐘）</li></ol>
    <div class="row">
      <label>班級<input id="cls" inputmode="numeric" maxlength="3" placeholder="609" autocomplete="off"></label>
      <label>座號<input id="seat" inputmode="numeric" maxlength="2" placeholder="1" autocomplete="off"></label>
      <label class="opt">第2位座號<input id="m1" inputmode="numeric" maxlength="2" placeholder="選填" autocomplete="off"></label>
      <label class="opt">第3位座號<input id="m2" inputmode="numeric" maxlength="2" placeholder="選填" autocomplete="off"></label>
    </div>
    <div class="err" id="lerr"></div>
    <div id="resumeBox" hidden>
      <button class="big alt" id="resume">繼續上次進度</button>
      <button class="big ghost" id="restart">重新開始（上次的進度會清除）</button>
    </div>
    <button class="big" id="start">開始探究</button>
    <div class="credit">由Zeiyen老師製作</div>
  </div>
</section>

<!-- ================= 遊戲 ================= -->
<section class="screen" id="game">
  <header class="top">
    <b>讀懂選舉公報</b>
    <div class="steps" id="steps"></div>
    <div class="meta" id="meta"></div>
    <button id="early">提早交卷</button>
  </header>
  <main id="stage"></main>
</section>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="in">
  <h3 style="margin:0 0 8px;font-size:22px">確定要提早交卷嗎？</h3>
  <p style="margin:0 0 6px">目前做到的部分會送給老師，交卷後就不能再作答了。</p>
  <button class="big" id="mYes">確定交卷</button>
  <button class="big ghost" id="mNo">再想想，繼續作答</button>
</div></div>

<script>
/* ===== 設定 ===== */
// 與〈穿越清帝國大逃脫〉共用同一個 Apps Script（成績存在「南園里-成績」工作表）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzqfvkWjqjGsLnnDsFNqlfvwluKJmvKC1KPbZjzwebmnk8PfmVhxOeSMGQUrRAP2fkVAg/exec';
const GAME_ID = 'nanyuan';
const KEY = 'nanyuan-v3';
const CLASSES = ['608','609','610'];

/* ===== 公報政見（請對照原始公報 PDF 確認文字）=====
   甲、乙只是代號，不對應號次。畫面上的政見卡都不標示甲乙。
   甲的「參選保證金與補助款捐款」承諾刻意不放入。 */
const POL_LI = {
  A1:{c:'甲',t:'持續守護學童安全，推動巡守、防災與民防服務。'},
  A2:{c:'甲',t:'追蹤改善道路坑洞、照明、公園及公共環境。'},
  A3:{c:'甲',t:'里務公開透明，善用社群即時說明，接受里民監督。'},
  A4:{c:'甲',t:'做到找得到人、聽得到聲音、看得到行動。'},
  B1:{c:'乙',t:'爭取全面優化萬坪公園與兒三公園遊具。'},
  B2:{c:'乙',t:'活化學府路綠帶部分區域，改為毛小孩友善場域。'},
  B3:{c:'乙',t:'配合捷運萬大線，爭取直達捷運站的公車路線、加密班次，並增設 YouBike 2.0。'},
  B4:{c:'乙',t:'刨鋪路口柏油、強化夜間照明，爭取增設路口監視系統。'},
  B5:{c:'乙',t:'優化學勤路滯洪池與佳園路箱涵排水分流，汛期前清淤。'},
  B7:{c:'乙',t:'開辦親子共學、健康養生及手機實用操作課程。'},
  B8:{c:'乙',t:'舉辦無人機法規與操作、手機拍照與影音剪輯等課程。'},
  B9:{c:'乙',t:'活化銀髮俱樂部，開辦歌唱及健康律動課程。'},
  B11:{c:'乙',t:'整合南園互聯網與 LINE@、FB 專頁，即時反映民意。'},
  B12:{c:'乙',t:'結合醫療機構定期辦理健檢與量血壓；推動學童上下學路段的愛心導護商店，舉辦 CPR 與 AED 訓練。'},
  B13:{c:'乙',t:'辦理寵物狂犬病疫苗施打與晶片登記。'}
};

/* ===== 議員篇：新北市議員第8選舉區（土城、樹林、三峽、鶯歌）=====
   應選 9 席（婦女保障 2 席），候選人 12 位。
   公平原則：第2關每位候選人 1 句、第3關（8 個角色各 3 句）每位候選人 2 句；畫面上都不標示姓名、號次、政黨。
   註解中的（n號）只給老師核對公報用，學生畫面不會出現。 */
const POL_C = {
  K01:{t:'65歲以上長輩裝假牙最高補助5萬元。'},                                   // 1號
  K02:{t:'推動青年育兒宅租期20年。'},                                             // 1號
  K03:{t:'引入新視覺減速標線，提升道路辨識與行車安全。'},                         // 2號
  K04:{t:'強化社區周邊 YouBike 站點普及化，解決短程運具需求。'},                  // 2號
  K05:{t:'擴大長照喘息服務，減輕家庭負擔。'},                                     // 3號
  K06:{t:'整合捷運、公車、YouBike，提升轉乘便利。'},                              // 3號
  K07:{t:'爭取經費改善老舊校舍並補強耐震。'},                                     // 4號
  K08:{t:'嚴格落實施工期間的防鄰損、防淹、防噪及交通安全監督。'},                 // 4號
  K09:{t:'樹林三期防洪計畫。'},                                                   // 5號
  K10:{t:'設立公有動物醫院，完善毛孩醫療保障。'},                                 // 5號
  K11:{t:'興建寵物公園，讓毛小孩及飼主有良好的休憩環境。'},                       // 6號
  K12:{t:'敬老卡增加至1000點，額度以年度累積。'},                                 // 6號
  K13:{t:'推動65歲以上長者免費施打帶狀疱疹（皮蛇）疫苗。'},                       // 7號
  K14:{t:'公共設施保留地解編後，闢建公園、停車場及多功能活動中心。'},             // 7號
  K15:{t:'設立符合動物福利的「社區型公園」，推廣動物保護與生命教育。'},           // 8號
  K16:{t:'守護校園食安，提高國產、在地食材比例，補足師資及校園人力。'},           // 8號
  K17:{t:'監督捷運土城樹林線如期如質完工。'},                                     // 9號
  K18:{t:'增設各區活動中心。'},                                                   // 9號
  K19:{t:'因應極端氣候，加強區域排水系統。'},                                     // 10號
  K20:{t:'要求市府增加親子、長者及寵物共融特色公園。'},                           // 10號

const l1q=()=>S.ed==='mayor'?L1MQ:L1CQ;
function l1cScore(){
  const L1CQ=l1q(), st=S.l1, n=WHO.length+L1CQ.length;
  const right=WHO.filter(w=>st.placed[w.id]&&!st.firstWrong[w.id]).length+L1CQ.filter(q=>st.first[q.id]===1).length;
  const retry=WHO.filter(w=>st.placed[w.id]&&st.firstWrong[w.id]).length+L1CQ.filter(q=>st.first[q.id]===0).length;
  return Math.round(20*(right+0.4*retry)/n);
}
function L1C(){
  const L1CQ=l1q(), st=S.l1, left=st.order.filter(id=>!st.placed[id]);
  const facts=S.ed==='mayor'?`<div class="facts"><div>選區<b style="font-size:20px">新北市<br>29 區</b></div><div>候選人<b>3 位</b></div><div>應選<b>1 位</b></div><div>任期<b>4 年</b></div></div>`

  if(left.length){
    $('#stage').innerHTML=`<div class="lvtitle"><h2>第1關　誰負責什麼？</h2><small>剩下 ${left.length} 張</small></div>${facts}
      <div class="task">議員、里長、市政府，各做什麼事？把卡片拖到正確的箱子。<br><span class="small">拖不動的話：先點卡片，再點箱子。</span></div>
      <div class="tray" id="tray">${left.map(id=>{ const c=WHO.find(v=>v.id===id); return `<div class="card${selId===id?' sel':''}" data-id="${id}">${c.html}</div>`; }).join('')}</div>
      <div class="boxes">${WHO_BOX.map(x=>`<div class="box ${x.cls}" data-b="${x.b}"><h4>${x.b}</h4><p>${x.d}</p>
        ${st.order.filter(id=>st.placed[id]===x.b).map(id=>`<div class="in">${esc(WHO.find(v=>v.id===id).v)}</div>`).join('')}</div>`).join('')}</div>`;
    bindDrag((id,b,el)=>{ const c=WHO.find(x=>x.id===id);
      if(c.b===b){ st.placed[id]=b; selId=null; save(); L1C(); toast('✔ 正確！'+esc(c.why),2400); }
      else { st.firstWrong[id]=1; miss('L1-'+id); save(); if(el){ el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); }
        toast('再想想看：「<b>'+esc(c.v)+'</b>」是誰負責的？看看箱子下面的說明。',2800); } });
    return;
  }
  if(st.i<L1CQ.length){
    const q=L1CQ[st.i];
    $('#stage').innerHTML=`<div class="lvtitle"><h2>第1關　${S.ed==='mayor'?'市長':'議員'}選舉怎麼選？</h2></div>${facts}
      <div class="panel q"><span class="qnum">第 ${st.i+1}／${L1CQ.length} 題</span><h3>${q.title}</h3>
      <div class="opts">${shuffle(q.o).map(o=>`<button data-a="${o.a}">${esc(o.t)}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nxBox"></div></div>`;
    let done=false;
    document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ if(done) return;
      if(b.dataset.a==='1'){ done=true; if(st.first[q.id]===undefined) st.first[q.id]=1; save(); b.classList.add('ok');
        $('#fb').className='fb good'; $('#fb').textContent='✔ '+q.why; $('#nxBox').innerHTML='<button class="big" id="nq">下一題 →</button>'; $('#nq').onclick=()=>{ st.i++; save(); L1C(); }; }
      else { if(st.first[q.id]===undefined) st.first[q.id]=0; miss(q.id); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); $('#fb').className='fb warn'; $('#fb').textContent='再想想：'+q.hint; } });
    return;
  }
  st.s=l1cScore(); st.done=true; save();
  $('#stage').innerHTML=`<div class="lvtitle"><h2>第1關　誰負責什麼？</h2></div>
    <div class="panel center q"><h3 style="font-size:24px">第1關完成！</h3>
    <p style="font-size:20px">得分 <b style="color:var(--blue);font-size:30px">${st.s}</b>／20</p>
    <div class="sum"><b>記住這件事</b><ul><li>真正去蓋捷運、發補助的是<b>市政府</b>，帶領市政府的是<b>市長</b>。</li><li>議員的工作是<b>審預算、質詢、訂規定、監督市府</b>，也會幫地方「爭取」。</li><li>${S.ed==='mayor'?'所以讀市長的政見時，可以想想：<b>要花多少錢？議會會同意嗎？</b>':'所以讀議員的政見時，可以想想：<b>議員要用什麼方法讓這件事發生？</b>'}</li></ul></div>
    <button class="big" id="nx" style="max-width:360px;margin:16px auto 0">前往第2關 →</button></div>`;
  $('#nx').onclick=next;
}

function bindDrag(onPlace){
  document.querySelectorAll('#tray .card').forEach(card=>{
    let ghost=null, sx=0, sy=0, moved=false, over=null;
    card.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; moved=false; try{card.setPointerCapture(e.pointerId);}catch(_){} });
    card.addEventListener('pointermove',e=>{
      if(!card.hasPointerCapture(e.pointerId)) return;
      if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)<8) return;
      if(!moved){ moved=true; ghost=card.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=card.offsetWidth+'px'; document.body.appendChild(ghost); card.classList.add('lift'); }
      ghost.style.left=(e.clientX-card.offsetWidth/2)+'px'; ghost.style.top=(e.clientY-24)+'px';
      const t=document.elementFromPoint(e.clientX,e.clientY), bx=t&&t.closest('.box');
      if(over&&over!==bx) over.classList.remove('over'); if(bx) bx.classList.add('over'); over=bx;
    });
    const end=()=>{
      if(ghost){ ghost.remove(); ghost=null; card.classList.remove('lift'); if(over) over.classList.remove('over');
        if(over){ const o=over; over=null; onPlace(card.dataset.id,o.dataset.b,o); } return; }
      if(!moved){ selId = selId===card.dataset.id ? null : card.dataset.id; document.querySelectorAll('#tray .card').forEach(c=>c.classList.toggle('sel',c.dataset.id===selId)); }
    };
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',()=>{ if(ghost){ghost.remove();ghost=null;card.classList.remove('lift');} if(over){over.classList.remove('over');over=null;} });
  });
  document.querySelectorAll('.box').forEach(bx=>bx.addEventListener('click',()=>{ if(selId) onPlace(selId,bx.dataset.b,bx); else toast('先點一張卡片，再點箱子。',1600); }));
}

const BLANK_MAX=12;
function tplParts(t){ return t.split(/(\{[^}]+\})/).filter(x=>x); }
function tplText(t,f){ let i=0; return tplParts(t).map(x=>/^\{/.test(x)?(f[i++]||'').trim():x).join(''); }
function tplFull(t,f){ return tplParts(t).filter(x=>/^\{/.test(x)).every((x,i)=>(f[i]||'').trim().length>0); }
// box：容器；list：句型；o：{t:句型序號,f:[空格內容]}；onChange(完整句子或'')
function tplUI(box,list,o,onChange){
  const draw=()=>{
    box.innerHTML=`<div class="small" style="font-weight:700;margin-bottom:6px">① 先選一個句型</div>
      <div class="pickl">${list.map((t,i)=>`<button data-t="${i}" class="${o.t===i?'on':''}">${esc(t).replace(/\{([^}]+)\}/g,'<u>〔$1〕</u>')}</button>`).join('')}</div>
      ${o.t>=0?`<div class="small" style="font-weight:700;margin:12px 0 6px">② 填空（每格最多 ${BLANK_MAX} 個字）</div>
      <div class="tplfill">${(()=>{ let i=0; return tplParts(list[o.t]).map(x=>{ if(!/^\{/.test(x)) return `<span>${esc(x)}</span>`; const k=i++;
        return `<input data-k="${k}" maxlength="${BLANK_MAX}" placeholder="${esc(x.slice(1,-1))}" value="${esc(o.f[k]||'')}" autocomplete="off">`; }).join(''); })()}</div>`:''}`;
    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.t; if(n!==o.t){ o.t=n; o.f=[]; } emit(); draw(); });
    box.querySelectorAll('.tplfill input').forEach(inp=>inp.oninput=()=>{ o.f[+inp.dataset.k]=inp.value.slice(0,BLANK_MAX); emit(); });
  };
  const emit=()=>onChange(o.t>=0&&tplFull(list[o.t],o.f)?tplText(list[o.t],o.f):'');
  draw();
}
function rateDone(id){ const r=S.l3.r[id]||{}; return !!(r.c&&r.f&&r.v&&(r.why||'').trim().length>=MINWHY); }
function score3(){
  const st=S.l3; let s=st.order.length?Math.round(28*st.order.filter(rateDone).length/st.order.length):0;
  if(st.top && st.topWhy.trim().length>=6) s+=6;
  if(st.mine.trim().length>=8) s+=6;
  return s;
}
function L3(){
  const st=S.l3; st.s=score3();
  if(!st.role){ if(st.picking) roleScreen(st); else quiz(st); return; }
  const R=ROLES.find(x=>x.id===st.role);
  const prog=`<div class="prog">${st.order.map((id,i)=>`<span class="${st.step==='rate'&&i===st.i?'now':(rateDone(id)?'ok':'')}">政見 ${i+1}</span>`).join('')}
    <span class="${st.step==='top'?'now':(st.top&&st.topWhy.trim().length>=6?'ok':'')}">最在意</span><span class="${st.step==='mine'?'now':(st.mine.trim().length>=8?'ok':'')}">我的政見</span></div>`;
  const head=`<div class="lvtitle"><h2>第3關　${R.ic} ${R.n}</h2><small>${R.d}</small></div>${prog}`;

  if(st.step==='rate'){
    const id=st.order[st.i], r=st.r[id]||(st.r[id]={c:'',f:'',v:'',why:''});
    $('#stage').innerHTML=head+`<div class="two"><div>
      <div class="pol"><small>${E.place}選舉公報・政見 ${st.i+1}／${st.order.length}</small>${esc(POL[id].t)}</div>
      <div class="task" style="margin:0">想一想：如果你是「${R.n}」，這條政見跟你有沒有關係？<br>三把尺都要量，最後點選理由。</div></div>
      <div>${RULERS.map(x=>`<div class="ruler"><h4>${x.n} <span>${x.d}</span></h4><div class="seg">${x.o.map(o=>`<button data-k="${x.k}" data-o="${o}" class="${r[x.k]===o?'on':''}">${o}</button>`).join('')}</div></div>`).join('')}
      <div class="ruler"><h4>💡 為什麼這樣量？ <span>點選理由，可以選好幾個</span></h4><div class="chips">${WHYS.map((w,i)=>`<button data-w="${i}" class="${(r.ws||[]).indexOf(i)>=0?'on':''}">${w}</button>`).join('')}</div></div>
      <div class="fb" id="fb"></div>
      <div class="row"><button class="big ghost" id="prev" style="flex:1" ${st.i===0?'disabled':''}>← 上一條</button><button class="big" id="nxr" style="flex:2">${st.i<st.order.length-1?'下一條 →':'量完了，下一步 →'}</button></div></div></div>`;
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ r[b.dataset.k]=b.dataset.o; save(); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
    document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.w; r.ws=r.ws||[];
      const k=r.ws.indexOf(i); if(k>=0) r.ws.splice(k,1); else r.ws.push(i); r.ws.sort((a,b)=>a-b);
      r.why=r.ws.map(n=>WHYS[n]).join('、'); b.classList.toggle('on',k<0); $('#fb').textContent=''; save(); });
    $('#prev').onclick=()=>{ st.i=Math.max(0,st.i-1); save(); L3(); };
    $('#nxr').onclick=()=>{
      if(!(r.c&&r.f&&r.v)){ $('#fb').className='fb warn'; $('#fb').textContent='還有尺沒有量喔！三把尺都要選一個。'; return; }
      if(!(r.ws&&r.ws.length)){ $('#fb').className='fb warn'; $('#fb').textContent='請至少點選一個理由。'; return; }
      if(st.i<st.order.length-1) st.i++; else st.step='top';
      save(); report(); L3(); window.scrollTo(0,0);
    };
    return;
  }
  if(st.step==='top'){
    $('#stage').innerHTML=head+`<div class="panel q"><h3>如果你是「${R.n}」，這 ${st.order.length} 條裡最在意哪一條？</h3>
      <div class="small" style="margin-bottom:8px">沒有標準答案。這裡選的是「跟這個角色最有關係的事」，不是選哪一位候選人。</div>
      <div class="pickl">${st.order.map(id=>`<button data-id="${id}" class="${st.top===id?'on':''}">${esc(POL[id].t)}</button>`).join('')}</div>
      <h3 style="margin-top:14px">為什麼？</h3><div id="tw"></div>
      <div class="fb" id="fb"></div>
      <div class="row"><button class="big ghost" id="prev" style="flex:1">← 回去看政見</button><button class="big" id="nxr" style="flex:2">下一步 →</button></div></div>`;
    document.querySelectorAll('.pickl button').forEach(b=>b.onclick=()=>{ st.top=b.dataset.id; save(); document.querySelectorAll('.pickl button').forEach(x=>x.classList.toggle('on',x===b)); });
    st.topTpl=st.topTpl||{t:-1,f:[]};
    tplUI($('#tw'),TOP_TPL,st.topTpl,txt=>{ st.topWhy=txt; $('#fb').textContent=''; save(); });
    $('#prev').onclick=()=>{ st.step='rate'; st.i=st.order.length-1; save(); L3(); };
    $('#nxr').onclick=()=>{
      if(!st.top){ $('#fb').className='fb warn'; $('#fb').textContent='先選一條政見。'; return; }
      if(!st.topWhy){ $('#fb').className='fb warn'; $('#fb').textContent=st.topTpl.t<0?'請選一個句型。':'空格都要填喔！'; return; }
      st.step='mine'; save(); report(); L3(); window.scrollTo(0,0);
    };
    return;
  }
  // 我的政見
  $('#stage').innerHTML=head+`<div class="panel q"><h3>換你當候選人！</h3>
    <p style="margin:0 0 8px">如果「${R.n}」要參選里長，請幫他寫一條政見，並試著讓它<b>過得了三把尺</b>：說得出地點或做法、知道誰來做、四年後查得到。選一個句型，把空格填好就可以。</p>
    <div id="mine"></div>
    <div class="fb" id="fb"></div>
    <div class="row"><button class="big ghost" id="prev" style="flex:1">← 上一步</button><button class="big alt" id="fin" style="flex:2">完成，送給老師 ✔</button></div></div>`;
  st.mineTpl=st.mineTpl||{t:-1,f:[]};
  tplUI($('#mine'),MINE_TPL,st.mineTpl,txt=>{ st.mine=txt; $('#fb').textContent=''; save(); });
  $('#prev').onclick=()=>{ st.step='top'; save(); L3(); };
  $('#fin').onclick=()=>{
    if(!st.mine){ $('#fb').className='fb warn'; $('#fb').textContent=st.mineTpl.t<0?'請選一個句型。':'空格都要填喔！'; return; }
    st.s=score3(); st.done=true; save(); next();
  };
}

/* ===== 總成績 ===== */
function result(){
  if(S.l3.order.length) S.l3.s=score3();
  report();
  const R=ROLES.find(x=>x.id===S.l3.role);
  $('#stage').innerHTML=`<div class="res center">
    <h2 style="font-size:30px;margin:10px 0">${S.early?'已交卷！':'三關完成！'}</h2>
    <div class="score">${total()}<span style="font-size:26px"> 分</span></div>
    <div class="small">${E.name}｜${S.cls} 班 ${who()}${S.l3.type?'｜'+TYPES[S.l3.type].ic+' '+TYPES[S.l3.type].n:''}${R?'｜角色：'+R.ic+' '+R.n:''}｜用時 ${fmt(secs())}</div>
    <div class="brk"><div>${E.steps[0]}<b>${S.l1.s}</b>／20</div><div>${E.steps[1]}<b>${S.l2.s}</b>／40</div><div>第3關 三把尺<b>${S.l3.s}</b>／40</div></div>
    <div class="sum"><b>這一節課的重點</b><ul>
      <li>公報是選舉委員會寄到每一戶的，但內容是<b>候選人自己提供的</b>，可以多方查證。</li>
      ${S.ed==='mayor'?'<li>市長帶領市政府做事，但花錢要<b>議會同意預算</b>。</li><li>新北市長只選 1 位；每個人只能圈 1 位。</li>':S.ed==='council'?'<li>議員不自己蓋東西：讀政見時看動詞，<b>監督、督促</b>是盯著市政府，<b>爭取、推動</b>是請市政府去做。</li><li>第8選區選出 9 位議員，其中至少 2 位女性；每個人只能圈 1 位。</li>'
        :'<li>讀政見時看動詞：<b>爭取</b>要靠政府單位，<b>開辦、舉辦</b>里辦公處自己能做，<b>做到、守護</b>說的是態度。</li>'}
      <li>用三把尺量政見：<b>具體嗎？做得到嗎？查得到嗎？</b></li>
      <li>不同的${E.who}在意不同的事。投票時，每個人要依照自己和社區的需要，自己做判斷。</li></ul></div>
    <p style="font-weight:700">${GAS_URL?'作答已經傳給老師囉。':'請把這個畫面拿給老師看。'}</p>
    ${GAS_URL?'<button class="big alt" id="resend" style="max-width:360px;margin:6px auto">老師說沒收到？再傳一次</button>':''}
    <button class="big ghost" id="again" style="max-width:360px;margin:10px auto">回到首頁</button>
    <div class="credit">由Zeiyen老師製作</div></div>`;
  if($('#resend')) $('#resend').onclick=()=>{ report(); toast('已重新傳送給老師。',2000); };
  $('#again').onclick=()=>{ show('login'); if(S&&S.ed) pickEd(S.ed); checkResume(); };
}
</script>
